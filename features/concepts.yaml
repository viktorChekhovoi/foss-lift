# The concept vocabulary.
#
# A concept is a thing that changes. Catalogue items link to concepts in one of
# two directions:
#
#   defines:  this item is where the concept lives. Change the concept and this
#             item is the one you edit.
#   uses:     this item consumes the concept. Change the concept and this item
#             has to be re-checked.
#
# The point of the direction is the second list. "Add a new colour role" starts
# at theme.colour-role's definers and cascades to everything that `uses` it —
# the preview, the presets, the share format — without anyone having drawn an
# edge to the preview by hand.
#
# The vocabulary is closed. `dart run tool/features.dart --check` rejects a tag
# that is not in this file, because free tagging turns into forty synonyms for
# "the weight" and a graph nobody can query.
#
# Adding a concept is cheap and expected. Splitting one that has grown two
# meanings is also expected — that is the maintenance, and it is linear.
#
# `code` is the honest part of the file: --check fails when a path stops
# existing, so a concept cannot quietly outlive the thing it names.

areas:
  - id: exercise
    title: The exercise library
  - id: template
    title: Routines, workouts and slots
  - id: session
    title: The live session
  - id: load
    title: Weight, bars and plates
  - id: progression
    title: Progression and layoffs
  - id: history
    title: History and stats
  - id: video
    title: Set videos
  - id: theme
    title: Colour and type
  - id: ui
    title: Shell, navigation and onboarding
  - id: share
    title: Getting things in and out
  - id: platform
    title: Platform, storage and policy

concepts:
  # ---------------------------------------------------------------- exercise
  - id: exercise.identity
    area: exercise
    what: An exercise row — its name, and whether it is seeded or the user's own.
    code: [lib/data/database.dart, lib/screens/exercise_form_screen.dart]

  - id: exercise.taxonomy
    area: exercise
    what: >-
      The closed lists an exercise is described with: muscle group and
      equipment. Also a wire format — a routine code sends the index, not the
      word.
    code: [lib/data/exercise_taxonomy.dart]

  - id: exercise.muscle-map
    area: exercise
    what: >-
      Which groups a movement trains and which it only assists: one or more
      primaries, the first of them the lead the movement files under, plus any
      number of secondaries.
    code: [lib/data/exercise_taxonomy.dart, lib/data/database.dart]

  - id: exercise.measure
    area: exercise
    what: Counted in reps or held for seconds. Constrains what a set and a progression axis can be.
    code: [lib/data/database.dart]

  - id: exercise.weight-type
    area: exercise
    what: Barbell, dumbbell, machine/cable, or none — decides whether a lift has a bar and plates behind it, and whether it has a weight at all.
    code: [lib/data/database.dart, lib/data/plates.dart]

  - id: exercise.cardio-machine
    area: exercise
    what: >-
      Which movements are done on a console that reports speed, incline,
      resistance and distance — derived from the classification rather than
      stored, so a shared routine carries it without a field of its own.
    code: [lib/data/exercise_taxonomy.dart, lib/data/database.dart]

  - id: exercise.notes
    area: exercise
    what: The user's own note on a movement. Never travels in a routine code.
    code: [lib/screens/exercise_detail_screen.dart]

  - id: exercise.video-url
    area: exercise
    what: The demonstration link on an exercise, canonicalised.
    code: [lib/util/video_links.dart]

  - id: exercise.seed
    area: exercise
    what: The starter library shipped with the app.
    code: [lib/data/database.dart]

  - id: exercise.filter
    area: exercise
    what: Finding a movement again — search, muscle-group and equipment filters.
    code: [lib/data/exercise_filter.dart, lib/widgets/exercise_filters.dart]

  # ---------------------------------------------------------------- template
  - id: template.routine
    area: template
    what: A program. Its name, colour, order and default rest.
    code: [lib/data/database.dart, lib/screens/routine_edit_screen.dart]

  - id: template.description
    area: template
    what: >-
      What a routine is, in a sentence or two — where it is typed, where it is
      shown, and how the description a shipped program arrives with follows the
      language.
    code: [lib/data/database.dart, lib/screens/routine_edit_screen.dart, lib/util/seed_names.dart]

  - id: template.workout
    area: template
    what: One workout inside a routine — the thing you actually start.
    code: [lib/data/database.dart, lib/screens/workout_edit_screen.dart]

  - id: template.item
    area: template
    what: An exercise slot in a workout — set count, target and suggested weight.
    code: [lib/data/database.dart, lib/widgets/workout_items_editor.dart]

  - id: template.rep-target
    area: template
    what: What a set is aiming at — a fixed count, a range, a hold, or to failure.
    code: [lib/data/database.dart, lib/widgets/workout_items_editor.dart]

  - id: template.effort-target
    area: template
    what: An optional RPE target on a slot or written-out set, kept out of ordinary routines until explicitly selected.
    code: [lib/data/database.dart, lib/data/set_scheme.dart, lib/widgets/workout_items_editor.dart]

  - id: template.set-scheme
    area: template
    what: >-
      How a slot's sets differ from one another — all alike, backing off,
      ramping up, or a weight and a rep count written out per set.
    code: [lib/data/set_scheme.dart, lib/widgets/workout_items_editor.dart]

  - id: template.per-set-reps
    area: template
    what: >-
      What one written-out row of a slot asks for — a count, a range, or a
      minimum with no top (AMRAP) — and which of those numbers a set is judged
      against.
    code: [lib/data/set_scheme.dart, lib/widgets/workout_items_editor.dart]

  - id: template.cycle
    area: template
    what: >-
      The ordered weeks a slot rotates through, one per session, and where it
      has got to. Each week is a written-out set of rows; the slot's weight is
      what their percentages are of.
    code: [lib/data/set_scheme.dart, lib/data/database.dart]

  - id: template.cycle-week-name
    area: template
    what: >-
      What one week of a cycle is called — the name a slot carries per week, and
      the "Week 3" a week nobody has named falls back to.
    code: [lib/data/set_scheme.dart, lib/widgets/workout_items_editor.dart]

  - id: template.training-max
    area: template
    what: >-
      The one weight a written-out slot's percentages are taken from, and what
      moves it — a number you train off rather than one you lift.
    code: [lib/data/database.dart, lib/widgets/workout_items_editor.dart]

  - id: template.percentage-base
    area: template
    what: >-
      Which lift a movement takes its percentages from — a front squat off the
      squat, a deficit deadlift off the deadlift — and the grouping that lets
      one number reach every slot in a routine that shares a base.
    code: [lib/data/percentage_base.dart, lib/screens/training_max_screen.dart]

  - id: template.superset
    area: template
    what: >-
      Which consecutive slots of a workout are trained as one round instead of
      one after the other — the join between a slot and the one above it, and
      where a group starts and ends.
    code: [lib/data/superset.dart, lib/data/database.dart]

  - id: template.rest
    area: template
    what: The rest a slot gets, and the routine default it falls back to.
    code: [lib/data/database.dart]

  - id: template.warmups-off
    area: template
    what: >-
      Whether a workout offers warm-up ramps at all — the switch on the day, and
      what a session started from it opens with.
    code: [lib/data/database.dart, lib/screens/workout_edit_screen.dart]

  - id: template.duration-estimate
    area: template
    what: >-
      How long a workout will take, derived from the template — sets,
      targets, warm-up rungs and rest. Never read from logged sessions.
    code: [lib/data/workout_estimate.dart, lib/widgets/workout_estimate.dart]

  - id: template.starter-library
    area: template
    what: >-
      The programs the app ships — what is in the library, what a copy of one
      arrives configured as, and what adding one does to your list.
    code: [lib/data/starter_routines.dart, lib/screens/routine_library_screen.dart]

  - id: template.active-routine
    area: template
    what: Which routine is the current one, and so what Today offers.
    code: [lib/screens/today_screen.dart, lib/providers/providers.dart]

  - id: template.long-routine
    area: template
    what: >-
      How a routine with more days than a week has is offered — the next session
      first, the rest behind a tap — rather than listed in full.
    code: [lib/screens/today_screen.dart]

  # ----------------------------------------------------------------- session
  - id: session.live-state
    area: session
    what: The in-memory session. Nothing reaches the database before Finish.
    code: [lib/state/active_workout.dart]

  - id: session.template-drift
    area: session
    what: >-
      What a running session does when the workout behind it is edited — which
      changes it takes and which it refuses, and why taking them at the tail is
      the only safe place.
    code: [lib/state/active_workout.dart]

  - id: session.start
    area: session
    what: Starting a workout, including the check for one already running.
    code: [lib/widgets/start_workout.dart]

  - id: session.set-logging
    area: session
    what: Turning a set into a logged result — tap to cycle, hold to type.
    code: [lib/screens/workout_screen.dart, lib/state/active_workout.dart, lib/widgets/board_cells.dart]

  - id: session.effort-rating
    area: session
    what: The optional actual RPE recorded with a completed working set and retained in history.
    code: [lib/screens/workout_screen.dart, lib/state/active_workout.dart, lib/data/database.dart]

  - id: session.exercise-weight
    area: session
    what: One weight carried by the exercise, which its sets follow.
    code: [lib/screens/workout_screen.dart]

  - id: session.hold-timer
    area: session
    what: The stopwatch that measures a held set.
    code: [lib/screens/workout_screen.dart]

  - id: session.progress-mark
    area: session
    what: Which set you are on — computed once, shown on the board and in the shade.
    code: [lib/state/workout_cue.dart]

  - id: session.superset-round
    area: session
    what: >-
      How a live superset is walked — a round across the group's movements
      rather than a column down one of them — and the rest that belongs to the
      end of a round instead of to each set in it.
    code: [lib/state/workout_cue.dart, lib/state/active_workout.dart]

  - id: session.rest-timer
    area: session
    what: The rest clock, owned by the session rather than by a screen.
    code: [lib/state/active_workout.dart]

  - id: session.rest-cue
    area: session
    what: What a rest is for — the caption naming what to set up next.
    code: [lib/state/workout_cue.dart]

  - id: session.rest-done
    area: session
    what: >-
      What a finished rest leaves on screen — the banner does not simply vanish
      the moment the clock reaches zero, it says the next set is up and waits to
      be dismissed.
    code: [lib/state/active_workout.dart, lib/screens/workout_screen.dart]

  - id: session.rest-sound
    area: session
    what: The tone at the end of a rest, on screen and off it.
    code: [lib/services/rest_tone.dart, lib/services/rest_alarm.dart, tool/make_rest_tone.dart]

  - id: session.rest-buzz
    area: session
    what: The vibration the session makes as a rest ends, beside the tone.
    code: [lib/services/rest_buzz.dart, lib/state/active_workout.dart]

  - id: session.warmup-ramp
    area: session
    what: The suggested ascending warm-up, never persisted.
    code: [lib/data/warmup.dart]

  - id: session.warmup-count
    area: session
    what: How many rungs a ramp is asked for — the app-wide default, a movement's own count over it, and the live stepper on top of both.
    code: [lib/data/warmup.dart, lib/data/database.dart, lib/screens/exercise_settings_screen.dart, lib/screens/exercise_detail_screen.dart]

  - id: session.abort
    area: session
    what: Throwing a session away without writing anything.
    code: [lib/screens/workout_screen.dart]

  - id: session.finish
    area: session
    what: The write on Finish — sets first, then progression.
    code: [lib/state/active_workout.dart]

  - id: session.resume-bar
    area: session
    what: The docked bar that gets you back into a collapsed session.
    code: [lib/widgets/resume_workout_bar.dart]

  - id: session.shade
    area: session
    what: The whole session in the notification shade, and the foreground service under it.
    code: [lib/services/workout_shade.dart]

  - id: session.console-metrics
    area: session
    what: >-
      The optional readouts a set on a cardio machine carries beside its
      duration — speed, incline, resistance level and distance — and the units
      they are shown and stored in.
    code: [lib/state/active_workout.dart, lib/screens/workout_screen.dart, lib/util/cardio_units.dart]

  - id: session.slot-settings
    area: session
    what: >-
      Reconfiguring an exercise slot from the live board — the same sheet the
      builder uses, what it writes, and how much of it the running session takes.
    code: [lib/screens/workout_screen.dart, lib/widgets/workout_items_editor.dart]

  - id: session.recap
    area: session
    what: The post-session summary.
    code: [lib/screens/summary_screen.dart]

  # -------------------------------------------------------------------- load
  - id: load.units
    area: load
    what: kg or lb. A display concern only — storage is always kilograms.
    code: [lib/util/units.dart]

  - id: load.exercise-unit
    area: load
    what: The unit one movement is read and typed in, overriding the app-wide one. Null — the usual case — means it follows the app.
    code: [lib/util/units.dart, lib/data/database.dart, lib/screens/exercise_detail_screen.dart]

  - id: load.unit-defaults
    area: load
    what: The step each unit counts by — 2.5 kg or 5 lb — what a fresh slot gets, and what a unit switch does with the slots already there.
    code: [lib/util/units.dart, lib/data/progression.dart]

  - id: load.bar-weight
    area: load
    what: Which bar a lift is over — the exercise's own, or the app default, from the list of bars the gym has.
    code: [lib/data/database.dart, lib/data/plates.dart, lib/screens/bar_settings_screen.dart]

  - id: load.plate-rack
    area: load
    what: The plates you own, one rack per unit.
    code: [lib/screens/plate_inventory_screen.dart]

  - id: load.plate-solver
    area: load
    what: Which plates make a weight, and whether they make it exactly.
    code: [lib/data/plates.dart, lib/widgets/plate_line.dart]

  - id: load.fine-grid
    area: load
    what: The finest a weight the app computes is expressed to — an eighth of a kilogram, or a quarter of a pound. Not the step a gym counts by; what a percentage or a conversion is tidied onto.
    code: [lib/util/units.dart, lib/data/set_scheme.dart]

  - id: load.loadable-grid
    area: load
    what: Which weights a given setup can actually be set to — what a warm-up rung may land on.
    code: [lib/data/plates.dart]

  # ------------------------------------------------------------- progression
  - id: progression.axis
    area: progression
    what: Which way a slot advances — weight, reps or time. Constrained by the measure.
    code: [lib/data/progression.dart]

  - id: progression.rates
    area: progression
    what: >-
      How much to add, after how many good sessions, and how far to back off —
      one pair of amounts per axis the slot advances on.
    code: [lib/data/progression.dart]

  - id: progression.verdict
    area: progression
    what: Whether a session counted as clean or as a miss.
    code: [lib/data/progression.dart]

  - id: progression.advanced
    area: progression
    what: >-
      The shut-by-default half of the Progression card, where the ways of
      advancing that most slots never use are offered.
    code: [lib/widgets/workout_items_editor.dart]

  - id: progression.double
    area: progression
    what: >-
      The opt-in rule that takes reps and weight in turn: a live rep goal climbs
      the slot's range, and the load moves only at the top of it.
    code: [lib/data/progression.dart, lib/data/database.dart]

  - id: progression.streak
    area: progression
    what: The stored consecutive success and failure counts.
    code: [lib/data/database.dart]

  - id: progression.gzcl-tier
    area: progression
    what: The optional T1, T2 or T3 role assigned to a slot in a GZCL program.
    code: [lib/data/progression.dart, lib/data/database.dart]

  - id: progression.stage-ladder
    area: progression
    what: An ordered, configurable series of set and rep prescriptions that advances after a missed base prescription.
    code: [lib/data/progression.dart, lib/data/database.dart]

  - id: progression.amrap-trigger
    area: progression
    what: A configurable final-set repetition result that earns a load increase.
    code: [lib/data/progression.dart, lib/data/database.dart]

  - id: progression.layoff-rules
    area: progression
    what: The days threshold and percentage per period, app-wide.
    code: [lib/data/layoff.dart]

  - id: progression.layoff-offer
    area: progression
    what: The dialog offering a lighter start, and what accepting does.
    code: [lib/screens/workout_detail_screen.dart]

  # ----------------------------------------------------------------- history
  - id: history.session-record
    area: history
    what: The logged session and its sets, denormalised so history survives library edits.
    code: [lib/data/database.dart, lib/screens/history_screen.dart]

  - id: history.aggregates
    area: history
    what: Lifetime totals, summed from the sets rather than from a stored tally.
    code: [lib/data/database.dart]

  - id: history.exercise-chart
    area: history
    what: One movement's progress over time.
    code: [lib/data/exercise_stats.dart, lib/screens/exercise_progress_screen.dart]

  # ------------------------------------------------------------------- video
  - id: video.capture
    area: video
    what: Filming a set, and the caps on length and height.
    code: [lib/services/set_video_recorder.dart, lib/screens/set_video_screen.dart]

  - id: video.storage
    area: video
    what: Where clips live, what they cost, and the sweep that collects orphans.
    code: [lib/services/set_video_store.dart]

  - id: video.still
    area: video
    what: The frame a reel row shows, decoded once and cached beside its clip.
    code: [lib/services/set_video_thumbnails.dart]

  - id: video.playback
    area: video
    what: Watching a clip back, and the reel that finds one again.
    code: [lib/screens/clip_player_screen.dart, lib/screens/exercise_clips_screen.dart, lib/util/clip_label.dart]

  # ------------------------------------------------------------------- theme
  - id: theme.colour-role
    area: theme
    what: >-
      The named slots a palette fills — ground, surface, line, text, accent,
      good, gold and the rest. Adding a role touches every consumer at once.
    code: [lib/theme/app_theme.dart]

  - id: theme.palette-source
    area: theme
    what: Where the live palette comes from — a shipped preset or a stored custom theme.
    code: [lib/theme/app_theme.dart, lib/theme/theme_id.dart]

  - id: theme.preview
    area: theme
    what: The sample UI showing a palette being edited. Consumes every role there is.
    code: [lib/widgets/theme_preview.dart]

  - id: theme.picker
    area: theme
    what: Editing one role — the wheel, the sliders and the hex field.
    code: [lib/screens/appearance_screen.dart]

  - id: theme.contrast-check
    area: theme
    what: The warning that says text will be hard to read on this background.
    code: [lib/widgets/theme_preview.dart]

  - id: theme.type-scale
    area: theme
    what: >-
      The sizes the app's own type steps through — the screen title, the eyebrow
      above it, the small-caps section headings — held in one place so the
      hierarchy is the same on every screen.
    code: [lib/theme/app_theme.dart, lib/widgets/common.dart]

  - id: ui.text-scale
    area: theme
    what: The user's text-size nudge on top of the phone's own, set by the chips or by a pinch.
    code: [lib/util/text_scale.dart, lib/widgets/pinch_text_scale.dart]

  # ---------------------------------------------------------------------- ui
  - id: ui.navigation
    area: ui
    what: The tab shell and the routes between screens.
    code: [lib/router.dart, lib/screens/home_shell.dart]

  - id: ui.dialog
    area: ui
    what: >-
      The app's dialogs as one thing rather than seven copies — how the field
      inside takes focus, and how the box makes room for the keyboard that
      focus raises.
    code: [lib/widgets/common.dart]

  - id: ui.system-insets
    area: ui
    what: >-
      The room the phone's own bars take at the edges of the screen — the
      status bar at the top, the gesture bar or Back / Home / Recents keys at
      the bottom — and the padding each surface leaves for them.
    code: [lib/widgets/common.dart]

  - id: ui.tutorial
    area: ui
    what: >-
      The coach-mark overlay itself — the scrim, the spotlight it cuts, the
      anchors it measures and what a tap does.
    code: [lib/widgets/tutorial.dart]

  - id: ui.tutorial-track
    area: ui
    what: >-
      Which tour you are on — the full walk-through, the quick one or the routine
      builder — how it is chosen on first launch, and how it is replayed later.
    code: [lib/widgets/tutorial.dart, lib/screens/profile_screen.dart]

  - id: ui.gym-vocabulary
    area: ui
    what: >-
      The plain-language definitions of the words the app assumes — routine,
      workout, set, rep, rest, superset. The tour is where they are spelled out;
      screens label their controls and leave the teaching to it, with one
      exception — a superset, which a slot can be switched to without knowing
      what has been asked for, so the builder explains it behind an icon. One
      noun per thing: nothing here teaches a word a screen does not itself use.
    code: [lib/widgets/tutorial.dart, lib/widgets/workout_items_editor.dart]

  - id: ui.tab-hosting
    area: ui
    what: >-
      Which tabs host each browsable screen, and how a link to one is prefixed
      so it opens in a tab that has it rather than in a location no route
      matches.
    code: [lib/router.dart]

  - id: ui.empty-state
    area: ui
    what: What a screen says when there is nothing on it yet.
    code: [lib/screens/today_screen.dart, lib/screens/history_screen.dart]

  - id: ui.routine-add-menu
    area: ui
    what: >-
      The single control that puts a routine in the list — the + in the corner of the Routines tab — and the choices behind it: a ready-made program, one built from nothing, or one somebody sent. Import asks scan or paste in a second step, or goes straight to the paste box where there is no scanner.
    code: [lib/screens/routines_screen.dart]

  - id: ui.language
    area: ui
    what: >-
      Which language the app renders in — the phone's best match on first run,
      or whatever was picked since — and how a region tag resolves to a
      catalogue.
    code: [lib/util/locales.dart, lib/screens/language_screen.dart]

  - id: ui.string-catalogue
    area: ui
    what: >-
      Every user-facing string, once, keyed. Adding a language is adding one
      more file to it; adding a screen means adding to it rather than typing a
      literal.
    code: [lib/l10n/app_en.arb]

  - id: ui.seeded-name
    area: ui
    what: >-
      The name of a row the app shipped, resolved from its seed key at display
      time so it follows the language instead of being frozen at install.
    code: [lib/util/seed_names.dart]

  # ------------------------------------------------------------------- share
  - id: share.routine-code
    area: share
    what: The wire format a routine travels as — FLR2 out, FLR1 and FLR2 in.
    code: [lib/data/routine_code.dart, lib/data/share_code.dart]

  - id: share.theme-code
    area: share
    what: The wire format a palette travels as.
    code: [lib/theme/theme_code.dart]

  - id: share.qr
    area: share
    what: Turning a code into a QR, and reading one back off the camera.
    code: [lib/services/qr_decoder.dart, lib/util/qr_capacity.dart, lib/screens/scan_screen.dart]

  - id: share.deep-link
    area: share
    what: A fosslift:// link the OS hands the app.
    code: [lib/services/deep_links.dart]

  - id: share.backup-file
    area: share
    what: >-
      The FLB1 backup file — what goes in it, the manifest that says which
      schema wrote it, and how it is built.
    code: [lib/data/backup_archive.dart, lib/services/backup_service.dart]

  - id: share.restore
    area: share
    what: >-
      Reading a backup back onto the phone: what it refuses, and the swap that
      replaces the live database with the one in the file.
    code: [lib/services/backup_service.dart, lib/screens/backup_screen.dart]

  - id: share.import-review
    area: share
    what: The screen that shows what a code contains before anything is added.
    code: [lib/screens/routine_import_screen.dart, lib/screens/theme_import_screen.dart]

  # ---------------------------------------------------------------- platform
  - id: platform.android
    area: platform
    what: Android-specific declarations — services, receivers, manifest entries.
    code: [android/app/src/main/AndroidManifest.xml]

  - id: platform.permissions
    area: platform
    what: Runtime grants, and behaving properly when one is refused.
    code: [lib/services/workout_shade.dart, lib/services/set_video_recorder.dart]

  - id: platform.portability
    area: platform
    what: >-
      Surviving the iOS port — no absolute paths, and platform features gated
      rather than assumed.
    code: [lib/services/reminders.dart, lib/services/set_video_store.dart]

  - id: platform.reminders
    area: platform
    what: Scheduling the one local notification a routine may ask for.
    code: [lib/data/schedule.dart, lib/services/reminders.dart]

  - id: platform.web
    area: platform
    what: >-
      The browser build — which capabilities a browser has, and how each one the
      app cannot get there is left absent rather than broken.
    code: [lib/util/capabilities.dart, lib/data/db_open_web.dart]

  - id: platform.tab-awake
    area: platform
    what: >-
      Keeping a browser from slowing the app's clocks down while a workout is
      running, and what that costs.
    code: [lib/services/tab_awake.dart]

  - id: platform.leave-guard
    area: platform
    what: >-
      Work the app would lose if the page went away, and the browser's own
      warning raised over it. A register of what counts, and the one listener
      armed while the register is not empty.
    code: [lib/state/unsaved_work.dart, lib/util/leave_guard.dart]

  - id: storage.database-location
    area: platform
    what: >-
      Where the SQLite file actually lives, and the per-platform opener that
      decides it.
    code: [lib/data/db_open.dart, lib/data/db_open_native.dart, lib/data/db_open_web.dart]

  - id: storage.durability
    area: platform
    what: >-
      Whether what is stored will still be there next time — the browser's
      promise not to evict it, asked for once, and what the app says when the
      answer is no.
    code: [lib/services/storage_health.dart, lib/data/db_open_web.dart]

  - id: storage.settings
    area: platform
    what: The single-row settings table, and the upsert that keeps writes from clobbering each other.
    code: [lib/data/database.dart]

  - id: storage.schema
    area: platform
    what: The drift tables themselves.
    code: [lib/data/database.dart]

  - id: storage.migration
    area: platform
    what: The version ladder an installed database climbs on open, one rung per schema change.
    code: [lib/data/database.dart]

  - id: storage.reset
    area: platform
    what: >-
      Emptying the database back to what a first launch writes: which rows go,
      what asks before they do, and what the app is on the other side of it.
    code: [lib/data/database.dart, lib/screens/exercise_settings_screen.dart]

  - id: privacy.offline
    area: platform
    what: The promise that nothing leaves the phone, and what upholds it.
    code: [PRIVACY.md, lib/screens/about_screen.dart]
