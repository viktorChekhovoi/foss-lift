<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FossLift — Feature Catalogue</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f7f6;
    --fg: #1a1a19;
    --fg2: #5f5f5c;
    --fg3: #8c8c88;
    --line: #e4e4e0;
    --line2: #d2d2cc;
    --accent: #b4531f;
    --accent-bg: #fbf1ea;
    --done: #3f7d47;
    --radius: 8px;
    --sidebar: 260px;
    --maxw: 780px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --bg2: #1e1e1b;
      --fg: #ececE6;
      --fg2: #a9a9a2;
      --fg3: #78786f;
      --line: #2c2c28;
      --line2: #3b3b35;
      --accent: #e08a4e;
      --accent-bg: #2a201a;
      --done: #7fb886;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    max-width: calc(var(--sidebar) + var(--maxw) + 96px);
    margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-weight: 640; letter-spacing: -0.01em; white-space: nowrap; }
  .brand span { color: var(--fg3); font-weight: 400; }
  .grow { flex: 1 1 120px; }
  .search {
    flex: 0 1 260px;
    font: inherit; font-size: 14px;
    padding: 6px 10px;
    border: 1px solid var(--line2); border-radius: var(--radius);
    background: var(--bg2); color: var(--fg);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn {
    font: inherit; font-size: 13px;
    padding: 6px 11px; cursor: pointer;
    border: 1px solid var(--line2); border-radius: var(--radius);
    background: var(--bg2); color: var(--fg2); white-space: nowrap;
  }
  .btn:hover { color: var(--fg); border-color: var(--fg3); }
  .btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .count { font-variant-numeric: tabular-nums; color: var(--fg2); font-size: 13px; white-space: nowrap; }
  .count b { color: var(--fg); font-weight: 620; }
  .bar { height: 3px; background: var(--line); }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .18s ease; }

  /* ---- layout ---- */
  .layout {
    max-width: calc(var(--sidebar) + var(--maxw) + 96px);
    margin: 0 auto; padding: 0 24px 120px;
    display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); gap: 48px;
  }
  nav {
    position: sticky; top: 72px; align-self: start;
    max-height: calc(100vh - 96px); overflow-y: auto;
    padding: 24px 0; font-size: 13.5px;
  }
  nav a {
    display: flex; gap: 10px; align-items: baseline;
    padding: 5px 8px; margin-left: -8px;
    border-radius: 6px; text-decoration: none; color: var(--fg2);
  }
  nav a:hover { background: var(--bg2); color: var(--fg); }
  nav a.on { color: var(--fg); font-weight: 560; background: var(--bg2); }
  nav a .n { color: var(--fg3); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 16px; }
  nav a .f { margin-left: auto; color: var(--fg3); font-variant-numeric: tabular-nums; font-size: 11.5px; white-space: nowrap; }
  nav a.full .f { color: var(--done); }
  nav .navhead { color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin: 0 0 10px; }

  main { padding: 24px 0; min-width: 0; }
  .lede { color: var(--fg2); margin: 0 0 40px; max-width: 60ch; }

  section { margin: 0 0 52px; scroll-margin-top: 84px; }
  section > h2 {
    font-size: 21px; letter-spacing: -0.015em; font-weight: 640;
    margin: 0 0 2px; display: flex; align-items: baseline; gap: 10px;
  }
  section > h2 .num { color: var(--fg3); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  section > h2 .f { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--fg3); font-variant-numeric: tabular-nums; }
  section.full > h2 .f { color: var(--done); }
  .tagline { color: var(--fg2); margin: 0 0 18px; max-width: 62ch; }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--fg3); font-weight: 620; margin: 22px 0 8px;
  }

  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item { border-top: 1px solid var(--line); }
  li.item:last-child { border-bottom: 1px solid var(--line); }
  label.row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 9px 8px 9px 4px; cursor: pointer;
  }
  label.row:hover { background: var(--bg2); }
  label.row input {
    appearance: none; -webkit-appearance: none;
    flex: 0 0 auto; width: 16px; height: 16px; margin: 3px 0 0;
    border: 1.5px solid var(--line2); border-radius: 4px;
    background: transparent; cursor: pointer;
  }
  label.row input:checked { background: var(--done); border-color: var(--done); }
  label.row input:checked::after {
    content: ""; display: block;
    width: 4px; height: 8px; margin: 1px 0 0 4.5px;
    border: solid #fff; border-width: 0 1.8px 1.8px 0; transform: rotate(42deg);
  }
  label.row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .txt { min-width: 0; }
  .t { font-weight: 570; }
  .d { color: var(--fg2); }
  li.item.done .txt { color: var(--fg3); }
  li.item.done .t { color: var(--fg3); font-weight: 500; }
  li.item.done .d { color: var(--fg3); }
  mark { background: var(--accent-bg); color: inherit; border-radius: 3px; padding: 0 1px; }

  .where {
    margin: 16px 0 0; padding: 10px 12px;
    background: var(--bg2); border-radius: var(--radius);
    font-size: 12.5px; color: var(--fg3); line-height: 1.5;
  }
  .where b { color: var(--fg2); font-weight: 600; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }

  .empty { color: var(--fg3); padding: 40px 0; }
  [hidden] { display: none !important; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; gap: 0; }
    nav { position: static; max-height: none; padding: 20px 0 0; border-bottom: 1px solid var(--line); }
    nav a { display: inline-flex; margin: 0 4px 4px 0; border: 1px solid var(--line); }
    nav a .f { margin-left: 4px; }
  }
  @media print {
    .topbar, nav { display: none; }
    .layout { display: block; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">FossLift <span>· feature catalogue</span></div>
    <div class="grow"></div>
    <input class="search" id="q" type="search" placeholder="Filter features…  (/)" autocomplete="off">
    <button class="btn" id="hide" aria-pressed="false">Hide checked</button>
    <button class="btn" id="expandAll">Check all</button>
    <button class="btn" id="reset">Reset</button>
    <div class="count" id="count"></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main">
    <p class="lede">Everything the app does today, one checkbox per behaviour. Tick as you walk through it; the ticks are kept in this browser.</p>
    <div id="sections"></div>
    <p class="empty" id="empty" hidden>Nothing matches that filter.</p>
  </main>
</div>

<script type="application/json" id="data">
[

  "id": "01",

  "where": "<b>Screens</b> lib/screens/library_screen.dart, exercise_form_screen.dart, exercise_detail_screen.dart · <b>Filtering</b> lib/data/exercise_filter.dart, lib/widgets/exercise_filters.dart · <b>Named bars</b> namedBars() in lib/data/plates.dart · <b>Data</b> Exercises table + first-run seed in lib/data/database.dart",
  "groups": [

      { "t": "Searchable by name", "d": "so \"a barbell movement for legs\" does not require knowing it is called a squat." },

      { "t": "Bar — an optional bar of its own", "d": "overriding the app-wide default. Chosen by name (Olympic, women's Olympic, EZ curl, trap, safety squat, Smith carriage) or typed as a number." },
      { "t": "Your own note on the movement", "d": "the seat setting, the rack pin, how far down you take it. Personal, and it never leaves the phone." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Browse / search", "d": "open the library from Profile, or via the exercise picker while building a workout. Type in the search box, tap chips to narrow, or both." },
      { "t": "Add a custom exercise", "d": "Library → ＋ (FAB) → name, muscle group, equipment, how it is measured, how it is loaded, optional demo link → Save. Paste a YouTube link in any shape." },
      { "t": "New exercise from inside the picker", "d": "the builder's picker offers it at the top of the list, and hands the movement you make straight back to the slot you were filling." },
      { "t": "Choose a bar by name", "d": "open any exercise → Bar weight → pick the bar, or \"Something else\" to type a weight. The same list sets the app-wide default under Settings → Default bar." },
      { "t": "Edit a movement's facts", "d": "any exercise's detail screen sets its weight type and its own bar weight — for every exercise, not just custom ones." },
      { "t": "Edit a custom exercise outright", "d": "the pencil in the app bar reopens the creation form on what you stored. The pencil is absent on a starter exercise." },
      { "t": "Write a note", "d": "open any exercise → My note → type. During a workout, noted movements show a note icon beside the name; one tap opens it in place." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "A starter's demo is a video, not a search", "d": "sources picked for a back catalogue with no reason to be deleted — Muscle &amp; Strength, Renaissance Periodization, PureGym, Bodybuilding.com carry most of the set. Every id is listed in one place (_starterDemos) with the video's own title beside it, so a re-check can tell \"this is gone\" from \"this is now something else\"; YouTube's oEmbed endpoint makes re-checking the lot a loop." },
      { "t": "The form asks how a movement is measured before how it is loaded", "d": "counted or held is the more fundamental fact. Loading is not hidden for a held movement — a weighted plank is real — but it is demoted to a quieter line that says why it is still being asked." },
      { "t": "Chips within a row are alternatives; the two rows narrow", "d": "arms and glutes is one session's browsing; barbell and legs is the pair of facts that finds a squat. A row nobody has touched excludes nothing." },
      { "t": "Muscle groups lead, equipment follows, and both stay on screen", "d": "six equipment chips already fill a phone's width. Splitting them also settles the one collision: Other is both a kind of equipment and a muscle group, and which is which is a matter of which row it is in." },

      { "t": "A link to anywhere else is kept exactly as typed", "d": "someone's own upload still opens from the exercise screen. It just will not travel when the exercise is shared — nor will a YouTube search link, which names no video." },
      { "t": "Glutes and Forearms are groups of their own", "d": "both are trained deliberately. Traps stay under Back, because a shrug is something you do on a back day. Movements that answer to no single group — a kettlebell swing, a power clean, a get-up — are under Other." },

      { "t": "Measure is fixed at creation for custom exercises", "d": "in the starter library the held movements are Plank, Side Plank, Hollow Hold, Dead Hang and Farmer's Carry. A held exercise offers only the time axis; a counted one offers weight and reps." },
      { "t": "History survives library edits", "d": "logged sets store the exercise name denormalised, so renaming or deleting an exercise never rewrites past sessions." }

      { "t": "A session ends by finishing it or by aborting it", "d": "collapsing never discards it, and an abort always asks first — it is the one control on the screen that destroys work." },
      { "t": "Only one session runs at a time, and Start knows it", "d": "starting the workout already in progress opens it rather than restarting it. Starting a different one asks first — naming the session at risk, how many sets are logged and how long it has been running — and defaults to keeping it. Every entry point goes through the same check, before the layoff offer." },
      { "t": "Finish order matters", "d": "sets are saved before progression advances, so a template never steps up without the history to justify it." }
    ]},
    { "name": "The resume bar", "items": [
      { "t": "It has one slot: the row directly above the bottom navigation bar", "d": "where there is no navigation bar — every screen pushed over a tab — it is the last row of the app, which is the same slot with nothing under it." },
      { "t": "It docks, it does not float", "d": "it takes real room rather than lying over the screen, so nothing is ever underneath it and the bottom of every list stays reachable. One line, because it is furniture for as long as the session lasts." },
      { "t": "There is only ever one on screen", "d": "two mount points draw it and exactly one may be live at a time — including during a navigation, where the tab screen keeps painting for the length of the slide. Ownership follows what is on screen, not what the route says." }
    ]},
    { "name": "The notification shade", "items": [
      { "t": "The whole session is in the shade", "d": "the notification names the exercise, the weight in your unit and the reps, walks an exercise's warm-up rungs before its working sets, and counts the rest down live." },
      { "t": "Done logs the outstanding set at its goal", "d": "and starts the rest, without the app coming forward. It asks the session what is outstanding rather than trusting the notification it came from." },
      { "t": "Missed logs one short of the goal", "d": "so it lands gold and the number is already close — and brings the app up to correct it. No rest starts." },
      { "t": "A rest offers +30s and Skip", "d": "nothing can be logged during one. Skip was left off at first and that was wrong in the gym: unlocking the phone to press Skip costs more, every time, than an accidental press costs once. The step is +30s rather than the screen's +15s, because a pocket press is not a considered one. Skip is silent, and neither button brings the app forward." },
      { "t": "It says which set of how many", "d": "Bench Press · Set 4/5, and a warm-up rung counts its own ramp: Warm-up · Bench Press · Set 2/3." },
      { "t": "While resting, the second line names the exercise", "d": "Next: Bench Press · Set 4/5 · 80 kg × 8. A weight and a rep count belonging to nothing is not an instruction." },
      { "t": "A hold gets one button, \"Open\"", "d": "how long you held something is the measurement itself, so nothing can claim it at the goal or guess it one short." },
      { "t": "It is a foreground service, and that is not about the notification", "d": "the session is in memory and untouched until Finish, so a Done press has to reach the isolate holding it — and without a service Android may kill the app once backgrounded. The service is what makes \"in memory\" survivable." },
      { "t": "Declared as specialUse on Android 14", "d": "health needs an activity-recognition permission this app has no business asking for, shortService caps at three minutes, dataSync is wrong and capped at six hours a day. The subtype is spelled out, which needs a justification at Play Store review. Off Android it is a no-op, not a crash." },
      { "t": "It asks to post notifications, or it is invisible", "d": "on Android 13 and up it is a runtime grant, and without it the service starts, reports success and draws nothing. The ask happens at the point the shade is first needed rather than on launch." },
      { "t": "Refusal is not an error", "d": "the workout runs exactly as before, just without the shade, and nothing interrupts it to say so. The app asks once and does not badger." }
    ]},
    { "name": "The rest timer", "items": [
      { "t": "The rest clock belongs to the session, not to the screen", "d": "it keeps running while the logging screen is popped, and a countdown a notification can show has to exist somewhere the notification can see. A timer owned by a widget dies with the widget." },
      { "t": "A rest says what it is for — between warm-up rungs", "d": "the next rung is a different load: \"Set up 60 kg, then lift.\"" },
      { "t": "After the last rung", "d": "the working weight is different again, and this is the longest rest of the ramp: \"Set up 100 kg, rest, then lift.\"" },
      { "t": "Between working sets", "d": "nothing to change: \"Rest, then lift.\"" },
      { "t": "Between exercises", "d": "a different movement and a different setup: \"Set up Overhead Press, rest, then lift.\" It skips past any exercise already finished." },
      { "t": "The caption replaces the word \"REST\"", "d": "a banner counting down is self-evidently a rest. The weight named is the one about to be lifted, in the display unit." },
      { "t": "The caption gives; the banner does not grow", "d": "the caption holds to two lines and ellipsises past that, while the countdown and the three controls keep their place and their size at any name length and any text scale." },
      { "t": "It makes a sound when it ends — one note, not two", "d": "a single pitch with a fast attack and a short decay, under half a second, struck at the top of the scale. The first tone was a two-note figure, which reads as a little melody — and a melody is a thing you notice having heard rather than a thing you act on." },
      { "t": "The tone is synthesised and shipped as an asset", "d": "no licence attached and nothing to attribute. The generator is committed beside it (tool/make_rest_tone.dart) — a wav is a binary nobody can review, and the frequency, envelope and length are the whole design. Regenerating it must produce the same file byte for byte." },
      { "t": "Declared as an alarm on Android", "d": "so it follows the phone's own silent and Do-Not-Disturb behaviour rather than overriding it. It takes transient focus, so music pauses for the length of the ding and resumes. (Flutter's SystemSound.play is documented as ignored on Android and iOS both.)" },
      { "t": "There is no switch on it", "d": "a rest timer that ends silently is a rest timer that does not work, and the phone already has three better controls for the same intent — volume keys, silent mode, Do Not Disturb." },
      { "t": "Off screen, the ding is a notification instead", "d": "its own high-importance channel, at alarm volume, with a buzz, naming what is next (\"Rest done — Bench Press · 80 kg × 8\"); it clears itself, and the next rest starting takes it down. Never both — two dings for one rest reads as two rests." },
      { "t": "It is the same sound either way", "d": "the generator writes the wav twice, once as a Flutter asset and once as an Android raw resource, because a notification can only sound from Android's own resources. Skipping a rest by hand sounds nothing." },
      { "t": "−15s ends a rest with less than 15 seconds left", "d": "below that the button's only honest readings are \"skip\" and \"do nothing\", and a button that does nothing is the worse of the two." }
    ]},
    { "name": "The board", "items": [
      { "t": "The goal is stated once per exercise", "d": "on the line that carries the weight you can edit: WORKING SETS × 8 [80 kg ✎]. A held movement reads × 45s; one with no load to name states the target on its own rather than hanging a × off nothing." },
      { "t": "The board marks the set you are on", "d": "the set the shade would name is marked in the accent on the board too, from the same arithmetic. Exactly one thing is ever marked, and nothing is once every set is logged." },
      { "t": "Warm-ups count toward the mark", "d": "when the ramp is where you are and its group is shut, the group carries the mark; opening it moves the mark onto the rung." },
      { "t": "The tap-to-log hint is pinned", "d": "beside the duration and set count, rather than scrolled with the rows: \"how do I log this?\" occurs on whichever exercise you are looking at, not only the first." },
      { "t": "The weight belongs to the exercise, not to each set", "d": "the sets follow it; the ones already logged keep the weight they were actually done at. Neither weight is a text field sitting open — both are values you tap to edit." },
      { "t": "A held set times itself", "d": "its result cell is a stopwatch: tap to start, tap again to stop, and the seconds it ran are what gets logged. It shows the running count in the accent with a heavier border, and sounds the rest tone when it stops. The rest begins then too, not when the hold started." },
      { "t": "Only one hold runs at a time", "d": "starting a second logs the first rather than losing it. Tapping a logged hold clears it — the same \"undo by tapping\" the rep cycle ends on. A long press still types an exact duration in." },
      { "t": "A missed set is one that fell short on reps/seconds or weight", "d": "deloading to finish counts as a miss. This feeds progression." }
    ]},
    { "name": "Warm-ups", "items": [
      { "t": "Warm-ups are never persisted", "d": "they're suggestions, not history, so logging them can't distort volume or lifetime totals. They are excluded from every working-set aggregate — verdict, volume, set count. The group carries a liability disclaimer." },
      { "t": "Moving the weight rebuilds the warm-up", "d": "rungs already logged survive the recompute; only the ones still ahead of you are redrawn. Changing the count follows the same rule." },
      { "t": "Warm-up rest is shorter between rungs, full before the work", "d": "45 s between rungs — changing plates and catching your breath — but after the last rung the exercise's own rest runs instead." },
      { "t": "Barbell ramps start on the empty bar", "d": "each later rung is a weight the plates can make, preferring the fewest plates per side. 225 lb over a 45 lb bar gives 45 → 115 → 185 at three, and 45 → 95 → 135 → 185 at four." },
      { "t": "Dumbbell rungs use the increments a gym stocks bells in", "d": "multiples of 5 lb, or 2.5 kg in a metric gym." },
      { "t": "Machine/cable rungs are multiples of 5", "d": "which is how a stack is labelled, in either unit." },
      { "t": "Non-barbell ramps start at ~40% of the work", "d": "a dumbbell has no empty bar to stand on." },
      { "t": "85% of the work is a hard ceiling", "d": "snapping onto a loadable weight rounds down past it, never up, so the last warm-up can't turn into a first working set." },
      { "t": "Reps fall off as the load climbs", "d": "8 → 5 → 3 → 2 by fraction of the work, so an 80 kg bench warms up 20×8, 40×5, 60×3." },
      { "t": "A step will only stray a tenth of the working weight to find a cheaper load", "d": "cheapness breaks a tie between neighbouring loads; it is never worth warming up 50 kg lighter for the sake of one pair of plates." },
      { "t": "Duplicates are dropped", "d": "where a coarse grid puts two steps on the same load, a light lift gets a shorter ramp than asked for rather than one that stalls or steps backward." },
      { "t": "One warm-up set is a middle-of-the-road set, not the empty bar", "d": "a single rung around halfway between the bar and the ceiling — 40 kg for an 80 kg bench, 70 for a 140 kg squat, 115 lb for a 225 lb squat. The \"starts on the empty bar\" rule resumes at two rungs and up." },
      { "t": "A light lift still collapses to the bar on its own", "d": "at any set count — a 25 kg lift over a 20 kg bar warms up with the empty bar and nothing else." },
      { "t": "The ramp's shape follows published practice", "d": "as fractions of the working weight, not of 1RM: three sets by default, 40–50% / 60–70% / 70–80% for the loads, 8–10 / 4–6 / 1–3 for the reps, 45–60 s between rungs. The stepper goes to six, but six is a choice the user makes. Sources cited in lib/data/warmup.dart." }
    ]}
  ]
},

{
  "id": "05",
  "title": "Automatic progression",
  "tagline": "Each exercise slot advances on one axis: add weight, add reps, or hold longer. Success steps it up; misses back it off.",
  "where": "<b>Pure rules</b> lib/data/progression.dart (stepProgression / advanceTarget) · <b>Applied by</b> AppDatabase.advanceProgression(...) · <b>Recorded</b> ProgressionReport / lastProgressionProvider in lib/state/active_workout.dart",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Weight axis", "d": "add load at a fixed rep target." },
      { "t": "Reps axis", "d": "add reps at a fixed load." },
      { "t": "Time axis", "d": "hold longer." },
      { "t": "Defaults work untouched", "d": "+2.5 kg after one clean session, −5 kg after two misses in a row. Every rate is configurable per slot." },
      { "t": "Loading the bar past the suggestion is itself progression", "d": "beating the stored target raises it, even before a step is formally \"earned\"." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "It is automatic", "d": "configure the rates in the workout builder; it runs on Finish, and what it did is shown on the post-session recap." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "The axis is constrained by the exercise's measure, not chosen freely", "d": "a counted exercise can use weight or reps; a held one can only use time." },
      { "t": "The verdict is \"every planned set logged and none short\"", "d": "a skipped set is a miss; finishing at a reduced weight is a miss." },
      { "t": "On the weight axis, the step is applied to the lightest logged set", "d": "the load carried through the whole exercise. One heavy set among lighter ones is a heavy single, not a new working weight." },
      { "t": "Streaks are stored", "d": "consecutive successes/failures, because the target moves and a past session can only be judged against the goal that was live that day. Editing a workout in the builder can't forgive a pending back-off." },
      { "t": "A weight-mode slot with no suggested weight has no target to move", "d": "nothing happens, rather than inventing \"load 2.5 kg onto a push-up\"." }
    ]}
  ]
},

{
  "id": "06",
  "title": "Layoff deloads",
  "tagline": "Come back from a long break and the app offers a lighter start — measured per workout, never applied without asking.",
  "where": "<b>Pure rules</b> lib/data/layoff.dart (layoffDeload / deloadedTarget) · <b>Applied by</b> applyLayoffDeload(...) · <b>Offered on Start</b> lib/screens/workout_detail_screen.dart · <b>Settings</b> lib/screens/settings_screen.dart",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Watches the gap since a workout was last trained", "d": "not \"the routine\"." },
      { "t": "Offers a back-off before the session starts", "d": "whole periods away, each worth a percentage, stacking up to a cap." },
      { "t": "The cut lands somewhere trainable", "d": "down to the half kilo, never below the mode's floor — and the session says why it's lighter." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Set the rules", "d": "Profile → Settings → the layoff days threshold and percent per period. App-wide." },
      { "t": "When it triggers", "d": "open a workout untrained for a while → Start → a dialog offers the deload. Accept to start lighter, or decline to start at the weight you left." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "Per workout, not per routine", "d": "a split where Push comes round weekly but Legs hasn't been touched since spring catches Legs exactly." },
      { "t": "Nothing is applied without asking", "d": "accepting moves the template and draws the first set at the new weight; the cut is carried into the session as a notice shown for its whole length." },
      { "t": "Declining is not recorded", "d": "training today resets the gap by itself, so the question can't come back to nag." },
      { "t": "A deload clears both progression streaks", "d": "sessions either side of a month off aren't \"consecutive\" in any sense the progression rules mean." },
      { "t": "The thresholds are app-wide", "d": "unlike per-slot progression rates: a layoff is something that happened to you, not to one exercise." }
    ]}
  ]
},

{
  "id": "07",
  "title": "Plate math",
  "tagline": "For barbell lifts, the app works out which plates go on each side — from the rack you actually own.",
  "where": "<b>Solver</b> lib/data/plates.dart (solvePlates → PlateSolution) · <b>The line</b> lib/widgets/plate_line.dart · <b>Settings</b> lib/screens/bar_settings_screen.dart, plate_inventory_screen.dart",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Solves the plate breakdown for a target weight", "d": "what goes on one side, what the bar will actually come to, and whether that's the weight you asked for." },
      { "t": "Shows it as a line under an exercise", "d": "30 kg/side · 25 + 5 · bar 20 — re-solving the moment you type a different weight." },
      { "t": "Uses the bar for the exercise and the rack you own", "d": "its own bar, or the app-wide default, or the standard bar for the unit; one rack per unit." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "The line appears automatically", "d": "on the live session for barbell lifts, describing the next set's weight." },
      { "t": "Set the default bar", "d": "Profile → Settings → Bar &amp; plates → Bar weight." },
      { "t": "Set a bar for one exercise", "d": "open the exercise → its detail screen." },
      { "t": "Edit the rack", "d": "Profile → Settings → plates — step plate pair counts up and down." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "The search is exhaustive, not greedy", "d": "greedy is only correct when every plate divides the next one up, which a real rack (45/35/25 lb; a lone 1.25 kg) does not." },
      { "t": "Nothing is snapped", "d": "a weight the plates can't build is still yours to type; the line goes gold with the nearest buildable load. Green is the weight you asked for. belowBar is asking for less than the empty bar." },
      { "t": "Ties break the way a lifter loads a bar", "d": "fewest plates first, then the heaviest — 40 kg/side is 25 + 15, not 20 + 20, and never 10 + 5 + 2.5 + 2.5." },
      { "t": "The rack is pairs", "d": "plates go on two at a time; an odd plate is ignored. The assumed rack is a pair of every size plus a pile of the workhorse plate — 45s in a pounds gym, 20s in a metric one." },
      { "t": "One rack per unit", "d": "a rack is a set of sizes, not weights; each unit remembers its own, and the standard rack stands in until you edit it." },
      { "t": "Only a bar gets a line", "d": "a machine's number is the number; a dumbbell's is whatever's in your hand." }
    ]}
  ]
},

{
  "id": "08",
  "title": "Schedule & reminders",
  "tagline": "A routine can name the weekdays it's meant to be trained on, and ask for a local notification on them.",
  "where": "<b>Pure decision</b> lib/data/schedule.dart (nextReminderAt) · <b>Service</b> lib/services/reminders.dart · <b>Wired via</b> reminderSyncProvider, watched in lib/main.dart · <b>Edited in</b> lib/screens/routine_edit_screen.dart",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Stores which day of the week a routine is trained on", "d": "a day mask." },
      { "t": "Optionally fires one local notification per routine", "d": "at a chosen time on those days." },
      { "t": "Everything is on-device", "d": "no server, nothing leaves the phone." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Open a routine → edit", "d": "set its training days and, optionally, a reminder time. Leave the reminder off and no notification is scheduled." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "The next reminder is computed, not stored", "d": "the next scheduled day strictly after now, skipping today if the routine was already trained today, and wrapping a week for a once-weekly schedule." },
      { "t": "Reminders re-sync from a single place", "d": "a schedule edit, a finished session and a fresh launch all converge on the same pending notification — the app cancels and re-lays the next reminder on every sync." },
      { "t": "Scheduled inexactly on purpose", "d": "an exact alarm needs a permission Android 14 makes the user grant by hand, and a nudge to go to the gym doesn't need to land on the second." },
      { "t": "Android-only", "d": "the service is a no-op off Android, so tests never touch a platform channel. Android needs RECEIVE_BOOT_COMPLETED, the plugin's receivers, and core-library desugaring." }
    ]}
  ]
},

      { "t": "Switching units pops a confirm dialog first" }

    { "name": "How to use it", "items": [

    { "name": "The preview & the two markers", "items": [
      { "t": "The preview is the workout board", "d": "a miniature of the screen the palette has to survive — an exercise heading, three set rows (a hit, a short one, one still to do) and the stat strip — rather than twelve swatches." },
      { "t": "The set rows are the point", "d": "good and gold are the palette's hardest job, and a chip of each says nothing about telling them apart at speed. The untouched third row puts surface2, surface3 and faint on screen doing their real jobs." },
      { "t": "Two warnings, both binary", "d": "one when text is too close to its background, one when the two markers are too close to each other. Guidance, never a running number." },
      { "t": "Done and short must be unmistakable from each other", "d": "every preset holds them at least kMarkerDistance apart in CIELAB, and both clear 4.5:1 against the ground and a card. Contrast against the background was never the problem — Solarized's green and yellow sit at the same luminance, so their ratio against each other is 1.00 and says nothing." },
      { "t": "And they differ by more than hue", "d": "two colours that differ only in hue are the one pair a colour-blind reader cannot separate at all, so a set that came up short also carries a downward arrow. The colour is the fast read; the arrow is the one that always works." },
      { "t": "The preview warns when a palette is illegible", "d": "comparing its own text against its ground and cards at the same 4.5:1 the presets are held to." }
    ]},
    { "name": "The colour picker", "items": [
      { "t": "It speaks RGB and HSL, because they are for different jobs", "d": "RGB and the hex field transcribe a colour that already exists; HSL chooses one. The roles are families — surface/surface2/surface3 are one hue at three lightnesses — and contrast is a function of lightness, so L is the slider that answers the illegibility warning without discarding the colour that raised it." },
      { "t": "Every colour the shipped presets use can be reached by hand", "d": "that is asserted, not assumed." },
      { "t": "Hue and saturation are remembered, not recomputed", "d": "a grey has no hue to recover, so deriving them from the colour would snap the hue slider to red the moment saturation reached zero. Switching notation never changes the value, in either direction." },
      { "t": "The hex field takes #RGB, #RRGGBB or bare RRGGBB", "d": "anything that does not read yet simply does not move the colour, so backspacing through a hex is not destructive and a typo cannot silently repaint a role." },
      { "t": "A hex can be copied and pasted, not just typed", "d": "explicit copy and paste buttons, and a long press on any role row copies that role's hex — because building a family by hand starts from the last one's value, and retyping six digits is what stops people doing it." },
      { "t": "Each slider track is painted with the colours it traverses", "d": "so it previews its own effect rather than asking you to imagine it." },
      { "t": "The label on a filled button is measured, not assumed", "d": "whichever of a near-black tint or white reads better on the accent wins, so a custom or imported accent of any lightness still gets a legible label." }
    ]},
    { "name": "Presets, accessibility & storage", "items": [
      { "t": "An untouched install follows the phone", "d": "Ignition on a phone set to dark, Daylight on one set to light, flipping with the system until a theme is picked. A stored choice outranks the system from then on." },
      { "t": "Nothing is painted until the stored theme is known", "d": "the root holds a bare ground-coloured frame rather than painting a frame of the wrong theme and correcting it — which was a flicker on every cold launch." },
      { "t": "The tab shell takes its colours from the palette, not from AppColors", "d": "go_router holds its branch navigators by GlobalKey, so re-keying MaterialApp moves its elements instead of rebuilding them — which is why a cold launch used to paint the navigation bar in the previous theme." },
      { "t": "The picker groups presets by brightness", "d": "dark then light, with each group's high-contrast option last and badged AAA. Long-pressing the badge explains it; so does tapping it, but only on the row already selected." },
      { "t": "Both accessible presets clear WCAG AAA (7:1) for body text", "d": "and AA (4.5:1) for secondary text, the accent, the completed marker and the record marker — over both the ground and a card — with borders above the 3:1 non-text floor. Every other preset clears 4.5:1 for body text." },
      { "t": "Solarized ships as published, with two documented departures", "d": "body text takes the palette's emphasized tier rather than its body tier (Solarized's own body tones sit near 4.1:1), and the two intermediate surfaces are blends, since the palette defines two background tones and the app paints four." },
      { "t": "A custom theme is never badged accessible", "d": "however it got there. The badge means the palette was designed and checked against WCAG, which is a fact about the two shipped presets. The claim is dropped on import and the row refuses to draw the badge whatever is stored." },
      { "t": "Only your own themes are shareable", "d": "the share row is hidden unless one of your own is selected — and it sends the one that is selected, not \"the custom slot\"." },
      { "t": "A shared theme is always previewed, never applied on arrival", "d": "a scan, a tapped link and a pasted code all land on the same confirmation screen. A code that will not decode offers nothing to apply." },
      { "t": "An arriving theme is added to your own, never substituted", "d": "it never claims a preset slot and never overwrites a theme you built — importing four codes leaves you holding four themes." },
      { "t": "Deleting is confirmed, and deleting the one you are looking at is safe", "d": "the app falls back to the system default in the same write that removes the theme, so no selection is ever left pointing at nothing." },
      { "t": "The choice is stored as a slug; your themes are rows", "d": "Settings holds themePresetId — a preset slug, custom:&lt;n&gt;, or none — and each of your themes is a row in CustomThemes holding its palette as JSON. The name lives inside that JSON." },
      { "t": "A stored slug naming something that no longer exists falls back to the default", "d": "as any unknown slug does — and so does a custom:&lt;n&gt; naming a row that is gone." }
    ]},
    { "name": "Sharing format", "items": [
      { "t": "A theme code is FLT1. followed by base64url", "d": "the whole palette in 65–84 characters." },
      { "t": "FLT1 is a format version, read first and dispatched on", "d": "so a future FLT2 is declined rather than misread." },
      { "t": "Bytes between the name and the trailing checksum are ignored", "d": "so a later writer can add a field without breaking older readers." },
      { "t": "The role order is a wire format", "d": "reordering it silently changes the meaning of every code already shared." },
      { "t": "A CRC-16 catches the damage codes actually suffer", "d": "a truncated paste, a mistyped character. It is not a security measure." },
      { "t": "Reading distinguishes two failures", "d": "not a theme code at all (which includes any tag that is not FLT1), or damaged in transit." },
      { "t": "Links are fosslift://theme/&lt;code&gt;", "d": "a custom scheme rather than an https App Link, so sharing needs no domain, no hosting and no network. The trade-off is that chat apps do not linkify it." },
      { "t": "QR codes hold the full link", "d": "so one image serves both a system camera and the in-app scanner. Decoding is pure Dart via zxing2, not Google's ML Kit, keeping the app free of proprietary binaries." }
    ]}
  ]
},

{
  "id": "12",
  "title": "First-run tutorial",
  "tagline": "A one-time coach-mark tour that runs on first launch.",
  "where": "<b>Overlay + anchors</b> lib/widgets/tutorial.dart · <b>Seen flag</b> Settings.tutorialSeen",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Opens on a welcome card", "d": "what the app is, and the choice to take the tour or not." },
      { "t": "Overlays a guided coach-mark tour", "d": "pointing at the key parts of the UI to get a new user started." },
      { "t": "Runs once", "d": "a flag records that it's been seen, so it never reappears." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "It appears by itself the first time the app is opened", "d": "Take the tour to walk through it, Not now to dismiss." },
      { "t": "Replay it any time", "d": "Profile → Help &amp; tour, which also starts at the welcome." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "Shown once, then remembered", "d": "Settings.tutorialSeen records that the tour has run." },
      { "t": "Anchored to real UI", "d": "the overlay attaches its callouts to on-screen anchors rather than hard-coded positions." },
      { "t": "It covers the live workout, which it cannot point at", "d": "the board, the rest timer and the shade are where the app is least like every other tracker — and none of them exists until a session is running. Those steps are told rather than pointed at, anchored to the card that leads there." },
      { "t": "Every anchored step is on the Today tab", "d": "the tour drives no navigation, so a step aimed at a screen you have to open would spotlight a rectangle that is not there." },
      { "t": "It introduces itself before it points at anything", "d": "the first step has no anchor at all — a plain dimmed screen and a card in the middle of it — and it is the step a replay starts from too." },
      { "t": "The greeting stacks its two answers", "d": "\"Take the tour\" over \"Not now\", rather than side by side: two long labels in a callout narrower than either the phone or the font can be relied on to be. Every later step is a short Skip / Back / Next." },
      { "t": "Declining ends it cleanly", "d": "the same path as skipping mid-tour, including recording that the tour has been seen." }
    ]}
  ]
},

{
  "id": "13",
  "title": "Offline & privacy",
  "tagline": "Everything is on-device. No network, no account, no telemetry.",
  "where": "<b>Screens</b> lib/screens/about_screen.dart · <b>Database</b> lib/data/database.dart (drift over SQLite) · <b>Clip storage</b> lib/services/set_video_store.dart · <b>Statement</b> PRIVACY.md",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Makes no network connections and collects nothing", "d": "no account, no server, no analytics." },
      { "t": "Stores all data on-device", "d": "in a local SQLite database (drift)." },
      { "t": "The only \"notification\" is a local one", "d": "scheduled on-device; it never leaves the phone." },
      { "t": "Says so, once, on an About screen", "d": "what the app does with your data, the licence, and an address to report a bug to." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Nothing to configure", "d": "no sign-in and no connectivity requirement; the app works fully offline." },
      { "t": "About", "d": "Profile → About Foss Lift." },
      { "t": "Report a bug", "d": "opens a pre-addressed draft in whatever handles mail; the address is printed underneath as well, and long-pressing it copies it." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "The UI never touches SQLite directly", "d": "screens watch providers, providers call the single AppDatabase — which is why there's one well-defined place all data lives." },
      { "t": "Reminders are the only platform integration", "d": "and they're on-device and Android-only." },
      { "t": "The three outward hand-offs are all to another app you can see", "d": "a demo link to the browser, a share code to the system share sheet, a bug report to a mail app. None is the app talking to a server — it holds no network permission to do so with." },
      { "t": "The promise is stated once, on About", "d": "rather than repeated as reassurance on every screen that shares something." },
      { "t": "The camera is used twice, and the two uses are not alike", "d": "scanning a QR examines frames and drops them. Filming a set writes a file, and it is the first data the app holds that is recognisably a person — so it is fenced." },
      { "t": "Clips live in app-private storage", "d": "never the shared gallery, never anywhere another app can enumerate them." },
      { "t": "There is no upload path and no share sheet for a clip", "d": "every other shareable thing in the app has one; this deliberately does not." },
      { "t": "Recording is the only way one gets in", "d": "nothing is imported from the gallery, which would need read access to shared storage." },
      { "t": "No audio is ever captured", "d": "which also means the app never asks for the microphone." },
      { "t": "The camera is opened only while filming", "d": "and released immediately after." },
      { "t": "Clips are the one thing that can fill a phone", "d": "so what they cost is shown in Settings with a way to reclaim it — and nothing is ever deleted automatically, because every rule that could be would bin the oldest recording first." }
    ]}
  ]
},

{
  "id": "14",
  "title": "Sharing a routine",
  "tagline": "A whole programme — days, slots, rep schemes, progression rates and the custom exercises it depends on — as one line of text you can paste into a message.",
  "where": "<b>Wire format</b> lib/data/routine_code.dart (FLR1) on lib/data/share_code.dart · <b>QR capacity</b> lib/util/qr_capacity.dart · <b>Landing an import</b> lib/data/routine_import.dart + AppDatabase.importSharedRoutine · <b>Screens</b> routine_share_screen.dart, routine_import_screen.dart, scan_screen.dart · <b>Links</b> lib/services/deep_links.dart + AndroidManifest.xml",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Export — any routine becomes a routine code", "d": "a versioned, compressed, base64 line beginning FLR1. It carries the routine's name, colour, default rest and training days; every workout in order; every exercise slot with its full configuration; and a definition of every exercise the routine references." },
      { "t": "Two ways out — a QR, or a fosslift://routine/… link", "d": "both carry the same code. Nothing is uploaded. The system share sheet is where \"copy\" lives; there is no separate copy button and no file to save." },
      { "t": "Import — a scanned QR, a tapped link or a pasted code", "d": "lands on a confirmation screen. Nothing is written until you accept it." },
      { "t": "Custom exercises travel with the routine", "d": "the name, muscle group, equipment, weight type and bar — plus a video link, if there is a video behind it. The recipient does not need them beforehand." },
      { "t": "A name clash is your call", "d": "if an incoming exercise has the same name as one already in the library and its definition differs, the import asks whether to replace yours or keep it. Keeping is the default." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Send one", "d": "Routines → open a routine → the share icon → Show QR or Send link." },
      { "t": "Receive one", "d": "Routines → scroll past + New routine to IMPORT A ROUTINE → Scan QR or Paste code. A fosslift://routine/… link tapped anywhere on the phone opens the same screen." },
      { "t": "Decide on clashes", "d": "the confirmation screen lists every exercise that will be added, and every one whose name you already use. Each clash has a Replace switch, off by default." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "The code is the whole routine", "d": "no server, no id to look up, nothing to expire. A code shared in 2026 still imports in 2030." },
      { "t": "There is nothing wordy left to carry", "d": "an exercise used to hold a coaching cue, the largest thing in a routine code; removing it took a custom exercise from about 55 characters on the wire to a handful." },
      { "t": "A video link travels as its id", "d": "any YouTube URL is reduced to its eleven-character id and rebuilt as https://youtu.be/&lt;id&gt; at the other end. A link with no video behind it does not travel at all — a search URL spends ninety characters to say nothing." },
      { "t": "Names are capped at 200 UTF-8 bytes on the wire", "d": "generous next to the 80 the app enforces, so a legal name never loses characters here first — and bounded, so a corrupt code cannot claim a megabyte of routine name. A longer one is cut rather than refused." },
      { "t": "Defaults are not transmitted", "d": "a slot only spends bytes on fields that differ from the app's defaults, and increment/deload defaults are read per progression mode. The PPL demo routine encodes to 421 characters." },
      { "t": "A QR is offered whenever one can hold the routine", "d": "the ceiling is the standard's: 2,331 bytes at medium error correction, 2,953 at low. A routine that outgrows medium is painted at low rather than refused; past 2,953 the QR is withheld with an explanation rather than rendered as an unscannable smudge." },
      { "t": "The symbol is drawn as large as the screen allows", "d": "density is the real limit on scanning a screen with a camera. It measures the screen and not its parent, and pins the result with a fixed box — which is how Show QR came to dim the screen and paint nothing at all." },
      { "t": "The paste box owns its own field", "d": "showDialog's future completes when the route is popped, which is the start of the dismissal and not the end of it, so disposing at the await left the field using a dead controller for the length of the fade." },
      { "t": "Every host the app shares needs an Android intent filter", "d": "or the link is inert outside the app however well the routing handles it. A test now reads the manifest and checks each host is listed." },
      { "t": "Progress does not travel", "d": "the success/failure streaks and the sender's reminder time are left behind. Everything else — including the training-day schedule — comes across." },
      { "t": "Built-in exercises travel by name", "d": "the starter library is on both phones, matched case-insensitively on import." },
      { "t": "Your own notes never travel, and are never overwritten", "d": "including under Replace, which rewrites everything else about the exercise." },
      { "t": "An exercise that already exists is reused, never duplicated", "d": "importing the same routine twice gives you two routines and one copy of each exercise." },
      { "t": "Replacing edits in place", "d": "it rewrites the existing exercise's definition and keeps its id, so its logged history and every other routine pointing at it survive." },
      { "t": "An import always creates a new routine", "d": "nothing existing is overwritten, and the new routine does not take over Today." },
      { "t": "A code that will not read is a dead end", "d": "the two failures — not a routine code at all, or damaged in transit — each say which, and neither offers a partial import." }
    ]}
  ]
},

{
  "id": "15",
  "title": "Text size",
  "tagline": "The app follows the phone's text setting, and can be nudged on top of it.",
  "where": "<b>Arithmetic</b> lib/util/text_scale.dart (resolveTextScale, kTextScaleChoices, the two bounds) · <b>Applied once</b> at the app root in lib/main.dart · <b>Stored as</b> Settings.textScale, read through textScaleProvider",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Follows the system text size", "d": "Android's own setting is system-wide and already discoverable; the app renders at whatever it says." },
      { "t": "Offers a nudge of its own", "d": "Smaller / Default / Larger / Largest — for wanting this app bigger without enlarging everything else, or smaller to fit more of a workout on screen." },
      { "t": "Holds the result in a range every screen is checked at", "d": "so no combination of the two produces a layout nobody has seen." }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Profile → Settings → Text size", "d": "each chip is drawn at the size it selects, because how big the words get is the only thing the control is about." },
      { "t": "Default means \"whatever the phone says\"", "d": "the phone's own setting is under Android's display settings and needs nothing here." }
    ]},
    { "name": "Behaviour & edge cases", "items": [
      { "t": "The nudge multiplies the phone's setting; it does not replace it", "d": "somebody who has already set their phone large should not have to set it again here, and should not lose that choice by touching this one." },
      { "t": "The product is clamped to 0.85×–2.0×", "d": "a phone at 2.0 and the app at Largest is 2.6, and a control that can produce an unchecked layout is not an accessibility feature. 2.0 is the ceiling because 2.0 is what the sweep covers; the floor is where the set rows stop being readable across a gym." },
      { "t": "Every screen is swept at every scale, and overflow fails the build", "d": "the feature test mounts each screen at 1.0×, 1.3× and 2.0× on a 360 dp viewport and fails on any render overflow." },
      { "t": "The dialogs and sheets are swept too", "d": "the tighter case — a dialog is bounded on both axes by its own insets, and none of it is on screen for the screen sweep to see. Covered at 1.0× and 2.0×, reached the way a user reaches them. That is where the stepper and the to-failure checkbox turned up." },
      { "t": "Where a row runs out of width, the label gives and the control does not", "d": "a section heading ellipsises before its action is pushed off; the warm-up group's \"· 3 sets\" gives before \"WARM-UP\"; the board's \"WORKING SETS\" gives before the weight beside it; a stepper's value ellipsises before either of its buttons. The part that only names things yields to the part you touch." }
    ]}
  ]
},

{
  "id": "16",
  "title": "Set videos",
  "tagline": "Film a set, and keep the clip attached to the set it was. Everything stays on the phone.",
  "where": "<b>Storage, naming, sweep</b> lib/services/set_video_store.dart · <b>Camera</b> lib/services/set_video_recorder.dart · <b>Screens</b> set_video_screen.dart, clip_player_screen.dart, exercise_clips_screen.dart, video_settings_screen.dart · <b>Label &amp; speeds</b> lib/util/clip_label.dart · <b>Path</b> SetEntry.videoPath live, SessionSets.videoPath saved",
  "groups": [
    { "name": "What it does", "items": [
      { "t": "Records one clip per set", "d": "from the live workout board, against the set in front of you." },
      { "t": "Marks a set that carries a clip", "d": "so it can be found again." },
      { "t": "Plays one back full screen", "d": "at half or quarter speed, looping on request." },
      { "t": "Lists every clip of one movement in date order", "d": "the same lift over months." },
      { "t": "Shows what the clips cost, and offers to reclaim it" }
    ]},
    { "name": "How to use it", "items": [
      { "t": "Film a set", "d": "during a workout, tap the camera on the set's row, then the shutter. It stops itself at the cap, or when you tap stop." },
      { "t": "Re-film or delete", "d": "tap the camera again on a set that already has a clip." },
      { "t": "Watch one back", "d": "Library → the exercise → N clips. Or from a session: History → the session → tap an exercise marked with a play symbol." },
      { "t": "See the cost", "d": "Profile → Settings → Storage, under Set videos. The screen behind it holds the quality, the max clip length and the way to get the space back." }
    ]},
    { "name": "Recording", "items": [
      { "t": "Recording is the only way a clip gets in", "d": "nothing is imported from the gallery: that would mean read access to shared storage, its own permission and its own privacy paragraph, for a path nobody asked for." },
      { "t": "No audio, ever", "d": "enableAudio: false. A gym is full of other people's conversations, the track is worth nothing for checking bar path, and leaving it off avoids the microphone permission prompt on both platforms." },
      { "t": "The camera is opened only while filming", "d": "and released the moment the recording screen closes. It is never held open in the background." },
      { "t": "Recording stops itself at the max clip length", "d": "60 seconds by default, 3 minutes if asked for. The failure mode that fills a phone is a recording nobody stopped. The last five seconds count down, so the stop is never a surprise." },
      { "t": "720p by default, 480p on request", "d": "1080p is not offered — roughly two and a half times the bytes for a judgement 720p already answers." },
      { "t": "Warm-ups cannot be filmed", "d": "they are suggestions that are never saved, so there is no logged set for a clip to belong to. The column is still reserved on those rows, so the two sections line up." },
      { "t": "A clip filmed mid-session is a file plus a path in memory", "d": "the live workout does not touch the database until Finish. The path is written alongside the set when the session is saved." },
      { "t": "Abandoning a workout takes its clips with it", "d": "nothing was written, so nothing points at those files." },
      { "t": "A clip on a set that was never logged goes too", "d": "at Finish — the set is not saved, so nothing would ever point at it." },
      { "t": "Deleting a clip leaves the set alone", "d": "a bad take is not a set that did not happen." },
      { "t": "Re-filming replaces", "d": "and the take it replaces is deleted then and there rather than left for the sweep." }
    ]},
    { "name": "Playing one back", "items": [
      { "t": "Full screen, on black", "d": "with play/pause and a scrubber you can drag." },
      { "t": "A loop you switch on", "d": "off to begin with, because a clip that plays once and stops is what opening one leads you to expect. Looping is what you reach for once you have found the rep worth watching again." },
      { "t": "Slow motion at 0.5× and 0.25×", "d": "on a cycling control. Nothing above 1×: this is for inspecting a rep, not skipping one." },
      { "t": "Frame-by-frame stepping is out of scope, deliberately", "d": "landing on an exact frame means seeking past the nearest keyframe and decoding forward, which the player cannot be relied on to do. Revisit it if the underlying player gains an exact-seek option." },
      { "t": "A clip whose file has gone says so", "d": "rather than sitting at nought seconds. A row can outlive its file if one is removed by hand." },
      { "t": "Deleting from the player clears the row first, then the file", "d": "the same ordering as everywhere else." }
    ]},
    { "name": "Finding one again", "items": [
      { "t": "The exercise's own reel", "d": "a flat list of every clip of that movement, newest first, each labelled with the set it came from — 12 Mar · set 3 · 100 kg × 5. Your squat over months, in one place." },
      { "t": "The button appears only once there is something to watch", "d": "an empty reel is a button that teaches you the feature exists by disappointing you." },
      { "t": "The session recap marks a filmed exercise", "d": "with a play symbol and a \"N filmed\" count. With more than one filmed set of the same movement the choice is offered rather than guessed at." },
      { "t": "The label reads identically in both places", "d": "one implementation (clipLabelOf), two callers — the same clip must not appear to be two different things." }
    ]},
    { "name": "Storage — the policy, stated", "items": [
      { "t": "Nothing is ever deleted automatically", "d": "every retention rule deletes the oldest clip first, and the oldest clip is the one the feature exists for. It would optimise the cost by throwing away the point." },
      { "t": "The caps do the work instead", "d": "one clip cannot be large, so the library cannot grow surprisingly fast." },
      { "t": "What is spent is visible", "d": "in Settings, with a way to reclaim it." },
      { "t": "Clips live in app-private storage", "d": "getApplicationSupportDirectory(), a set_videos/ subfolder — never the shared gallery, never uploaded, and no share sheet." },
      { "t": "Only relative paths are stored", "d": "set_videos/&lt;id&gt;.mp4, joined onto a freshly resolved directory every time. The iOS container path carries a UUID that changes on reinstall and restore." },
      { "t": "The filename is a generated id", "d": "not a timestamp, which collides, and not the exercise name, which would leak what somebody trains to anything that can list the directory." }
    ]},
    { "name": "Never a dead reference", "items": [
      { "t": "The file is written first, and the row that names it only at Finish" },
      { "t": "Deleting goes row first, then file" },
      { "t": "A sweep on launch removes any file in set_videos/ that no row points at" },
      { "t": "The sweep leaves files younger than kOrphanGrace (24 hours) alone", "d": "without that guard it would delete the clip of the set being filmed right now, which has no row yet by design." },
      { "t": "There is no way to delete a session in the app today", "d": "when one exists, the rows go with the session by foreign-key cascade and the files become orphans the sweep collects." }
    ]}
  ]
}
]
</script>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'fosslift.features.v1';
  const state = JSON.parse(localStorage.getItem(KEY) || '{}');

  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };

  const secEl = document.getElementById('sections');
  const navEl = document.getElementById('nav');
  const items = [];   // {id, li, sec, text}
  const secs  = [];   // {data, el, navA, ids}

  navEl.insertAdjacentHTML('beforeend', '<p class="navhead">Contents</p>');

  DATA.forEach(sec => {
    const ids = [];
    let html = '<h2 id="s' + sec.id + '"><span class="num">' + sec.id + '</span>' + sec.title + '<span class="f"></span></h2>';
    html += '<p class="tagline">' + sec.tagline + '</p>';
    sec.groups.forEach(g => {
      html += '<h3>' + g.name + '</h3><ul class="items">';
      g.items.forEach(it => {
        const id = sec.id + '-' + hash(g.name + '|' + it.t);
        ids.push(id);
        const on = !!state[id];
        html += '<li class="item' + (on ? ' done' : '') + '" data-id="' + id + '">' +
          '<label class="row"><input type="checkbox"' + (on ? ' checked' : '') + '>' +
          '<span class="txt"><span class="t">' + it.t + '</span>' +
          (it.d ? ' <span class="d">' + it.d + '</span>' : '') +
          '</span></label></li>';
      });
      html += '</ul>';
    });
    if (sec.where) html += '<p class="where">' + sec.where + '</p>';

    const el = document.createElement('section');
    el.id = 'sec' + sec.id;
    el.innerHTML = html;
    secEl.appendChild(el);

    const a = document.createElement('a');
    a.href = '#sec' + sec.id;
    a.innerHTML = '<span class="n">' + sec.id + '</span><span>' + sec.title + '</span><span class="f"></span>';
    navEl.appendChild(a);

    secs.push({ data: sec, el, navA: a, ids });
    el.querySelectorAll('li.item').forEach(li => {
      items.push({ id: li.dataset.id, li, sec, text: li.textContent.toLowerCase() });
    });
  });

  const countEl = document.getElementById('count');
  const fill = document.getElementById('barfill');

  function tally() {
    let done = 0;
    secs.forEach(s => {
      const d = s.ids.filter(i => state[i]).length;
      done += d;
      const label = d + '/' + s.ids.length;
      s.navA.querySelector('.f').textContent = label;
      s.el.querySelector('h2 .f').textContent = label;
      const full = d === s.ids.length;
      s.navA.classList.toggle('full', full);
      s.el.classList.toggle('full', full);
    });
    const total = items.length;
    countEl.innerHTML = '<b>' + done + '</b> / ' + total;
    fill.style.width = (total ? (done / total * 100) : 0) + '%';
  }

  secEl.addEventListener('change', e => {
    const box = e.target;
    if (box.type !== 'checkbox') return;
    const li = box.closest('li.item');
    if (box.checked) state[li.dataset.id] = 1; else delete state[li.dataset.id];
    li.classList.toggle('done', box.checked);
    localStorage.setItem(KEY, JSON.stringify(state));
    tally();
    applyFilter();
  });

  // ---- filtering ----
  const q = document.getElementById('q');
  const hideBtn = document.getElementById('hide');
  const emptyEl = document.getElementById('empty');
  let hideChecked = false;

  function applyFilter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    items.forEach(it => {
      const matches = (!term || it.text.includes(term)) && (!hideChecked || !state[it.id]);
      it.li.hidden = !matches;
      if (matches) shown++;
    });
    secs.forEach(s => {
      const any = [...s.el.querySelectorAll('li.item')].some(li => !li.hidden);
      s.el.hidden = !any;
      s.navA.hidden = !any;
      s.el.querySelectorAll('h3').forEach(h3 => {
        const ul = h3.nextElementSibling;
        h3.hidden = ![...ul.querySelectorAll('li.item')].some(li => !li.hidden);
        ul.hidden = h3.hidden;
      });
      const where = s.el.querySelector('.where');
      if (where) where.hidden = !!term || hideChecked;
    });
    emptyEl.hidden = shown > 0;
  }

  q.addEventListener('input', applyFilter);
  hideBtn.addEventListener('click', () => {
    hideChecked = !hideChecked;
    hideBtn.setAttribute('aria-pressed', String(hideChecked));
    hideBtn.textContent = hideChecked ? 'Show all' : 'Hide checked';
    applyFilter();
  });

  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Clear every tick?')) return;
    Object.keys(state).forEach(k => delete state[k]);
    localStorage.setItem(KEY, JSON.stringify(state));
    secEl.querySelectorAll('input[type=checkbox]').forEach(b => { b.checked = false; b.closest('li').classList.remove('done'); });
    tally(); applyFilter();
  });

  document.getElementById('expandAll').addEventListener('click', () => {
    const visible = items.filter(it => !it.li.hidden);
    const allOn = visible.every(it => state[it.id]);
    visible.forEach(it => {
      if (allOn) delete state[it.id]; else state[it.id] = 1;
      it.li.querySelector('input').checked = !allOn;
      it.li.classList.toggle('done', !allOn);
    });
    localStorage.setItem(KEY, JSON.stringify(state));
    tally(); applyFilter();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; applyFilter(); q.blur(); }
  });

  // ---- scroll spy ----
  const spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        navEl.querySelectorAll('a.on').forEach(a => a.classList.remove('on'));
        const s = secs.find(x => x.el === en.target);
        if (s) s.navA.classList.add('on');
      }
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  secs.forEach(s => spy.observe(s.el));

  tally();
  applyFilter();
})();
</script>
</body>
</html>
