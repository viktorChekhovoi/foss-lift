id: "13"
title: Offline & privacy
tagline: All data stays on-device; the app has no network, account, or telemetry.
screen: about
code:
- lib/screens/about_screen.dart
- lib/data/database.dart
- lib/services/set_video_store.dart
test:
- test/feature_13_offline_and_privacy_test.dart
where: >-
  <b>About</b> lib/screens/about_screen.dart · <b>Database</b> lib/data/database.dart
  (drift over SQLite) · <b>Clip storage</b> lib/services/set_video_store.dart · <b>Policy</b> PRIVACY.md
groups:
- name: What it does
  items:
  - id: makes-no-network-connections-collects
    t: Makes no network connections and collects no telemetry
    d: >-
      The app has no account, server, or analytics and works offline. Request-capable
      imports are prohibited except for two named browser-API files used by the web
      build.
    screen: none
    defines:
    - privacy.offline
    uses:
    - platform.web
  - id: stores-all-data-device
    t: Stores all data on the current device
    d: >-
      Data is stored in a local drift/SQLite database: app-private phone storage,
      or the browser storage for the page origin on web. Both use the same schema
      and queries.
    screen: none
    defines:
    - storage.schema
    uses:
    - storage.database-location
    - privacy.offline
  - id: preferences-live-one-row
    t: App-wide preferences live in one row
    d: >-
      The row contains the unit, current routine, theme, text-size adjustment,
      layoff rules, plate rack, clip caps, warm-up count, and tutorial flag. A write
      updates only named columns and creates the row if absent.
    screen: none
    defines:
    - storage.settings
    uses:
    - storage.schema
  - id: update-keeps-what-is-already-stored
    t: Updates preserve stored data
    d: >-
      the database climbs a numbered ladder as it opens — one rung per schema
      change, each taking the shape before it to the shape after — so a phone
      coming from an older build finds its history, its routines and its
      settings where it left them, and a preference that build never had arrives
      at its default rather than empty.
    screen: none
    defines:
    - storage.migration
    uses:
    - storage.schema
    - storage.settings
  - id: existing-workouts-arrive-with-no-supersets
    t: Pre-update workouts contain no supersets
    d: >-
      the join between two slots is a new column that defaults to off, so every
      slot on an installed phone keeps standing on its own and no existing day
      changes shape. Making a superset is something you then do, not something the
      upgrade decides for you.
    screen: none
    uses:
    - storage.migration
    - template.superset
  - id: an-update-brings-the-new-starter-movements
    t: Updates add missing starter movements
    d: >-
      the starter library grows, and a phone that never got the additions cannot
      be given a routine that uses one — so the shipped set is walked on upgrade
      and anything missing is inserted, matched on the canonical English name.
      Nothing already there is touched: a movement you have set a loading, a bar
      or a note on keeps all three, whatever this build would now say about it,
      and a movement you built yourself under the same name blocks the insert
      rather than being overwritten.
    screen: none
    uses:
    - storage.migration
    - exercise.seed
  - id: sets-logged-before-the-update-carry-no-readouts
    t: Pre-update sets have no console readouts
    d: >-
      speed, incline, resistance and distance are four nullable columns added to
      the logged-set table, so every set already in the history arrives with all
      four empty — which is what "nobody recorded this" means, and it is what
      the recap prints nothing for.
    screen: none
    uses:
    - storage.migration
    - session.console-metrics
    - history.session-record
  - id: only-notification-local-one
    t: Notifications are local only
    d: scheduled on-device; it never leaves the phone.
    screen: shade
    uses:
    - platform.reminders
    - privacy.offline
  - id: says-so-once-about-screen
    t: States the privacy model on About
    d: >-
      Profile → About Foss Lift: what the app does with your data, the licence, and
      an address to report a bug to.
    uses:
    - privacy.offline
- name: How to use it
  items:
  - id: report-bug
    t: Report a bug
    d: >-
      opens a pre-addressed draft in whatever handles mail; the address is printed
      underneath as well, and long-pressing it copies it.
    screen: system
    uses:
    - privacy.offline
- name: Behaviour & edge cases
  items:
  - id: ui-never-touches-sqlite-directly
    t: The UI does not access SQLite directly
    d: >-
      screens watch providers, providers call the single AppDatabase — which is
      why there's one well-defined place all data lives.
    screen: none
    uses:
    - storage.schema
  - id: three-outward-hand-offs-all
    t: Outward hand-offs open another app
    d: >-
      a demo link to the browser, a share code to the system share sheet, a bug
      report to a mail app. None is the app talking to a server — it holds no
      network permission to do so with.
    screen: system
    uses:
    - privacy.offline
    - share.deep-link
    - exercise.video-url
  - id: camera-used-twice-two-uses
    t: The camera is used only for scanning and recording
    d: >-
      scanning a QR examines frames and drops them. Filming a set writes a file,
      and it is the first data the app holds that is recognisably a person — so
      it is fenced. Neither records audio, and the microphone is not in the
      manifest to be asked for.
    screen: none
    uses:
    - share.qr
    - video.capture
    - platform.permissions
  - id: plugin-permissions-are-pruned
    t: Unneeded plugin permissions are removed
    d: >-
      the list a phone shows is the merged manifest, not the one in this
      repository, and plugins add their own — the camera library declares the
      microphone whether or not audio is ever recorded, and the video player drags
      in network state. Both are removed again by name, so that what the app asks
      for is what the app does. An offline tracker holding the microphone is
      exactly the discrepancy somebody checking would find, and "it never prompts"
      is not an answer to it.
    screen: none
    uses:
    - privacy.offline
    - platform.permissions
    - platform.android
  - id: there-no-upload-path-no
    t: Clips have no upload path or share action
    d: >-
      every other shareable thing in the app has one; this deliberately does not.
    screen: none
    uses:
    - video.storage
    - privacy.offline
  - id: clips-one-thing-can-fill
    t: Clips are the only unbounded local data
    d: >-
      the only data the app holds that grows without bound, which is why what they
      cost is a screen of its own.
    screen: video-settings
    uses:
    - video.storage
