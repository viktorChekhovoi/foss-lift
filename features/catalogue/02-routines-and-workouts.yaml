id: "02"
title: Routines & workouts
tagline: >-
  A program is three levels deep — routine → workout → exercise slot. You build,
  edit, reorder and delete at every level.
screen: routines
code:
- lib/screens/routines_screen.dart
- lib/screens/routine_detail_screen.dart
- lib/screens/routine_edit_screen.dart
- lib/screens/workout_detail_screen.dart
- lib/screens/workout_edit_screen.dart
- lib/widgets/workout_items_editor.dart
- lib/widgets/routine_card.dart
- lib/data/workout_estimate.dart
- lib/widgets/workout_estimate.dart
test:
- test/feature_02_routines_and_workouts_test.dart
- test/feature_02_workout_duration_test.dart
where: >-
  <b>Screens</b> routines_screen.dart, routine_detail_screen.dart, routine_edit_screen.dart,
  workout_detail_screen.dart, workout_edit_screen.dart · <b>Shared editor</b>
  lib/widgets/workout_items_editor.dart, routine_card.dart · <b>Estimate</b>
  lib/data/workout_estimate.dart, lib/widgets/workout_estimate.dart · <b>Data</b> Routines,
  Workouts, WorkoutItems
groups:
- name: What it does
  items:
  - id: routine-whole-programme
    t: A routine is a whole program
    d: >-
      Push/Pull/Legs, Upper/Lower… It carries a name, a colour, a default rest
      time and its weekly schedule.
    defines:
    - template.routine
    uses:
    - template.rest
  - id: workout-one-training-day-inside
    t: A workout is one session's worth of exercises inside a routine
    d: >-
      this is the thing you actually Start. It is called a workout everywhere —
      on the screens, in the tour and in here — because a routine is a set of
      them and picking a second noun for the same thing only ever costs a reader.
      Names need not be unique inside a routine — Upper/Lower legitimately has
      "Upper 1" and "Upper 2".
    defines:
    - template.workout
  - id: exercise-slot-one-exercise-inside
    t: An exercise slot is one exercise inside a workout
    d: with its own configuration.
    defines:
    - template.item
  - id: one-routine-current-routine
    t: One routine is the current routine
    d: the one Today is about.
    screen: today
    defines:
    - template.active-routine
  - id: two-demo-routines-seeded-first
    t: Five starter programs are seeded on first launch
    d: >-
      Two hypertrophy splits — Push / Pull / Legs and Upper / Lower — and three
      beginner strength programs: Starting Strength, StrongLifts 5x5 and
      Full Body 3x. Push / Pull / Legs is the one Today starts out about.
    uses:
    - template.routine
    - exercise.seed
  - id: seeded-programmes-carry-their-prescription
    t: A seeded program is set up the way the program is actually run
    d: >-
      Not one shape copied five times. Starting Strength opens on 3&nbsp;&times;&nbsp;5
      with the deadlift a single set and the power clean 5&nbsp;&times;&nbsp;3;
      StrongLifts is 5&nbsp;&times;&nbsp;5 with the deadlift 1&nbsp;&times;&nbsp;5.
      The linear-progression programs step the squat and the deadlift 5&nbsp;kg a
      session and the presses 2.5&nbsp;kg, and back off 10% only after
      <b>three</b> failed sessions rather than the usual two. Rest defaults follow
      the program too — five minutes on Starting Strength, three on StrongLifts.
    uses:
    - template.routine
    - template.rest
    - progression.rates
    - exercise.seed
    - template.item
    - template.rep-target
  - id: workout-carries-estimated-duration
    t: A workout says how long it will take
    d: >-
      an estimate read off the template alone — the working sets, the warm-up
      rungs before them at the count Settings asks for, the rest after every set
      but the last, and time under the bar scaled by the reps or the hold. Shown
      as a single rounded figure next to the exercise count, on the workout
      and on its Today card.
    screen: workout-detail
    defines:
    - template.duration-estimate
    uses:
    - template.item
    - template.rest
    - template.rep-target
    - session.warmup-ramp
    - session.warmup-count
- name: How to use it
  items:
  - id: see-current-routine-s-days
    t: See the current routine's workouts
    d: >-
      the Today tab lists them directly, under the routine's name in full — it
      wraps rather than truncating, at any text size. Starting a workout is two
      taps: tap a workout → Start.
    screen: today
    uses:
    - template.active-routine
    - ui.text-scale
  - id: pick-change-current-routine
    t: Pick / change the current routine
    d: >-
      Routines → open one → the radio button in its app bar makes it the routine
      Today is about. It is already filled in on the routine that holds that
      place, and disabled there.
    screen: routine-detail
    uses:
    - template.active-routine
    - storage.settings
  - id: open-routine-see-its-days
    t: A routine's page lists its workouts
    d: >-
      numbered, in the order you train them, each with the exercises it holds
      and the one you are due next badged. Tapping a workout opens it; the app bar
      carries share and edit. You start a workout from its own page, never from the
      routine.
    screen: routine-detail
    uses:
    - template.routine
    - template.workout
  - id: build-edit-routine
    t: Build / edit a routine
    d: >-
      Routines → open a routine → edit → name, colour, default rest, schedule,
      and the list of workouts: add, delete, and drag by the handle on the
      left of each row into the order you train them.
    screen: routine-edit
    uses:
    - template.routine
    - template.workout
    - template.rest
  - id: build-edit-day-s-exercises
    t: Build / edit a workout's exercises
    d: >-
      open a workout → edit → add exercises from the picker, drag them by the
      handle into order, configure each slot. The same control at both levels.
    screen: workout-edit
    uses:
    - template.workout
    - template.item
- name: Behaviour & edge cases
  items:
  - id: estimate-rounded-not-precise
    t: The estimate is rounded to five minutes and marked as approximate
    d: >-
      a workout that comes out at 47 minutes reads <b>~45 min</b>. Anything above
      zero rounds up to at least five, and a workout with no exercises shows no
      estimate at all rather than zero.
    screen: workout-detail
    uses:
    - template.duration-estimate
  - id: estimate-follows-template-edits
    t: The estimate moves when the template does
    d: >-
      add a set, widen the rep range, lengthen the rest or override it on one
      slot, and the figure on the workout and on the Today card follows.
      A slot's own rest override is used where it is set; every other slot falls
      back to the routine's default rest.
    screen: workout-detail
    uses:
    - template.duration-estimate
    - template.rest
  - id: estimate-is-planned-time-not-history
    t: The estimate is what the plan costs, not what past sessions took
    d: >-
      logged durations are wall-clock from Start to Finish with no pause, so a
      session left running while you walk home records an hour that was never
      trained and nothing stored distinguishes it. The estimate is derived from
      the template alone, which is also what lets a workout that has never been
      trained carry one.
    screen: none
    uses:
    - template.duration-estimate
    - history.session-record
  - id: editing-split-match-hierarchy
    t: Editing is split to match the hierarchy
    d: >-
      the routine editor changes routine meta and its list of workouts; the workout
      editor changes the exercises inside one workout. Renaming or reordering workouts
      never disturbs the exercises inside them, and only workouts you actually
      removed are deleted.
    screen: routine-edit
    uses:
    - template.routine
    - template.workout
    - ui.navigation
  - id: you-can-build-routine-s
    t: You can build a routine's exercises before saving it
    d: drafts are held in memory and written on save.
    screen: routine-edit
    uses:
    - template.item
  - id: deleted-current-routine-degrades-none
    t: A deleted current routine degrades to "none"
    d: rather than dangling — Today falls back to the routine chooser.
    screen: today
    uses:
    - template.active-routine
    - storage.settings
  - id: you-never-train-routine
    t: You never train "a routine"
    d: >-
      there is no build button next to start a routine; that screen is for working
      out, not editing.
    screen: none
    uses:
    - template.routine
    - template.workout
