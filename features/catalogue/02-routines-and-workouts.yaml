id: "02"
title: Routines & workouts
tagline: >-
  Organize routines, workouts, and exercise slots; edit, reorder, and delete each level.
screen: routines
code:
- lib/screens/routines_screen.dart
- lib/screens/routine_detail_screen.dart
- lib/screens/routine_edit_screen.dart
- lib/screens/workout_detail_screen.dart
- lib/screens/workout_edit_screen.dart
- lib/widgets/workout_items_editor.dart
- lib/widgets/routine_card.dart
- lib/data/superset.dart
- lib/data/workout_estimate.dart
- lib/widgets/workout_estimate.dart
test:
- test/feature_02_routines_and_workouts_test.dart
- test/feature_02_workout_duration_test.dart
where: >-
  <b>Screens</b> routines_screen.dart, routine_detail_screen.dart, routine_edit_screen.dart,
  workout_detail_screen.dart, workout_edit_screen.dart · <b>Shared editor</b>
  lib/widgets/workout_items_editor.dart, routine_card.dart · <b>Estimate</b>
  lib/data/workout_estimate.dart, lib/widgets/workout_estimate.dart · <b>Data</b> Routines,
  Workouts, WorkoutItems
groups:
- name: What it does
  items:
  - id: routine-whole-programme
    t: A routine is a whole program
    d: >-
      A routine such as Push/Pull/Legs or Upper/Lower has a name, colour, default
      rest time, and weekly schedule.
    defines:
    - template.routine
    uses:
    - template.rest
  - id: routine-can-describe-itself
    t: A routine can say what it is
    d: >-
      An optional description is shown on the routine page, included in routine
      codes, and supplied for library programs. Empty descriptions are omitted.
    screen: routine-detail
    defines:
    - template.description
    uses:
    - template.routine
    - template.starter-library
    - share.routine-code
  - id: workout-one-training-day-inside
    t: A workout is one session's worth of exercises inside a routine
    d: >-
      A workout is the session started from the app. Workout names need not be
      unique within a routine.
    defines:
    - template.workout
  - id: exercise-slot-one-exercise-inside
    t: An exercise slot is one exercise inside a workout
    d: with its own configuration.
    defines:
    - template.item
  - id: one-routine-current-routine
    t: One routine is the current routine
    d: the one Today is about.
    screen: today
    defines:
    - template.active-routine
  - id: two-demo-routines-seeded-first
    t: A routine comes from the library, from you, or from somebody else
    d: >-
      nothing is written into the list on your behalf — the programs the app ships
      live in the routine library until you add one. See section 21.
    uses:
    - template.routine
    - template.starter-library
  - id: workout-carries-estimated-duration
    t: A workout says how long it will take
    d: >-
      Derived from working sets, configured warm-up rungs, rest after each
      non-final set, and time under load scaled by reps or hold duration. Disabled
      ramps and zero warm-ups contribute no warm-up time. The rounded estimate is
      shown beside the exercise count on the workout and Today card.
    screen: workout-detail
    defines:
    - template.duration-estimate
    uses:
    - template.item
    - template.rest
    - template.rep-target
    - session.warmup-ramp
    - session.warmup-count
    - template.warmups-off
  - id: day-shows-which-exercises-are-supersetted
    t: A workout shows which of its exercises are supersetted
    d: >-
      Joined rows are bracketed and the first row is tagged, identifying the
      back-to-back group before the session starts.
    screen: workout-detail
    uses:
    - template.superset
- name: How to use it
  items:
  - id: see-current-routine-s-days
    t: See the current routine's workouts
    d: >-
      Today lists workouts below the full routine name and wraps the name at any
      text size. Start a workout with tap workout → Start.
    screen: today
    uses:
    - template.active-routine
    - ui.text-scale
  - id: a-long-routine-offers-the-next-session-rather-than-all-of-them
    t: A long routine offers the session you are on, not all of them
    d: >-
      For routines longer than one week, Today shows the current workout, the
      previous workout, and the next two, with Show all N expanding the complete
      list. The routine page always shows every workout.
    screen: today
    defines:
    - template.long-routine
    uses:
    - template.active-routine
    - template.workout
  - id: pick-change-current-routine
    t: Pick / change the current routine
    d: >-
      Routines → open a routine → select the app-bar radio button. The current
      routine is selected and its control is disabled.
    screen: routine-detail
    uses:
    - template.active-routine
    - storage.settings
  - id: open-routine-see-its-days
    t: A routine's page lists its workouts
    d: >-
      Workouts are numbered in training order, show their exercises, and badge the
      next due workout. Tap a workout to open it; its app bar contains share and
      edit. Start from the workout page.
    screen: routine-detail
    uses:
    - template.routine
    - template.workout
  - id: build-edit-routine
    t: Build / edit a routine
    d: >-
      Routines → open → edit to change name, description, colour, default rest,
      schedule, and workout order. Add or delete workouts and drag their handles.
      Create with Routines → + → New routine.
    screen: routine-edit
    uses:
    - template.routine
    - ui.routine-add-menu
    - template.workout
    - template.rest
    - template.description
  - id: build-edit-day-s-exercises
    t: Build / edit a workout's exercises
    d: >-
      Open a workout → edit → add exercises from the picker, drag handles to
      reorder them, and configure each slot.
    screen: workout-edit
    uses:
    - template.workout
    - template.item
- name: Behaviour & edge cases
  items:
  - id: estimate-rounded-not-precise
    t: The estimate is rounded to five minutes and marked as approximate
    d: >-
      A 47-minute calculation displays <b>~45 min</b>. Positive values round to a
      five-minute increment; workouts with no exercises omit the estimate.
    screen: workout-detail
    uses:
    - template.duration-estimate
  - id: estimate-follows-template-edits
    t: The estimate moves when the template does
    d: >-
      Set count, rep range, and rest edits update the workout and Today values.
      A slot-specific rest override takes precedence over the routine default.
    screen: workout-detail
    uses:
    - template.duration-estimate
    - template.rest
  - id: estimate-prices-a-superset-as-one-rest-a-round
    t: The estimate prices a superset as one rest per round
    d: >-
      Counts each member's work and one rest after each round; no rest is counted
      between members of a superset.
    screen: workout-detail
    uses:
    - template.duration-estimate
    - template.superset
    - template.rest
  - id: estimate-is-planned-time-not-history
    t: The estimate is what the plan costs, not what past sessions took
    d: >-
      Session duration is wall-clock time from Start to Finish and is not used for
      estimates. Estimates derive only from the template, including untrained
      workouts.
    screen: none
    uses:
    - template.duration-estimate
    - history.session-record
  - id: editing-split-match-hierarchy
    t: Editing is split to match the hierarchy
    d: >-
      The routine editor changes routine metadata and its workout list. The
      workout editor changes exercises in one workout. Renaming or reordering
      workouts preserves their exercises; only explicitly removed workouts are
      deleted.
    screen: routine-edit
    uses:
    - template.routine
    - template.workout
    - ui.navigation
  - id: description-of-a-shipped-program-follows-the-language
    t: A program's description follows the language until you rewrite it
    d: >-
      Library descriptions are resolved from the seeded English value and follow
      the app language. Editing the description stores a custom value shown in all
      languages.
    screen: routine-detail
    uses:
    - template.description
    - template.starter-library
    - ui.seeded-name
    - ui.language
  - id: description-capped-at-a-paragraph
    t: A description is capped at a paragraph
    d: >-
      Limited to 300 characters while typing. The value appears wherever the
      program is offered and is included in routine codes.
    screen: routine-edit
    uses:
    - template.description
    - share.routine-code
  - id: you-can-build-routine-s
    t: You can build a routine's exercises before saving it
    d: Draft changes remain in memory until save.
    screen: routine-edit
    uses:
    - template.item
  - id: deleted-current-routine-degrades-none
    t: A deleted current routine degrades to "none"
    d: Today falls back to the routine chooser.
    screen: today
    uses:
    - template.active-routine
    - storage.settings
  - id: you-never-train-routine
    t: You never train "a routine"
    d: >-
      The routine screen has no build button beside Start; editing is done through
      the routine and workout editors.
    screen: none
    uses:
    - template.routine
    - template.workout
