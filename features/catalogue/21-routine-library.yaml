id: "21"
title: The routine library
tagline: >-
  The programs the app ships live in a library you add from, rather than in your
  routine list. Your list holds what you put there — a ready-made program, one
  you built, or one somebody shared.
screen: routine-library
code:
- lib/data/starter_routines.dart
- lib/screens/routine_library_screen.dart
- lib/screens/routines_screen.dart
- lib/data/database.dart
test:
- test/feature_21_routine_library_test.dart
where: >-
  <b>The programs</b> lib/data/starter_routines.dart — a table of prescriptions,
  no drift and no Flutter · <b>Installing one</b> AppDatabase.addStarterRoutine ·
  <b>Screens</b> lib/screens/routine_library_screen.dart (the list and the
  preview), reached from lib/screens/routines_screen.dart
groups:
- name: What it does
  items:
  - id: library-holds-the-programs-the-app-ships
    t: The library holds the programs the app ships
    d: >-
      sixteen of them. Two hypertrophy splits — Push / Pull / Legs and Upper / Lower — and three beginner barbell programs, Starting Strength, StrongLifts 5x5 and Full Body 3x, for somebody with a gym. Four for everybody else: Bodyweight Basics, Dumbbell Full Body, Interval Conditioning, and Two-Day Full Body for a week with two sessions in it. Four 5/3/1 programs for somebody past a linear progression, two Candito Linear programs for somebody not past it yet, and Sheiko #29–32 for somebody peaking for a meet — see below for all three. They are a table in the app rather than rows in your database, so the list is the same on every phone and nothing you do to a copy can change it.
    defines:
    - template.starter-library
    uses:
    - template.routine
  - id: your-list-holds-only-what-you-put-there
    t: Your routine list holds only what you put there
    d: >-
      a fresh install opens on an empty list, because fifteen programs nobody chose is fifteen rows to wade past before finding the one you train. What is in the list is what you added: a ready-made program, one you built, or one somebody shared with you. An empty list says so in one line — "No routines yet" — and leaves the + in the corner to be the way out of it.
    screen: routines
    uses:
    - template.starter-library
    - template.routine
    - ui.empty-state
    - ui.routine-add-menu
  - id: three-ways-to-get-a-routine
    t: One button adds a routine, and it offers all three ways
    d: >-
      a + in the top right of the Routines tab, above the list rather than below it. It opens a sheet with the three answers to "how do I get a program": a ready-made one, one you build, or one somebody sent you. Import asks the second question — scan a QR or paste a code — on a sheet of its own, so the first one stays three rows long. Where there is no scanner, import opens the paste box directly rather than offering a choice of one. The three used to be full-width buttons under the list, which pushed them further down the screen with every routine added, until the way to add a fourth was below four cards.
    screen: routines
    defines:
    - ui.routine-add-menu
    uses:
    - template.starter-library
    - template.routine
    - share.routine-code
    - share.qr
  - id: a-program-is-previewed-before-it-is-added
    t: A program is previewed before it is added
    d: >-
      tapping one in the library opens every training day it holds and every exercise in each, with its sets and target — what you are agreeing to, before anything is written. A slot the program runs as a cycle has no single set count to multiply, so the preview lists the week it opens on the way the rest of the app does: the main lift of a 5/3/1 program reads "5/5/5+", not "0 × 0". Add is on that screen; backing out adds nothing.
    screen: routine-preview
    uses:
    - template.starter-library
    - template.item
    - template.cycle
    - template.per-set-reps
    - template.rep-target
  - id: added-program-is-yours
    t: An added program is a copy, and it is yours
    d: >-
      rename it, re-order its days, change every slot in it, delete it — it is an
      ordinary routine from the moment it lands, and none of that reaches the
      library or any other copy. Adding the same program twice gives two
      independent routines rather than being refused.
    uses:
    - template.starter-library
    - template.routine
  - id: added-program-carries-its-prescription
    t: A program arrives set up the way the program is actually run
    d: >-
      Not one shape copied five times. Starting Strength opens on 3&nbsp;&times;&nbsp;5
      with the deadlift a single set and the power clean 5&nbsp;&times;&nbsp;3;
      StrongLifts is 5&nbsp;&times;&nbsp;5 with the deadlift 1&nbsp;&times;&nbsp;5.
      The linear-progression programs step the squat and the deadlift 5&nbsp;kg a
      session and the presses 2.5&nbsp;kg, and back off 10% only after
      <b>three</b> failed sessions rather than the usual two. Rest defaults follow
      the program too — five minutes on Starting Strength, three on StrongLifts —
      and so do the training days it is meant to be trained on, and the loads it
      opens at.
    uses:
    - template.starter-library
    - template.rest
    - progression.rates
    - template.item
    - template.rep-target
    - platform.reminders
  - id: a-program-arrives-in-your-own-unit
    t: A program's weights arrive as numbers your gym loads
    d: >-
      the programs are written down in kilograms, so on a pounds phone every
      load and every step in them is a conversion: 45&nbsp;kg is 99.208&nbsp;lb
      and a 2.5&nbsp;kg step is 5.512. Both are rounded on the way in to the
      nearest pair of plates a pounds gym racks — 100&nbsp;lb, stepping 5 — so
      the copy opens on numbers somebody can put on a bar. A kilogram phone gets
      the numbers exactly as they were written, since there is nothing to
      convert and rounding would only move them.
    uses:
    - template.starter-library
    - load.units
    - load.unit-defaults
    - progression.rates
    - template.item
  - id: library-covers-training-without-a-gym
    t: Four of the programs need no gym
    d: >-
      Bodyweight Basics needs a floor and something to hang from; Dumbbell Full Body needs one pair of dumbbells; Interval Conditioning needs a rope and room to sprint. The fourth is for the constraint that is not equipment — Two-Day Full Body covers a squat, a hinge, a press and a pull in each of two sessions, for a week that has two in it rather than four.
    uses:
    - template.starter-library
    - template.routine
  - id: interval-programs-prescribe-seconds
    t: An interval program prescribes seconds, not reps
    d: >-
      a conditioning day is rounds of work against the clock, so its slots carry a work period — thirty seconds of jump rope, twenty of sprinting — and both the preview and the copy show the seconds where a strength program shows a rep count. The axis is the movement's own, not the program's claim about it: the library only ever puts a work period on a movement the app measures in time, and a counted movement ignores one.
    uses:
    - template.starter-library
    - template.item
    - template.rep-target
  - id: library-ships-four-531-programs
    t: Four of the programs run 5/3/1 cycles
    d: >-
      the same four training days — press, deadlift, bench, squat — under four
      different amounts of work. <b>5/3/1 Classic</b> is the main lift and two
      assistance movements a day. <b>Boring But Big</b> adds five sets of ten at
      half the training max. <b>First Set Last</b> adds five sets at the week's
      own opening percentage, so its back-off weight moves with the week.
      <b>5/3/1 for Beginners</b> folds the four lifts into three days a week, two
      main lifts a day. All four open at a training max the copy asks you to
      replace with 90% of your own best single.
    uses:
    - template.starter-library
    - template.cycle
    - template.training-max
    - template.per-set-reps
  - id: library-ships-two-candito-programs
    t: Two of the programs are Candito's linear progression
    d: >-
      Jonnie Candito's four-day upper/lower split, in the two variants a
      week-to-week progression can be run as. Both share the same two heavy days
      — squat 3&nbsp;&times;&nbsp;6 and deadlift 2&nbsp;&times;&nbsp;6 on the
      lower, bench 3&nbsp;&times;&nbsp;6 and a row on the upper — and differ in
      what the other two days do with them. <b>Strength / Control</b> repeats the
      same movement patterns paused, six sets of four at about 70% of the heavy
      day's weight. <b>Strength / Hypertrophy</b> spends those days on five sets
      of eight of a variation instead. Every lift moves on its own: the main work
      steps a session and backs off 7.5&nbsp;kg on the lift that missed rather
      than on the program, and the shoulder press and the chin-up wait three
      clean sessions before stepping, which is the slower cadence Candito puts
      them on.
    uses:
    - template.starter-library
    - progression.rates
    - progression.streak
    - template.item
  - id: library-ships-sheiko-29-32
    t: One of the programs is Sheiko's sixteen-week #29–32
    d: >-
      Boris Sheiko's four numbered blocks, run as the one sixteen-week sequence they were written to be rather than as four programs that happen to follow each other. Three sessions a week for sixteen weeks, every set of every competition lift written out at its own percentage, and the last session of #32 a max test that opens the same way the first fifteen weeks did and finishes above the max it started from. It is not a program that decides anything week to week: what makes week eleven harder than week two is that week eleven says so.
    uses:
    - template.starter-library
    - template.set-scheme
    - template.per-set-reps
    - template.training-max
  - id: sheiko-is-forty-eight-explicit-sessions
    t: Sheiko arrives as forty-eight sessions in order, not as a rotation
    d: >-
      the program does not keep a fixed set of slots whose numbers rotate — the order of the lifts changes, a lift comes round twice inside one session, variations appear for a fortnight and go, and no two sessions ask for the same thing. So each of the forty-eight is a training day of its own, named for where it sits — "#29 · W1 · Mon" through "#32 · W4 · Meet". A cycle would have to claim they were forty-eight versions of one week, and they are not.
    uses:
    - template.starter-library
    - template.workout
    - template.cycle
  - id: sheikos-repeated-lifts-stay-separate-slots
    t: A lift that comes round twice in a session is two slots
    d: >-
      the first session benches, squats, then benches again, and the second bench is not the first one with more sets bolted on: it happens after the squats, at its own percentages, and that is the point of writing it there. The copy keeps the order the program is written in, so the day reads bench, squat, bench.
    uses:
    - template.starter-library
    - template.item
    - template.workout
  - id: sheikos-percentages-are-of-your-actual-max
    t: Sheiko's percentages are of your real max, not 90% of it
    d: >-
      the 5/3/1 programs open at a training max the copy asks you to replace with 90% of your best single, because that is what 5/3/1 is written against. Sheiko is not: its percentages are calculated from the competition max itself, so the number to put in is your current best squat, bench and deadlift — actual or honestly estimated. A program that asks for the same number in different terms has to say which terms, and this one says its own.
    screen: routine-preview
    uses:
    - template.starter-library
    - template.training-max
    - template.percentage-base
  - id: sheiko-does-not-move-its-own-max
    t: Sheiko does not move the max it is percentages of
    d: >-
      the overload is already written into the sixteen weeks; adding a step on top of it would be a second program running underneath the first. So every percentage slot in the copy steps by nothing and backs off by nothing, and the max stays where you put it until you change it — including through the final max test, whose single at 105% is a lift to attempt rather than a new number for the fifteen weeks behind it to be recalculated against. The rates are the ordinary ones on the slot, set to zero, not a rule of the program's own.
    uses:
    - template.starter-library
    - template.training-max
    - progression.rates
  - id: sheikos-accessories-carry-no-percentage
    t: Sheiko's accessory work carries sets and reps and no weight
    d: >-
      the source prescribes five sets of ten flyes and five sets of five good mornings and says nothing about the load, so neither does the copy: those slots arrive as ordinary sets and reps with no suggested weight, for you to fill in. Inventing a percentage for them would be putting words in the program's mouth on the one part of it that was deliberately left to the lifter.
    uses:
    - template.starter-library
    - template.item
  - id: sheikos-variations-train-off-the-competition-lift
    t: Sheiko's variations train off the competition lift's max
    d: >-
      the front squats are percentages of the squat, and the deadlifts to the knees, from blocks and from a deficit are percentages of the deadlift. That is not a rule this program is given: it is what those movements carry in the library, so setting the routine's three maxes reaches all of them and the front squat slots never ask for a max of their own.
    uses:
    - template.starter-library
    - template.percentage-base
    - template.training-max
  - id: a-531-copy-is-an-ordinary-routine
    t: A 5/3/1 copy is an ordinary routine
    d: >-
      the weeks arrive as an editable cycle on the slot, not as a program the
      library keeps a hold of: open any main lift in the builder and its weeks
      are there to change, remove or add to. Every scheme the copy uses is one
      you could have picked yourself.
    screen: workout-edit
    uses:
    - template.starter-library
    - template.cycle
  - id: program-says-what-it-is
    t: A program says what it is before you take it
    d: >-
      the preview opens with the program's own description — who it is for, how often it is trained, what it is trying to do — so choosing between sixteen of them is not a matter of guessing from a name. The copy keeps it, so the routine still explains itself a month later, and rewriting it is one more thing a copy of yours can do.
    screen: routine-preview
    uses:
    - template.starter-library
    - template.description
  - id: first-program-added-becomes-the-current-one
    t: The first program you add becomes the routine Today is about
    d: >-
      an empty install has no current routine, so the first thing to arrive takes
      that place and Today has something to offer straight away. Anything added
      after it leaves the current routine alone — that choice is already made, and
      adding a program to look at is not the same as switching to it.
    uses:
    - template.active-routine
    - template.starter-library
- name: How to use it
  items:
  - id: add-a-ready-made-routine
    t: Add a ready-made routine
    d: >-
      Routines → + → Ready-made routines → tap a program → Add. It lands at the bottom
      of your list and, on an empty install, becomes the one Today is about.
    screen: routine-library
    uses:
    - template.starter-library
    - ui.routine-add-menu
  - id: browse-without-adding
    t: Look at one without taking it
    d: >-
      open a program, read its days, and back out. The library is also the place
      to steal an idea for a routine of your own.
    screen: routine-preview
    uses:
    - template.starter-library
- name: Behaviour & edge cases
  items:
  - id: update-keeps-the-programs-already-in-your-list
    t: An update leaves the programs already in your list alone
    d: >-
      the original five used to be written into every new install, so a phone that has been
      running the app has them as ordinary routines — with its history, its edits
      and its weights on them. They stay exactly where they are: this changes what
      a *fresh* install opens with, and adds the library everyone can pull one from
      later. Nothing is removed from anybody's list.
    screen: none
    uses:
    - template.starter-library
    - storage.migration
  - id: library-is-code-not-rows
    t: The library is code, not rows
    d: >-
      nothing about it is stored, so there is nothing to migrate, nothing to keep
      in step with a backup, and no way for a phone to end up with a library
      different from the build it is running. It is the same argument the colour
      presets are settled by.
    screen: none
    uses:
    - template.starter-library
    - storage.schema
  - id: adding-copies-the-movements-you-already-have
    t: A program points at the movements already in your library
    d: >-
      every exercise every program names is in the starter library, so adding one creates a routine, its days and its slots and no exercises at all — the history you already have on Bench Press is the history the new program's bench slot is about.
    screen: none
    uses:
    - template.starter-library
    - exercise.seed
  - id: library-names-follow-the-language
    t: The library reads in the app's language
    d: >-
      the programs, their training days and the descriptions they ship with are shipped strings like any other row's name, so both the library and the copy it makes resolve all three through their seed keys — and a copy you rename, or whose description you rewrite, stops following the language for the part you changed, exactly as a seeded routine always has.
    uses:
    - template.starter-library
    - template.description
    - ui.seeded-name
    - ui.language
