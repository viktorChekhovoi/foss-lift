id: "21"
title: The routine library
tagline: >-
  Shipped programs are immutable library templates. Your routine list contains
  only routines you add, build, or import.
screen: routine-library
code:
- lib/data/starter_routines.dart
- lib/screens/routine_library_screen.dart
- lib/screens/routines_screen.dart
- lib/data/database.dart
test:
- test/feature_21_routine_library_test.dart
where: >-
  <b>The programs</b> lib/data/starter_routines.dart — a table of prescriptions,
  no drift and no Flutter · <b>Installing one</b> AppDatabase.addStarterRoutine ·
  <b>Screens</b> lib/screens/routine_library_screen.dart (the list and the
  preview), reached from lib/screens/routines_screen.dart
groups:
- name: What it does
  items:
  - id: library-holds-the-programs-the-app-ships
    t: The library holds the programs the app ships
    d: >-
      The library contains sixteen templates: Push / Pull / Legs, Upper / Lower,
      Starting Strength, StrongLifts 5x5, Full Body 3x, Bodyweight Basics,
      Dumbbell Full Body, Interval Conditioning, Two-Day Full Body, four 5/3/1
      variants, two Candito Linear variants, and Sheiko #29–32. Templates are
      defined in code rather than stored as database rows, so every build has the
      same immutable library.
    defines:
    - template.starter-library
    uses:
    - template.routine
  - id: your-list-holds-only-what-you-put-there
    t: Your routine list holds only what you put there
    d: >-
      A fresh install has an empty routine list. The list contains only ready-made
      templates you add, routines you build, or routines you import. Empty state
      text is "No routines yet" and the + action remains available.
    screen: routines
    uses:
    - template.starter-library
    - template.routine
    - ui.empty-state
    - ui.routine-add-menu
  - id: three-ways-to-get-a-routine
    t: One button adds a routine, and it offers all three ways
    d: >-
      The Routines tab has a + action above the list. Its sheet offers a ready-made
      template, a new routine, or an imported routine. Import then offers QR
      scanning or code pasting; on builds without a scanner it opens the paste
      field directly.
    screen: routines
    defines:
    - ui.routine-add-menu
    uses:
    - template.starter-library
    - template.routine
    - share.routine-code
    - share.qr
  - id: a-program-is-previewed-before-it-is-added
    t: A program is previewed before it is added
    d: >-
      Selecting a template previews its training days, exercises, sets, and
      targets before writing anything. Cycle slots show the initial week's
      targets (for example, 5/5/5+) rather than an aggregate count. Add commits
      the copy; back navigation does not.
    screen: routine-preview
    uses:
    - template.starter-library
    - template.item
    - template.cycle
    - template.per-set-reps
    - template.rep-target
  - id: added-program-is-yours
    t: An added program is a copy, and it is yours
    d: >-
      An added template becomes an ordinary independent routine. Renaming,
      reordering, editing, or deleting it does not change the template or other
      copies. Adding the same template twice creates two independent routines.
    uses:
    - template.starter-library
    - template.routine
  - id: added-program-carries-its-prescription
    t: A program arrives set up the way the program is actually run
    d: >-
      Templates preserve their published prescriptions. Starting Strength uses
      3 × 5, deadlift 1 × 5, and power clean 5 × 3; StrongLifts uses 5 × 5 and
      deadlift 1 × 5. Linear programs step squat/deadlift by 5 kg and presses by
      2.5 kg per session, backing off 10% after three failed sessions. Rest
      defaults, training days, and starting loads also come from each program.
    uses:
    - template.starter-library
    - template.rest
    - progression.rates
    - template.item
    - template.rep-target
    - platform.reminders
  - id: a-program-arrives-in-your-own-unit
    t: A program's weights arrive as numbers your gym loads
    d: >-
      Template loads and progression steps are authored in kilograms. On a pounds
      device they are converted and rounded to the nearest plate-pair increments
      (45 kg → 100 lb; 2.5 kg → 5 lb). Kilogram devices retain the authored
      values.
    uses:
    - template.starter-library
    - load.units
    - load.unit-defaults
    - progression.rates
    - template.item
  - id: library-covers-training-without-a-gym
    t: Four of the programs need no gym
    d: >-
      Bodyweight Basics requires a floor and hanging point; Dumbbell Full Body
      requires one pair of dumbbells; Interval Conditioning requires a rope and
      sprint space. Two-Day Full Body covers squat, hinge, press, and pull across
      two sessions.
    uses:
    - template.starter-library
    - template.routine
  - id: interval-programs-prescribe-seconds
    t: An interval program prescribes seconds, not reps
    d: >-
      Conditioning slots carry a work period in seconds, shown in the preview and
      copied routine instead of a rep count. A work period is applied only to
      exercises measured in time; counted exercises ignore it.
    uses:
    - template.starter-library
    - template.item
    - template.rep-target
  - id: library-ships-four-531-programs
    t: Four of the programs run 5/3/1 cycles
    d: >-
      The four 5/3/1 templates use press, deadlift, bench, and squat days. Classic
      adds two assistance movements; Boring But Big adds 5 × 10 at 50% of the
      training max; First Set Last adds five sets at the week's opening
      percentage; Beginners combines the lifts into three days. Each opens with
      a training max to replace with 90% of a best single.
    uses:
    - template.starter-library
    - template.cycle
    - template.training-max
    - template.per-set-reps
  - id: library-ships-two-candito-programs
    t: Two of the programs are Candito's linear progression
    d: >-
      The two Candito variants use a four-day upper/lower split. Both include
      heavy lower days (squat 3 × 6, deadlift 2 × 6) and upper days (bench 3 × 6
      and a row). Strength / Control uses paused patterns at 6 × 4 and about 70%;
      Strength / Hypertrophy uses variations at 5 × 8. Lifts progress
      independently, backing off 7.5 kg only for the lift that missed; shoulder
      press and chin-up step after three clean sessions.
    uses:
    - template.starter-library
    - progression.rates
    - progression.streak
    - template.item
  - id: library-ships-sheiko-29-32
    t: One of the programs is Sheiko's sixteen-week #29–32
    d: >-
      Sheiko #29–32 is one sixteen-week sequence: three sessions per week, every
      competition-lift set written at its own percentage. The final #32 session is
      a max test. Workload is explicit in each week; the program does not generate
      progression dynamically.
    uses:
    - template.starter-library
    - template.set-scheme
    - template.per-set-reps
    - template.training-max
  - id: sheiko-is-forty-eight-explicit-sessions
    t: Sheiko arrives as forty-eight sessions in order, not as a rotation
    d: >-
      The sequence has 48 ordered training days rather than rotating slots. Lift
      order, repeated lifts, and variations change between sessions; days are
      named by block, week, and day (for example, "#29 · W1 · Mon").
    uses:
    - template.starter-library
    - template.workout
    - template.cycle
  - id: sheikos-repeated-lifts-stay-separate-slots
    t: A lift that comes round twice in a session is two slots
    d: >-
      Repeated lifts remain separate slots in their prescribed order. For example,
      bench, squat, bench remains three slots with independent percentages.
    uses:
    - template.starter-library
    - template.item
    - template.workout
  - id: sheikos-percentages-are-of-your-actual-max
    t: Sheiko's percentages are of your real max, not 90% of it
    d: >-
      5/3/1 uses a training max initialized to 90% of a best single. Sheiko
      percentages use the competition max itself, so enter the current squat,
      bench, and deadlift maxes.
    screen: routine-preview
    uses:
    - template.starter-library
    - template.training-max
    - template.percentage-base
  - id: sheiko-does-not-move-its-own-max
    t: Sheiko does not move the max it is percentages of
    d: >-
      Sheiko's overload is encoded in its sixteen weeks, so percentage slots have
      zero step and back-off rates. The max remains unchanged, including after the
      final 105% test, until edited manually.
    uses:
    - template.starter-library
    - template.training-max
    - progression.rates
  - id: sheikos-accessories-carry-no-percentage
    t: Sheiko's accessory work carries sets and reps and no weight
    d: >-
      Accessory slots such as flyes (5 × 10) and good mornings (5 × 5) specify
      sets and reps but no load. Copies leave their weight unset for manual entry.
    uses:
    - template.starter-library
    - template.item
  - id: sheikos-variations-train-off-the-competition-lift
    t: Sheiko's variations train off the competition lift's max
    d: >-
      Front squats use the squat max; deadlift variations use the deadlift max.
      These percentage bases come from the movement definitions, so setting the
      three competition-lift maxes covers the variations.
    uses:
    - template.starter-library
    - template.percentage-base
    - template.training-max
  - id: a-531-copy-is-an-ordinary-routine
    t: A 5/3/1 copy is an ordinary routine
    d: >-
      Main lifts arrive as editable cycle slots. Their weeks can be changed,
      removed, or extended in the builder; the library retains no reference to
      the copy.
    screen: workout-edit
    uses:
    - template.starter-library
    - template.cycle
  - id: program-says-what-it-is
    t: A program says what it is before you take it
    d: >-
      The preview and copied routine retain the template's description, including
      intended user, schedule, and purpose. The copied description remains
      editable.
    screen: routine-preview
    uses:
    - template.starter-library
    - template.description
  - id: first-program-added-becomes-the-current-one
    t: The first program you add becomes the routine Today is about
    d: >-
      When no current routine exists, the first added routine becomes current.
      Later additions do not change the current routine.
    uses:
    - template.active-routine
    - template.starter-library
- name: How to use it
  items:
  - id: add-a-ready-made-routine
    t: Add a ready-made routine
    d: >-
      Routines → + → Ready-made routines → select a program → Add. It is appended
      to the list and becomes current when the list was empty.
    screen: routine-library
    uses:
    - template.starter-library
    - ui.routine-add-menu
  - id: browse-without-adding
    t: Look at one without taking it
    d: >-
      Open a template, inspect its days, and back out. No routine is added.
    screen: routine-preview
    uses:
    - template.starter-library
- name: Behaviour & edge cases
  items:
  - id: update-keeps-the-programs-already-in-your-list
    t: An update leaves the programs already in your list alone
    d: >-
      Existing installs retain their ordinary routines, history, edits, and
      weights. The library changes only fresh-install defaults and adds templates;
      it removes nothing from a user's list.
    screen: none
    uses:
    - template.starter-library
    - storage.migration
  - id: library-is-code-not-rows
    t: The library is code, not rows
    d: >-
      Because templates are code, they require no database migration or backup
      entry and cannot diverge between devices running the same build.
    screen: none
    uses:
    - template.starter-library
    - storage.schema
  - id: adding-copies-the-movements-you-already-have
    t: A program points at the movements already in your library
    d: >-
      Adding a template creates its routine, days, and slots but no exercises.
      Slots reference the existing exercise rows, preserving shared history.
    screen: none
    uses:
    - template.starter-library
    - exercise.seed
  - id: library-names-follow-the-language
    t: The library reads in the app's language
    d: >-
      Template names, training days, and descriptions resolve through seed keys in
      the selected locale. Renamed routines or edited descriptions retain the
      custom value instead of following locale changes.
    uses:
    - template.starter-library
    - template.description
    - ui.seeded-name
    - ui.language
