id: "04"
title: Live workout session
tagline: >-
  Run a workout in memory, log sets, manage rest, and finish to save history.
screen: session
code:
- lib/state/active_workout.dart
- lib/data/warmup.dart
- lib/data/plates.dart
- lib/screens/workout_screen.dart
- lib/widgets/resume_workout_bar.dart
- lib/services/rest_tone.dart
- lib/services/rest_alarm.dart
- tool/make_rest_tone.dart
- lib/services/workout_shade.dart
- lib/state/workout_cue.dart
- lib/data/superset.dart
- lib/widgets/start_workout.dart
- lib/screens/exercise_settings_screen.dart
test:
- test/feature_04_live_session_test.dart
- test/feature_04_clocks_test.dart
- test/feature_04_shade_permission_test.dart
- test/feature_04_rest_alarm_test.dart
- test/feature_04_rest_buzz_test.dart
- test/feature_04_session_continuity_test.dart
- test/feature_04_rest_done_test.dart
- test/feature_04_template_drift_test.dart
- test/feature_04_superset_test.dart
- test/feature_04_warmups_off_test.dart
- test/feature_04_cardio_console_test.dart
- test/feature_04_slot_settings_test.dart
where: >-
  <b>State</b> lib/state/active_workout.dart · <b>Warm-up ramp</b> lib/data/warmup.dart,
  loadLadder in lib/data/plates.dart · <b>Screens</b> lib/screens/workout_screen.dart,
  lib/widgets/resume_workout_bar.dart · <b>Rest tone</b> lib/services/rest_tone.dart
  on screen, rest_alarm.dart off it, generator in tool/make_rest_tone.dart · <b>Shade</b>
  lib/services/workout_shade.dart on lib/state/workout_cue.dart · <b>Starting
  one</b> lib/widgets/start_workout.dart
groups:
- name: What it does
  items:
  - id: starts-training-day
    t: Starts a training day
    d: >-
      Today → tap a day → Start workout, and the set rows are hydrated from the
      template. If a layoff deload is offered, accept or decline it here first.
    defines:
    - session.start
    uses:
    - template.workout
    - template.item
    - progression.layoff-offer
  - id: logs-sets-tapping
    t: Logs sets by tapping
    d: >-
      Each row shows a rep or time goal and weight. Tapping the result cycles
      goal → one fewer → … → 0 → untouched; holding the cell enters an exact value.
    defines:
    - session.set-logging
  - id: result-cell-is-the-obvious-target
    t: The cell that logs a set is the one that looks like a button
    d: >-
      The result cell is the widest filled control; weight is an outlined control.
      Column headings are centered over their cells, including the camera column.
    uses:
    - session.set-logging
    - session.exercise-weight
  - id: next-set-logging-cell-pulses
    t: The cell to tap next pulses
    d: >-
      The current working-set or warm-up result cell pulses at about 1 Hz and
      stops when logged. Only one cell pulses. Running holds do not pulse; reduced
      motion displays the accent at the pulse maximum.
    uses:
    - session.set-logging
    - session.progress-mark
    - session.warmup-ramp
  - id: carries-one-weight-per-exercise
    t: Carries one weight per exercise
    d: >-
      The exercise weight is set above the working sets. Editing it changes future
      sets; editing a row changes only that set.
    defines:
    - session.exercise-weight
  - id: tracks-duration-set-count-live
    t: Tracks duration and set count live
    d: The elapsed duration is refreshed from the clock each second; the set counter updates on logging.
    uses:
    - session.live-state
    - session.rest-timer
  - id: runs-rest-timer
    t: Runs a rest timer
    d: >-
      Logging a set starts its configured rest with shorter, longer, and skip
      controls and an end alert. Clearing the set that started the rest stops that
      rest; clearing an earlier set does not. This applies to cycle edits, typed
      values, holds, warm-up rungs, and working sets. Changing a logged value does
      not restart the clock.
    defines:
    - session.rest-timer
    uses:
    - template.rest
    - session.rest-cue
    - session.rest-sound
    - session.set-logging
    - session.warmup-ramp
    - session.hold-timer
  - id: suggests-warm-up-sets
    t: Suggests warm-up sets
    d: >-
      Weighted lifts receive an ascending ramp of loadable weights. The ramp is
      above working sets, starts open when it has rungs, and has a rung-count
      stepper. Collapse state is remembered per exercise for the session.
    defines:
    - session.warmup-ramp
    uses:
    - load.loadable-grid
    - exercise.weight-type
    - session.warmup-count
  - id: walks-a-superset-a-round-at-a-time
    t: Walks a superset a round at a time
    d: >-
      The mark advances across a group's movements by round: first set of each,
      then second set of each. A movement with fewer sets leaves later rounds.
    defines:
    - session.superset-round
    uses:
    - session.progress-mark
    - template.superset
  - id: no-rest-inside-a-superset
    t: There is no rest inside a superset
    d: >-
      Logging one member does not start rest; the next member is current. Rest
      starts after every member completes its set, using the ending slot's rest.
    uses:
    - session.superset-round
    - session.rest-timer
    - template.rest
  - id: survives-being-collapsed
    t: Survives being collapsed
    d: The down arrow collapses the running session; a resume bar appears on other screens.
    screen: resume-bar
    defines:
    - session.resume-bar
  - id: lives-notification-shade
    t: Lives in the notification shade
    d: >-
      While running, shows the current exercise, set counter, load, and Done/Missed
      actions. During rest it shows remaining time and Skip/−15s/+15s. It follows
      warm-up rungs and counts rest down live.
    screen: shade
    defines:
    - session.shade
    uses:
    - session.progress-mark
    - session.warmup-ramp
    - session.rest-timer
    - load.units
  - id: can-aborted
    t: Can be aborted
    d: >-
      Finish → bin → Abort discards the session without writing history or changing
      progression targets.
    defines:
    - session.abort
  - id: finish-writes-only-completed-sets
    t: On Finish, writes only the completed sets
    d: >-
      Finish writes completed sets, advances progression, and opens the recap. If
      working sets remain unlogged, it first reports their count and asks for
      confirmation.
    defines:
    - session.finish
    uses:
    - progression.rates
    - history.session-record
    - session.recap
- name: The session in memory
  screen: none
  uses:
  - session.live-state
  items:
  - id: live-session-memory
    t: The live session is in memory
    d: >-
      Writes session history to the database only on Finish. Set edits remain
      in-memory until then.
    defines:
    - session.live-state
  - id: exercise-added-mid-session-joins-the-end
    t: An exercise added to the workout while it is running joins the end of the session
    d: >-
      Adding an exercise to the active workout appends it to the session. Its ramp
      uses the session's initial weight and plate settings. Append-only insertion
      preserves logged set positions.
    screen: session
    defines:
    - session.template-drift
    uses:
    - session.live-state
    - template.item
    - session.warmup-ramp
  - id: other-edits-wait-for-the-next-session
    t: Every other edit made in the builder waits for the next session
    d: >-
      Builder changes to removal, order, name, sets, and targets apply on the next
      session. Rest changes and board settings can affect the running session.
      Finish preserves logged sets, including those whose template exercise was
      later deleted.
    screen: none
    uses:
    - session.template-drift
    - session.live-state
    - session.slot-settings
    - session.finish
    - template.rest
  - id: rest-changed-in-the-builder-reaches-the-session
    t: A rest time changed mid-workout reaches the session you are training
    d: >-
      Builder changes to slot or default rest affect the next rest in the active
      session. A rest already counting down keeps its original duration; its
      −15s/+15s controls still apply. Rest values match board exercises by order.
    screen: session
    uses:
    - session.template-drift
    - session.live-state
    - session.rest-timer
    - template.rest
  - id: recorded-duration-is-real-time
    t: The duration a workout is filed under is the time it really took
    d: >-
      Finish records elapsed wall-clock time from the session clock, including time
      while the app is backgrounded.
    uses:
    - session.live-state
    - history.session-record
  - id: session-survives-being-killed
    t: A workout survives the app being killed
    d: >-
      A snapshot is rewritten on every change and removed on Finish or Abort.
      Restore recovers logged sets, weights, logging order, progress mark, and rest
      state with elapsed time advanced while the app was stopped. It is not history
      until Finish. Missing fields in older snapshots are treated as absent.
    screen: none
    uses:
    - session.live-state
    - session.progress-mark
    - session.rest-timer
    - session.superset-round
    - storage.schema
  - id: note-one-exception-goes-both
    t: The note is the one exception, and it goes both ways
    d: >-
      Notes can be created or edited from the board and update the library
      immediately. Notes edited in the library while a session runs appear there.
    screen: session
    uses:
    - exercise.notes
  - id: session-ends-finishing-or-aborting
    t: A session ends by finishing it or by aborting it
    d: >-
      Collapsing preserves the session. Abort requires confirmation and discards it.
    uses:
    - session.abort
    - session.finish
  - id: finish-asks-when-sets-are-unlogged
    t: Finishing with sets unlogged asks first
    d: >-
      The dialog reports unlogged working sets, which are not written and count as
      misses for progression. Finish anyway is available; returning to the board
      is the default. A fully logged session finishes immediately.
    screen: session
    uses:
    - session.finish
    - progression.rates
  - id: unlogged-warm-ups-never-ask
    t: An unlogged warm-up never triggers it
    d: >-
      Warm-up rungs are not stored or used for the clean-session decision; only
      working sets trigger the confirmation.
    screen: session
    uses:
    - session.finish
    - session.warmup-ramp
  - id: only-one-session-runs-time
    t: Only one session runs at a time, and Start knows it
    d: >-
      Starting the active workout reopens it. Starting another workout asks for
      confirmation, identifies the active session and its logged-set count, and
      defaults to keeping it. All entry points check before offering a layoff.
    screen: session
    uses:
    - session.start
    - progression.layoff-offer
  - id: finish-order-matters
    t: Finish order matters
    d: Sets are saved before progression advances.
    uses:
    - session.finish
    - progression.rates
    - history.session-record
- name: The resume bar
  screen: resume-bar
  uses:
  - session.resume-bar
  items:
  - id: has-one-slot-row-directly
    t: 'It has one slot: the row directly above the bottom navigation bar'
    d: It occupies the last row on screens without a bottom navigation bar.
    uses:
    - ui.navigation
  - id: docks-does-not-float
    t: It docks, it does not float
    d: It occupies layout space instead of overlaying content, keeping list bottoms reachable.
  - id: there-only-ever-one-screen
    t: There is only ever one on screen
    d: >-
      Two mount points can render it, but only the visible screen owns it, including
      during tab transitions.
    uses:
    - ui.navigation
- name: The notification shade
  screen: shade
  uses:
  - session.shade
  items:
  - id: done-logs-outstanding-set-goal
    t: Done logs the outstanding set at its goal
    d: >-
      Logs the outstanding set at its goal, starts rest, and returns to the board.
      It resolves the current set from session state.
    uses:
    - session.set-logging
    - session.rest-timer
  - id: missed-logs-one-short-goal
    t: Missed logs one short of the goal
    d: >-
      Logs one below the goal, marks the set as missed, starts rest, and returns to
      the board for correction.
    uses:
    - session.set-logging
    - session.rest-timer
    - progression.verdict
  - id: buttons-route-they-do-not-raise
    t: A button sends you to the board; it cannot raise the phone
    d: >-
      Notification actions route to the board because Android 12+ restricts
      starting activities from broadcasts. Tapping the notification itself opens
      the activity.
    uses:
    - session.shade
  - id: press-survives-the-app-dying
    t: A press waits for the app rather than being lost with it
    d: >-
      Actions are recorded by the service before being applied to session state.
      Pending actions are replayed when the app restores the snapshot; the record
      is removed when the session ends.
    uses:
    - session.shade
    - session.set-logging
    - session.live-state
  - id: rest-offers-30s-skip
    t: A rest in the shade offers Skip, −15s and +15s
    d: >-
      Provides Skip, −15s, and +15s, matching the board. Sets cannot be logged
      during rest. Skip is first in the action row.
    uses:
    - session.rest-timer
  - id: says-which-set-how-many
    t: It says which set of how many, on the line under the movement
    d: >-
      The bold line contains the exercise (or Warm-up · exercise). The next line
      contains the set counter and target, such as “Set 4/5 · 80 kg × 8”; single-set
      exercises omit the counter.
    uses:
    - session.progress-mark
    - session.warmup-ramp
    - load.units
  - id: name-gives-so-counter-stays
    t: On the rest line the exercise name gives way so the set counter stays
    d: >-
      During rest, the exercise name is ellipsized before the set counter so the
      counter remains complete in a collapsed notification.
    uses:
    - session.progress-mark
    - session.rest-cue
  - id: shade-ranked-to-open-expanded
    t: It is ranked so the shade opens it expanded, as far as Android allows
    d: >-
      Actions require the expanded notification. The live workout uses a default
      importance, silent channel so Android can rank it for expansion without sound,
      vibration, or screen takeover.
    uses:
    - session.shade
    - platform.android
    manual: true
  - id: while-resting-second-line-names
    t: While resting, the second line names the exercise
    d: The second line identifies the next exercise, set, weight, and reps during rest.
    uses:
    - session.rest-cue
    - load.units
  - id: shade-asks-to-finish-when-done
    t: With the last set logged it asks you to finish
    d: >-
      When all working sets are logged, the notification remains and says the
      workout is complete. It has no Finish action; tapping opens the board, where
      Finish checks unlogged sets and opens the recap. It is removed when the
      session finishes or is abandoned.
    uses:
    - session.shade
    - session.finish
  - id: hold-gets-one-button-open
    t: A hold gets one button, "Start", and it logs nothing
    d: >-
      Duration is the measurement, so the notification cannot infer a result. Start
      opens the board at the stopwatch.
    uses:
    - session.hold-timer
    - exercise.measure
  - id: foreground-service-not-about-notification
    t: It is a foreground service, and that is not about the notification
    d: >-
      The foreground service keeps the in-memory session available while
      backgrounded; the snapshot restores it if Android still kills the process.
    uses:
    - session.live-state
    - platform.android
  - id: declared-specialuse-android-14
    t: Declared as specialUse on Android 14
    d: >-
      Uses the Android 14 specialUse subtype; other subtypes require unsuitable
      permissions or impose duration limits. The subtype justification and review
      video are documented in RELEASING.md. Off Android it is a no-op.
    screen: none
    defines:
    - platform.android
  - id: asks-post-notifications-or-invisible
    t: It asks to post notifications, or it is invisible
    d: >-
      Android 13+ requires a runtime notification grant. Without it the service
      starts but renders no shade notification. The request occurs when the shade
      is first needed.
    screen: system
    defines:
    - platform.permissions
  - id: refusal-not-error
    t: Refusal is not an error
    d: The workout continues without the shade. The app asks once and does not repeat the prompt.
    screen: system
    uses:
    - platform.permissions
- name: The rest timer
  screen: session
  uses:
  - session.rest-timer
  items:
  - id: rest-clock-belongs-session-not
    t: The rest clock belongs to the session, not to the screen
    d: The session owns the rest clock, so it continues when the screen is popped and remains available to notifications.
    uses:
    - session.live-state
  - id: clocks-read-the-time-rather-than-count
    t: Both clocks read the time rather than counting their own ticks
    d: >-
      Both clocks derive elapsed time from timestamps rather than decrementing a
      counter. They remain correct across sleep, background throttling, and restore.
    uses:
    - session.rest-timer
    - session.live-state
  - id: a-rest-that-ends-unwatched-ends-once
    t: A rest that ends while nothing is watching still ends, once
    d: >-
      A late tick still treats the rest as ended at its due timestamp and emits one
      alert, regardless of the delay.
    uses:
    - session.rest-timer
    - session.rest-sound
  - id: rest-says-what-between-warm
    t: A rest says what it is for
    d: >-
      Labels the next action: set up the next warm-up load, set up the working
      weight, rest before the next set, or set up the next exercise. It skips
      completed exercises and names the next movement after a superset round.
    defines:
    - session.rest-cue
    uses:
    - session.warmup-ramp
    - session.superset-round
  - id: rest-that-ended-says-so-and-waits
    t: A rest that has ended says the next set is up, and waits
    d: >-
      At zero, the banner remains and identifies the next set or setup action. It
      clears when that set is logged, a new rest starts, or its originating set is
      cleared. There is no separate dismiss action.
    defines:
    - session.rest-done
    uses:
    - session.rest-cue
    - session.rest-timer
    - session.progress-mark
  - id: ending-a-rest-yourself-lands-the-same-way
    t: Skipping a rest lands in the same place as letting it run out
    d: >-
      Skip and reducing the final 15 seconds both produce the finished banner.
      Starting a new rest replaces it.
    uses:
    - session.rest-done
    - session.rest-timer
  - id: rest-bar-docks-takes-room
    t: The rest bar docks at the bottom and takes real room
    d: >-
      The board reserves the bar's height instead of overlaying rows, so all content
      remains reachable.
    uses:
    - session.rest-timer
  - id: caption-replaces-word-rest
    t: The caption replaces the word "REST"
    d: The countdown identifies the upcoming load in the display unit; it does not repeat “REST”.
    uses:
    - session.rest-cue
    - load.units
  - id: caption-gives-banner-does-not
    t: The caption gets a line of its own, and never a "…"
    d: >-
      The caption occupies a full-width row above the timer and controls, wraps as
      needed, and remains readable at all text scales. The timer and controls keep
      their size.
    uses:
    - session.rest-cue
    - ui.text-scale
    manual: true
  - id: makes-sound-when-ends-one
    t: It makes a sound when it ends
    d: A single high-pitched tone with fast attack and decay, under 0.5 seconds.
    defines:
    - session.rest-sound
    manual: true
  - id: rest-end-is-felt-as-well-as-heard
    t: The end of a rest is felt as well as heard
    d: >-
      The phone vibrates when rest ends naturally or through Skip/−15s. It uses a
      full-strength pulse-gap-pulse alarm pattern, works in silent mode, and is
      session-owned rather than screen- or notification-owned. Starting a hold,
      finishing, or aborting cancels it. Android only; Do Not Disturb can suppress
      it and the phone controls the setting.
    defines:
    - session.rest-buzz
    uses:
    - session.rest-timer
    - session.rest-sound
    - session.hold-timer
    - platform.android
    - platform.portability
  - id: tone-synthesised-shipped-asset
    t: The tone is synthesised and shipped as an asset
    d: >-
      The generator is committed at tool/make_rest_tone.dart; it defines frequency,
      envelope, and length and must reproduce the asset byte-for-byte.
    screen: none
    uses:
    - session.rest-sound
  - id: declared-alarm-android
    t: Declared as an alarm on Android
    d: >-
      Uses the alarm audio stream, following the phone's silent and Do Not Disturb
      settings. It takes transient audio focus, pausing and then resuming other
      audio.
    screen: system
    uses:
    - session.rest-sound
    - platform.android
    manual: true
  - id: rest-alert-volume-slider
    t: How loud it is belongs to the phone, not to the app
    d: >-
      The alarm volume comes from the phone's alarm control; the app has no separate
      volume setting.
    screen: none
    uses:
    - session.rest-sound
    - platform.android
  - id: volume-is-a-gain-because-app-plays-it
    t: The app plays the sound itself, so it sounds the same in a pocket
    d: >-
      The foreground service keeps the process alive so the app plays the same
      asset in foreground and background. The notification provides status only.
    screen: none
    uses:
    - session.rest-sound
    - session.shade
    - platform.android
  - id: off-screen-ding-notification-instead
    t: Off screen the sound is joined by a notification, not replaced by one
    d: >-
      Off screen, posts a silent high-importance notification with the next action
      (for example, “Rest done — Bench Press · 80 kg × 8”). It clears itself when
      the next rest starts. On screen, no notification is posted.
    screen: shade
    uses:
    - session.rest-sound
    - session.shade
    - platform.android
    manual: true
  - id: ding-posted-when-rest-ends
    t: The off-screen ding is posted when the rest ends, by the app
    d: >-
      The app posts the notification when its timestamp reaches zero. The
      foreground service keeps the session alive, avoiding an inexact scheduled
      alarm and exact-alarm permission.
    screen: shade
    uses:
    - session.rest-sound
    - session.shade
    - platform.android
  - id: no-alarm-privilege-asked-for
    t: It asks for no alarm privilege, and that is why the service matters
    d: >-
      USE_EXACT_ALARM is refused publication to anything that is not an alarm clock
      or a calendar, and SCHEDULE_EXACT_ALARM is denied by default from Android 14.
      So there is no exact alarm to fall back on, which makes the foreground service
      the thing keeping a rest audible: it is what leaves an app alive to ring at
      the moment its own countdown reaches zero. Kill the app mid-rest — force-stop
      it, or lose it to a memory reclaim the service did not prevent — and that rest
      ends in silence. The workout itself is not lost; the snapshot brings it back.
    screen: none
    uses:
    - session.rest-sound
    - session.shade
    - platform.android
  - id: same-sound-either-way
    t: It is the same sound either way
    d: >-
      one asset, one player, one gain — so a rest cannot end with one noise in
      your hand and a different one in your pocket. It used to be two copies of
      the wav, the second an Android raw resource for the notification channel to
      sound; the channel no longer makes a sound, so there is one copy again.
    uses:
    - session.rest-sound
    manual: true
  - id: 15s-ends-rest-less-than
    t: −15s ends a rest with less than 15 seconds left
    d: >-
      below that the button's only honest readings are "skip" and "do nothing",
      and a button that does nothing is the worse of the two.
    uses:
    - session.rest-timer
- name: The board
  screen: session
  items:
  - id: goal-stated-once-per-exercise
    t: The goal is stated once per exercise
    d: >-
      on the line that carries the weight you can edit: WORKING SETS · 3 × 8 @ [80
      kg ✎], where the weight sits in the same bordered box a set row uses, so the
      part you can change looks like a control. A held movement reads 2 × 45s; one
      carrying no load drops the @ and the box entirely.
    uses:
    - session.exercise-weight
    - template.rep-target
    - exercise.measure
  - id: board-marks-set-you
    t: The board marks the set you are on
    d: >-
      so coming back to the phone does not mean scanning for the last row that went
      green. The mark follows the movement you are working rather than the order the
      template lists: it sits in the exercise you logged in *most recently* that still
      has working sets outstanding, so starting on the third exercise marks the third
      exercise instead of pinning the mark to the untouched first — and going back up
      the board to a movement you skipped past moves the mark to it on the first set
      you log there, rather than leaving it on the later exercise. Recency is the
      session's own order of logging, not the clock, so it is the same on a phone
      whose time changed and it survives the session being restored after the process
      is killed. With nothing logged yet — and once the exercise you were on is
      complete — it falls back to template order, taking the first outstanding set of
      the first unfinished exercise, warm-up rungs before the working sets they prime.
      The shade names the same set from the same arithmetic, so its Done button logs
      the set the board has marked. Exactly one thing is ever marked, and nothing is
      once every set is logged.
    defines:
    - session.progress-mark
    uses:
    - session.warmup-ramp
    - session.shade
  - id: warm-ups-count-toward-mark
    t: Warm-ups count toward the mark
    d: >-
      Marks and pulses the current rung. A collapsed ramp marks its header instead;
      the whole group is never highlighted.
    uses:
    - session.progress-mark
    - session.warmup-ramp
  - id: every-working-set-logged-finishes-the-exercise
    t: An exercise with every working set logged is finished, ramp or no ramp
    d: >-
      Warm-ups do not keep an exercise active after all working sets are logged.
      Late warm-up logging is recorded without starting rest. In supersets, a
      completed member leaves both its ramp and later rounds.
    uses:
    - session.progress-mark
    - session.warmup-ramp
    - session.rest-timer
    - session.superset-round
  - id: board-draws-a-superset-as-one-block
    t: The board draws a superset as one block
    d: >-
      A SUPERSET bracket contains each movement's heading, weight, ramp, and sets.
      The bracket changes grouping only; each row retains its own target.
    uses:
    - session.superset-round
  - id: superset-warms-up-every-movement-first
    t: A superset warms up every movement before the first round
    d: >-
      Each member keeps its own ramp. The mark visits all ramps in order before the
      first work round; warm-up rest applies between all rungs, including between
      movements.
    uses:
    - session.warmup-ramp
    - session.superset-round
    - session.rest-timer
  - id: board-opens-where-you-are
    t: The board opens on the exercise you are on
    d: >-
      On restore, scrolls once to the marked exercise without animation. It does
      not auto-scroll again while logging; an untouched session opens at the top.
    uses:
    - session.progress-mark
  - id: tap-log-hint-pinned
    t: The tap-to-log hint is pinned
    d: The hint remains beside duration and set count while exercise rows scroll.
    uses:
    - session.set-logging
  - id: weight-belongs-exercise-not-each
    t: A logged set keeps the weight it was done at
    d: >-
      Changing exercise weight updates future sets, not logged sets. Exercise and
      row weights are bordered controls. Unloaded movements have no weight field,
      unit heading, or weight cell.
    uses:
    - session.exercise-weight
    - exercise.weight-type
  - id: held-set-times-itself
    t: A held set times itself
    d: >-
      The result cell starts and stops a stopwatch; elapsed seconds are logged.
      Stopping starts rest and plays the rest tone.
    defines:
    - session.hold-timer
    uses:
    - session.rest-sound
    - session.rest-timer
    - exercise.measure
  - id: only-one-hold-runs-time
    t: Only one hold runs at a time
    d: >-
      Starting another hold logs the first. Tapping a logged hold clears it; a long
      press enters an exact duration.
    uses:
    - session.hold-timer
  - id: missed-set-one-fell-short
    t: A missed set is one that fell short on reps/seconds or weight
    d: deloading to finish counts as a miss. This feeds progression.
    screen: none
    uses:
    - progression.verdict
- name: Cardio machines
  screen: session
  uses:
  - session.console-metrics
  - exercise.cardio-machine
  items:
  - id: cardio-set-carries-console-readouts
    t: A set on a cardio machine can carry what the console said
    d: >-
      A timed set can store speed, incline, resistance level, and distance in
      addition to duration.
    defines:
    - session.console-metrics
    uses:
    - session.set-logging
  - id: readouts-are-optional-every-one-of-them
    t: Every readout is optional, and none is asked for
    d: >-
      Details are collapsed by default. Each field is blank until entered; all
      four are optional, and an empty details set can still be finished.
    uses:
    - session.console-metrics
  - id: readouts-fold-away-under-the-row
    t: The fields fold away under the set they belong to
    d: >-
      Details expand per set below its row. A collapsed row indicates when it has
      readouts, so entered values are distinguishable from an empty set.
    uses:
    - session.console-metrics
    - session.set-logging
  - id: readouts-follow-the-gyms-unit
    t: Speed and distance follow the unit the gym counts in
    d: >-
      kg mode displays km/h and km; lb mode displays mph and miles. Incline is a
      percentage and resistance is a unitless level. Readouts are stored in metric
      units and converted on display; switching units does not rewrite history.
    uses:
    - session.console-metrics
    - load.units
  - id: readouts-are-kept-with-the-session
    t: The readouts are kept with the set, and survive the app dying
    d: >-
      Readouts are included in the crash snapshot and saved with completed sets.
      Unlogged set readouts are discarded with the set.
    screen: none
    uses:
    - session.console-metrics
    - session.live-state
    - session.finish
    - history.session-record
  - id: only-a-cardio-machine-gets-the-details-control
    t: Only a cardio machine gets the details control
    d: >-
      Appears only for exercises classified as Cardio with Machine equipment.
    uses:
    - exercise.cardio-machine
    - session.console-metrics
- name: Slot settings from the board
  screen: session
  uses:
  - session.slot-settings
  items:
  - id: slot-settings-open-from-the-board
    t: An exercise's settings open from the board
    d: >-
      The settings control opens the builder sheet for sets, reps, rest, weight,
      set scheme, progression axis, and rates. Superset membership is unavailable
      because it changes workout structure.
    defines:
    - session.slot-settings
    uses:
    - template.item
    - progression.rates
    - template.set-scheme
  - id: board-settings-are-saved-to-the-workout
    t: What you change there is saved to the workout
    d: >-
      Edits apply to the workout slot itself and are used by future sessions; no
      duplicate slot is created.
    uses:
    - session.slot-settings
    - template.item
  - id: board-takes-the-change-where-it-can
    t: The board takes the change where it safely can
    d: >-
      Rest, future weights, and future targets update immediately; logged sets keep
      their values. Increasing set count appends sets; decreasing it removes only
      unlogged sets. Console readouts are preserved. Progression uses the rates
      and verdict rule active when the session is finished. Rebuilding from the
      slot applies newly added settings consistently.
    uses:
    - session.slot-settings
    - session.live-state
    - session.exercise-weight
    - session.console-metrics
    - template.rep-target
    - progression.rates
    - progression.double
    - progression.verdict
  - id: no-settings-on-an-exercise-with-no-slot
    t: A movement the session is carrying without a slot has no settings to open
    d: >-
      Exercises without a corresponding workout slot have no writable target, so
      the settings control is omitted.
    uses:
    - session.slot-settings
- name: Warm-ups
  screen: session
  uses:
  - session.warmup-ramp
  items:
  - id: warm-ups-never-persisted
    t: Warm-ups are never persisted
    d: >-
      Warm-ups are excluded from history aggregates, progression verdicts, and
      working-set counts. The warm-up group displays its liability disclaimer.
    uses:
    - history.aggregates
    - session.finish
    - progression.verdict
  - id: an-empty-ramp-starts-shut
    t: A ramp with no rungs in it starts shut
    d: >-
      A zero-rung ramp remains as a collapsed header so its stepper stays available.
      An unbuildable requested ramp opens normally. Collapse is only the initial
      state; the header toggles it, and reducing to zero preserves the current state.
    uses:
    - session.warmup-count
  - id: moving-weight-rebuilds-warm-up
    t: Moving the weight rebuilds the warm-up
    d: >-
      Logged rungs are preserved when weight or rung count changes; only future
      rungs are rebuilt.
    uses:
    - session.exercise-weight
    - session.warmup-count
  - id: default-warm-up-count-is-a-setting
    t: How many rungs a ramp opens with is a setting, and none is one of the answers
    d: >-
      Profile → Exercise settings → Warm-ups sets 0–6 (default 3). Exercise-level
      counts override it. Zero disables ramps and excludes them from duration
      estimates; a workout-level off switch has the same effect. Running sessions
      retain their initial counts and in-session changes.
    screen: settings
    defines:
    - session.warmup-count
    uses:
    - storage.settings
    - template.duration-estimate
    - session.start
  - id: a-workout-can-turn-its-own-ramps-off
    t: A single workout can turn its warm-up ramps off
    d: >-
      A workout-level switch disables all ramps for that workout and its estimate,
      persists on the workout, and leaves other workouts unchanged. App-wide zero
      also disables ramps. The board stepper remains available during the session.
    screen: workout-edit
    defines:
    - template.warmups-off
    uses:
    - session.warmup-ramp
    - session.warmup-count
    - template.workout
    - template.duration-estimate
    - storage.schema
  - id: warm-up-rest-shorter-between
    t: Warm-up rest is shorter between rungs, full before the work
    d: >-
      Uses 45 seconds between warm-up rungs; the exercise's configured rest follows
      the final rung before working sets.
    uses:
    - session.rest-timer
    - template.rest
  - id: barbell-ramps-start-empty-bar
    t: Barbell ramps start on the empty bar
    d: >-
      Starts at the empty bar and selects loadable later rungs, preferring fewer
      plates per side (225 lb over 45 lb: 45 → 115 → 185 for three rungs).
    defines:
    - load.loadable-grid
    uses:
    - load.bar-weight
    - load.plate-solver
    - exercise.weight-type
  - id: dumbbell-rungs-use-increments-gym
    t: Off the bar, a rung snaps to the increments a gym stocks
    d: >-
      Dumbbell rungs use 5 lb or 2.5 kg increments. Machine and cable rungs use
      increments of 5 in either unit.
    uses:
    - load.loadable-grid
    - load.units
    - exercise.weight-type
  - id: non-barbell-ramps-start-40
    t: Non-barbell ramps start at ~40% of the work
    d: Without an empty bar, the first rung starts near 40% of working weight.
    uses:
    - exercise.weight-type
  - id: 85-work-hard-ceiling
    t: 85% of the work is a hard ceiling
    d: Snapping rounds down; no warm-up exceeds 85% of working weight.
    uses:
    - load.loadable-grid
  - id: reps-fall-off-load-climbs
    t: Reps fall off as the load climbs
    d: Repetition targets decrease as load increases (for example, 8 → 5 → 3 → 2).
  - id: step-will-only-stray-tenth
    t: >-
      A step will only stray a tenth of the working weight to find a cheaper load
    d: >-
      Plate-count cost breaks ties only between neighboring loads; it cannot select
      a substantially lighter rung.
    uses:
    - load.plate-solver
  - id: duplicates-dropped
    t: Duplicates are dropped, and the stepper says so
    d: >-
      Duplicate loads are removed. The stepper reports the number built; + is
      disabled when no additional rung exists, − reduces the displayed ramp, and
      an entirely unbuildable request becomes zero. The requested count is retained
      for rebuilding after the working weight increases.
    uses:
    - load.loadable-grid
    - session.warmup-count
  - id: one-warm-up-set-middle
    t: One warm-up set is a middle-of-the-road set, not the empty bar
    d: >-
      A one-rung ramp uses roughly half the working weight (for example, 40 kg for
      an 80 kg bench). The empty-bar start applies from two rungs upward.
    uses:
    - load.loadable-grid
  - id: light-lift-still-collapses-bar
    t: A light lift still collapses to the bar on its own
    d: >-
      A 25 kg lift over a 20 kg bar produces only the empty-bar rung. A working
      weight equal to the bar produces no ramp.
    uses:
    - load.bar-weight
  - id: ramp-s-shape-follows-published
    t: The ramp's shape follows published practice
    d: >-
      Uses working-weight fractions rather than 1RM: default three rungs at
      40–50%, 60–70%, and 70–80%, with 8–10, 4–6, and 1–3 reps and 45–60 seconds
      between rungs. The count can reach six. Sources are cited in
      lib/data/warmup.dart.
