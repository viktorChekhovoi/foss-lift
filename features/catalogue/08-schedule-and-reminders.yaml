id: "08"
title: Schedule & reminders
tagline: >-
  Schedule routine weekdays and optional local notifications.
screen: routine-edit
code:
- lib/data/schedule.dart
- lib/services/reminders.dart
- lib/main.dart
- lib/screens/routine_edit_screen.dart
test:
- test/feature_08_schedule_and_reminders_test.dart
where: >-
  <b>Pure decision</b> lib/data/schedule.dart (nextReminderAt) · <b>Service</b>
  lib/services/reminders.dart · <b>Wired via</b> reminderSyncProvider, watched
  in lib/main.dart · <b>Edited in</b> lib/screens/routine_edit_screen.dart
groups:
- name: What it does
  items:
  - id: stores-which-day-week-routine
    t: Stores which day of the week a routine is trained on
    d: >-
      Stores a weekday mask and optional reminder time. Disabled reminders schedule
      nothing.
    defines:
    - platform.reminders
    uses:
    - template.routine
  - id: optionally-fires-one-local-notification
    t: Optionally fires one local notification per routine
    d: Sends one notification at the selected time on scheduled days.
    screen: shade
    uses:
    - platform.reminders
- name: Behaviour & edge cases
  items:
  - id: next-reminder-computed-not-stored
    t: The next reminder is computed, not stored
    d: >-
      Selects the next scheduled day after now, skips today when the routine was
      trained today, and wraps to the following week when necessary.
    screen: none
    uses:
    - platform.reminders
    - history.session-record
  - id: reminders-re-sync-single-place
    t: Reminders re-sync from a single place
    d: >-
      Schedule edits, completed sessions, and app launches all cancel and recreate
      the next pending notification through the same sync path.
    screen: none
    uses:
    - platform.reminders
    - session.finish
  - id: scheduled-inexactly-purpose
    t: Scheduled inexactly on purpose
    d: >-
      Uses inexact alarms to avoid Android 14 exact-alarm permission; reminder
      timing does not require second-level precision.
    screen: none
    uses:
    - platform.reminders
    - platform.android
  - id: notifications-carry-own-status-bar-icon
    t: Notifications carry the app's own status-bar icon
    d: >-
      Uses a white transparent barbell silhouette. Android renders status-bar
      icons as alpha-only stencils, so the launcher icon is unsuitable.
    screen: system
    uses:
    - platform.android
    - platform.reminders
    - session.shade
  - id: android-only
    t: Android-only
    d: >-
      The service is a no-op off Android. Android requires RECEIVE_BOOT_COMPLETED,
      the plugin receivers, and core-library desugaring.
    screen: none
    uses:
    - platform.android
    - platform.portability
