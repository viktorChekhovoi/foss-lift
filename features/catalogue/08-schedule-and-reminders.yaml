id: "08"
title: Schedule & reminders
tagline: >-
  A routine can name the weekdays it's meant to be trained on, and ask for a local
  notification on them.
screen: routine-edit
code:
- lib/data/schedule.dart
- lib/services/reminders.dart
- lib/main.dart
- lib/screens/routine_edit_screen.dart
test:
- test/feature_08_schedule_and_reminders_test.dart
where: >-
  <b>Pure decision</b> lib/data/schedule.dart (nextReminderAt) · <b>Service</b>
  lib/services/reminders.dart · <b>Wired via</b> reminderSyncProvider, watched
  in lib/main.dart · <b>Edited in</b> lib/screens/routine_edit_screen.dart
groups:
- name: What it does
  items:
  - id: stores-which-day-week-routine
    t: Stores which day of the week a routine is trained on
    d: >-
      a day mask, set on the routine editor along with an optional reminder time.
      Leave the reminder off and no notification is scheduled.
    defines:
    - platform.reminders
    uses:
    - template.routine
  - id: optionally-fires-one-local-notification
    t: Optionally fires one local notification per routine
    d: at a chosen time on those days.
    screen: shade
    uses:
    - platform.reminders
- name: Behaviour & edge cases
  items:
  - id: next-reminder-computed-not-stored
    t: The next reminder is computed, not stored
    d: >-
      the next scheduled day strictly after now, skipping today if the routine
      was already trained today, and wrapping a week for a once-weekly schedule.
    screen: none
    uses:
    - platform.reminders
    - history.session-record
  - id: reminders-re-sync-single-place
    t: Reminders re-sync from a single place
    d: >-
      a schedule edit, a finished session and a fresh launch all converge on the
      same pending notification — the app cancels and re-lays the next reminder
      on every sync.
    screen: none
    uses:
    - platform.reminders
    - session.finish
  - id: scheduled-inexactly-purpose
    t: Scheduled inexactly on purpose
    d: >-
      an exact alarm needs a permission Android 14 makes the user grant by hand,
      and a nudge to go to the gym doesn't need to land on the second.
    screen: none
    uses:
    - platform.reminders
    - platform.android
  - id: notifications-carry-own-status-bar-icon
    t: Notifications carry the app's own status-bar icon
    d: >-
      a white silhouette of the barbell from the app mark, drawn on transparency.
      Android renders a status-bar icon as an alpha-only stencil, so falling back
      to the launcher icon flattens it to a featureless blob — the colour and the
      detail that make the mark recognisable are exactly what is thrown away. The
      silhouette is drawn for that treatment instead, so what appears beside the
      clock is still the barbell.
    screen: system
    uses:
    - platform.android
    - platform.reminders
    - session.shade
  - id: android-only
    t: Android-only
    d: >-
      the service is a no-op off Android, so tests never touch a platform channel.
      Android needs RECEIVE_BOOT_COMPLETED, the plugin's receivers, and core-library
      desugaring.
    screen: none
    uses:
    - platform.android
    - platform.portability
