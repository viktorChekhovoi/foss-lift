id: "25"
title: iOS
tagline: Build the native app for iPhone and distribute beta builds with TestFlight.
screen: none
code: [ios/Runner/Info.plist, ios/Podfile, ios/Runner.xcodeproj/project.pbxproj, lib/util/capabilities.dart, .github/workflows/build-ios.yml, .github/workflows/testflight.yml]
test: [test/feature_25_ios_workout_test.dart, test/ci/test_ios_distribution.py]
groups:
- name: Platform support
  items:
  - id: ios-keeps-local-training
    t: iOS uses the same local training database and screens
    d: The iPhone app requires iOS 15 or later and supports routine editing, scheduled routine reminders, live workouts, progression, camera scanning, silent set videos, and local file backups. The app declares camera use, keeps clips in app-private storage, and registers fosslift links.
    uses: [platform.portability, platform.reminders, storage.database-location, platform.permissions, video.storage, share.deep-link]
  - id: ios-shows-live-workout
    t: The Lock Screen shows the active workout
    d: On iOS 16.2 or later, starting a workout shows its next set on the Lock Screen and in the Dynamic Island on supported iPhones when Live Activities are enabled. On iOS 17 or later, the Lock Screen and expanded island offer Done and Missed for the displayed counted set. These log the goal or one rep short and start the same rest as the board while the lifter stays in their other app. A running rest offers Skip, −15s and +15s. When the rest expires, the next set's controls become available even while Foss Lift is suspended. A stale or repeated tap cannot log a different set. Start on a timed hold opens the workout for its stopwatch. Tapping the activity opens the board where the lifter can finish the session. Finishing or discarding removes the activity.
    screen: system
    code: [lib/services/workout_activity.dart, ios/Runner/WorkoutLiveActivity.swift, ios/WorkoutActivity/WorkoutWidget.swift]
    uses: [session.live-state, session.progress-mark, session.set-logging, session.rest-timer, load.units, ui.navigation, platform.portability]
  - id: ios-rest-alert-at-deadline
    t: Rest ends with one audible cue, including when the phone is locked
    d: When a workout first needs notifications, iOS asks permission for alerts and sounds. With permission, the phone plays the rest tone at the scheduled deadline even if Foss Lift is suspended. Adjusting or replacing a rest moves its alert. Skipping, undoing the originating set, finishing, or discarding cancels the old deadline. Reopening the workout after delivery does not replay the tone. A lifter who declines can still hear the in-app cue while training with the app open. iPhone sound and Focus settings apply.
    screen: system
    code: [lib/state/active_workout.dart, lib/services/rest_alarm.dart, ios/Runner/AppDelegate.swift]
    uses: [session.rest-timer, session.rest-sound, session.set-logging, session.live-state, platform.permissions, privacy.offline]
  - id: ios-builds-on-macos
    t: macOS CI builds unsigned apps and manually requested signed IPAs
    d: Push and pull-request builds compile the simulator app and an unsigned device release. A manual workflow on main signs the app and its workout widget extension with their respective App Store profiles. It checks both identifiers, distribution type, expiry, team and certificate before archiving. The exported IPA is checked for the embedded extension, matching build numbers and profiles, signatures, and the app's minimum iOS version of 15.0 or later.
    uses: [platform.portability]
  - id: ios-testflight-upload-is-manual
    t: TestFlight uploads require an explicit manual choice
    d: The TestFlight workflow defaults to building a signed IPA without uploading it. Upload runs only when the owner manually selects the upload operation on main and provides a unique positive build number. It uses an App Store Connect team API key, leaves beta review and tester invitations to the owner, and removes temporary signing material after the job. A check operation tests the signing setup with generated dummy credentials and never uses production secrets or uploads an app.
    uses: [platform.portability]
