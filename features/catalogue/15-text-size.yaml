id: "15"
title: Text size
tagline: Follows the phone's text setting with an app-specific adjustment.
screen: theme-settings
code:
- lib/util/text_scale.dart
- lib/widgets/pinch_text_scale.dart
- lib/main.dart
test:
- test/feature_15_text_size_test.dart
where: >-
  <b>Scale arithmetic</b> lib/util/text_scale.dart (resolveTextScale, clampTextNudge,
  kTextScaleChoices, bounds) · <b>Root application</b> PinchTextScale in lib/main.dart
  · <b>Gesture</b> lib/widgets/pinch_text_scale.dart · <b>Controls</b>
  lib/screens/appearance_screen.dart · <b>Storage</b> Settings.textScale via textScaleProvider
groups:
- name: What it does
  items:
  - id: follows-system-text-size
    t: Follows the system text size
    d: >-
      The app uses the platform value. Default in Appearance means the phone's
      current setting.
    uses:
    - ui.text-scale
    - storage.settings
  - id: offers-nudge-own
    t: Offers an app-specific text-size adjustment
    d: >-
      Profile → Appearance → Text size offers Smaller, Default, Larger, and Largest.
      Each chip uses its selected size.
    defines:
    - ui.text-scale
  - id: chips-span-the-whole-pinch-range
    t: The four chips span the pinch range
    d: >-
      The choices are 85%, 100%, 130%, and 200%. Smaller and Largest are the pinch
      bounds, so the gesture and chips share one scale.
    uses:
    - ui.text-scale
  - id: pinching-onto-a-chip-selects-it
    t: A pinch landing on a chip percentage selects that chip
    d: >-
      Chips and the gesture write the same setting. A value at 200% selects Largest;
      a value between choices leaves all chips unselected.
    uses:
    - ui.text-scale
  - id: pinch-two-fingers-scales-text
    t: A two-finger pinch scales text throughout the app
    d: >-
      It writes the same persistent adjustment as the chips and scales text rather
      than zooming the canvas. The gesture activates only after two fingers pass a
      movement threshold, preserving one-finger scrolling. The current percentage
      appears during the gesture and is saved when the fingers lift.
    uses:
    - ui.text-scale
- name: Behaviour & edge cases
  items:
  - id: nudge-multiplies-phone-s-setting
    t: The app adjustment multiplies the phone's setting
    d: >-
      The platform setting remains in effect; changing this setting does not reset
      it.
    screen: none
    uses:
    - ui.text-scale
  - id: product-clamped-0-85-2
    t: The final scale is clamped to 0.85×–2.0×
    d: >-
      The product of the platform setting and app adjustment stays within the range
      covered by layout checks. The pinch uses the same bounds.
    screen: none
    uses:
    - ui.text-scale
  - id: every-screen-swept-every-scale
    t: Layout checks cover every screen and overflow fails the build
    d: >-
      The feature test mounts each screen at 1.0×, 1.3×, and 2.0× on a 360 dp
      viewport and fails on overflow. Dialogs and sheets are also tested at 1.0×
      and 2.0× through their normal entry points.
    screen: none
    uses:
    - ui.text-scale
    manual: true
  - id: where-row-runs-out-width
    t: Labels yield to controls when a row runs out of width
    d: >-
      A section heading ellipsizes before its action; the warm-up count yields to
      "WARM-UP"; the board's "WORKING SETS" yields to its weight; and a stepper's
      value ellipsizes before either button.
    screen: none
    uses:
    - ui.text-scale
    manual: true
