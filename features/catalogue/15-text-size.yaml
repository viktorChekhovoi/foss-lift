id: "15"
title: Text size
tagline: >-
  The app follows the phone's text setting, and can be nudged on top of it.
screen: theme-settings
code:
- lib/util/text_scale.dart
- lib/widgets/pinch_text_scale.dart
- lib/main.dart
test:
- test/feature_15_text_size_test.dart
where: >-
  <b>Arithmetic</b> lib/util/text_scale.dart (resolveTextScale, clampTextNudge,
  kTextScaleChoices, the two bounds) · <b>Applied once</b> by PinchTextScale, mounted
  at the app root in lib/main.dart · <b>The gesture</b> lib/widgets/pinch_text_scale.dart
  · <b>The chips</b> lib/screens/appearance_screen.dart · <b>Stored as</b>
  Settings.textScale, read through textScaleProvider
groups:
- name: What it does
  items:
  - id: follows-system-text-size
    t: Follows the system text size
    d: >-
      Android's own setting is system-wide and already discoverable; the app renders
      at whatever it says, and Default here means "whatever the phone says".
    defines:
    - ui.text-scale
    uses:
    - storage.settings
  - id: offers-nudge-own
    t: Offers a nudge of its own
    d: >-
      Profile → Appearance → Text size: Smaller / Default / Larger / Largest, for
      wanting this app bigger without enlarging everything else, or smaller to fit
      more of a workout on screen. Each chip is drawn at the size it selects, because
      how big the words get is the only thing the control is about.
    defines:
    - ui.text-scale
  - id: chips-span-the-whole-pinch-range
    t: The four chips span the whole range the pinch does
    d: >-
      85%, 100%, 130% and 200% — the two ends are exactly the two the pinch stops
      at, so the chips are named stops on one scale rather than a second, narrower
      control beside it. Largest is the largest text the app will render, and
      Smaller is the smallest; pinching to either end lands on a chip rather than
      somewhere past the last one.
    defines:
    - ui.text-scale
  - id: pinching-onto-a-chip-selects-it
    t: A pinch that lands on a chip's percentage selects that chip
    d: >-
      the chips and the gesture write the same setting, so Appearance marks
      whichever step the stored value is on however it got there. Pinch to 200%
      and Largest is the selected chip when you next open the screen; land between
      two and neither is marked, because neither is what the app is rendering at.
    uses:
    - ui.text-scale
  - id: pinch-two-fingers-scales-text
    t: A two-finger pinch scales the text, anywhere in the app
    d: >-
      the same nudge the chips write, so it survives leaving the screen and the
      whole app follows it — this is text scaling, not a zoomed canvas, so a
      scrolling list stays a scrolling list at every size. The gesture only takes
      over once two fingers have moved apart or together past a threshold, which
      is what keeps a one-finger scroll from ever being read as a pinch. While it
      runs, the scale it is on is shown as a percentage over the screen, and the
      value is written once the fingers come off.
    defines:
    - ui.text-scale
- name: Behaviour & edge cases
  items:
  - id: nudge-multiplies-phone-s-setting
    t: The nudge multiplies the phone's setting; it does not replace it
    d: >-
      somebody who has already set their phone large should not have to set it
      again here, and should not lose that choice by touching this one.
    screen: none
    uses:
    - ui.text-scale
  - id: product-clamped-0-85-2
    t: The product is clamped to 0.85×–2.0×
    d: >-
      a phone at 2.0 and the app at Largest is 2.6, and a control that can produce
      an unchecked layout is not an accessibility feature. The result stays in a range
      every screen is checked at, so no combination of the two produces a layout
      nobody has seen: 2.0 is the ceiling because 2.0 is what the sweep covers, and
      the floor is where the set rows stop being readable across a gym. The pinch is
      held to the same two bounds, so a gesture with no stops on it cannot walk out
      of the range either.
    screen: none
    uses:
    - ui.text-scale
  - id: every-screen-swept-every-scale
    t: Every screen is swept at every scale, and overflow fails the build
    d: >-
      the feature test mounts each screen at 1.0×, 1.3× and 2.0× on a 360 dp viewport
      and fails on any render overflow. Dialogs and sheets are swept too, at 1.0× and
      2.0× and reached the way a user reaches them — the tighter case, since a dialog
      is bounded on both axes by its own insets and none of it is on screen for the
      screen sweep to see. That is where the stepper and the to-failure checkbox
      turned up.
    screen: none
    uses:
    - ui.text-scale
    manual: true
  - id: where-row-runs-out-width
    t: Where a row runs out of width, the label gives and the control does not
    d: >-
      a section heading ellipsises before its action is pushed off; the warm-up
      group's "· 3 sets" gives before "WARM-UP"; the board's "WORKING SETS" gives
      before the weight beside it; a stepper's value ellipsises before either
      of its buttons. The part that only names things yields to the part you touch.
    screen: none
    uses:
    - ui.text-scale
    manual: true
