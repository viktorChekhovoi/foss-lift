id: "18"
title: Language
tagline: >-
  The app speaks English, Ukrainian, Spanish and both Portugueses, picks the
  phone's language on first run and lets you change it.
screen: language-settings
code:
- lib/l10n/app_en.arb
- lib/util/locales.dart
- lib/screens/language_screen.dart
test:
- test/feature_18_language_test.dart
where: >-
  <b>The strings</b> lib/l10n/*.arb, compiled to AppLocalizations by gen_l10n ·
  <b>Which language</b> lib/util/locales.dart (kSupportedLocales, resolveLocale)
  · <b>Stored as</b> Settings.localeTag — written on first run and never null
  after it — read through localeTagProvider · <b>Applied once</b> at the app root
  in lib/main.dart · <b>Seeded rows</b> resolve through Exercises.seedKey,
  Routines.seedKey and Workouts.seedKey
groups:
- name: What it does
  items:
  - id: five-languages
    t: Ships in five languages
    d: >-
      English, Ukrainian, Spanish, Portuguese (Portugal) and Portuguese (Brazil).
      The two Portugueses are separate translations rather than a base plus a
      handful of overrides, because the vocabulary a Brazilian lifter uses for
      the movements is not European Portuguese with a few words swapped.
    defines:
    - ui.language
    uses:
    - ui.string-catalogue
  - id: first-run-picks-the-phone-language
    t: First run picks the phone's language and stores it as a choice
    d: >-
      A fresh install resolves the phone's language list against the five —
      language and region first, then the language alone, then English — and
      writes the answer to <code>Settings.localeTag</code>. It is a real choice
      from then on, not a standing deference: the phone is consulted once, and
      changing the phone's language afterwards leaves the app where it is.
      Nothing asks on first run, because the phone has already answered.
    uses:
    - ui.language
    - storage.settings
  - id: language-picker-in-settings
    t: The language can be set in the app, independently of the phone
    d: >-
      Profile → Appearance → Language lists the five, one of them always
      selected — there is no <i>follow the phone</i> row to fall back to. Each
      language names itself in its own language, so the row you want is legible
      from whatever the app is currently rendering in.
    uses:
    - ui.language
  - id: change-applies-immediately
    t: Changing the language repaints the app at once
    d: >-
      No restart and no prompt to restart. The choice is a database write like
      any other setting, and the widget tree rebuilds against it.
    uses:
    - ui.language
    - storage.settings
  - id: muscle-and-equipment-translated
    t: Muscle groups and equipment kinds read in the chosen language
    d: >-
      The filter chips, both rows of chips on the exercise form, and the groups
      on an exercise's own page. The stored value and the routine-code index stay
      English — see
      <i>the vocabulary is still English underneath</i>.
    uses:
    - exercise.taxonomy
    - ui.string-catalogue
  - id: seeded-exercises-translated
    t: The starter library reads in the chosen language, and re-reads when it changes
    d: >-
      Every movement the app ships with carries a <code>seedKey</code>, and the
      name on screen is looked up from it rather than read out of the row. So
      switching from Spanish to Ukrainian renames all 123 of them, and switching
      back renames them again. A movement you added yourself has no key and
      keeps the name you gave it.
    defines:
    - ui.seeded-name
    uses:
    - exercise.seed
    - exercise.identity
  - id: demo-routines-translated
    t: The starter programs and their training days read in the chosen language
    d: >-
      Push / Pull / Legs, Upper / Lower, Full Body 3x and the training days of
      all five, by the same mechanism — until you rename one. Starting Strength
      and StrongLifts 5x5 are the names of published programs and stay in
      English everywhere, the way a book title does.
    uses:
    - ui.seeded-name
    - template.routine
    - template.workout
  - id: history-names-follow
    t: A logged set names its movement in the chosen language
    d: >-
      History denormalises the exercise name so it survives a library edit, and
      it stores the seed key beside it for the same reason it stores the name.
      A session logged in English reads in Ukrainian after the switch, and a
      custom movement deleted from the library still reads as whatever it was
      called.
    screen: history
    uses:
    - ui.seeded-name
    - history.session-record
  - id: dates-and-numbers-follow
    t: Dates and numbers are formatted for the language
    d: >-
      Weekday and month names, and the decimal separator — a Ukrainian phone
      showing 82,5 kg rather than 82.5 kg.
    screen: none
    uses:
    - ui.language
- name: Behaviour & edge cases
  items:
  - id: vocabulary-still-english-underneath
    t: The vocabulary is still English underneath
    d: >-
      Muscle groups, equipment kinds and the canonical exercise names are stored
      and transmitted in English. A routine shared from a Brazilian phone lands
      on a Ukrainian one naming the same movements, because the code carries the
      English name and the recipient's copy of that movement translates itself.
      Translating the wire format instead would make a share code mean different
      things depending on who wrote it.
    screen: none
    uses:
    - share.routine-code
    - exercise.taxonomy
  - id: renaming-a-seeded-row-keeps-your-name
    t: Renaming a seeded routine or training day makes the name yours
    d: >-
      The rename clears the seed key, so a day you called "Chest &amp; Tris"
      stays that in every language rather than reverting to "Push" on the next
      switch. Seeded exercises cannot be renamed at all, so the question does not
      arise for them.
    screen: routine-edit
    uses:
    - ui.seeded-name
  - id: missing-translation-falls-back-to-english
    t: A string with no translation renders in English rather than as a key
    d: >-
      A half-finished locale is a mixed-language screen, which is ugly but
      usable. A screen of <code>settings_language_title</code> is neither.
    screen: none
    uses:
    - ui.string-catalogue
  - id: portuguese-region-resolution
    t: A Portuguese phone gets European Portuguese and a Brazilian one gets Brazilian
    d: >-
      On first run pt-BR resolves to the Brazilian catalogue; every other
      Portuguese region tag, including a bare pt, resolves to the European one.
      Either way it is the resolved tag that gets stored.
    screen: none
    uses:
    - ui.language
  - id: every-screen-swept-every-language
    t: Every screen is swept in every language, and overflow fails the build
    d: >-
      The same sweep the text-size feature runs, over the five locales as well as
      the three scales. Ukrainian and Portuguese run appreciably longer than
      English — "Розпочати тренування" against "Start workout" — and a fixed-width
      button that fits one does not necessarily fit the other.
    screen: none
    uses:
    - ui.string-catalogue
    - ui.text-scale
  - id: no-untranslated-literals-left
    t: No user-facing string is left hard-coded
    d: >-
      A test walks the widget tree of every screen and fails on any rendered text
      that is not in the catalogue and is not data — a name, a number, a date.
      Extraction that is only ever checked by eye regresses on the next screen
      anybody writes.
    screen: none
    uses:
    - ui.string-catalogue
  - id: adding-a-language-is-one-file
    t: Adding a sixth language is a file and a list entry
    d: >-
      Drop <code>app_&lt;tag&gt;.arb</code> into lib/l10n and add the tag to
      <code>kSupportedLocales</code>. Nothing else knows how many languages there
      are — the picker, the resolver and the sweep all read that list.
    screen: none
    defines:
    - ui.string-catalogue
