id: "18"
title: Language
tagline: >-
  English, Ukrainian, Spanish, European Portuguese, and Brazilian Portuguese;
  the initial locale comes from the phone and can then be changed in-app.
screen: language-settings
code:
- lib/l10n/app_en.arb
- lib/util/locales.dart
- lib/screens/language_screen.dart
test:
- test/feature_18_language_test.dart
where: >-
  <b>The strings</b> lib/l10n/*.arb, compiled to AppLocalizations by gen_l10n ·
  <b>Which language</b> lib/util/locales.dart (kSupportedLocales, resolveLocale)
  · <b>Stored as</b> Settings.localeTag — written on first run and never null
  after it — read through localeTagProvider · <b>Applied once</b> at the app root
  in lib/main.dart · <b>Seeded rows</b> resolve through Exercises.seedKey,
  Routines.seedKey and Workouts.seedKey
groups:
- name: What it does
  items:
  - id: five-languages
    t: Ships in five languages
    d: >-
      The supported locales are English, Ukrainian, Spanish, pt-PT, and pt-BR.
      pt-PT and pt-BR use separate catalogues.
    defines:
    - ui.language
    uses:
    - ui.string-catalogue
  - id: first-run-picks-the-phone-language
    t: First run picks the phone's language and stores it as a choice
    d: >-
      On a fresh install, the phone's locale list is matched by language and
      region, then by language, with English as the fallback. The resolved tag
      is written to <code>Settings.localeTag</code>; later phone locale changes
      do not change the app locale.
    uses:
    - ui.language
    - storage.settings
  - id: language-picker-in-settings
    t: The language can be set in the app, independently of the phone
    d: >-
      Profile → Appearance → Language lists the five locales and always has one
      selected. Each option uses its native language name; there is no follow-
      the-phone option.
    uses:
    - ui.language
  - id: change-applies-immediately
    t: Changing the language repaints the app at once
    d: >-
      The setting is persisted and the widget tree rebuilds immediately; no
      restart or restart prompt is shown.
    uses:
    - ui.language
    - storage.settings
  - id: muscle-and-equipment-translated
    t: Muscle groups and equipment kinds read in the chosen language
    d: >-
      Filter chips, exercise-form chips, and exercise-page groups use the
      selected locale. Stored values and routine-code indexes remain English;
      see <i>the vocabulary is still English underneath</i>.
    uses:
    - exercise.taxonomy
    - ui.string-catalogue
  - id: seeded-exercises-translated
    t: The starter library reads in the chosen language, and re-reads when it changes
    d: >-
      Shipped movements carry a <code>seedKey</code>; their displayed names are
      resolved from that key, so all 133 update when the locale changes. Custom
      movements have no key and retain their stored names.
    defines:
    - ui.seeded-name
    uses:
    - exercise.seed
    - exercise.identity
  - id: demo-routines-translated
    t: The starter programs and their training days read in the chosen language
    d: >-
      Push / Pull / Legs, Upper / Lower, Full Body 3x, and the training days of
      all five starter routines resolve through seeded names until renamed.
      Starting Strength and StrongLifts 5x5 remain English as published program
      names.
    uses:
    - ui.seeded-name
    - template.routine
    - template.workout
  - id: history-names-follow
    t: A logged set names its movement in the chosen language
    d: >-
      History stores both the exercise name and its seed key. Seeded names are
      re-resolved after a locale change; custom names remain available even if
      the movement is later deleted.
    screen: history
    uses:
    - ui.seeded-name
    - history.session-record
  - id: dates-and-numbers-follow
    t: Dates and numbers are formatted for the language
    d: >-
      Weekday and month names and numeric formatting, including the locale's
      decimal separator (for example, Ukrainian 82,5 kg).
    screen: none
    uses:
    - ui.language
- name: Behaviour & edge cases
  items:
  - id: vocabulary-still-english-underneath
    t: The vocabulary is still English underneath
    d: >-
      Muscle groups, equipment kinds, and canonical exercise names are stored and
      transmitted in English. A recipient resolves those values into its own
      locale, so a share code has the same meaning regardless of its source
      locale.
    screen: none
    uses:
    - share.routine-code
    - exercise.taxonomy
  - id: renaming-a-seeded-row-keeps-your-name
    t: Renaming a seeded routine or training day makes the name yours
    d: >-
      Renaming clears a routine or training day's seed key, so the custom name
      persists across locale changes. Seeded exercises are not renameable.
    screen: routine-edit
    uses:
    - ui.seeded-name
  - id: missing-translation-falls-back-to-english
    t: A string with no translation renders in English rather than as a key
    d: >-
      Missing translations fall back to English. The UI never renders a message
      key such as <code>settings_language_title</code>.
    screen: none
    uses:
    - ui.string-catalogue
  - id: portuguese-region-resolution
    t: A Portuguese phone gets European Portuguese and a Brazilian one gets Brazilian
    d: >-
      On first run, pt-BR resolves to the Brazilian catalogue. Other Portuguese
      tags, including bare pt, resolve to pt-PT. The resolved tag is stored.
    screen: none
    uses:
    - ui.language
  - id: every-screen-swept-every-language
    t: Every screen is swept in every language, and overflow fails the build
    d: >-
      The text-size sweep runs across all five locales and three scales. Longer
      Ukrainian and Portuguese strings can expose overflow in controls sized for
      English.
    screen: none
    uses:
    - ui.string-catalogue
    - ui.text-scale
  - id: no-untranslated-literals-left
    t: No user-facing string is left hard-coded
    d: >-
      A widget-tree test fails on rendered text that is neither a catalogue
      string nor data such as a name, number, or date.
    screen: none
    uses:
    - ui.string-catalogue
  - id: adding-a-language-is-one-file
    t: Adding a sixth language is a file and a list entry
    d: >-
      Add <code>app_&lt;tag&gt;.arb</code> under lib/l10n and add the tag to
      <code>kSupportedLocales</code>. The picker, resolver, and locale sweep read
      that list.
    screen: none
    defines:
    - ui.string-catalogue
