id: "22"
title: Cycles and training maxes
tagline: >-
  A slot can rotate through explicit weekly set schemes and adjust their shared
  training max when the cycle wraps.
screen: workout-edit
code:
- lib/data/set_scheme.dart
- lib/data/progression.dart
- lib/data/percentage_base.dart
- lib/data/database.dart
- lib/widgets/workout_items_editor.dart
- lib/screens/training_max_screen.dart
test:
- test/feature_22_cycles_test.dart
where: >-
  <b>Blocks and rows</b> lib/data/set_scheme.dart (CycleBlocks, resolveSetTargets)
  · <b>The wrap</b> lib/data/progression.dart (stepCycle), applied by
  AppDatabase.advanceProgression · <b>Data</b> WorkoutItems.cycle_blocks /
  cycle_names / cycle_position · <b>Builder</b>
  lib/widgets/workout_items_editor.dart (_CycleEditor, _CustomSetRow) · <b>The
  base a variation trains off</b> lib/data/percentage_base.dart, gathered per
  routine by AppDatabase.watchTrainingMaxGroups and set on
  lib/screens/training_max_screen.dart
groups:
- name: The cycle
  items:
  - id: a-slot-can-run-a-cycle
    t: A slot can rotate through a fixed set of weeks
    d: >-
      <b>Cycle</b> is a set scheme alongside flat, back-off, ramp, and custom. It
      stores multiple weekly row sets; each session resolves one week, then wraps
      to the first. Each row has a per-set rep target and percentage of the
      slot's weight.
    defines:
    - template.cycle
    uses:
    - template.set-scheme
    - template.item
  - id: the-cycle-advances-on-the-slot-that-ran-it
    t: Each slot advances its own cycle, on the session that trained it
    d: >-
      Each slot stores its own cycle position and advances when the containing
      workout is finished. A slot trained twice weekly advances twice as fast as
      one trained weekly. Skipping a day does not advance its position.
    screen: session
    uses:
    - template.cycle
    - session.finish
  - id: the-wrap-is-what-moves-the-weight
    t: Coming round to the first week again is what moves the weight
    d: >-
      The training max changes once, when the final week completes. It increases
      by the slot's step when misses are below the threshold, decreases by its
      back-off when the threshold is reached, and otherwise stays unchanged.
      Miss and clean counters reset for the next cycle.
    screen: none
    defines:
    - template.training-max
    uses:
    - template.cycle
    - progression.rates
    - progression.streak
  - id: the-progression-card-says-it-moves-the-training-max
    t: The Progression card says the rates move the training max
    d: >-
      On a cycle slot, Progression rates modify the training max at wrap rather
      than the prescribed session weight. The UI states the increase, decrease,
      and miss threshold, for example: "adds 2.5 kg at a clean cycle; drops 5 kg
      after 2 missed sessions."
    screen: workout-edit
    uses:
    - template.cycle
    - template.training-max
    - progression.rates
    - progression.streak
  - id: what-a-cycle-is-sits-behind-an-i
    t: What a cycle is sits behind an (i) on the Cycle option itself
    d: >-
      The (i) action is attached to the Cycle option and is available before or
      after selection. It states that weeks run in order and wrap, percentages
      use the training max, and the training max changes at wrap. It describes
      the scheme without naming a particular program.
    screen: workout-edit
    uses:
    - template.cycle
    - template.training-max
    - template.set-scheme
  - id: a-cycle-weight-is-not-raised-by-what-you-lifted
    t: Loading the bar past the prescription does not move a training max
    d: >-
      Percentage-based schemes treat the slot weight as a base, not as a lifted
      target. Completing a set above its prescription does not change that base;
      otherwise a 105% set would increase the max it references. Cycle slots
      update at wrap. Custom slots follow their own step, including zero.
    screen: none
    uses:
    - template.cycle
    - template.training-max
    - template.set-scheme
    - session.exercise-weight
    - progression.verdict
  - id: the-week-is-on-screen
    t: The board says which week of the cycle you are on
    d: >-
      The live board and offering day show the position as "Week 2/4". Goals are
      listed per set when rows differ, such as "5/3/1+"; slashes distinguish set
      targets from the middot separators used between slot-summary fields.
    screen: session
    points:
    - workout-detail
    uses:
    - template.cycle
    - template.item
    - session.set-logging
  - id: a-week-of-a-cycle-can-be-named
    t: A week of a cycle can be called what it is
    d: >-
      Each week may have a heading-length name such as Deload, Peak, Volume, or
      Heavy Single. An unnamed week displays its ordinal label, such as "Week 4".
    screen: workout-edit
    defines:
    - template.cycle-week-name
    uses:
    - template.cycle
  - id: a-named-week-is-named-everywhere-the-week-is-shown
    t: A named week is named everywhere the week is shown
    d: >-
      The live board, offering day, and folded builder card use the custom name in
      place of "Week" while retaining the position, for example "Deload 4/4".
      Clearing the name restores "Week 4".
    screen: session
    points:
    - workout-detail
    - workout-edit
    uses:
    - template.cycle-week-name
    - template.cycle
    - template.item
  - id: a-week-is-a-card-that-folds
    t: Each week is a card of its own, and it folds
    d: >-
      Each week is a bordered, collapsible card containing its set rows; only one
      card is expanded at a time. A collapsed card summarizes its targets, such as
      "5/5/5+ · 65/75/85%". The next session's week is initially expanded and
      highlighted; a newly added week opens automatically.
    screen: workout-edit
    uses:
    - template.cycle
    - template.per-set-reps
- name: What a written-out row can ask for
  items:
  - id: a-row-can-ask-for-a-range-or-for-as-many-as-you-have
    t: A written-out row takes a count, a range, or a minimum with no top
    d: >-
      A row accepts a fixed count, a range, or an unbounded minimum (for example,
      5, 8–12, or 5+). The target is per row, so one slot can mix fixed and open
      targets. Both custom schemes and cycles use per-set rows.
    defines:
    - template.per-set-reps
    uses:
    - template.set-scheme
    - template.rep-target
  - id: a-row-is-judged-against-its-own-floor
    t: A row is missed only below its own floor
    d: >-
      A range is successful at any value within its bounds; 8–12 is met at 9. An
      unbounded target is successful at or above its minimum. A fixed count is
      both its minimum and target. A miss is any result below the row's floor.
    screen: session
    uses:
    - template.per-set-reps
    - session.set-logging
    - progression.verdict
- name: The training max
  items:
  - id: the-weight-field-says-training-max-on-a-cycle-slot
    t: On a slot whose sets are written out, the weight field is a training max
    d: >-
      For percentage-based slots, every set is a percentage of the base. The
      builder labels it "Training max"; the board and exercise summary use "TM".
      Editing it changes the base for all rows. This applies to custom
      percentage schemes as well as cycles.
    screen: workout-edit
    points:
    - session
    uses:
    - template.training-max
    - template.set-scheme
    - session.exercise-weight
  - id: a-movement-can-take-its-percentages-from-another-lift
    t: A variation takes its percentages from the lift it is a version of
    d: >-
      A movement may reference another lift as its percentage base. Shipped squat
      variations use Back Squat; deadlift variations use Deadlift. Movements with
      no reference use their own training max, including all newly created ones.
    screen: none
    defines:
    - template.percentage-base
    uses:
    - template.training-max
    - exercise.seed
  - id: one-screen-sets-every-training-max-in-a-routine
    t: One screen sets every training max in a routine
    d: >-
      The routine groups percentage slots by their base lift and provides one field
      per lift. Entering Squat writes to every slot based on Squat, including back
      and front squats; untouched fields leave their slots unchanged.
    screen: routine-training-maxes
    uses:
    - template.percentage-base
    - template.training-max
    - template.routine
  - id: the-screen-says-what-each-field-will-touch
    t: Each field names the slots it will write
    d: >-
      Each field lists covered movements and slot counts, for example "Back Squat ×
      31 · Front Squat × 2". Individual slots remain editable after the bulk
      update.
    screen: routine-training-maxes
    uses:
    - template.percentage-base
    - template.training-max
  - id: a-field-opens-on-what-the-slots-already-say
    t: A field opens on the number its slots already carry
    d: >-
      A field is prefilled when all covered slots share a value. If values differ,
      it is empty and indicates the disagreement; entering a value synchronizes
      the covered slots. Leaving it empty changes nothing.
    screen: routine-training-maxes
    uses:
    - template.percentage-base
    - template.training-max
  - id: the-screen-is-for-any-routine-with-percentages-in-it
    t: It is there for a routine you built, not only a shipped one
    d: >-
      The screen groups slots in any routine, including user-created routines. It
      appears when at least one slot uses percentages and is omitted for routines
      containing only flat sets.
    screen: routine-detail
    points:
    - routine-edit
    - routine-training-maxes
    uses:
    - template.percentage-base
    - template.training-max
    - template.routine
- name: Behaviour & edge cases
  items:
  - id: an-upgraded-phone-changes-nothing
    t: An upgraded phone trains exactly what it trained before
    d: >-
      Existing slots receive empty cycle columns during upgrade. No scheme,
      position, or weight changes; the new picker option affects only slots where
      it is selected.
    screen: none
    uses:
    - storage.schema
    - template.cycle
  - id: a-cycle-of-one-week-is-just-a-custom-scheme
    t: A cycle of one week is a custom scheme that steps every session
    d: >-
      A one-week cycle wraps every session, so its rows remain constant and its
      training max progresses every session. A cycle with no weeks resolves as a
      flat scheme.
    screen: none
    uses:
    - template.cycle
  - id: names-follow-the-week-they-were-typed-on
    t: Removing a week takes its name with it
    d: >-
      Names are stored with their weeks. Deleting week two does not rename week
      three; adding a week creates an unnamed week.
    screen: workout-edit
    uses:
    - template.cycle-week-name
    - template.cycle
  - id: week-names-travel-with-a-shared-routine
    t: The names travel with a shared routine
    d: >-
      Shared routine codes carry week names in an optional trailing section. Older
      builds stop before that section and import the same weeks without names.
    screen: none
    uses:
    - template.cycle-week-name
    - share.routine-code
  - id: an-upgraded-phone-has-no-week-names
    t: An upgraded phone finds its weeks unnamed
    d: >-
      The upgrade adds an empty name column to existing slots. Weeks display their
      ordinal labels and training behavior is unchanged.
    screen: none
    uses:
    - template.cycle-week-name
    - storage.schema
  - id: editing-the-weeks-does-not-restart-the-cycle
    t: Editing the weeks does not send the slot back to week one
    d: >-
      Builder edits preserve the slot's cycle position and progression streaks. If
      a cycle is shortened below the stored position, the position resolves to its
      final week.
    screen: workout-edit
    uses:
    - template.cycle
    - progression.streak
- name: Where to find it
  items:
  - id: build-a-cycle
    t: Build a cycle
    d: >-
      Routines → a routine → a day → edit → tap a slot → Target → Advanced → Set
      scheme → Cycle. Add weeks and one row per set with reps and a percentage of
      the training max. Use the Cycle option's (i) for its definition.
    screen: workout-edit
    uses:
    - template.cycle
  - id: set-the-training-maxes-of-a-routine
    t: Set a routine's training maxes
    d: >-
      Routines → a routine → % in the app bar → enter a number per lift → Save.
      The builder also links to Training maxes. Values apply to every slot based
      on that lift.
    screen: routine-training-maxes
    uses:
    - template.percentage-base
    - template.training-max
  - id: name-a-week
    t: Name a week
    d: >-
      In the cycle editor, tap a week's pencil → enter a name → Save. The name
      replaces "Week 3" on the card, live board, and offering day. Saving empty
      restores "Week 3".
    screen: workout-edit
    uses:
    - template.cycle-week-name
