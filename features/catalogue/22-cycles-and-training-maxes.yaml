id: "22"
title: Cycles and training maxes
tagline: >-
  A slot can rotate through a fixed set of weeks — each with its own written-out
  sets — and move the weight they are percentages of when the cycle comes round.
  The toolbox 5/3/1 is built from.
screen: workout-edit
code:
- lib/data/set_scheme.dart
- lib/data/progression.dart
- lib/data/database.dart
- lib/widgets/workout_items_editor.dart
test:
- test/feature_22_cycles_test.dart
where: >-
  <b>Blocks and rows</b> lib/data/set_scheme.dart (CycleBlocks, resolveSetTargets)
  · <b>The wrap</b> lib/data/progression.dart (stepCycle), applied by
  AppDatabase.advanceProgression · <b>Data</b> WorkoutItems.cycle_blocks /
  cycle_names / cycle_position · <b>Builder</b>
  lib/widgets/workout_items_editor.dart (_CycleEditor, _CustomSetRow)
groups:
- name: The cycle
  items:
  - id: a-slot-can-run-a-cycle
    t: A slot can rotate through a fixed set of weeks
    d: >-
      <b>Cycle</b> is the fifth set scheme, beside flat, back-off, ramp and
      custom. Instead of one written-out set of rows it holds several — a week
      each — and one session uses one of them. The week after the last is the
      first again. Everything a written-out row already says it says here too: a
      rep target and a percentage of the slot's weight, per set.
    defines:
    - template.cycle
    uses:
    - template.set-scheme
    - template.item
  - id: the-cycle-advances-on-the-slot-that-ran-it
    t: Each slot advances its own cycle, on the session that trained it
    d: >-
      where a slot has got to is stored on that slot, not on the routine, and it
      moves on when the workout holding it is finished. A four-day split where
      each lift comes round once a week keeps every lift on the same week without
      anything counting weeks; a lift you train twice a week runs its cycle twice
      as fast, which is what training it twice a week is. Skipping a day does not
      skip its week — the week is waiting the next time you train it.
    screen: session
    uses:
    - template.cycle
    - session.finish
  - id: the-wrap-is-what-moves-the-weight
    t: Coming round to the first week again is what moves the weight
    d: >-
      the percentages take care of the weeks; the weight they are of is what a
      cycle progresses. It moves once, on the session that closes the cycle: up
      by the slot's step if no session in the cycle came up short, down by its
      back-off if the number that did reaches the slot's miss threshold, and held
      where it is in between. Both counters then start again with the new cycle.
      A three-week block that adds 2.5 kg to the press and 5 kg to the squat is
      the step and the threshold, not a rule of its own.
    screen: none
    defines:
    - template.training-max
    uses:
    - template.cycle
    - progression.rates
    - progression.streak
  - id: the-progression-card-says-it-moves-the-training-max
    t: The Progression card says the rates move the training max
    d: >-
      the four numbers under Progression are the slot's, and on a cycle they mean something different from what they mean anywhere else: they move the training max, and only when the cycle comes round. So the sentence they are read back as says so — "adds 2.5&nbsp;kg to the training max at the end of a clean cycle; drops 5&nbsp;kg after 2 missed sessions in it". The clean-sessions threshold goes with it, because a cycle counts weeks rather than clean sessions and a stepper that changes nothing is worse than no stepper.
    screen: workout-edit
    uses:
    - template.cycle
    - template.training-max
    - progression.rates
    - progression.streak
  - id: what-a-cycle-is-sits-behind-an-i
    t: What a cycle is sits behind an (i) on the Cycle option itself
    d: >-
      the info tap rides on the Cycle pill rather than on the section label above it, and it is there whether or not the slot is on one — the question it answers is "what would I be picking", which is asked before the pick and not after. On the label it was a footnote about the picker as a whole, next to four other options it said nothing about; on the pill it is attached to the one thing it explains. It opens three sentences: the weeks run in order and wrap, the percentages are of the training max, and the training max is what moves, at the wrap. It names no particular program — a cycle is a shape, and 5/3/1 is one thing built from it rather than what it is for. It is the one option in this picker that is a way of training rather than a shape, so it is explained on the same terms the superset tick is — behind a tap, once, rather than as a paragraph under a control that everybody reads past for ever.
    screen: workout-edit
    uses:
    - template.cycle
    - template.training-max
    - template.set-scheme
  - id: a-cycle-weight-is-not-raised-by-what-you-lifted
    t: Loading the bar past the prescription does not move a cycle's weight
    d: >-
      on an ordinary weight slot, working above the suggestion is itself
      progression and the target follows the bar. On a cycle it cannot be: every
      set is a percentage of the slot's weight rather than the weight itself, so
      a heavy week would read as a target that had gone up and the next week's
      percentages would be taken from it. A cycle's weight moves at the wrap and
      nowhere else.
    screen: none
    uses:
    - template.cycle
    - template.training-max
    - session.exercise-weight
    - progression.verdict
  - id: the-week-is-on-screen
    t: The board says which week of the cycle you are on
    d: >-
      "Week 2/4" under the exercise, on the live board and on the day that
      offers it, because 3×3 at 80% and 3×5 at 75% are the same slot on different
      weeks and nothing else on the row says which. The goal beside it is listed
      set by set wherever the week's rows differ, since "3 × 5" would be a claim
      about two sets that is false of both. The sets are joined by a slash —
      "5/3/1+" — rather than by the middot that separates a slot's summary into
      fields: joined by that, a three-set week reads as three more fields.
    screen: session
    points:
    - workout-detail
    uses:
    - template.cycle
    - template.item
    - session.set-logging
  - id: a-week-of-a-cycle-can-be-named
    t: A week of a cycle can be called what it is
    d: >-
      "Week 4" says where in the order a week sits and nothing about what it asks for, which on a four-week block is most of the question: three of them are work and the fourth is a deload, and only the percentages say which. So a week takes a name of its own — Deload, Peak, Volume, Heavy Single — typed on the week's own card in the builder, capped at the length of a heading rather than a sentence. A week nobody has named is "Week 4", which is what every week was before this and what a cycle built by somebody who does not want to name anything stays.
    screen: workout-edit
    defines:
    - template.cycle-week-name
    uses:
    - template.cycle
  - id: a-named-week-is-named-everywhere-the-week-is-shown
    t: A named week is named everywhere the week is shown
    d: >-
      the live board and the day that offers it write the name where they wrote "Week" and keep the count beside it — "Deload 4/4" rather than "Week 4/4" — because the name says what the week is and the count says how much of the cycle is left, and neither answers the other. The builder's folded card heads itself with the name in place of "Week 4". Emptying the field puts "Week 4" back rather than leaving a blank heading.
    screen: session
    points:
    - workout-detail
    - workout-edit
    uses:
    - template.cycle-week-name
    - template.cycle
    - template.item
  - id: a-week-is-a-card-that-folds
    t: Each week is a card of its own, and it folds
    d: >-
      four weeks of four sets is sixteen rep steppers, sixteen percentages and sixteen headings in one scrolling column, and the question somebody is actually holding — how does this week differ from the one before it — cannot be answered in that. So each week is a bordered card with its set rows boxed inside it, and its heading is the tap that opens it. One week is open at a time. Folded, the heading reads the week back in a line — "5/5/5+ · 65/75/85%" — so nothing has to be opened to see what it asks for. The week the next session will run is the one open when the sheet arrives, and it keeps the accent border whether it is open or shut; a week you have just added opens, because you added it to edit it.
    screen: workout-edit
    uses:
    - template.cycle
    - template.per-set-reps
- name: What a written-out row can ask for
  items:
  - id: a-row-can-ask-for-a-range-or-for-as-many-as-you-have
    t: A written-out row takes a count, a range, or a minimum with no top
    d: >-
      5, or 8–12, or 5+. The third is the set 5/3/1 is named after — a minimum
      to beat and no ceiling — and it is per row rather than per slot, so one
      slot can hold two fixed sets and an open one. Rows belong to the custom
      scheme as much as to a cycle; both are written out a set at a time.
    defines:
    - template.per-set-reps
    uses:
    - template.set-scheme
    - template.rep-target
  - id: a-row-is-judged-against-its-own-floor
    t: A row is missed only below its own floor
    d: >-
      a range asks for its top and is not a miss anywhere inside itself: 8–12 is
      met at 9. A row with no top asks for its minimum, so beating it is not a
      different kind of success and falling under it is the only miss there is.
      A plain count is its own floor, which is what every set was before rows
      could hold a range.
    screen: session
    uses:
    - template.per-set-reps
    - session.set-logging
    - progression.verdict
- name: The training max
  items:
  - id: the-weight-field-says-training-max-on-a-cycle-slot
    t: On a cycle slot the weight field is a training max
    d: >-
      it is not a weight the session asks you to lift — every set is a
      percentage of it — so the builder's card is headed "Training max" instead
      of "Weight", and both the board and the slot's one-line summary in the
      exercise list name it "TM" where an ordinary slot writes "@" or nothing:
      "do 5/3/1+ at this" would be wrong about all three sets. Editing it moves
      the whole week at once, which is what adjusting a training max means.
    screen: workout-edit
    points:
    - session
    uses:
    - template.training-max
    - session.exercise-weight
- name: Behaviour & edge cases
  items:
  - id: an-upgraded-phone-changes-nothing
    t: An upgraded phone trains exactly what it trained before
    d: >-
      the two columns a cycle needs arrive empty on every slot already on a
      phone. No slot gains a scheme, no weight moves, and nothing anybody built
      trains differently — the builder has a fifth option in a picker, and an
      option nobody picked changes nothing.
    screen: none
    uses:
    - storage.schema
    - template.cycle
  - id: a-cycle-of-one-week-is-just-a-custom-scheme
    t: A cycle of one week is a custom scheme that steps every session
    d: >-
      nothing special-cases the count. One week wraps on every session, so the
      weight moves on every session and the rows never change — which is a
      written-out slot with ordinary progression, arrived at from the other
      direction. A cycle with no weeks in it at all trains as flat rather than as
      nothing.
    screen: none
    uses:
    - template.cycle
  - id: names-follow-the-week-they-were-typed-on
    t: Removing a week takes its name with it
    d: >-
      the names are held one per week rather than as a list beside the weeks, so
      deleting week two leaves week three called what week three was called
      instead of shifting every name up one. A cycle that gains a week gains an
      unnamed one.
    screen: workout-edit
    uses:
    - template.cycle-week-name
    - template.cycle
  - id: week-names-travel-with-a-shared-routine
    t: The names travel with a shared routine
    d: >-
      a code carries them in a trailing section of its own, written after the weeks it names and only when some week has a name, so a routine whose weeks are called Volume and Deload arrives called that. A build older than the section stops reading where it starts and gets the routine with its weeks unnamed — which is the same training, since a name is what a week is called rather than what it asks for.
    screen: none
    uses:
    - template.cycle-week-name
    - share.routine-code
  - id: an-upgraded-phone-has-no-week-names
    t: An upgraded phone finds its weeks unnamed
    d: >-
      the column arrives empty on every slot already on a phone, which is exactly
      what "nobody has named these" means: every week still reads "Week 3" and
      nothing trains differently.
    screen: none
    uses:
    - template.cycle-week-name
    - storage.schema
  - id: editing-the-weeks-does-not-restart-the-cycle
    t: Editing the weeks does not send the slot back to week one
    d: >-
      where the slot has got to is kept through a builder edit, the way the
      progression streaks are: fixing a typo in week three must not cost the two
      weeks already trained. A position past the end of a shortened cycle is read
      as the last week rather than as an error.
    screen: workout-edit
    uses:
    - template.cycle
    - progression.streak
- name: Where to find it
  items:
  - id: build-a-cycle
    t: Build a cycle
    d: >-
      Routines → a routine → a day → edit → tap a slot → Target → Advanced → Set
      scheme → Cycle. Add a week, then a row per set: reps and the percentage of
      the training max. The (i) on the Cycle option itself says what a cycle is,
      before you take it.
    screen: workout-edit
    uses:
    - template.cycle
  - id: name-a-week
    t: Name a week
    d: >-
      In the same editor, tap the pencil on a week's card → type a name → Save. It
      takes the place of "Week 3" on that card, on the live board and on the day
      that offers it. Saving it empty puts "Week 3" back.
    screen: workout-edit
    uses:
    - template.cycle-week-name
