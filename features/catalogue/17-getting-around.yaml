id: "17"
title: Getting around
tagline: >-
  Four persistent tabs, task screens above them, and explicit empty states.
screen: today
code:
- lib/router.dart
- lib/screens/home_shell.dart
- lib/widgets/common.dart
test:
- test/feature_17_getting_around_test.dart
where: >-
  <b>Routes</b> lib/router.dart · <b>Tab shell</b> lib/screens/home_shell.dart
  · <b>Empty states</b> today_screen.dart, history_screen.dart,
  routine_detail_screen.dart, exercise_progress_screen.dart
groups:
- name: What it does
  items:
  - id: app-four-tabs
    t: The app is four tabs
    d: >-
      Today, Routines, History, and Profile are persistent tab roots. Each tab
      retains its navigation state when another tab is selected.
    defines:
    - ui.navigation
  - id: every-other-screen-stacks-over-tabs
    t: A screen you browse to keeps the tabs; a screen you are finishing does not
    d: >-
      Routine, workout, exercise, library, and settings pages open inside the
      shell and retain the tab bar. The live session and single-purpose tasks
      (editors, set recording, scanning, import review, sharing, playback, and
      recap) stack above the shell; the session's rest bar occupies the tab-bar
      position. Browse a routine with the tabs; edit it above the shell.
    uses:
    - ui.navigation
    - session.resume-bar
  - id: one-type-scale-shared-widgets
    t: One type scale, and it lives in the shared widgets
    d: >-
      ScreenHeader and SectionLabel define the title, eyebrow, and small-caps
      heading sizes. Screens use these shared widgets instead of declaring
      local font sizes.
    defines:
    - theme.type-scale
  - id: empty-screen-says-so-in-line
    t: A screen with nothing on it yet says so in a line
    d: >-
      History before the first session, routines without workouts, exercises
      without chart data, and filters with no matches show an inline empty-state
      message where content would appear.
    screen: history
    defines:
    - ui.empty-state
- name: How to use it
  items:
  - id: move-between-tabs
    t: Move between tabs
    d: >-
      Use the bottom navigation bar. Tapping the selected tab returns to that
      tab's root.
    uses:
    - ui.navigation
- name: Behaviour & edge cases
  items:
  - id: empty-screen-offers-next-step-where-one
    t: An empty screen offers the next step only where there is one
    d: >-
      Today with no routines offers a ready-made program and a routine builder.
      History before the first session shows only its empty-state message.
    uses:
    - ui.empty-state
  - id: an-empty-screens-way-out-is-the-width-of-its-card
    t: Where there is a next step, it is the width of the card offering it
    d: >-
      The primary action fills the card width. The secondary routine-building
      action remains plain text below it, preserving one primary next step.
    screen: today
    uses:
    - ui.empty-state
    - theme.type-scale
  - id: tab-bar-belongs-shell-not-screens
    t: The navigation bar belongs to the shell, and the resume-workout bar rides above it
    d: >-
      Screens inside the shell neither draw nor reserve space for the tab bar;
      the shell measures its bottom slot and applies the inset. The resume bar
      occupies that slot above the tabs. Screens stacked above the shell own
      their bottom controls, and the resume bar is provided by the corresponding
      app-level slot.
    uses:
    - ui.navigation
    - session.resume-bar
    - ui.system-insets
  - id: link-opens-in-a-tab-that-has-the-screen
    t: A link opens in the tab you are in, or in one that has the screen
    d: >-
      A link stays in the current tab when that tab hosts the destination;
      otherwise it selects a tab that does. This also resolves links from
      screens stacked above the tabs, such as the plate inventory from a builder
      slot sheet. Legacy browse paths resolve through the same hosting rule.
    screen: workout-edit
    defines:
    - ui.tab-hosting
    uses:
    - ui.navigation
    - load.plate-rack
  - id: unknown-location-has-a-way-back
    t: A location the app has no screen for has a way back
    d: >-
      The not-found page links to Today, the first tab.
    uses:
    - ui.navigation
    - ui.tab-hosting
  - id: system-bars-never-cover-a-control
    t: The phone's own bars never cover a control
    d: >-
      Screens, sheets, and dialogs inset controls for Android gesture or system
      navigation bars. The keyboard uses the same bottom inset while visible;
      the insets are not applied twice.
    screen: workout-edit
    defines:
    - ui.system-insets
