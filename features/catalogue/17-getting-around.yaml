id: "17"
title: Getting around
tagline: >-
  Four tabs at the bottom, every other screen stacked over them, and one plain
  line on a screen that has nothing on it yet.
screen: today
code:
- lib/router.dart
- lib/screens/home_shell.dart
- lib/widgets/common.dart
test:
- test/feature_17_getting_around_test.dart
where: >-
  <b>Routes</b> lib/router.dart · <b>Tab shell</b> lib/screens/home_shell.dart
  · <b>Empty states</b> today_screen.dart, history_screen.dart,
  routine_detail_screen.dart, exercise_progress_screen.dart
groups:
- name: What it does
  items:
  - id: app-four-tabs
    t: The app is four tabs
    d: >-
      Today, Routines, History and Profile. Each keeps its place while you are
      on the others, so a scrolled list is where you left it when you come back.
    defines:
    - ui.navigation
  - id: every-other-screen-stacks-over-tabs
    t: A screen you browse to keeps the tabs; a screen you are finishing does not
    d: >-
      a routine, a workout, an exercise, the library and the settings pages open
      inside the shell and keep the navigation bar, so leaving for another tab is
      one tap rather than walking back up the stack first — and the tab you left
      is still where you left it. Two kinds of screen stack over the shell
      instead. The live session is one: it owns the whole screen, and its rest
      bar docks where the tabs would be. The other is a screen that is a single
      task to finish or abandon — every editor, filming a set, the scanner, an
      import waiting to be reviewed, sharing, clip playback, the recap — where a
      stray tab tap would walk out of the task and leave it half done. Reading a
      routine keeps the tabs; editing one does not.
    uses:
    - ui.navigation
    - session.resume-bar
  - id: one-type-scale-shared-widgets
    t: One type scale, and it lives in the shared widgets
    d: >-
      a screen title, the eyebrow above it and a small-caps section heading are
      three obviously different sizes rather than three sizes within two points
      of each other, so the hierarchy on a screen reads before any of the words
      do. The sizes belong to ScreenHeader and SectionLabel; a screen that wants
      a heading uses the widget and inherits them rather than retyping a
      fontSize.
    defines:
    - theme.type-scale
  - id: empty-screen-says-so-in-line
    t: A screen with nothing on it yet says so in a line
    d: >-
      History before the first session, a routine with no workouts, an exercise with
      nothing to chart, a filter that matches nothing — each says what is missing
      where the content would be, rather than showing an empty frame.
    screen: history
    defines:
    - ui.empty-state
- name: How to use it
  items:
  - id: move-between-tabs
    t: Move between tabs
    d: >-
      the bar at the bottom. Tapping the tab you are already on re-enters it at
      its root.
    uses:
    - ui.navigation
- name: Behaviour & edge cases
  items:
  - id: empty-screen-offers-next-step-where-one
    t: An empty screen offers the next step only where there is one
    d: >-
      Today with no routines offers a ready-made program and, under it, building your own — that is the whole of what to do next. History before the first session has nothing to offer but the sentence, and does not invent a button.
    uses:
    - ui.empty-state
  - id: an-empty-screens-way-out-is-the-width-of-its-card
    t: Where there is a next step, it is the width of the card offering it
    d: >-
      the button runs the full width rather than shrink-wrapping its label. A card that fills the screen with a small pill floating in the middle of it reads as a caption with a link in it, not as the one thing to do — and on a fresh install this is the one thing to do, since nothing else on Today is reachable until a routine exists. The second way out stays plain text beneath it, because two buttons of equal weight is a choice rather than a next step.
    screen: today
    uses:
    - ui.empty-state
    - theme.type-scale
  - id: tab-bar-belongs-shell-not-screens
    t: The navigation bar belongs to the shell, and the resume-workout bar rides above it
    d: >-
      a screen inside the shell draws neither and reserves room for neither — the
      shell measures whatever sits in that bottom slot and insets it by that,
      which is what lets the resume bar sit above the tabs during a live session.
      A screen with its own bottom furniture, like a workout's Start button, sits
      above the tabs rather than under them, and the resume bar shows in exactly
      one place: the shell's slot for screens inside it, the app-level slot for
      the ones that stack over.
    uses:
    - ui.navigation
    - session.resume-bar
    - ui.system-insets
  - id: system-bars-never-cover-a-control
    t: The phone's own bars never cover a control
    d: >-
      most Android phones draw a gesture bar or a row of Back / Home / Recents
      keys over the bottom of the screen. Every surface the app puts a control
      on — screens, the sheets that open over them, dialogs — leaves room for
      it, so the button at the foot of a sheet stays tappable rather than
      sitting half under the Back key. A keyboard takes the same room while it
      is up, and the two are never counted twice.
    screen: workout-edit
    defines:
    - ui.system-insets
