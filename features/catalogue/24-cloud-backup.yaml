id: "24"
title: Optional cloud backup
tagline: Save and restore training data through an email sign-in on the web.
screen: cloud
code: [lib/screens/cloud_screen.dart, lib/services/cloud_client_web.dart, lib/data/cloud_snapshot.dart, server/api.js]
test: [test/feature_24_cloud_backup_test.dart, server/test/cloud.test.mjs]
groups:
- name: Sign-in
  items:
  - id: cloud-backup-is-opt-in
    t: Cloud backup is optional and opened from Profile in the browser
    d: Training stays local. Opening Cloud backup checks availability and sign-in; saving and restoring require a separate explicit action. Videos and unfinished sessions are never uploaded. Native apps keep their existing local backup workflow.
    defines: [cloud.backup]
    uses: [platform.web, privacy.offline, storage.schema, video.storage, session.live-state]
  - id: email-link-sign-in
    t: Email sign-in uses a short-lived single-use link
    d: The email link expires after 15 minutes and works only in the browser that requested it. Opening the landing page does not consume it; the user presses Continue to sign in. Tokens contain 256 random bits and only their hashes are stored. Links are kept out of request URLs and referrers. Requests are rate-limited by email and IP; responses do not reveal account existence. Email delivery must be configured before sign-in is enabled.
    defines: [cloud.auth]
    uses: [cloud.backup]
  - id: sessions-stay-in-secure-cookies
    t: Sign-in uses a secure session cookie
    d: A 30-day server session uses an HttpOnly, Secure, SameSite cookie, never browser localStorage. State-changing requests must come from the app's own origin. Sign out revokes the session. Account deletion removes the backup, outstanding links, and all sessions.
    uses: [cloud.auth, cloud.backup]
- name: Saving and restoring
  items:
  - id: one-versioned-server-backup
    t: Save keeps a versioned backup on the server
    d: A backup contains the local routines, exercise library, settings, themes, bars, and completed history. A revision precondition prevents one device from silently overwriting a backup changed by another device. The free-tier-friendly limit is 1 MB per backup; larger saves are refused without changing either copy.
    uses: [cloud.backup, cloud.auth, storage.schema, history.session-record]
  - id: restore-validates-before-replacing
    t: Restore validates before replacing local data
    d: Restore asks for confirmation, refuses incompatible schema versions and malformed data, and replaces local rows atomically. A failure rolls back all local changes. Restore is unavailable during a live workout. No background merge or automatic overwriting occurs.
    uses: [cloud.backup, storage.schema, storage.migration, session.live-state]
