id: "07"
title: Plate math
tagline: >-
  Calculates per-side plates for barbell lifts from the configured rack.
screen: session
code:
- lib/data/plates.dart
- lib/widgets/plate_line.dart
- lib/screens/bar_settings_screen.dart
- lib/screens/plate_inventory_screen.dart
test:
- test/feature_07_plate_math_test.dart
where: >-
  <b>Solver</b> lib/data/plates.dart (solvePlates → PlateSolution) · <b>The line</b>
  lib/widgets/plate_line.dart · <b>Bars and rack</b> Bars + PlateInventory in
  lib/data/database.dart, on lib/screens/bar_settings_screen.dart,
  plate_inventory_screen.dart
groups:
- name: What it does
  items:
  - id: solves-plate-breakdown-target-weight
    t: Solves the plate breakdown for a target weight
    d: Returns the per-side plates, resulting total, and whether it matches the target.
    defines:
    - load.plate-solver
  - id: shows-line-under-exercise
    t: Shows it as a line under an exercise
    d: >-
      Displays values such as 30 kg/side · 25 + 5 · bar 20 kg and re-solves on
      input. The line appears for barbell exercises in a live session and labels
      every value, including the bar, with its unit.
    uses:
    - load.plate-solver
    - load.units
    - exercise.weight-type
  - id: bars-are-list-you-keep
    t: The bars are a list you keep, one per unit
    d: >-
      Profile → Exercise settings → Default bar opens the per-unit bar list. Six
      standard bars are fixed; custom bars can be added, renamed, reweighed, or
      deleted. Deleting a bar returns its exercises to the default; deleting the
      default returns it to the unit's standard bar.
    screen: bar-settings
    defines:
    - load.bar-weight
    uses:
    - load.units
    - share.routine-code
  - id: uses-bar-exercise-rack-you
    t: Uses the bar for the exercise and the rack you own
    d: Resolves to the exercise bar, app-wide default, or unit standard bar.
    uses:
    - load.bar-weight
    - load.plate-rack
- name: How to use it
  items:
  - id: edit-rack
    t: Edit the rack
    d: Profile → Exercise settings → Plates; adjust each plate pair count.
    screen: plate-inventory
    uses:
    - load.plate-rack
- name: Behaviour & edge cases
  items:
  - id: search-exhaustive-not-greedy
    t: The search is exhaustive, not greedy
    d: Considers all combinations because racks may contain non-divisible sizes such as 45/35/25 lb or a single 1.25 kg plate.
    uses:
    - load.plate-solver
  - id: nothing-snapped
    t: Nothing is snapped, but the bar is a floor
    d: >-
      Unbuildable targets remain editable; the line shows the nearest buildable
      load in gold and the requested target in green. Values below the bar are
      rejected in the board, builder, progression, and layoff paths. Legacy
      belowBar values remain representable until a bar is assigned.
    uses:
    - load.plate-solver
    - load.bar-weight
    - session.exercise-weight
    - progression.rates
    - progression.layoff-rules
  - id: ties-break-way-lifter-loads
    t: Ties break the way a lifter loads a bar
    d: >-
      Tie-breaking minimizes plate count, then prefers heavier plates (40 kg/side
      becomes 25 + 15).
    uses:
    - load.plate-solver
  - id: rack-pairs
    t: The rack is pairs
    d: >-
      Plates are stored and loaded in pairs; an odd count is ignored. The default
      rack has one pair of each size plus extra 45 lb or 20 kg plates.
    screen: plate-inventory
    defines:
    - load.plate-rack
  - id: one-rack-per-unit
    t: One rack per unit
    d: Each unit stores a rack of plate sizes; the standard rack is used until edited.
    screen: plate-inventory
    uses:
    - load.plate-rack
    - load.units
  - id: warmup-rungs-say-per-side
    t: A warm-up rung on a bar says what goes on each side
    d: >-
      Each barbell warm-up rung shows its own per-side value (for example,
      “30/side”). The empty bar has no plate label; approximate builds use “≈”.
      Non-barbell ramps have no plate label.
    uses:
    - session.warmup-ramp
    - load.plate-solver
    - exercise.weight-type
  - id: only-bar-gets-line
    t: Only a bar gets a line
    d: Machines and dumbbells display their entered load without plate math.
    uses:
    - exercise.weight-type
    - load.plate-solver
