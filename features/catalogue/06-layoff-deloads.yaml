id: "06"
title: Layoff deloads
tagline: >-
  After a long break, offers a lighter workout start after confirmation.
screen: workout-detail
code:
- lib/data/layoff.dart
- lib/screens/workout_detail_screen.dart
- lib/screens/exercise_settings_screen.dart
test:
- test/feature_06_layoff_deloads_test.dart
where: >-
  <b>Pure rules</b> lib/data/layoff.dart (layoffDeload / deloadedTarget) · <b>Applied
  by</b> applyLayoffDeload(...) · <b>Offered on Start</b> lib/screens/workout_detail_screen.dart
  · <b>Settings</b> lib/screens/exercise_settings_screen.dart
groups:
- name: What it does
  items:
  - id: watches-gap-since-workout-was
    t: Watches the gap since a workout was last trained
    d: The gap is tracked per workout, not per routine.
    screen: none
    defines:
    - progression.layoff-rules
    uses:
    - history.session-record
    - template.workout
  - id: offers-back-off-before-session
    t: Offers a back-off before the session starts
    d: >-
      Complete periods of inactivity each apply a configured percentage up to a
      cap. Starting an overdue workout prompts to accept the deload or retain the
      previous weights.
    defines:
    - progression.layoff-offer
    uses:
    - session.start
  - id: cut-lands-somewhere-trainable
    t: The cut lands somewhere trainable
    d: >-
      Rounds to the 0.5-unit grid and clamps to the mode floor and the exercise's
      bar weight. The session displays the reason for the reduced target.
    uses:
    - load.loadable-grid
    - load.units
    - load.bar-weight
    - exercise.weight-type
- name: How to use it
  items:
  - id: set-rules
    t: The rules are app-wide, and set in Settings
    d: >-
      Profile → Exercise settings → configure the inactivity threshold and percent
      per period. These settings apply app-wide, not per slot.
    screen: settings
    uses:
    - progression.layoff-rules
    - storage.settings
- name: Behaviour & edge cases
  items:
  - id: nothing-applied-without-asking
    t: Nothing is applied without asking
    d: >-
      Accepting updates the template and starts the first set at the reduced
      weight. A notice remains visible throughout the session.
    uses:
    - progression.layoff-offer
    - session.start
    - template.item
  - id: declining-not-recorded
    t: Declining is not recorded
    d: Training the workout resets its inactivity gap; declining does not record a separate decision.
    uses:
    - progression.layoff-offer
  - id: deload-clears-both-progression-streaks
    t: A deload clears both progression streaks
    d: A deload breaks both progression success and failure streaks.
    screen: none
    uses:
    - progression.streak
