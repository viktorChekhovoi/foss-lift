id: "14"
title: Sharing a routine
tagline: >-
  A whole program — days, slots, rep schemes, progression rates and the custom
  exercises it depends on — as one line of text you can paste into a message.
screen: routine-share
code:
- lib/data/routine_code.dart
- lib/data/share_code.dart
- lib/util/qr_capacity.dart
- lib/data/routine_import.dart
- lib/screens/routine_share_screen.dart
- lib/screens/routine_import_screen.dart
- lib/screens/scan_screen.dart
- lib/services/deep_links.dart
- android/app/src/main/AndroidManifest.xml
test:
- test/feature_14_routine_sharing_test.dart
where: >-
  <b>Wire format</b> lib/data/routine_code.dart (FLR2 out, FLR1 and FLR2 in) on lib/data/share_code.dart
  · <b>QR capacity</b> lib/util/qr_capacity.dart · <b>Landing an import</b> lib/data/routine_import.dart
  + AppDatabase.importSharedRoutine · <b>Screens</b> routine_share_screen.dart,
  routine_import_screen.dart, scan_screen.dart · <b>Links</b> lib/services/deep_links.dart
  + AndroidManifest.xml
groups:
- name: What it does
  items:
  - id: export-any-routine-becomes-routine
    t: Export — any routine becomes a routine code
    d: >-
      a versioned, compressed, base64 line beginning FLR2. It carries the routine's
      name, colour, default rest, training days and description; every workout in order; every
      exercise slot's prescription — sets, reps, rest, the set scheme and its
      percentages, progression axis, step and back-off rates, thresholds — and a
      definition of every exercise the routine references. Not the weights: see
      below. A scheme travels as its shape rather than as its numbers, which is
      what lets it arrive already snapped to the receiving phone's unit.
    defines:
    - share.routine-code
    uses:
    - template.set-scheme
  - id: two-ways-out-qr-or
    t: Two ways out — a QR to scan, or the code itself
    d: >-
      Routines → open a routine → the share icon → Show QR or Send code. The share
      sheet sends the bare FLR2 line, because a chat app will not make a
      fosslift:// link tappable and an unclickable link is worse than a string
      nobody expected to click. The QR still holds the link, so a phone's own
      camera opens the import screen without knowing this app has a scanner.
      Nothing is uploaded, and the share sheet is where "copy" lives — no separate
      copy button, no file to save.
    defines:
    - share.qr
    - share.deep-link
  - id: import-scanned-qr-tapped-link
    t: Import — a scanned QR, a tapped link or a pasted code
    d: >-
      Routines → + → Import a routine → Scan QR or Paste
      code; a fosslift://routine/… link tapped anywhere on the phone opens the same
      screen. All three land on a confirmation screen, and nothing is written until
      you accept it.
    screen: routine-import
    defines:
    - share.import-review
    uses:
    - ui.routine-add-menu
  - id: custom-exercises-travel-routine
    t: Custom exercises travel with the routine
    d: >-
      the name, every muscle group it trains and every one it assists, equipment,
      weight type and bar — plus a video link, if there is a video behind it. The
      recipient does not need them beforehand.
    uses:
    - share.routine-code
    - exercise.identity
    - exercise.taxonomy
    - exercise.muscle-map
    - exercise.weight-type
    - exercise.video-url
    - load.bar-weight
  - id: flr2-carries-whole-muscle-map
    t: FLR2 carries the whole muscle map, and FLR1 codes still open
    d: >-
      a movement's groups stopped being one byte the moment a movement could name
      several, so the format that could only hold one is closed and a new one
      written beside it. Codes go out as FLR2. Both are read: an FLR1 code — the
      one in a chat message from last month, the one printed on a gym wall —
      arrives with each exercise carrying the single group it was written with as
      its only primary, which is exactly what it meant. What does not work is the
      other direction: a phone still on the shipped build cannot open an FLR2
      code, and says so plainly rather than importing a mangled routine. That is
      also what lets FLR2 still grow in the middle rather than only on the end —
      a field added to the routine header breaks no code anybody is holding,
      because no build in the wild reads this tag at all.
    uses:
    - share.routine-code
    - exercise.muscle-map
  - id: supersets-travel-on-the-end-of-the-code
    t: A shared routine carries its supersets, and older builds ignore them
    d: >-
      the joins ride in a section appended after the training days rather than
      inside a slot, so the tag stays FLR2 and a build that has never heard of a
      superset stops where it always stopped and skips what follows. Sent to the
      shipped build, the routine arrives as the same exercises in the same order,
      listed one after another; sent to this one, it arrives grouped. A code from a
      routine with no supersets in it is not one byte longer than before.
    uses:
    - share.routine-code
    - template.superset
  - id: range-climb-travels-on-the-end-of-the-code
    t: A shared routine carries which slots take reps and weight in turn, and at what rates
    d: >-
      the ticks ride in their own appended section, behind the supersets, for the
      same reason those do: a new bit inside a slot would leave the shipped build
      parsing a tick as the next slot's exercise. The rep step and rep back-off
      those slots advance by ride in a section of their own behind that, on the
      same terms and for the same reason, and only for the slots that use them.
      An older build imports the routine with the box unticked on every slot,
      which is a program that adds weight a session sooner rather than a corrupt
      one. Where the sender's program had got to inside its range does not travel
      at all: a shared routine is a program, not somebody's progress through one,
      so every imported slot starts at the bottom of its range. A routine where
      nothing takes the two axes in turn costs no bytes at all — neither section
      is written when there is nothing to carry.
    uses:
    - share.routine-code
    - progression.double
  - id: cycles-travel-on-the-end-of-the-code
    t: A shared routine carries its cycles, and older builds get the first week
    d: >-
      the weeks ride in a section of their own behind the rep rates, on the terms
      every trailing section is on. Inside the slot itself the cycle is written
      as the plain custom scheme its first week already is, so a build that stops
      before the section imports a working program — the same exercises, the same
      sets, the opening week's reps and percentages — rather than a slot with no
      scheme at all. Where the sender had got to in the cycle does not travel:
      an imported copy opens on week one, for the reason a rep goal does not
      travel either.
    uses:
    - share.routine-code
    - template.cycle
    - template.per-set-reps
  - id: description-travels-with-the-routine
    t: A routine's description travels with it
    d: >-
      it rides in the routine header, right behind the training days, so an imported program arrives explaining itself rather than as a name and a list of days. A routine nobody has described pays nothing for the field: a spare bit in the flag byte the envelope already carries says whether there is one, so such a code is the same bytes it was before descriptions existed. It lands as the sender's own words: an import is nobody's copy of a library program, so the paragraph is shown as it was written, the way a name somebody invented is. Capped at 700 bytes on the wire — well past the 300 characters the app enforces, so a legal description never loses its tail here first, and bounded all the same, so a hostile code cannot claim a megabyte of paragraph.
    uses:
    - share.routine-code
    - template.description
    - ui.seeded-name
  - id: name-clash-your-call
    t: A name clash is your call
    d: >-
      the confirmation screen lists every exercise that will be added, and every one
      whose name you already use. Where an incoming exercise has the same name as
      one already in the library and its definition differs, it carries a Replace
      switch: keeping yours is the default.
    screen: routine-import
    uses:
    - share.import-review
  - id: import-preview-names-in-app-language
    t: The confirmation screen names exercises in the app's language
    d: >-
      a code carries the canonical English name, and the preview resolves it the
      way every other screen does, so a starter movement is listed translated
      rather than reading "Bench Press" on the confirmation and "Жим лежачи" the
      moment it lands. A name the sender invented has no translation and is shown
      as they wrote it.
    screen: routine-import
    uses:
    - share.import-review
    - ui.seeded-name
    - ui.language
- name: Behaviour & edge cases
  items:
  - id: code-whole-routine
    t: The code is the whole routine
    d: >-
      no server, no id to look up, nothing to expire. A code shared in 2026 still
      imports in 2030.
    screen: none
    uses:
    - share.routine-code
    - template.item
  - id: there-nothing-wordy-left-carry
    t: There is nothing wordy left to carry
    d: >-
      an exercise used to hold a coaching cue, the largest thing in a routine
      code; removing it took a custom exercise from about 55 characters on the
      wire to a handful.
    screen: none
    uses:
    - share.routine-code
    - exercise.taxonomy
  - id: video-link-travels-id
    t: A video link travels as its id
    d: >-
      any YouTube URL is reduced to its eleven-character id and rebuilt as https://youtu.be/&lt;id&gt;
      at the other end. A link with no video behind it does not travel at all
      — a search URL spends ninety characters to say nothing.
    screen: none
    uses:
    - share.routine-code
    - exercise.video-url
  - id: names-capped-200-utf-8
    t: Names are capped at 200 UTF-8 bytes on the wire
    d: >-
      generous next to the 80 the app enforces, so a legal name never loses characters
      here first — and bounded, so a corrupt code cannot claim a megabyte of routine
      name. A longer one is cut rather than refused.
    screen: none
    uses:
    - share.routine-code
  - id: defaults-not-transmitted
    t: Defaults are not transmitted
    d: >-
      a slot only spends bytes on fields that differ from the app's defaults,
      and increment/deload defaults are read per progression mode. A default
      that was never sent is filled in from the *receiving* phone's unit, so a
      routine written in a metric gym still steps by 5 lb in a pounds one. The
      PPL demo routine encodes to 421 characters.
    screen: none
    uses:
    - share.routine-code
    - template.item
    - load.unit-defaults
  - id: imported-rates-land-on-a-tidy-grid
    t: An imported step-up or back-off lands on a number somebody would type
    d: >-
      the wire format carries a rate as hundredths of a kilogram, so a rate set in
      pounds arrives a hundredth of a kilogram off what it was — a 2.5 lb step comes
      back as 2.49 lb. A decoded weight rate is put on the receiving phone's fine
      grid, measured in that phone's own unit, which is the same grid a percentage
      lands on and is coarse enough to absorb an error that size several times over.
      Rep and hold rates carry no unit and are untouched, and a rate that was never
      sent still takes the unit default rather than being rounded to one.
    screen: none
    uses:
    - share.routine-code
    - load.unit-defaults
    - load.fine-grid
    - progression.rates
  - id: qr-offered-whenever-one-can
    t: A QR is offered whenever one can hold the routine
    d: >-
      the ceiling is the standard's: 2,331 bytes at medium error correction, 2,953
      at low. A routine that outgrows medium is painted at low rather than refused;
      past 2,953 the QR is withheld with an explanation rather than rendered as
      an unscannable smudge.
    uses:
    - share.qr
  - id: symbol-drawn-large-screen-allows
    t: The symbol is drawn as large as the screen allows
    d: >-
      density is the real limit on scanning a screen with a camera. It measures
      the screen and not its parent, and pins the result with a fixed box — which
      is how Show QR came to dim the screen and paint nothing at all.
    uses:
    - share.qr
  - id: paste-box-owns-own-field
    t: The paste box owns its own field
    d: >-
      showDialog's future completes when the route is popped, which is the start
      of the dismissal and not the end of it, so disposing at the await left the
      field using a dead controller for the length of the fade.
    screen: routine-import
    uses:
    - share.import-review
  - id: one-scanner-everything-shareable
    t: One scanner serves everything shareable
    d: >-
      the same camera screen reads a routine QR and a theme QR, and what it was
      opened to look for decides where it hands off — and what it ignores: a café's
      Wi-Fi QR, or a theme code held up while importing a routine, does nothing at
      all rather than pulling you onto an import screen, and frames that decode to
      nothing are dropped as they arrive. Nothing is taken on there either: a scan
      replaces itself with the confirmation, which is the only place anything shared
      is ever adopted.
    screen: scan
    uses:
    - share.qr
    - share.deep-link
    - share.import-review
    - share.theme-code
    - ui.navigation
  - id: refused-camera-says-what-instead
    t: A refused camera says what to do instead
    d: >-
      that the camera is needed to scan, and that a code can be pasted instead;
      a device with no camera says that much. Either way the screen keeps a way
      back rather than sitting on a dead preview.
    screen: scan
    manual: true
    uses:
    - share.import-review
    - share.qr
    - platform.android
    - platform.permissions
  - id: every-host-app-shares-needs
    t: Every host the app can be handed needs an Android intent filter
    d: >-
      or the link is inert outside the app however well the routing handles it. The
      app no longer builds links, but it still reads one that arrives — from a QR,
      or from a code someone sent before. A test reads the manifest and checks each
      host is listed.
    screen: system
    uses:
    - share.deep-link
    - platform.android
  - id: progress-does-not-travel
    t: Neither progress nor weights travel
    d: >-
      the success/failure streaks, the sender's reminder time and every suggested
      weight are left behind — someone else's working load is the one number in a
      program that is certainly wrong for you. The importing phone fills each slot
      in itself: the weight it last logged for that movement, or nothing at all
      when it has never trained it, exactly as a slot you add by hand starts
      empty. Everything else — the whole prescription, including the
      training-day schedule — comes across.
    screen: none
    uses:
    - share.routine-code
    - progression.streak
    - template.item
    - platform.reminders
    - history.session-record
  - id: built-exercises-travel-name
    t: Built-in exercises travel by name and arrive as built-ins
    d: >-
      the starter library is on both phones, matched on seed key first and on the
      name, case-insensitively, second. The receiving phone re-derives the key
      from the canonical English name the code carries, so a starter movement the
      recipient happens not to have is inserted as one — keyed, not custom — and
      reads in the app's language from then on instead of staying English forever.
      A movement of the sender's own has no key and arrives as a custom exercise
      named the way they named it, in whatever language they named it in.
    screen: none
    uses:
    - share.routine-code
    - exercise.seed
    - ui.seeded-name
  - id: your-own-notes-never-travel
    t: Your own notes never travel, and are never overwritten
    d: >-
      including under Replace, which rewrites everything else about the exercise.
    screen: none
    uses:
    - share.routine-code
    - exercise.notes
  - id: exercise-already-exists-reused-never
    t: An exercise that already exists is reused, never duplicated
    d: >-
      importing the same routine twice gives you two routines and one copy of
      each exercise.
    screen: routine-import
    uses:
    - share.import-review
    - exercise.identity
  - id: replacing-edits-place
    t: Replacing edits in place, and never renames a starter movement
    d: >-
      it rewrites the existing exercise's definition and keeps its id, so its
      logged history and every other routine pointing at it survive. What a
      starter movement is called is not part of that: its name and seed key are
      left alone, because the name is the shared vocabulary a routine code is
      written in — the same reason it cannot be edited by hand. How it is loaded
      — the muscle groups, the equipment, the weight type, the bar — is the
      sender's to describe, and is written.
    screen: routine-import
    uses:
    - share.import-review
    - exercise.identity
    - exercise.seed
    - ui.seeded-name
  - id: import-always-creates-new-routine
    t: An import always creates a new routine
    d: >-
      nothing existing is overwritten, and the new routine does not take over
      Today.
    screen: routine-import
    uses:
    - share.import-review
    - template.routine
    - template.active-routine
  - id: code-will-not-read-dead
    t: A code that will not read is a dead end
    d: >-
      the two failures — not a routine code at all, or damaged in transit — each
      say which, and neither offers a partial import.
    screen: routine-import
    uses:
    - share.import-review
    - share.routine-code
