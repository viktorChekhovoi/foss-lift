id: "19"
title: The browser build
tagline: >-
  The Flutter app runs in a browser with its database stored by that browser.
screen: none
code:
- lib/data/db_open.dart
- lib/data/db_open_native.dart
- lib/data/db_open_web.dart
- lib/util/capabilities.dart
- lib/util/leave_guard.dart
- lib/state/unsaved_work.dart
- lib/services/storage_health.dart
- lib/services/tab_awake.dart
- lib/widgets/storage_warning.dart
- lib/widgets/common.dart
- web/index.html
test:
- test/feature_19_web_build_test.dart
- test/feature_19_web_leave_and_storage_test.dart
where: >-
  <b>Opener</b> lib/data/db_open.dart, chosen at compile time between
  db_open_native.dart and db_open_web.dart · <b>What this build can do</b>
  lib/util/capabilities.dart · <b>Unfinished work, and the browser's question
  over it</b> lib/state/unsaved_work.dart and lib/util/leave_guard.dart ·
  <b>Whether the browser will keep the database</b>
  lib/services/storage_health.dart · <b>Keeping the tab's clocks running</b>
  lib/services/tab_awake.dart · <b>Dialogs, and the keyboard they raise</b>
  lib/widgets/common.dart · <b>Page and assets</b> web/ ·
  <b>How to build and where to host it</b> docs/web-build.md
groups:
- name: What it does
  items:
  - id: runs-in-browser-same-code
    t: Runs in a browser from the same code
    d: >-
      The Android and web builds use one Flutter codebase and the same widgets,
      including the routine builder, live board, plate calculations, and charts.
    defines:
    - platform.web
  - id: browser-holds-database
    t: The browser holds the database
    d: >-
      SQLite is compiled to WebAssembly and stored in the browser's origin-private
      file system or IndexedDB. The schema and Drift queries match the phone
      build; only the storage backend differs. Data is not uploaded and is scoped
      to that browser and machine.
    defines:
    - storage.database-location
    uses:
    - storage.schema
    - privacy.offline
  - id: first-run-seeds-in-browser
    t: A fresh browser gets the starter library
    d: >-
      An empty web database receives the same first-run seed as an install: 133
      movements, racked bars, an empty routine list, and the ready-made program
      library.
    uses:
    - storage.schema
    - exercise.seed
    - template.starter-library
  - id: web-build-serves-itself
    t: The page serves everything it needs from its own origin
    d: >-
      The engine, fonts, SQLite WebAssembly module, and Drift worker are served
      from the app's origin. The running app fetches no CDN resources and works
      offline after it loads.
    uses:
    - privacy.offline
    - platform.web
- name: Behaviour & edge cases
  items:
  - id: capabilities-absent-not-broken
    t: What a browser cannot do is absent, not broken
    d: >-
      Controls that require phone capabilities are hidden on the web. Screens
      query a central capability model shared with Android-only services.
    uses:
    - platform.web
    - platform.portability
  - id: no-reminders-on-web
    t: A routine cannot ask to be reminded on the web
    d: >-
      Browsers cannot schedule the local notification used for reminders. The
      weekday schedule remains editable and is included in share codes; reminder
      time is unavailable.
    screen: routine-edit
    uses:
    - platform.reminders
    - platform.web
  - id: no-set-videos-on-web
    t: Set videos are not offered on the web
    d: >-
      The browser build has no supported set-video storage, so camera controls,
      clip playback, and video settings are hidden. History and progression do
      not depend on clips.
    screen: session
    uses:
    - video.capture
    - video.storage
    - video.playback
    - platform.web
  - id: no-scanning-on-web
    t: A code is pasted on the web, not scanned
    d: >-
      The scanner plugin cannot provide camera frames on the web, so scanning is
      hidden. QR display and code pasting remain available; routine import opens
      the paste field directly.
    screen: routine-import
    uses:
    - share.qr
    - platform.web
    - ui.routine-add-menu
  - id: no-shade-on-web
    t: The live workout does not leave the tab
    d: >-
      The web build has no ongoing notification or external completion control,
      and cannot play a rest sound while its tab is backgrounded. The in-memory
      session remains available, and the rest timer resumes with its current
      state.
    screen: session
    uses:
    - platform.web
    - session.shade
    - session.rest-timer
  - id: workout-keeps-the-tab-awake
    t: A running workout keeps the tab from being slowed down
    d: >-
      Browsers throttle timers in hidden tabs. While a workout runs, the app
      plays an inaudible tone to keep the tab active; it stops on Finish or
      discard and is not held between workouts.
    defines:
    - platform.tab-awake
    uses:
    - platform.web
    - session.live-state
    - session.rest-timer
  - id: keeping-awake-shows-in-the-tab
    t: The browser will say the page is playing something
    d: >-
      The browser marks the tab as playing audio for the workout duration. Muting
      the tab also mutes the rest tone because both use the same audio output.
    uses:
    - platform.tab-awake
    - session.rest-sound
  - id: keeping-awake-does-not-work-everywhere
    t: It does not work on an iPhone, and nothing pretends it does
    d: >-
      Safari stops page audio when the page leaves the foreground, so the tab
      cannot be kept awake there. The app does not expose that capability on
      iPhone; timers resume with the correct elapsed time.
    uses:
    - platform.tab-awake
    - platform.portability
    - platform.web
  - id: rest-tone-sounds-in-the-open-tab
    t: A rest still sounds when the tab is the one you are looking at
    d: >-
      The rest-end tone plays when the web tab is foregrounded and has received
      user interaction. It is silent while the tab is backgrounded.
    screen: session
    uses:
    - session.rest-sound
    - session.rest-timer
    - platform.web
  - id: share-codes-work-everywhere
    t: A routine code made in a browser opens on a phone
    d: >-
      Both builds use the same routine-code compression and wire format, so
      `FLR2` has the same meaning on web and phone.
    screen: routine-share
    uses:
    - share.routine-code
    - platform.web
  - id: browser-storage-can-be-cleared
    t: Clearing site data clears the workout log
    d: >-
      The database is origin-scoped browser storage. Clearing cookies or site
      data deletes the log, and a private window starts empty on each use.
    uses:
    - storage.database-location
    - storage.durability
    - privacy.offline
    - history.session-record
- name: Not losing the work
  items:
  - id: leaving-mid-workout-asks-first
    t: Closing the tab mid-workout asks first
    d: >-
      The live session is written only on Finish, so reload would discard sets
      logged since it began. While it runs, the browser leave guard asks whether
      to stay. Finish or discard clears the guard.
    screen: system
    defines:
    - platform.leave-guard
    uses:
    - platform.web
    - session.live-state
  - id: leaving-with-unsaved-edits-asks-first
    t: Closing the tab over an unfinished edit asks first
    d: >-
      The routine builder, workout builder, and exercise form retain edits until
      Save. The leave guard appears while any of these forms has pending edits
      and clears after saving or leaving the screen.
    screen: system
    uses:
    - platform.leave-guard
    - platform.web
    - template.routine
    - exercise.identity
  - id: leave-guard-is-a-browser-only-question
    t: The question is the browser's, and only the browser's
    d: >-
      Leaving is a browser-tab event. Phone sessions survive app switching and do
      not show this prompt; both builds maintain the unfinished-work register.
    uses:
    - platform.leave-guard
    - platform.portability
  - id: asks-the-browser-to-keep-the-database
    t: The app asks the browser not to throw the database away
    d: >-
      Browsers may reclaim storage under disk pressure. The app requests durable
      storage once, on first open; browsers may grant, deny, or prompt for that
      request, so the result is not guaranteed.
    defines:
    - storage.durability
    uses:
    - storage.database-location
    - platform.web
  - id: says-so-when-storage-will-not-hold
    t: A browser that cannot keep the data says so before you train on it
    d: >-
      If no durable storage is available, the app warns on entry and keeps the
      warning visible because the log lasts only until the tab closes. If storage
      is durable but not eviction-protected, it shows a dismissible warning.
    screen: today
    uses:
    - storage.durability
    - storage.database-location
    - platform.web
  - id: durability-is-not-a-question-on-a-phone
    t: A phone is simply durable
    d: >-
      Phone app storage is not evicted, so the durability request and warning are
      web-only.
    uses:
    - storage.durability
    - platform.portability
  - id: dialog-in-a-browser-raises-its-keyboard
    t: A dialog with a field in it raises the keyboard in a browser too
    d: >-
      Text-entry dialogs focus their field during the opening tap, allowing the
      browser to raise the keyboard. Deferring focus until after the dialog
      animation would require a second tap.
    screen: session
    defines:
    - ui.dialog
    uses:
    - platform.web
  - id: dialog-makes-its-own-room-for-the-keyboard
    t: A dialog makes its own room for the keyboard
    d: >-
      A dialog resizes and scrolls its own content when the keyboard opens. The
      field remains visible without moving the whole dialog off screen.
    screen: session
    uses:
    - ui.dialog
    - ui.system-insets
    - platform.web
