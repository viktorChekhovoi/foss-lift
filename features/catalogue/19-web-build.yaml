id: "19"
title: The browser build
tagline: >-
  The same app, served as a web page. Everything still stays on your own
  machine — the browser holds the database instead of the phone.
screen: none
code:
- lib/data/db_open.dart
- lib/data/db_open_native.dart
- lib/data/db_open_web.dart
- lib/util/capabilities.dart
- lib/util/leave_guard.dart
- lib/state/unsaved_work.dart
- lib/services/storage_health.dart
- lib/services/tab_awake.dart
- lib/widgets/storage_warning.dart
- lib/widgets/common.dart
- web/index.html
test:
- test/feature_19_web_build_test.dart
- test/feature_19_web_leave_and_storage_test.dart
where: >-
  <b>Opener</b> lib/data/db_open.dart, chosen at compile time between
  db_open_native.dart and db_open_web.dart · <b>What this build can do</b>
  lib/util/capabilities.dart · <b>Unfinished work, and the browser's question
  over it</b> lib/state/unsaved_work.dart and lib/util/leave_guard.dart ·
  <b>Whether the browser will keep the database</b>
  lib/services/storage_health.dart · <b>Keeping the tab's clocks running</b>
  lib/services/tab_awake.dart · <b>Dialogs, and the keyboard they raise</b>
  lib/widgets/common.dart · <b>Page and assets</b> web/ ·
  <b>How to build and where to host it</b> docs/web-build.md
groups:
- name: What it does
  items:
  - id: runs-in-browser-same-code
    t: Runs in a browser from the same code
    d: >-
      one Flutter codebase, built for Android and for the web. No separate
      front end, no cut-down version of the screens — the routine builder, the
      live board, the plate maths and the charts are the same widgets either
      way.
    defines:
    - platform.web
  - id: browser-holds-database
    t: The browser holds the database
    d: >-
      sqlite3 compiled to WebAssembly, stored through the browser's own
      origin-private file system or IndexedDB. It is the same schema and the
      same drift queries as on the phone — only the file underneath is
      different. Nothing is uploaded and there is no account: close the tab and
      the data is still in that browser, on that machine.
    defines:
    - storage.database-location
    uses:
    - storage.schema
    - privacy.offline
  - id: first-run-seeds-in-browser
    t: A fresh browser gets the starter library
    d: >-
      the first-run seed is a property of an empty database, not of a phone, so
      opening the page for the first time lands on the same 133 movements and racked
      bars an install does — and, like an install, on an empty routine list with
      the same library of ready-made programs to add from.
    uses:
    - storage.schema
    - exercise.seed
    - template.starter-library
  - id: web-build-serves-itself
    t: The page serves everything it needs from its own origin
    d: >-
      the engine, the fonts, the sqlite3 WebAssembly module and the drift
      worker are all served from the same place as the app. Nothing is fetched
      from a CDN, which is what keeps "no network" true of the running app and
      what lets it work offline once loaded.
    uses:
    - privacy.offline
    - platform.web
- name: Behaviour & edge cases
  items:
  - id: capabilities-absent-not-broken
    t: What a browser cannot do is absent, not broken
    d: >-
      every control that needs a phone is hidden on the web rather than left to
      fail when tapped. One place answers what this build can do, and the
      screens ask it — the same shape the Android-only services already use.
    uses:
    - platform.web
    - platform.portability
  - id: no-reminders-on-web
    t: A routine cannot ask to be reminded on the web
    d: >-
      the reminder is a scheduled local notification, and a browser has nothing
      to schedule one with. The weekday schedule is still editable — it is part
      of the program and it travels in a share code — but the reminder time
      is not offered.
    screen: routine-edit
    uses:
    - platform.reminders
    - platform.web
  - id: no-set-videos-on-web
    t: Set videos are not offered on the web
    d: >-
      filming a set writes a file into app storage the browser has no
      equivalent of, so the camera button, the clip reel and the video settings
      screen are all absent. History and progression are untouched — a clip was
      never anything a set needed.
    screen: session
    uses:
    - video.capture
    - video.storage
    - video.playback
    - platform.web
  - id: no-scanning-on-web
    t: A code is pasted on the web, not scanned
    d: >-
      a browser can open a camera, but the plugin behind the scanner cannot
      hand over frames one at a time there — it refuses the request outright —
      and the decoder needs the frames. So the scanner is absent rather than
      opening to a picture it can never read. Showing a QR still works, and so
      does pasting a code, which was always the way in that needs no
      permission.
    screen: routine-import
    uses:
    - share.qr
    - platform.web
  - id: no-shade-on-web
    t: The live workout does not leave the tab
    d: >-
      no ongoing notification, no Done button outside the app, and nothing to
      hear once the tab is behind another one. The clock underneath keeps its
      place either way, so what you come back to is the truth — but a browser
      is not somewhere the app can reach you from. The session itself is
      unaffected: it is in memory, and collapsing it to another screen resumes
      exactly as it does on a phone.
    screen: session
    uses:
    - platform.web
    - session.shade
    - session.rest-timer
  - id: workout-keeps-the-tab-awake
    t: A running workout keeps the tab from being slowed down
    d: >-
      a browser slows a hidden tab's clocks right down after a few minutes, and
      will not do it to one that is making a sound. So for as long as a workout
      is running — and only then — the app holds a tone far too quiet to hear,
      which is enough to be left alone. It stops on Finish and on discarding,
      so nothing is held between workouts.
    defines:
    - platform.tab-awake
    uses:
    - platform.web
    - session.live-state
    - session.rest-timer
  - id: keeping-awake-shows-in-the-tab
    t: The browser will say the page is playing something
    d: >-
      the speaker mark appears beside the tab for the length of a workout, which
      is the honest cost of the line above — a browser only leaves alone a page
      it can tell is making noise. Muting the tab there silences the rest tone
      as well, since it is the same output.
    uses:
    - platform.tab-awake
    - session.rest-sound
  - id: keeping-awake-does-not-work-everywhere
    t: It does not work on an iPhone, and nothing pretends it does
    d: >-
      Safari stops a page's audio the moment it is not the thing on screen, so
      there is nothing to hold and no way to hold it. The app still does not
      claim to reach you with the tab put away — that promise is a phone one
      either way, and the clocks come back correct on the way in regardless.
    uses:
    - platform.tab-awake
    - platform.portability
    - platform.web
  - id: rest-tone-sounds-in-the-open-tab
    t: A rest still sounds when the tab is the one you are looking at
    d: >-
      the tone at the end of a rest plays in a browser as it does on a phone,
      as long as the tab is in front. It stays silent until you have touched
      the page — which starting a workout already is — and it cannot reach you
      once the tab is in the background, so the off-screen ding is the part the
      web does not get.
    screen: session
    uses:
    - session.rest-sound
    - session.rest-timer
    - platform.web
  - id: share-codes-work-everywhere
    t: A routine code made in a browser opens on a phone
    d: >-
      the compression under the code is the same on both, so `FLR2` means one
      thing everywhere and a code does not carry which build wrote it.
    screen: routine-share
    uses:
    - share.routine-code
    - platform.web
  - id: browser-storage-can-be-cleared
    t: Clearing site data clears the workout log
    d: >-
      the database sits in the browser's storage for that origin, so "clear
      cookies and site data" takes the training history with it, and a private
      window starts empty every time. This is the honest cost of not having a
      server, and it is why the phone build is the one to train off.
    uses:
    - storage.database-location
    - storage.durability
    - privacy.offline
    - history.session-record
- name: Not losing the work
  items:
  - id: leaving-mid-workout-asks-first
    t: Closing the tab mid-workout asks first
    d: >-
      a live session is held in memory and only written down when you finish
      it, so a reload throws away every set logged since you started. While one
      is running the browser asks whether you meant to leave, and offers to
      stay. Finishing or discarding the session drops the question.
    screen: system
    defines:
    - platform.leave-guard
    uses:
    - platform.web
    - session.live-state
  - id: leaving-with-unsaved-edits-asks-first
    t: Closing the tab over an unfinished edit asks first
    d: >-
      the routine builder, the workout builder and the exercise form all keep
      their changes until Save, so the same question is asked over any of them
      with edits pending. Saving, or backing out of the screen, drops it.
    screen: system
    uses:
    - platform.leave-guard
    - platform.web
    - template.routine
    - exercise.identity
  - id: leave-guard-is-a-browser-only-question
    t: The question is the browser's, and only the browser's
    d: >-
      leaving is a thing a tab does, not a thing an app does — on a phone the
      session survives being switched away from, and there is nothing to ask.
      The register of unfinished work is kept either way; only the browser
      raises anything over it.
    uses:
    - platform.leave-guard
    - platform.portability
  - id: asks-the-browser-to-keep-the-database
    t: The app asks the browser not to throw the database away
    d: >-
      storage in a browser can be reclaimed when the machine runs short, and a
      site can ask to be exempt. The app asks, once, the first time it opens.
      Some browsers grant it outright, some weigh it against how much you use
      the site, and one asks you — so the answer is not guaranteed and the app
      does not pretend it is.
    defines:
    - storage.durability
    uses:
    - storage.database-location
    - platform.web
  - id: says-so-when-storage-will-not-hold
    t: A browser that cannot keep the data says so before you train on it
    d: >-
      if the app lands in a browser with nowhere durable to write, the training
      log lasts until the tab closes — so it says so, on the way in, and keeps
      saying it. If storage is durable but the browser refused to exempt it
      from being reclaimed, that is a milder note you can dismiss.
    screen: today
    uses:
    - storage.durability
    - storage.database-location
    - platform.web
  - id: durability-is-not-a-question-on-a-phone
    t: A phone is simply durable
    d: >-
      app storage is not evicted and nothing has to be asked for, so neither
      the request nor the warning exists outside the browser build.
    uses:
    - storage.durability
    - platform.portability
  - id: dialog-in-a-browser-raises-its-keyboard
    t: A dialog with a field in it raises the keyboard in a browser too
    d: >-
      the weight box, the workout name, the note and every other dialog that
      asks for typing open ready to type in, on the web as on a phone. A browser
      only lets a page open the keyboard while it is still handling the tap that
      asked for it, and a field that takes focus after the dialog has finished
      animating is asking too late — so the dialog claims focus within the tap
      rather than leaving it to the field to ask for afterwards. The symptom
      when it is wrong is a dialog you have to tap a second time to type in.
    screen: session
    defines:
    - ui.dialog
    uses:
    - platform.web
  - id: dialog-makes-its-own-room-for-the-keyboard
    t: A dialog makes its own room for the keyboard
    d: >-
      the box stays put and stays whole when the keyboard comes up: it shrinks
      and scrolls inside itself rather than being shoved up the page until its
      title is off the top. Sheets have always done this and dialogs did not,
      which is why a browser was left to do the scrolling and overshot — the
      field is what has to be visible, and it is what the dialog keeps visible.
    screen: session
    uses:
    - ui.dialog
    - ui.system-insets
    - platform.web
