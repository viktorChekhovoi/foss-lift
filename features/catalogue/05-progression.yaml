id: "05"
title: Automatic progression
tagline: >-
  Each exercise slot advances on one axis: add weight, add reps, or hold longer.
  Success steps it up; misses back it off.
screen: none
code:
- lib/data/progression.dart
- lib/state/active_workout.dart
test:
- test/feature_05_progression_test.dart
where: >-
  <b>Pure rules</b> lib/data/progression.dart (stepProgression / advanceTarget)
  · <b>Applied by</b> AppDatabase.advanceProgression(...) · <b>Recorded</b> ProgressionReport
  / lastProgressionProvider in lib/state/active_workout.dart
groups:
- name: What it does
  items:
  - id: weight-axis
    t: A slot advances on one of three axes
    d: >-
      weight — more load at a fixed rep target; reps — more reps at a fixed load;
      or time — a longer hold.
    screen: session
    defines:
    - progression.axis
    uses:
    - exercise.measure
  - id: defaults-work-untouched
    t: Defaults work untouched
    d: >-
      +2.5 kg after one clean session, −5 kg after two missed ones in a row — and
      the rule is written out under the steppers, reading correctly at any count. Every
      rate is configurable per slot.
    defines:
    - progression.rates
  - id: climb-the-range-then-add-weight
    t: A weight slot can climb its rep range before the load moves
    d: >-
      tick "Add weight at the top of the range" on a slot with a rep range and
      the two numbers take turns: the weight holds while the reps climb inside
      6–8, and topping the range at every set is what earns the step up — at
      which point the load moves by the slot's increment and the goal drops back
      to the bottom of the range. The range itself never moves. Off by default,
      and offered only where it means something: a slot with a fixed rep count
      has no range to climb, and a slot on the reps or time axis is already
      advancing the number this would advance.
    screen: session
    defines:
    - progression.double
    uses:
    - progression.axis
    - progression.rates
    - template.rep-target
    - session.exercise-weight
  - id: loading-bar-past-suggestion-itself
    t: Loading the bar past the suggestion is itself progression
    d: >-
      beating the stored target raises it, even before a step is formally "earned".
    uses:
    - progression.verdict
    - session.exercise-weight
- name: How to use it
  items:
  - id: automatic
    t: It is automatic
    d: >-
      configure the rates in the workout builder; it runs on Finish, and what
      it did is shown on the post-session recap.
    screen: summary
    uses:
    - session.recap
    - session.finish
- name: Behaviour & edge cases
  items:
  - id: verdict-every-planned-set-logged
    t: The verdict is "every planned set logged and none short"
    d: >-
      a skipped set is a miss; finishing at a reduced weight is a miss. The
      verdict has two answers on every slot but one: a slot climbing its rep
      range has a third, because landing inside the range is neither.
    defines:
    - progression.verdict
    uses:
    - progression.double
  - id: range-not-topped-holds-everything
    t: A session inside the range holds the weight and both streaks
    d: >-
      8/7/7 against 3×6–8 is not a clean session and not a miss: the load stays
      where it is, and the success and failure counts stay where they are, so
      three sessions spent working up through a range neither earn a step nor
      spend a back-off. Falling below the bottom of the range is still a miss and
      still feeds the back-off, which is what a rep range means — the bottom is
      the weight's price of admission, and the top is what buys the next one.
    uses:
    - progression.double
    - progression.verdict
    - progression.streak
    - template.rep-target
  - id: recap-held-range-says-top-it
    t: The recap tells a held slot climbing a range what it is waiting for
    d: >-
      an ordinary held exercise counts down the clean sessions or the misses left
      before its target moves. Neither number is what a slot climbing a range is
      waiting on, so it is told the thing that would actually move it: top the
      range on every set. Counting down a streak that this session did not touch
      would be counting down something that never arrives.
    screen: summary
    uses:
    - progression.double
    - progression.streak
    - session.recap
  - id: ticked-slot-without-a-range-is-ordinary
    t: A ticked slot with no range left is an ordinary weight slot
    d: >-
      take the rep range off a slot that was climbing one and it steps up on a
      clean session like any other, because there is no longer a range to top.
      The tick is kept rather than cleared, so putting the range back puts the
      behaviour back — dropping it would make an edit somebody made to the reps
      quietly rewrite the progression rules underneath.
    uses:
    - progression.double
    - template.rep-target
  - id: weight-axis-step-applied-lightest
    t: On the weight axis, the step is applied to the lightest logged set
    d: >-
      the load carried through the whole exercise. One heavy set among lighter
      ones is a heavy single, not a new working weight.
    screen: session
    uses:
    - progression.axis
    - session.exercise-weight
  - id: streaks-stored
    t: Streaks are stored
    d: >-
      consecutive successes/failures, because the target moves and a past session
      can only be judged against the goal that was live that day. Editing a workout
      in the builder can't forgive a pending back-off.
    defines:
    - progression.streak
    uses:
    - storage.schema
  - id: weight-mode-slot-no-suggested
    t: A weight-mode slot with no suggested weight takes one from the session
    d: >-
      no load is invented for a slot nobody ever put a number on — that would be
      telling you to load 2.5 kg onto a push-up. A weight set on the board is a
      number, though: a slot with no stored target that was worked at a weight
      today takes that weight as its target, steps on from it, and is listed on the
      recap like every other exercise. The weight the session carried is the
      lightest set logged, or the working weight when nothing was logged at all.
      Only a slot that had no target and was given no weight is left alone, and it
      is the one case with genuinely nothing to move.
    uses:
    - progression.axis
    - template.item
    - session.exercise-weight
    - session.recap
  - id: target-never-stored-below-its-bar
    t: A target is never stored below its own bar
    d: >-
      for a movement with a bar under it, repeated back-offs stop at the empty bar
      rather than running down to nothing — a target lighter than the bar it is
      loaded on is not a lighter session. The floor is applied as the target is
      read as well as written, so a slot that drifted under its bar on an older
      build is brought back to it the next time progression touches it, and the
      recap counts that session's step from the bar rather than reporting the whole
      climb back as a step up.
    uses:
    - progression.axis
    - progression.rates
    - load.bar-weight
    - exercise.weight-type
    - session.recap
