id: "05"
title: Automatic progression
tagline: >-
  Progression adds weight, reps, or hold time after success and backs off after misses.
screen: none
code:
- lib/data/progression.dart
- lib/state/active_workout.dart
test:
- test/feature_05_progression_test.dart
where: >-
  <b>Pure rules</b> lib/data/progression.dart (stepProgression / advanceTarget)
  · <b>Applied by</b> AppDatabase.advanceProgression(...) · <b>Recorded</b> ProgressionReport
  / lastProgressionProvider in lib/state/active_workout.dart
groups:
- name: What it does
  items:
  - id: weight-axis
    t: A slot advances on one of three axes
    d: >-
      Weight increases load at a fixed rep target; reps increases reps at fixed
      load; time increases hold duration. A counted slot with a rep range can
      alternate weight and reps through the Advanced axis.
    screen: session
    defines:
    - progression.axis
    uses:
    - exercise.measure
  - id: defaults-work-untouched
    t: Defaults work untouched
    d: >-
      Defaults are +2.5 kg after one clean session and −5 kg after two consecutive
      misses. Each rate is configurable per slot.
    defines:
    - progression.rates
  - id: climb-the-range-then-add-weight
    t: A weight slot can progress by reps, then by weight
    d: >-
      Advanced alternates rep and weight changes within a fixed range. The live
      goal starts at the lower bound; a clean session raises it by the rep step,
      and reaching the upper bound applies the weight step and resets the goal to
      the lower bound. Misses reverse this process. The option is available only
      for counted slots with a rep range on the weight axis.
    screen: session
    defines:
    - progression.double
    uses:
    - progression.axis
    - progression.advanced
    - progression.rates
    - progression.streak
    - template.rep-target
    - session.exercise-weight
  - id: advanced-has-a-rate-for-each-axis
    t: The advanced axis carries a step and a back-off for each of its two axes
    d: >-
      Rep and weight each have independent step-up and back-off amounts. One
      clean-session threshold and one miss threshold apply to the slot as a whole.
    uses:
    - progression.rates
    - progression.double
  - id: advanced-goal-is-stored-on-the-slot
    t: The live rep goal is stored on the slot
    d: >-
      The goal position is slot state and persists across launches. New and
      imported slots start at the lower bound. Editing the range clamps an
      out-of-range goal back inside it.
    uses:
    - progression.double
    - template.rep-target
    - storage.schema
  - id: loading-bar-past-suggestion-itself
    t: Loading the bar past the suggestion is itself progression
    d: >-
      Exceeding a stored target raises it before a configured progression step is
      earned. Cycle slots are excluded because their stored value is a training
      max, not the session's requested weight.
    uses:
    - progression.verdict
    - session.exercise-weight
    - template.cycle
    - template.training-max
- name: How to use it
  items:
  - id: automatic
    t: It is automatic
    d: Configure rates in the workout builder. Progression runs on Finish and is shown on the recap.
    screen: summary
    uses:
    - session.recap
    - session.finish
- name: Behaviour & edge cases
  items:
  - id: verdict-every-planned-set-logged
    t: The verdict is "every planned set logged and none short"
    d: >-
      A skipped set or reduced-weight set is a miss. The same rule applies to the
      Advanced axis: the session either reaches its live rep goal or does not.
    defines:
    - progression.verdict
  - id: recap-names-the-axis-that-actually-moved
    t: The recap reports whichever axis a slot moved on
    d: >-
      Reports rep progress when the rep goal advances and weight progress when a
      range reset adds load.
    screen: summary
    uses:
    - progression.double
    - progression.axis
    - session.recap
  - id: ticked-slot-without-a-range-is-ordinary
    t: An advanced slot with no range left is an ordinary weight slot
    d: >-
      Without a rep range, Advanced steps weight on a clean session like an
      ordinary weight slot. The setting is retained and resumes when a range is
      restored. To-failure slots use the same ordinary case.
    uses:
    - progression.double
    - template.rep-target
  - id: weight-axis-step-applied-lightest
    t: On the weight axis, the step is applied to the lightest logged set
    d: The step applies to the exercise's lightest logged load, not an isolated heavy set.
    screen: session
    uses:
    - progression.axis
    - session.exercise-weight
  - id: streaks-stored
    t: Streaks are stored
    d: >-
      Stores consecutive successes and failures so sessions are judged against the
      target that was active at the time. Editing a workout does not clear a pending
      back-off.
    defines:
    - progression.streak
    uses:
    - storage.schema
  - id: weight-mode-slot-no-suggested
    t: A weight-mode slot with no suggested weight takes one from the session
    d: >-
      A slot without a target does not invent a load. If a weight is logged, the
      lightest logged set becomes the target and progression starts from it. A
      slot with neither target nor logged weight is unchanged.
    uses:
    - progression.axis
    - template.item
    - session.exercise-weight
    - session.recap
  - id: target-never-stored-below-its-bar
    t: A target is never stored below its own bar
    d: >-
      Barbell targets are clamped to the empty bar on read and write. A legacy
      target below its bar is corrected when progression touches it; the recap
      treats the bar as the step baseline.
    uses:
    - progression.axis
    - progression.rates
    - load.bar-weight
    - exercise.weight-type
    - session.recap
