id: "09"
title: Units (kg / lb)
tagline: >-
  A single global unit toggle. Weights are stored canonically in kilograms and
  converted on the fly.
screen: settings
code:
- lib/util/units.dart
- lib/util/format.dart
- lib/screens/exercise_settings_screen.dart
test:
- test/feature_09_units_test.dart
where: >-
  <b>Conversion helpers</b> lib/util/units.dart · <b>Toggle + confirm</b> lib/screens/exercise_settings_screen.dart
  (_switchUnit) · <b>Read via</b> weightUnitProvider
groups:
- name: What it does
  items:
  - id: asks-which-unit-on-first-launch
    t: A fresh install takes its unit from the phone's region, without asking
    d: >-
      pounds for the United States, Liberia and Myanmar, kilograms everywhere
      else. The guess is stored on the first launch and is the user's from then
      on: changing the phone's language or region later never moves it, because
      by then it is a setting somebody has trained against rather than a guess.
      Nothing is painted until it has been stored, so no screen ever opens in the
      wrong unit and corrects itself.
    screen: none
    uses:
    - load.units
    - storage.settings
  - id: one-app-wide-setting-kg
    t: 'One app-wide setting: kg or lb'
    d: >-
      Profile → Exercise settings → tap kg or lb. Tapping the unit you are already on does
      nothing — it is not a switch. It is what every movement reads in unless
      that movement has been given a unit of its own.
    defines:
    - load.units
    uses:
    - storage.settings
    - load.exercise-unit
  - id: every-weight-app-displayed-chosen
    t: Every weight in the app is displayed in the chosen unit
    d: >-
      the plate rack you see follows the unit too. A movement with its own unit
      is the exception, and it is an exception everywhere at once — see below.
    uses:
    - load.units
    - load.plate-rack
    - load.exercise-unit
  - id: switching-units-pops-confirm-dialog
    t: Switching units confirms first, and never rewrites what you lifted
    d: >-
      logged sets keep the kilograms they were lifted at, for good — a session
      trained at 100 kg still reads 100 kg after a switch to pounds, whatever the
      screen now calls it. What does move is the configuration you are about to
      act on: see the snapping and the per-unit steps below. The dialog says so
      before anything changes.
    uses:
    - load.units
    - load.unit-defaults
    - history.session-record
  - id: converted-targets-are-snapped
    t: A converted target is snapped to a weight somebody can load
    d: >-
      100 kg converts to 220.46 lb, which is not a bar anybody sets. On a switch
      every slot's suggested weight is snapped to the nearest step in the new
      unit — 2.5 kg or 5 lb — so it lands on 220 lb. Only that target moves;
      logged sets, their goal weights and the bars and plates the gym owns are
      left exactly as they are.
    uses:
    - load.units
    - load.unit-defaults
    - template.item
    - history.session-record
  - id: exercise-weight-and-its-sets-are-one-load
    t: An exercise's weight and its set rows are the same load
    d: >-
      both sit on the same fine grid, so a header reading 101 kg over rows reading
      100 is not a state the board can be in. The weight an exercise is worked at
      goes through the same snap as the weights of its sets — when the session
      hydrates and again every time the weight is changed — so the rows, the
      working weight and the plate line under them all describe one bar. A weight
      already on the grid passes through untouched, which is why a slot set to
      48.75 kg opens at 48.75 rather than being rounded to a number nobody typed.
    screen: session
    uses:
    - load.units
    - load.fine-grid
    - session.exercise-weight
    - template.set-scheme
  - id: each-unit-has-its-own-fine-grid
    t: Each unit has a fine grid, separate from the step it counts by
    d: >-
      an eighth of a kilogram in a metric gym, a quarter of a pound in a pounds
      one. It is not the 2.5 kg or 5 lb a gym loads by and is not what a slot
      progresses in; it is the resolution a weight the app worked out for itself is
      expressed to. Three jobs use it: keeping a percentage where the arithmetic
      put it instead of rounding it to the nearest plate change, killing the tail
      a conversion leaves on a set row, and repairing the hundredth of a kilogram
      a step rate loses on its way through a routine code. One grid for all three,
      because they are one question — how precisely does this app hold a weight it
      was not handed. Switching units is the one place that still snaps
      to the coarse step — 100 kg opens at 220 lb, not 220.5 — because re-plating
      a whole gym is a different question from resolving one set.
    screen: none
    defines:
    - load.fine-grid
    uses:
    - load.units
    - load.unit-defaults
  - id: each-unit-has-its-own-default-step
    t: Step up and back off have a default in each unit
    d: >-
      2.5 kg up and 5 kg down in a metric gym, 5 lb up and 10 lb down in a
      pounds one. A slot still sitting on the old unit's default takes the new
      unit's default when the unit changes, so a switch to pounds gives 5 lb
      steps rather than 5.51. A rate you set yourself is yours: it converts, and
      2.5 kg deliberately chosen stays 2.5 kg.
    screen: workout-edit
    defines:
    - load.unit-defaults
    uses:
    - load.units
    - progression.rates
  - id: weight-and-unit-read-one-way
    t: A weight and its unit are joined one way, everywhere
    d: >-
      one helper puts the two together through the language's own "{amount}
      {unit}" pattern, so a language that spaces or orders them differently is
      obeyed on every screen rather than on most of them. The symbol is never
      re-cased: "kg" reads kg in a column heading and in a shouted plate line
      alike. A weight nobody has chosen yet reads "—" rather than 0, on the
      working weight and on the set rows both. Inside the session's set board the
      unit is named once, in the column heading, and the cells under it are bare
      numbers.
    screen: session
    uses:
    - load.units
    - session.exercise-weight
    - load.plate-solver
  - id: weights-read-to-two-decimals
    t: A weight reads to three decimals, with trailing zeros dropped
    d: >-
      100 kg is "100", a 1.25 kg plate is "1.25" and not "1.3", and a 2.5 lb step
      is "2.5". Three rather than two because the fine grid reaches an eighth of a
      kilogram, and a percentage landing on 48.875 that reads "48.88" is a number
      the app cannot be asked for again. One helper formats every weight the app
      shows — a set row, a step rate, a plate breakdown — so the same number never
      reads two ways on two screens.
    screen: none
    uses:
    - load.units
    - load.fine-grid
- name: A movement with its own unit
  uses:
  - load.exercise-unit
  - load.units
  items:
  - id: override-reads-everywhere-at-once
    t: The override is the movement's unit everywhere the movement appears
    d: >-
      the session board and its column heading, the exercise's own screen, its
      bar row and plate line, the slot in the builder and the step rates on it,
      the history rows, the progress chart and the clip labels. One movement
      reading two units on two screens is the failure this exists to avoid, so
      there is one question — what unit is this exercise in — and every screen
      asks it.
    screen: none
    uses:
    - load.plate-solver
    - session.exercise-weight
    - history.session-record
  - id: typing-means-overridden-unit
    t: A number you type into that movement is in its unit
    d: >-
      the weight field, the step rate, the training max. Reading in one unit and
      writing in another is how somebody ends up benching 100 lb.
    screen: session
    uses:
    - session.exercise-weight
    - progression.rates
  - id: override-drives-the-arithmetic
    t: It counts, snaps and warms up in its own unit too
    d: >-
      a slot on a movement overridden to pounds gets the 5 lb step and 10 lb
      back-off as its defaults rather than the metric pair, its computed weights
      land on the quarter-pound grid, and its warm-up ramp climbs a rack that
      goes up in 5 lb dumbbells and 5 lb stack pins. A step that lands somewhere
      unloadable is a step nobody can take, whichever unit the rest of the app is
      in. The plates and the bars are the exception, and stay app-wide: they are
      the iron in one gym, weighed once, and a movement being read in another
      unit does not change what is on the rack.
    screen: none
    uses:
    - load.unit-defaults
    - load.fine-grid
    - load.loadable-grid
    - load.plate-rack
    - session.warmup-ramp
  - id: setting-override-moves-that-movement-only
    t: Giving a movement its own unit moves that movement's targets, and nothing else
    d: >-
      the same pass a whole-app switch makes, scoped to the one exercise: its
      slots' suggested weights are snapped to a weight the new unit can load, and
      a slot still on the old unit's default step takes the new one's. It asks
      first, in the same words, because it is the same change to the numbers you
      are about to act on. Logged sets are not touched here any more than they
      are there.
    screen: exercise-detail
    uses:
    - load.unit-defaults
    - template.item
    - history.session-record
  - id: totals-over-several-movements-stay-app-wide
    t: A total that spans movements stays in the app's unit
    d: >-
      session volume, the stats on the history tab, the weight moved in a week.
      They add several exercises together, and a sum of kilograms and pounds is
      not a number — so they are read in the app-wide unit, which is what a
      figure with no single movement behind it can honestly be in.
    screen: history
    uses:
    - history.aggregates
  - id: app-wide-switch-leaves-overrides-alone
    t: Switching the app's unit leaves an overridden movement where it is
    d: >-
      an override is an answer somebody gave about one movement; the app-wide
      setting is the answer for everything they did not. So a switch to pounds
      moves every movement that was following the app and leaves the one pinned
      to kilograms in kilograms — including its step rates and its targets, which
      are already in the unit they were chosen in.
    screen: settings
    uses:
    - load.unit-defaults
    - template.item
