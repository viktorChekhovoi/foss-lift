id: "09"
title: Units (kg / lb)
tagline: One app-wide unit setting; stored weights remain kilograms.
screen: settings
code:
- lib/util/units.dart
- lib/util/format.dart
- lib/screens/exercise_settings_screen.dart
test:
- test/feature_09_units_test.dart
where: >-
  <b>Conversion</b> lib/util/units.dart · <b>Setting and confirmation</b> lib/screens/exercise_settings_screen.dart
  (_switchUnit) · <b>Provider</b> weightUnitProvider
groups:
- name: What it does
  items:
  - id: asks-which-unit-on-first-launch
    t: A fresh install infers its unit from the phone's region
    d: >-
      The default is pounds in the United States, Liberia and Myanmar, and
      kilograms elsewhere. The value is stored on first launch and does not
      change when the phone's language or region changes. The app waits for the
      stored value before painting a screen.
    screen: none
    uses:
    - load.units
    - storage.settings
  - id: one-app-wide-setting-kg
    t: 'The app has one unit setting: kg or lb'
    d: >-
      Profile → Exercise settings → tap kg or lb. Tapping the current unit has no
      effect. It applies to every movement without an exercise-specific override.
    defines:
    - load.units
    uses:
    - storage.settings
    - load.exercise-unit
  - id: every-weight-app-displayed-chosen
    t: The chosen unit formats every displayed weight
    d: >-
      This includes the plate rack. An exercise-specific unit overrides the app
      setting everywhere that exercise appears.
    uses:
    - load.units
    - load.plate-rack
    - load.exercise-unit
  - id: switching-units-pops-confirm-dialog
    t: Switching units requires confirmation and preserves logged weights
    d: >-
      Logged sets retain their stored kilogram values; a set logged at 100 kg is
      displayed as the equivalent pounds after switching. Configuration targets
      and per-unit progression steps are converted as described below, and the
      dialog explains this before the change.
    uses:
    - load.units
    - load.unit-defaults
    - history.session-record
  - id: converted-targets-are-snapped
    t: Converted targets snap to a loadable weight
    d: >-
      On a unit switch, each slot's suggested weight is rounded to the nearest
      step in the new unit (2.5 kg or 5 lb); 100 kg therefore becomes 220 lb.
      Logged sets, their goal weights, and the configured bars and plates do not
      change.
    uses:
    - load.units
    - load.unit-defaults
    - template.item
    - history.session-record
  - id: exercise-weight-and-its-sets-are-one-load
    t: An exercise weight and its set rows represent one load
    d: >-
      Both use the same fine grid. The exercise weight is snapped with its set
      weights when the session hydrates and whenever it changes, keeping the set
      rows, working weight, and plate line consistent. Values already on the grid
      are unchanged; 48.75 kg remains 48.75 kg.
    screen: session
    uses:
    - load.units
    - load.fine-grid
    - session.exercise-weight
    - template.set-scheme
  - id: each-unit-has-its-own-fine-grid
    t: Each unit has a fine grid separate from its progression step
    d: >-
      The grid is 0.125 kg or 0.25 lb. It is distinct from the 2.5 kg or 5 lb
      loading step and is used for percentage results, conversion tails on set
      rows, and weight progression rates decoded from routine codes. Unit switches
      use the coarse loading step: 100 kg becomes 220 lb, not 220.5 lb.
    screen: none
    defines:
    - load.fine-grid
    uses:
    - load.units
    - load.unit-defaults
  - id: each-unit-has-its-own-default-step
    t: Each unit has default step-up and back-off rates
    d: >-
      Metric defaults are 2.5 kg up and 5 kg down; pound defaults are 5 lb up and
      10 lb down. A slot using the old default step adopts the new unit's default
      after a unit change. A user-defined rate is converted and retained; an
      explicitly chosen 2.5 kg rate remains 2.5 kg.
    screen: workout-edit
    defines:
    - load.unit-defaults
    uses:
    - load.units
    - progression.rates
  - id: weight-and-unit-read-one-way
    t: Weight and unit formatting uses one shared helper
    d: >-
      The helper uses the locale's "{amount} {unit}" pattern and preserves the
      unit's lowercase symbol. An unset weight displays "—", not 0. In the
      session board the unit appears once in the column heading; cells contain
      numbers only.
    screen: session
    uses:
    - load.units
    - session.exercise-weight
    - load.plate-solver
  - id: weights-read-to-two-decimals
    t: Weights display up to three decimals, without trailing zeros
    d: >-
      For example, 100 kg displays as "100", 1.25 kg as "1.25", and 2.5 lb as
      "2.5". Three decimal places represent the 0.125 kg fine grid and prevent
      values such as 48.875 from being displayed as a different value. The same
      formatter handles set rows, progression rates, and plate breakdowns.
    screen: none
    uses:
    - load.units
    - load.fine-grid
- name: A movement with its own unit
  uses:
  - load.exercise-unit
  - load.units
  items:
  - id: override-reads-everywhere-at-once
    t: An exercise override applies everywhere that exercise appears
    d: >-
      It controls the session board and column heading, exercise settings, bar
      and plate displays, builder slot and progression rates, history, progress
      chart, and clip labels.
    screen: none
    uses:
    - load.plate-solver
    - session.exercise-weight
    - history.session-record
  - id: typing-means-overridden-unit
    t: Values entered for an overridden exercise use its unit
    d: This includes the weight field, step rate, and training max.
    screen: session
    uses:
    - session.exercise-weight
    - progression.rates
  - id: override-drives-the-arithmetic
    t: Progression, snapping, and warm-ups use the override unit
    d: >-
      A pound-denominated exercise uses 5 lb up and 10 lb back-off defaults and a
      quarter-pound fine grid. Warm-ups use that unit's 5 lb dumbbell and stack-pin
      increments. Computed weights must remain loadable. Bars and plates are
      app-wide physical equipment and are not converted by an exercise override.
    screen: none
    uses:
    - load.unit-defaults
    - load.fine-grid
    - load.loadable-grid
    - load.plate-rack
    - session.warmup-ramp
  - id: setting-override-moves-that-movement-only
    t: Assigning an exercise unit converts only that exercise's targets
    d: >-
      Its suggested slot weights are snapped to a loadable value in the new unit;
      slots using the previous default step adopt the new unit's default. The
      change requires confirmation. Logged sets are unchanged.
    screen: exercise-detail
    uses:
    - load.unit-defaults
    - template.item
    - history.session-record
  - id: totals-over-several-movements-stay-app-wide
    t: Totals spanning multiple exercises use the app-wide unit
    d: >-
      Session volume, history statistics, and weekly weight moved combine multiple
      exercises, so they are displayed in the app-wide unit rather than an
      exercise-specific override.
    screen: history
    uses:
    - history.aggregates
  - id: app-wide-switch-leaves-overrides-alone
    t: Switching the app unit leaves overridden exercises unchanged
    d: >-
      The app-wide setting affects exercises that follow it. An exercise pinned to
      kilograms remains in kilograms, including its progression rates and targets.
    screen: settings
    uses:
    - load.unit-defaults
    - template.item
