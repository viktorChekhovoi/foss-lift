id: "20"
title: Backup and restore
tagline: >-
  One portable file for the phone's training data, suitable for restoring after
  an uninstall, device loss, or sideloaded build.
screen: backup
code:
- lib/data/backup_archive.dart
- lib/services/backup_service.dart
- lib/screens/backup_screen.dart
test:
- test/feature_20_backup_and_restore_test.dart
where: >-
  <b>The format</b> lib/data/backup_archive.dart (FLB1, no dart:io in it) ·
  <b>Reading and writing the disk</b> lib/services/backup_service.dart ·
  <b>Screen</b> lib/screens/backup_screen.dart
groups:
- name: What it does
  items:
  - id: backup-is-one-file
    t: A backup is one file, holding everything the app knows
    d: >-
      The archive contains the database, including sessions, routines, exercises,
      bars, settings, and custom themes, plus a manifest with the archive format
      and schema version. It uses ZIP so common file pickers and sharing services
      can transport it.
    defines:
    - share.backup-file
    uses:
    - storage.schema
  - id: backup-goes-where-you-say
    t: It goes wherever you send it, and the app keeps no copy
    d: >-
      Save opens the phone's share sheet. The app uploads no copy and retains no
      backup in app storage. Files are dated so multiple backups sort together.
    screen: system
    uses:
    - share.backup-file
  - id: videos-left-out-by-default
    t: Set videos are left out unless you ask for them
    d: >-
      Videos can be much larger than the database, so the include-videos option is
      unchecked by default. The checkbox is the only control needed to state that
      default.
    uses:
    - share.backup-file
    - video.storage
  - id: videos-optional-and-sized
    t: They can be included, and the size is stated before you commit
    d: >-
      Selecting the option adds every clip. The displayed size is measured from
      the database and clip files; compression may make the archive smaller. A
      size warning appears when the result exceeds common mail or chat limits and
      identifies videos as the removable content.
    uses:
    - share.backup-file
    - video.storage
  - id: restore-replaces-everything
    t: Restore replaces everything on the phone
    d: >-
      Restore replaces the current database; it does not merge records. A
      confirmation states this before any data is changed. The replacement is
      staged and proven to be a compatible Foss Lift database before the live
      profile is closed or changed. If staging, replacement, or reopening fails,
      the previous profile remains available without restarting the app.
    defines:
    - share.restore
    uses:
    - share.backup-file
  - id: restore-brings-clips-back-if-they-are-in-it
    t: Clips come back only if they were put in
    d: >-
      An archive containing clips restores them beside the sets that reference
      them. Clips are staged separately after the database succeeds, so a bad
      clip cannot make either the restored or previous database unavailable.
      Clip paths are relative to app storage, so a backup without clips can still
      restore on the original phone. On a phone without those files, sets remain
      valid and show no playback control.
    uses:
    - share.restore
    - video.storage
    - platform.portability
- name: What it refuses
  items:
  - id: restore-refuses-a-newer-backup
    t: A backup from a newer version is refused, not half-read
    d: >-
      The manifest records the writing schema version. A backup newer than the
      current migration ladder is rejected with an explanation; older backups are
      upgraded through that ladder before restore.
    uses:
    - share.restore
    - storage.schema
  - id: restore-refuses-anything-that-is-not-a-backup
    t: A file that is not a backup is refused by what is in it
    d: >-
      Validation uses the manifest, not the filename. Renamed archives, photos,
      routine-code files, corrupt SQLite files, unrelated SQLite databases, and
      databases whose real schema disagrees with the manifest are rejected. The
      embedded database must pass SQLite integrity checks and contain compatible
      Foss Lift tables and essential columns. The current database remains open
      and usable after every refusal.
    uses:
    - share.restore
  - id: restore-refuses-during-a-workout
    t: It will not restore over a running workout
    d: >-
      A live session remains in memory until Finish. Restore is unavailable until
      the session is finished or abandoned, preventing replacement of the
      database from discarding it.
    uses:
    - share.restore
    - session.live-state
- name: Behaviour &amp; edge cases
  items:
  - id: backup-only-on-a-build-with-files
    t: The section is absent where there is no filesystem to put a file on
    d: >-
      The web build has no supported filesystem archive path, so Profile omits
      Backup & restore.
    screen: profile
    uses:
    - share.backup-file
    - platform.web
  - id: backup-is-offline-like-everything-else
    t: Nothing about it touches the network
    d: >-
      The file is built locally and handed to the destination selected in the
      system share sheet. The app has no account or upload service.
    screen: none
    uses:
    - share.backup-file
    - privacy.offline
