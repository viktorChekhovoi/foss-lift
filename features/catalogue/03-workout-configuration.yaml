id: "03"
title: Workout configuration
tagline: >-
  Configure each workout slot independently in the exercise builder.
screen: workout-edit
code:
- lib/screens/workout_edit_screen.dart
- lib/widgets/builder_widgets.dart
- lib/widgets/workout_items_editor.dart
- lib/data/set_scheme.dart
- lib/data/superset.dart
test:
- test/feature_03_workout_configuration_test.dart
where: >-
  <b>Screen</b> lib/screens/workout_edit_screen.dart (_ItemConfigSheet) · <b>Shared
  chrome</b> lib/widgets/builder_widgets.dart, workout_items_editor.dart · <b>Set
  schemes</b> lib/data/set_scheme.dart (resolveSetTargets), applied by
  ActiveWorkoutController.start · <b>Data</b> WorkoutItems columns
groups:
- name: What it does
  items:
  - id: sets
    t: A slot carries its own set count, working weight and rest
    d: >-
      Stores working-set count, starting weight, and an optional rest override.
    defines:
    - template.rest
    uses:
    - template.item
    - load.units
  - id: fixed-rep-count
    t: A slot's goal is reps, a rep range, failure, or a hold in seconds
    d: >-
      A fixed count, range, to-failure target, or timed hold; targets are mutually
      exclusive.
    defines:
    - template.rep-target
    uses:
    - exercise.measure
  - id: target-opens-on-three-fields
    t: The Target card opens on sets, reps and rest, and nothing else
    d: >-
      Sets, reps, and rest are the default fields. Rep bounds, failure mode, and
      set scheme are behind the card's collapsed Advanced section.
    uses:
    - template.item
  - id: advanced-holds-the-rest-of-the-target
    t: Advanced holds the rep range, to failure, effort target, and set scheme
    d: >-
      Contains the upper rep bound, to-failure mode, optional RPE target, and set
      scheme. It expands automatically when a slot uses any advanced option. RPE
      is absent from a new slot until selected here.
    uses:
    - template.set-scheme
    - template.rep-target
    - template.effort-target
  - id: slot-can-prescribe-rpe
    t: A slot can optionally prescribe RPE
    d: >-
      Advanced offers no effort target by default. Selecting RPE accepts 6–10 in
      half-point steps and shows the equivalent reps in reserve in the picker.
      The target applies to every working set in the slot, including written-out
      custom and cycle sets. Removing it restores the ordinary builder and
      does not remove RPE already recorded in history.
    defines:
    - template.effort-target
    uses:
    - template.item
    - template.set-scheme
    - template.per-set-reps
    - ui.gym-vocabulary
  - id: rpe-load-is-self-selected
    t: An RPE slot leaves today's load to the lifter
    d: >-
      Its last working load is a starting reference rather than a progression
      target. Finishing the session neither steps nor backs off that load, and an
      effort rating above or below target is not a progression success or miss.
    screen: none
    uses:
    - template.effort-target
    - progression.rates
    - session.effort-rating
  - id: an-advanced-toggle-is-a-control
    t: An Advanced toggle is a control the size of the pills it sits under
    d: >-
      Both cards use full-width bordered rows matching the Weight and Reps pill
      controls. The rows are interactive controls, not captions.
    screen: workout-edit
    uses:
    - template.item
    - template.set-scheme
  - id: to-failure-greys-the-rep-range
    t: Ticking "to failure" greys the rep range out rather than taking it away
    d: >-
      Disables the rep-range stepper while retaining its bound in the UI and
      storage. Clearing to-failure restores the previous range, including after
      save and reopen.
    screen: workout-edit
    uses:
    - template.rep-target
  - id: progression-card-has-its-own-advanced
    t: The Progression card has its own Advanced half
    d: >-
      The card keeps axis, rates, and thresholds visible. Advanced contains
      Progress by reps, then weight, which raises reps through the range before
      increasing weight. It is offered only when the slot has a rep range.
    defines:
    - progression.advanced
    uses:
    - progression.axis
    - progression.rates
    - progression.double
  - id: advanced-axis-is-a-pill-and-a-tick
    t: The advanced rule is a pill on the axis row and a tick, and they are one switch
    d: >-
      Selecting the checkbox selects the Advanced axis; selecting Weight or Reps
      clears it. The pill and checkbox are two controls for the same setting.
    screen: workout-edit
    uses:
    - progression.double
    - progression.axis
    - progression.advanced
  - id: advanced-axis-shows-both-rates
    t: The advanced axis asks for both pairs of amounts and one pair of thresholds
    d: >-
      Takes rep and weight step-up/back-off amounts plus one clean-session
      threshold and one miss threshold shared by both axes. Helper text describes
      clean, top-of-range, and bottom-of-range behavior.
    screen: workout-edit
    uses:
    - progression.double
    - progression.rates
  - id: sets-can-back-off-ramp-or-be-written-out
    t: The sets of a slot can back off, ramp up, or be written out one by one
    d: >-
      Flat uses one weight and target for every set. Back-off decreases each later
      set by a configured percentage (for example, 100%, 90%, 80%); Ramp reverses
      that order. Custom stores a target and percentage per set. Cycle stores
      multiple custom rows and selects one per week. The slot weight remains the
      top of each scheme.
    defines:
    - template.set-scheme
    uses:
    - template.item
    - template.cycle
    - template.per-set-reps
    - progression.rates
  - id: scheme-weights-land-on-something-loadable
    t: A scheme's weights keep the arithmetic that made them
    d: >-
      Computed weights retain percentage arithmetic, then snap to the fine grid:
      0.125 kg or 0.25 lb. Bar-loaded values are clamped to the empty bar. This
      grid removes conversion and percentage tails without rounding to gym plate
      increments.
    screen: none
    uses:
    - template.set-scheme
    - load.units
    - load.fine-grid
    - load.bar-weight
  - id: scheme-reaches-the-live-board
    t: The scheme is what the board hydrates from
    d: >-
      Each set row hydrates its own weight and rep goal; back-off sets are judged
      against their own weight. Changing exercise weight during a session
      recomputes future rows while preserving logged sets.
    screen: session
    points:
    - session
    uses:
    - template.set-scheme
    - session.set-logging
    - session.live-state
    - session.exercise-weight
  - id: slot-joins-the-one-above-as-a-superset
    t: A slot can be joined to the one above it as a superset
    d: >-
      The Target card can join a slot to the immediately preceding slot. Joined
      slots form a consecutive group, run back to back, with rest after each
      round. The first slot has no join control.
    defines:
    - template.superset
    uses:
    - template.item
    - template.rest
  - id: superset-checkbox-says-what-a-superset-is
    t: The checkbox says what a superset is, if you ask it
    d: >-
      An adjacent help icon explains the superset behavior and purpose without
      adding helper text to the form.
    uses:
    - template.superset
    - ui.gym-vocabulary
  - id: superset-reads-as-a-group-in-the-list
    t: A superset reads as a group in the exercise list
    d: >-
      Joined rows have a shared accent edge and the first row is tagged SUPERSET.
      Each row retains its own target; the group changes execution order only.
    uses:
    - template.superset
  - id: progression-rates
    t: A slot carries its own progression rates
    d: >-
      Stores the progression axis, step and back-off amounts, and success and
      failure thresholds. Advanced slots also store separate rep rates.
    uses:
    - progression.rates
  - id: step-amounts-tapped-or-typed
    t: The step-up and back-off amounts are tapped as well as typed
    d: >-
      Stepper taps change weight by 1.25 kg or 2.5 lb, reps by 1, and holds by 5 s.
      Typed values are accepted without tap rounding. Step-up is clamped to at
      least one tap; back-off may be zero.
    uses:
    - progression.rates
    - load.units
  - id: weight-nudged-by-the-slots-own-rates
    t: The weight is nudged by the amounts the slot itself progresses by
    d: >-
      Weight steppers apply the slot's step-up and back-off rates. For rep or time
      axes they use the relevant unit step. Values are not tap-rounded; decrement
      stops at the bar weight for barbell exercises or zero otherwise. Cycle slots
      step the training max.
    screen: workout-edit
    uses:
    - template.item
    - template.training-max
    - progression.rates
    - load.units
    - load.unit-defaults
    - load.bar-weight
  - id: exercise-library-properties-in-sheet
    t: The exercise's own library properties are editable from the config sheet
    d: >-
      The Exercise card edits loading, bar, and note; custom exercises also expose
      name, groups, equipment, measurement, and demo link. Library edits apply to
      every routine using the exercise. Starter names and classifications remain
      fixed for routine-code compatibility.
    uses:
    - exercise.identity
    - exercise.taxonomy
    - exercise.measure
    - exercise.notes
    - exercise.weight-type
    - exercise.video-url
    - load.bar-weight
- name: How to use it
  items:
  - id: open-config-sheet
    t: Open the config sheet
    d: open a workout → edit → tap an exercise slot.
    uses:
    - template.item
  - id: adding-exercise-opens-its-config
    t: Adding an exercise opens its config straight away
    d: >-
      Selecting an exercise closes the picker and opens its configuration sheet.
      Backing out keeps the exercise in the workout with default settings.
    screen: workout-edit
    uses:
    - template.item
    - template.rep-target
    - progression.axis
  - id: progression-axis-comes-first-sheet
    t: The progression axis comes first in the sheet
    d: The axis determines whether subsequent targets use reps or seconds.
    uses:
    - progression.axis
  - id: turn-on-add-weight-at-top-of-range
    t: Turn on progress by reps, then weight
    d: >-
      Open a slot → set a rep range under Target → open Progression → select the
      Advanced axis. The same setting is available through the card's Advanced
      toggle once a range exists.
    screen: workout-edit
    uses:
    - progression.double
    - progression.advanced
    - template.rep-target
  - id: sheet-field-stays-above-keyboard
    t: A field tapped in the config sheet scrolls clear of the keyboard
    d: The sheet scrolls the active text field above the keyboard.
    uses:
    - ui.system-insets
  - id: reorder-slots-up-down
    t: Drag slots into order by the handle
    d: Drag by the handle and add exercises from the picker.
    uses:
    - template.item
  - id: make-a-superset
    t: Make a superset
    d: >-
      Open a workout → edit → select the second exercise → tick “Superset with …”.
      The rows join in the list.
    uses:
    - template.superset
- name: Behaviour & edge cases
  items:
  - id: which-targets-offered-depends-exercise
    t: >-
      Which targets are offered depends on the exercise, not the program
    d: >-
      Counted exercises offer weight and reps; held exercises offer timed holds;
      unloaded exercises omit the weight axis. Unloaded slots display Bodyweight
      without a weight field, while a blank loaded field means no weight is set.
    uses:
    - exercise.measure
    - exercise.weight-type
    - progression.axis
    - template.rep-target
  - id: switching-axis-keeps-the-rates-you-set
    t: Switching the axis keeps the rates you set on the axis you left
    d: >-
      Rates are stored per axis and restored when switching back. Advanced stores
      separate rep and weight rates. Unused axes receive defaults; Advanced starts
      from the current weight rates. Stored rates survive reopening, relaunch, and
      upgrades. Shared routine codes include only the active axis and its rates.
    screen: workout-edit
    uses:
    - progression.axis
    - progression.rates
    - progression.double
    - exercise.measure
    - storage.schema
    - share.routine-code
  - id: range-climb-greyed-without-a-range
    t: The advanced rule is greyed out until there is a range to climb
    d: >-
      The Advanced axis pill remains visible but disabled until a rep range exists.
      The checkbox and its toggle are hidden when they have no content. Held and
      unloaded exercises do not offer the axis. Setting an upper bound enables it.
    screen: workout-edit
    uses:
    - progression.double
    - progression.advanced
    - progression.axis
    - template.rep-target
  - id: rep-range-keeps-width-progression
    t: A rep range keeps its width as progression moves it
    d: >-
      The reps axis advances 6–8 to 7–9. Advanced keeps the range fixed and moves
      the live goal within it.
    screen: none
    uses:
    - template.rep-target
    - progression.rates
    - progression.double
  - id: a-joined-slot-dragged-to-the-top-is-unjoined
    t: A joined slot dragged to the top of the list is unjoined
    d: >-
      A row moved to the top has no preceding slot and is unjoined. Moving it back
      down does not restore the previous join.
    uses:
    - template.superset
  - id: removing-the-top-of-a-superset-leaves-the-rest-a-group
    t: Removing the top row of a superset leaves the rest of it a group
    d: >-
      Deleting the first of three joined exercises leaves the remaining two joined.
      Deleting all but one leaves an ordinary slot.
    uses:
    - template.superset
  - id: set-measured-reps-or-seconds
    t: A set is measured in reps or seconds, never both
    d: >-
      Timed sets store seconds and zero reps, so aggregate reps and volume do not
      treat a 45-second plank as 45 repetitions.
    screen: none
    uses:
    - exercise.measure
    - storage.schema
    - history.aggregates
