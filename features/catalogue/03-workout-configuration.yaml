id: "03"
title: Workout configuration
tagline: >-
  Every exercise slot in a workout is configured on its own, in the exercise builder.
screen: workout-edit
code:
- lib/screens/workout_edit_screen.dart
- lib/widgets/builder_widgets.dart
- lib/widgets/workout_items_editor.dart
test:
- test/feature_03_workout_configuration_test.dart
where: >-
  <b>Screen</b> lib/screens/workout_edit_screen.dart (_ItemConfigSheet) · <b>Shared
  chrome</b> lib/widgets/builder_widgets.dart, workout_items_editor.dart · <b>Data</b>
  WorkoutItems columns
groups:
- name: What it does
  items:
  - id: sets
    t: A slot carries its own set count, working weight and rest
    d: >-
      how many working sets, the weight to start from, and a rest time that
      overrides the routine's default.
    defines:
    - template.item
    - template.rest
    uses:
    - load.units
  - id: fixed-rep-count
    t: A slot's goal is reps, a rep range, failure, or a hold in seconds
    d: >-
      5, or 6–8, or as many as you have, or 45 s for a held movement — one of the
      four, never a mixture.
    defines:
    - template.rep-target
    uses:
    - exercise.measure
  - id: progression-rates
    t: A slot carries its own progression rates
    d: >-
      the axis and the step/back-off numbers: increment, success threshold, deload
      amount, failure threshold.
    uses:
    - progression.rates
- name: How to use it
  items:
  - id: open-config-sheet
    t: Open the config sheet
    d: open a workout → edit → tap an exercise slot.
  - id: progression-axis-comes-first-sheet
    t: The progression axis comes first in the sheet
    d: >-
      because it decides whether everything below asks for reps or for seconds.
    uses:
    - progression.axis
  - id: reorder-slots-up-down
    t: Drag slots into order by the handle
    d: and add more from the exercise picker.
    uses:
    - template.item
- name: Behaviour & edge cases
  items:
  - id: which-targets-offered-depends-exercise
    t: >-
      Which targets are offered depends on the exercise, not the programme
    d: >-
      the axis is constrained by the measure rather than chosen freely: a counted
      exercise offers weight and reps; a held one offers only a timed hold; and a
      movement that carries no load is not offered the weight axis at all. The builder never offers "a deadlift progressed by time" or "load 2.5 kg
      onto a pull-up". A slot on an unloaded movement reads Bodyweight where the
      weight would be, with no field; on a loaded one a blank field means a number
      still to come.
    uses:
    - exercise.measure
    - progression.axis
    - template.rep-target
  - id: rep-range-keeps-width-progression
    t: A rep range keeps its width as progression moves it
    d: 6–8 steps to 7–9, not 6–9.
    screen: none
    uses:
    - template.rep-target
    - progression.rates
  - id: set-measured-reps-or-seconds
    t: A set is measured in reps or seconds, never both
    d: >-
      a timed set stores seconds and leaves reps at zero, so lifetime reps and volume
      never count a 45-second plank as 45 of anything.
    screen: none
    uses:
    - exercise.measure
    - storage.schema
    - history.aggregates
