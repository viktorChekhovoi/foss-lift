id: "03"
title: Workout configuration
tagline: >-
  Every exercise slot in a workout is configured on its own, in the exercise builder.
screen: workout-edit
code:
- lib/screens/workout_edit_screen.dart
- lib/widgets/builder_widgets.dart
- lib/widgets/workout_items_editor.dart
- lib/data/set_scheme.dart
- lib/data/superset.dart
test:
- test/feature_03_workout_configuration_test.dart
where: >-
  <b>Screen</b> lib/screens/workout_edit_screen.dart (_ItemConfigSheet) · <b>Shared
  chrome</b> lib/widgets/builder_widgets.dart, workout_items_editor.dart · <b>Set
  schemes</b> lib/data/set_scheme.dart (resolveSetTargets), applied by
  ActiveWorkoutController.start · <b>Data</b> WorkoutItems columns
groups:
- name: What it does
  items:
  - id: sets
    t: A slot carries its own set count, working weight and rest
    d: >-
      how many working sets, the weight to start from, and a rest time that
      overrides the routine's default.
    defines:
    - template.rest
    uses:
    - template.item
    - load.units
  - id: fixed-rep-count
    t: A slot's goal is reps, a rep range, failure, or a hold in seconds
    d: >-
      5, or 6–8, or as many as you have, or 45 s for a held movement — one of the
      four, never a mixture.
    defines:
    - template.rep-target
    uses:
    - exercise.measure
  - id: target-opens-on-three-fields
    t: The Target card opens on sets, reps and rest, and nothing else
    d: >-
      those are the three numbers every slot has an answer for, and the three
      most people ever change. Everything else about the target sits behind an
      Advanced toggle in the same card, shut by default.
    uses:
    - template.item
  - id: advanced-holds-the-rest-of-the-target
    t: Advanced holds the rep range, to failure, and the set scheme
    d: >-
      tapping it opens the upper bound of the rep range, the to-failure checkbox
      and the way the sets differ from one another. It opens already expanded on
      a slot that is using any of them, so nothing a slot actually does is hidden
      behind a toggle somebody has to think to press.
    uses:
    - template.set-scheme
    - template.rep-target
  - id: progression-card-has-its-own-advanced
    t: The Progression card has its own Advanced half
    d: >-
      the axis, the two amounts and the two thresholds stay in the open; the ways
      of advancing that most slots never use sit behind an Advanced toggle in the
      same card, shut by default and opening already expanded on a slot that uses
      one. Progression is configured in one place — a rule about how a slot
      advances belongs under Progression whatever it reads from, so the range
      climb is here rather than beside the rep range it needs.
    defines:
    - progression.advanced
    uses:
    - progression.axis
    - progression.rates
  - id: sets-can-back-off-ramp-or-be-written-out
    t: The sets of a slot can back off, ramp up, or be written out one by one
    d: >-
      four schemes. <b>Flat</b> — the default — is every set at the same weight
      and the same target. <b>Back-off</b> opens at the slot's weight and takes a
      configurable percentage off each set after it: at 10%, three sets are 100%,
      90%, 80%. <b>Ramp</b> is the same ladder climbed the other way, so the last
      set is the slot's weight and the ones before it are lighter. <b>Custom</b>
      is a row per set, each with its own rep count and its own percentage of the
      slot's weight. The slot's weight is the top of the ladder in every case, so
      progression still moves one number and the whole scheme moves with it.
    defines:
    - template.set-scheme
    uses:
    - template.item
    - progression.rates
  - id: scheme-weights-land-on-something-loadable
    t: A scheme's weights land on something you can actually load
    d: >-
      90% of 102.5 kg is 92.25, which is not a bar anybody sets. Every weight a
      scheme computes is snapped to the step the current unit counts by — 2.5 kg
      or 5 lb — and held at or above the empty bar for a bar-loaded movement, the
      same two rules a converted target obeys.
    screen: none
    uses:
    - template.set-scheme
    - load.units
    - load.unit-defaults
    - load.bar-weight
  - id: scheme-reaches-the-live-board
    t: The scheme is what the board hydrates from
    d: >-
      each set row opens at its own weight and its own rep goal, so a back-off
      set is judged against the back-off weight rather than against the top one —
      finishing it is not a miss. Editing the exercise's weight mid-session moves
      the whole ladder with it, keeping the proportions: every set still to come
      is recomputed, and sets already logged keep what they were done at.
    screen: session
    points:
    - session
    uses:
    - template.set-scheme
    - session.set-logging
    - session.live-state
    - session.exercise-weight
  - id: slot-joins-the-one-above-as-a-superset
    t: A slot can be joined to the one above it as a superset
    d: >-
      one checkbox in the Target card, naming the exercise directly above it —
      "Superset with Bench Press" — and the two are trained as one group: a set of
      each, back to back, and the rest at the end of the round. Joining a third
      slot to the second makes it a group of three. Only consecutive slots can be
      joined, which is why the control says "the one above" rather than offering a
      list: a group is always the run of rows it looks like. The first slot of a
      workout has nothing above it and so has no checkbox.
    defines:
    - template.superset
    uses:
    - template.item
    - template.rest
  - id: superset-checkbox-says-what-a-superset-is
    t: The checkbox says what a superset is, if you ask it
    d: >-
      an icon beside it opens two sentences — what a superset is, and why anybody
      does one — and nothing sits under the control for everybody who already
      knows. It is the one training term the app defines outside the tour, because
      it is the one a slot can be switched to without knowing what has been asked
      for.
    uses:
    - template.superset
    - ui.gym-vocabulary
  - id: superset-reads-as-a-group-in-the-list
    t: A superset reads as a group in the exercise list
    d: >-
      its rows carry an accent edge down their left and the top one is tagged
      SUPERSET, so which exercises are joined is something you see on the list
      rather than something you open each slot to find out. Each row keeps its own
      target line — a group is a way of performing slots, not a slot of its own.
    uses:
    - template.superset
  - id: progression-rates
    t: A slot carries its own progression rates
    d: >-
      the axis and the step/back-off numbers: increment, success threshold, deload
      amount, failure threshold.
    uses:
    - progression.rates
  - id: step-amounts-tapped-or-typed
    t: The step-up and back-off amounts are tapped as well as typed
    d: >-
      each has − and + beside the box. One tap moves a weight by 1.25 kg, or by
      2.5 lb when the display unit is pounds; a rep count by 1 and a hold by 5 s.
      Typing a value still works and is not rounded to a tap. A step-up will not
      settle below one tap's worth — the buttons stop there, and a smaller number
      typed in is raised to it when you leave the box, because a slot that steps up
      by nothing never progresses. A back-off may be taken to zero, which means a
      missed session never lightens the load.
    uses:
    - progression.rates
    - load.units
  - id: exercise-library-properties-in-sheet
    t: The exercise's own library properties are editable from the config sheet
    d: >-
      how it is loaded, which bar it is over, your note on it, and — for a movement
      you made yourself — the form that holds its name, muscle groups, equipment,
      measure and demo link. They sit in an Exercise card below the per-slot
      settings, captioned to say that they belong to the exercise: an edit lands in
      every routine that uses it, and the sheet above takes the new name, measure and
      loading straight away. A starter exercise's name and classification stay put,
      as they do in the library — a routine code that says "Bench Press" has to mean
      the movement everyone else calls that.
    uses:
    - exercise.identity
    - exercise.taxonomy
    - exercise.measure
    - exercise.notes
    - exercise.weight-type
    - exercise.video-url
    - load.bar-weight
- name: How to use it
  items:
  - id: open-config-sheet
    t: Open the config sheet
    d: open a workout → edit → tap an exercise slot.
    uses:
    - template.item
  - id: adding-exercise-opens-its-config
    t: Adding an exercise opens its config straight away
    d: >-
      picking a movement out of the library closes the picker and opens that
      slot's own sheet on top of the list, because an exercise nobody has set the
      sets, reps and weight on is not finished being added — landing back on the
      list makes every add two taps and leaves the defaults standing on the slots
      where somebody forgot the second one. Backing out of the sheet keeps the
      exercise, at its defaults: it is already in the workout, and the sheet is
      for tuning it rather than for confirming it.
    screen: workout-edit
    uses:
    - template.item
    - template.rep-target
    - progression.axis
  - id: progression-axis-comes-first-sheet
    t: The progression axis comes first in the sheet
    d: >-
      because it decides whether everything below asks for reps or for seconds.
    uses:
    - progression.axis
  - id: turn-on-add-weight-at-top-of-range
    t: Turn on the range climb
    d: >-
      open a slot's config sheet → set a rep range under Target's Advanced →
      scroll to Progression → tap its own Advanced → tick "Add weight only at
      the top of the rep range".
    screen: workout-edit
    uses:
    - progression.double
    - progression.advanced
    - template.rep-target
  - id: sheet-field-stays-above-keyboard
    t: A field tapped in the config sheet scrolls clear of the keyboard
    d: >-
      the sheet scrolls the box you are typing in into view above the keyboard, and
      does it for every text field in it — the weight and both progression amounts.
    uses:
    - ui.system-insets
  - id: reorder-slots-up-down
    t: Drag slots into order by the handle
    d: and add more from the exercise picker.
    uses:
    - template.item
  - id: make-a-superset
    t: Make a superset
    d: >-
      open a workout → edit → tap the second of the two exercises → tick "Superset
      with …". The two rows join in the list behind the sheet.
    uses:
    - template.superset
- name: Behaviour & edge cases
  items:
  - id: which-targets-offered-depends-exercise
    t: >-
      Which targets are offered depends on the exercise, not the program
    d: >-
      the axis is constrained by the measure rather than chosen freely: a counted
      exercise offers weight and reps; a held one offers only a timed hold; and a
      movement that carries no load is not offered the weight axis at all. The builder never offers "a deadlift progressed by time" or "load 2.5 kg
      onto a pull-up". A slot on an unloaded movement reads Bodyweight where the
      weight would be, with no field; on a loaded one a blank field means a number
      still to come.
    uses:
    - exercise.measure
    - exercise.weight-type
    - progression.axis
    - template.rep-target
  - id: range-climb-greyed-without-a-range
    t: The range climb is greyed out until there is a range to climb
    d: >-
      it stays on the list rather than vanishing, greyed and untickable, under
      one line saying what it wants: a rep range. A control that appears and
      disappears as a field two cards up is filled in teaches nobody where it
      went, and somebody looking for double progression needs to find it before
      they can work out what it needs. Set the upper bound and it comes alive
      where they are already looking. The same line does the same job on a slot
      running to failure, and on one progressing by reps or by time, where the
      axis rather than the range is what is missing.
    screen: workout-edit
    uses:
    - progression.double
    - progression.advanced
    - progression.axis
    - template.rep-target
  - id: rep-range-keeps-width-progression
    t: A rep range keeps its width as progression moves it
    d: >-
      6–8 steps to 7–9, not 6–9. That is the reps axis, where the range is the
      thing being advanced. A weight slot ticked to add weight at the top of its
      range does not move the range at all — there the range is the ladder, and a
      ladder that climbs with you is no ladder.
    screen: none
    uses:
    - template.rep-target
    - progression.rates
    - progression.double
  - id: a-joined-slot-dragged-to-the-top-is-unjoined
    t: A joined slot dragged to the top of the list is unjoined
    d: >-
      the first exercise of a workout has nothing above it to be supersetted with,
      so a row that lands there loses the join rather than keeping a link to
      nothing. Dragging it back down does not restore it: the join belongs to a
      pair, and which pair is exactly what the drag changed.
    uses:
    - template.superset
  - id: removing-the-top-of-a-superset-leaves-the-rest-a-group
    t: Removing the top row of a superset leaves the rest of it a group
    d: >-
      delete the first of three joined exercises and the second becomes the top of
      a group of two — the joins that are left still describe consecutive rows.
      Delete all but one and that one is an ordinary slot again.
    uses:
    - template.superset
  - id: set-measured-reps-or-seconds
    t: A set is measured in reps or seconds, never both
    d: >-
      a timed set stores seconds and leaves reps at zero, so lifetime reps and volume
      never count a 45-second plank as 45 of anything.
    screen: none
    uses:
    - exercise.measure
    - storage.schema
    - history.aggregates
