id: "10"
title: History & stats
tagline: Session recaps, recorded history, lifetime totals, and progress charts.
screen: history
code:
- lib/screens/summary_screen.dart
- lib/screens/history_screen.dart
- lib/screens/exercise_progress_screen.dart
- lib/data/exercise_stats.dart
- lib/util/format.dart
test:
- test/feature_10_history_and_stats_test.dart
where: >-
  <b>Screens</b> summary_screen.dart, history_screen.dart, exercise_progress_screen.dart
  · <b>Chart calculations</b> lib/data/exercise_stats.dart · <b>Queries</b> Sessions / SessionSets,
  watchLifetimeTotals(), watchExerciseSetHistory() · <b>Formatting</b> lib/util/format.dart
groups:
- name: What it does
  items:
  - id: post-session-recap
    t: A recap opens after a session is finished
    d: >-
      It shows a "Workout logged" heading, session name, duration and completed-set
      tiles, progression results for each exercise, and logged sets grouped by
      exercise.
    screen: summary
    defines:
    - session.recap
    uses:
    - session.finish
    - history.session-record
    - progression.rates
  - id: session-history
    t: Finished sessions appear in History
    d: >-
      Sessions are ordered newest first. Tapping one opens its recap; the action
      there is Back.
    defines:
    - history.session-record
  - id: lifetime-totals
    t: Lifetime totals appear on Today
    d: The totals are running volume, repetitions, and sets.
    screen: today
    defines:
    - history.aggregates
  - id: recap-repeats-a-cardio-set-s-readouts
    t: The recap includes recorded cardio-machine readouts
    d: >-
      The best console set shows entered speed, incline, resistance, and distance
      below its duration, using the gym's unit. Only populated fields are shown;
      a set with no readouts is unchanged.
    screen: summary
    uses:
    - session.recap
    - session.console-metrics
    - history.session-record
    - load.units
  - id: history-keeps-set-rpe
    t: History keeps the RPE recorded on each set
    d: >-
      Recaps and saved session details append the actual rating to weight and reps,
      such as “100 kg × 5 @8.5”. A blank rating adds nothing, and editing or
      removing a routine target never changes past ratings.
    uses:
    - history.session-record
    - session.effort-rating
    - template.effort-target
    - storage.schema
  - id: per-exercise-progress-chart
    t: Each exercise has a progress chart
    d: >-
      Exercise → Progress plots one top set per session: the heaviest recorded
      weight, or the longest hold for a timed movement.
    screen: exercise-progress
    defines:
    - history.exercise-chart
    uses:
    - exercise.measure
- name: Behaviour & edge cases
  items:
  - id: progression-banner-belongs-session-just
    t: The progression banner belongs to the session just finished
    d: >-
      It is read once and cleared, so reopening the session from History does not
      show it again. Bodyweight slots without a target are omitted.
    screen: summary
    uses:
    - session.recap
    - progression.rates
  - id: lifetime-totals-sum-logged-sets
    t: Lifetime totals are calculated from logged sets
    d: >-
      They are not cached, so totals cannot diverge from the underlying history.
    screen: none
    uses:
    - history.aggregates
    - storage.schema
  - id: deleting-template-never-erases-history
    t: Deleting a template or exercise preserves its training history
    d: >-
      Session IDs are not foreign keys, and set rows store the exercise name
      denormalised. Renaming or deleting an exercise does not rewrite past sessions.
    screen: none
    uses:
    - history.session-record
    - storage.schema
    - exercise.identity
  - id: chart-plots-top-set-only
    t: The chart plots only the top set
    d: >-
      Estimated 1RM is excluded; it is a formula-derived value rather than a lift
      recorded in the session.
    screen: exercise-progress
    uses:
    - history.exercise-chart
