id: "01"
title: Exercise library
tagline: >-
  Search the seeded exercise set or add custom exercises.
screen: library
code:
- lib/screens/library_screen.dart
- lib/screens/exercise_form_screen.dart
- lib/screens/exercise_detail_screen.dart
- lib/data/exercise_filter.dart
- lib/state/exercise_filter_state.dart
- lib/widgets/exercise_filters.dart
- lib/data/plates.dart
- lib/data/database.dart
test:
- test/feature_01_exercise_library_test.dart
- test/feature_01_exercise_filters_test.dart
- test/feature_01_cardio_machines_test.dart
where: >-
  <b>Screens</b> lib/screens/library_screen.dart, exercise_form_screen.dart, exercise_detail_screen.dart
  · <b>Filtering</b> lib/data/exercise_filter.dart, lib/widgets/exercise_filters.dart,
  lib/state/exercise_filter_state.dart
  · <b>Named bars</b> namedBars() in lib/data/plates.dart · <b>Data</b> Exercises
  table + first-run seed in lib/data/database.dart
groups:
- name: What it does
  items:
  - id: ships-85-starter-exercises
    t: Ships 141 starter exercises
    d: >-
      Most include a demo video stored as https://youtu.be/&lt;id&gt;.
    defines:
    - exercise.seed
    uses:
    - exercise.video-url
  - id: the-paused-competition-lifts-are-in-the-starter-set
    t: The three paused competition lifts are in the starter set
    d: >-
      The pause squat, paused bench press, and pause deadlift are separate
      exercises. They use the parent lift's bar and percentage base but keep
      independent history.
    uses:
    - exercise.seed
    - exercise.taxonomy
    - exercise.muscle-map
  - id: the-partial-range-deadlifts-are-in-the-starter-set
    t: The deadlifts that change where the bar starts and stops are in the starter set
    d: >-
      Deadlift to knees, block deadlift, and deficit deadlift are separate
      exercises with independent history. Their percentage base is deadlift.
    uses:
    - exercise.seed
    - exercise.taxonomy
    - template.percentage-base
  - id: the-seated-good-morning-and-the-french-press-are-in-the-starter-set
    t: The seated good morning and the French press are in the starter set
    d: >-
      These are distinct named accessories: the seated good morning and the
      barbell overhead triceps extension (French press), separate from the
      lying skull crusher.
    uses:
    - exercise.seed
    - exercise.taxonomy
    - exercise.muscle-map
  - id: covers-bodyweight-dumbbells-conditioning
    t: Covers bodyweight, dumbbell, and conditioning exercises
    d: >-
      The seeded set includes bodyweight and dumbbell movements plus
      conditioning exercises. Rep-counted conditioning includes burpees, jump
      squats, box jumps, skater jumps, and jumping jacks. Timed conditioning
      includes the wall sit, superman hold, high knees, mountain climbers, bear
      crawl, sprint, jump rope, battle rope, and shadow boxing.
    uses:
    - exercise.seed
    - exercise.taxonomy
    - exercise.measure
    - exercise.muscle-map
  - id: cardio-floor-is-in-the-starter-set
    t: Includes ten cardio machines in the starter set
    d: >-
      The machines are the treadmill, elliptical, stationary bike, recumbent
      bike, rowing machine, stair climber, air bike, ski erg, arc trainer, and
      Jacob's ladder. Each is timed, unweighted, and progresses by duration;
      its involved muscles are secondary groups.
    uses:
    - exercise.seed
    - exercise.taxonomy
    - exercise.measure
    - exercise.muscle-map
    - exercise.weight-type
    - exercise.cardio-machine
  - id: a-cardio-machine-is-cardio-and-a-machine
    t: A movement is a cardio machine when it files under Cardio and its equipment is Machine
    d: >-
      The classification derives console readouts (speed, incline, resistance,
      and distance) without adding a flag to the routine-code format. It also
      gives custom machine exercises the same fields. Cardio bodyweight
      exercises such as burpees do not receive readouts.
    screen: none
    defines:
    - exercise.cardio-machine
    uses:
    - exercise.taxonomy
    - exercise.muscle-map
    - share.routine-code
  - id: conditioning-files-under-cardio
    t: Files timed conditioning under Cardio
    d: >-
      Timed and rep-counted conditioning uses Cardio as its primary group while
      retaining involved muscles as secondary groups. Kettlebell swings and
      Turkish get-ups remain in their strength classifications.
    defines:
    - exercise.taxonomy
    uses:
    - exercise.muscle-map
    - exercise.seed
    - exercise.filter
  - id: cardio-is-appended-not-inserted
    t: Appends Cardio to the group list
    d: >-
      Shared routines encode group indexes rather than names. Appending Cardio
      preserves the meaning of existing codes; inserting or reordering groups
      would re-label them.
    screen: none
    uses:
    - exercise.taxonomy
    - share.routine-code
  - id: searchable-name
    t: Searchable by name, in your language and in English
    d: >-
      Matches the displayed localized name and the stored English name. For
      example, both <i>жим</i> and <i>bench</i> find bench press.
    defines:
    - exercise.filter
    uses:
    - ui.seeded-name
  - id: filterable-muscle-group-equipment
    t: Filterable by muscle group and equipment
    d: >-
      Muscle and Equipment open separate multi-select sheets. Choices within a
      dimension are alternatives; the two dimensions and the search query are
      combined. An untouched dimension matches all values.
    uses:
    - exercise.filter
    - exercise.taxonomy
  - id: muscle-filter-counts-secondaries
    t: The muscle filter counts what a movement assists, not only what it trains
    d: >-
      Matches both primary and secondary groups. For example, Shoulders includes
      bench press and dips even when their primary group is Chest. Search uses
      the same complete group map in both the selected language and English.
    uses:
    - exercise.filter
    - exercise.muscle-map
  - id: filter-stays-set-while-you-use-it
    t: A filter you set stays set
    d: >-
      Muscle and equipment selections persist while navigating and reopening the
      library, and the picker maintains a separate filter state. The active
      choices are shown on the filter buttons. Search text is cleared when its
      field is closed; filters are in-memory only and reset on a cold launch.
    uses:
    - exercise.filter
  - id: movement-names-every-group-trains
    t: A movement names every group it trains, and every group it helps with
    d: >-
      Primary groups describe the movement's purpose; secondary groups describe
      additional muscles worked. Every exercise has at least one primary, may
      have no secondaries, and cannot contain the same group in both lists.
    screen: exercise-detail
    defines:
    - exercise.muscle-map
    uses:
    - exercise.taxonomy
  - id: lead-primary-is-where-it-files
    t: The first primary is where the movement files
    d: >-
      The library, history rollups, and legacy routine codes use the first primary
      group. An exercise appears once, so bench press is listed under Chest and
      not again under Arms.
    uses:
    - exercise.muscle-map
    - exercise.seed
  - id: each-exercise-opens-detail-page
    t: Each exercise opens a detail page
    d: >-
      Shows the exercise facts, demo link, primary groups, and secondary groups.
      The secondary row is omitted when it is empty.
    screen: exercise-detail
    uses:
    - exercise.identity
    - exercise.video-url
    - exercise.muscle-map
  - id: add-your-own-custom-exercises
    t: Add your own custom exercises
    d: >-
      Library → ＋ → enter the name, groups, equipment, measurement, loading, and
      optional demo link → Save. Custom exercises appear with the starter set.
    screen: exercise-form
    defines:
    - exercise.identity
    uses:
    - exercise.taxonomy
    - exercise.muscle-map
    - exercise.measure
    - exercise.weight-type
    - exercise.video-url
  - id: form-ticks-primary-then-secondary
    t: The form ticks the primaries first, then the secondaries
    d: >-
      The form has separate primary and secondary rows. Selecting a group in one
      row clears it in the other, and at least one primary is required. Primary
      selection order is stored; the first selected group determines filing.
    screen: exercise-form
    uses:
    - exercise.muscle-map
  - id: edit-them-afterwards
    t: Edit your own afterwards
    d: >-
      The app-bar pencil reopens the form with the saved values. It is available
      for custom exercises and hidden for starter exercises.
    screen: exercise-form
    uses:
    - exercise.identity
  - id: measure-counted-or-held
    t: Measure — counted or held
    d: >-
      Exercises are measured by repetitions or timed holds; this controls the
      progression axes available to their slots. Timed starters include Plank,
      Side Plank, Hollow Hold, Superman Hold, Dead Hang, Farmer's Carry, Wall
      Sit, seven timed conditioning movements (High Knees, Mountain Climber, Bear
      Crawl, Sprint, Jump Rope, Battle Rope, Shadow Boxing), and all ten cardio
      machines.
    screen: exercise-form
    defines:
    - exercise.measure
    uses:
    - exercise.seed
  - id: weight-type-barbell-machine-or
    t: Weight type — barbell, machine, dumbbell, or nothing at all
    d: >-
      Controls whether plate math is shown (barbell only) and whether the
      exercise has a load. Clearing the load for a pull-up or plank removes its
      weight field, bar row, and warm-up ramp.
    screen: exercise-form
    defines:
    - exercise.weight-type
    uses:
    - load.plate-solver
    - session.warmup-ramp
  - id: bar-optional-bar-own
    t: Bar — an optional bar of its own
    d: >-
      Overrides the app-wide default. From an exercise, choose Bar weight and
      select or add a bar, or return to the default. The list is shared with
      Exercise settings → Default bar.
    screen: exercise-detail
    uses:
    - load.bar-weight
  - id: unit-optional-unit-own
    t: Unit — an optional unit of its own
    d: >-
      Overrides the app-wide unit. From an exercise, choose Unit → kg or lb, or
      return to the app setting. Selecting the current app unit returns control to
      the app instead of storing a redundant override.
    screen: exercise-detail
    defines:
    - load.exercise-unit
    uses:
    - load.units
  - id: warm-ups-own-count
    t: Warm-ups — a count of its own
    d: >-
      Overrides the app-wide warm-up count from zero through six rungs. The
      control is hidden when the app-wide count is zero because no ramp can open.
    screen: exercise-detail
    uses:
    - session.warmup-count
    - session.warmup-ramp
  - id: your-own-note-movement
    t: Your own note on the movement
    d: >-
      Available on starter and custom exercises, capped at 300 characters. A
      whitespace-only note is stored as absent and notes are never shared.
    screen: exercise-detail
    defines:
    - exercise.notes
- name: How to use it
  items:
  - id: browse-search
    t: Browse / search
    d: >-
      Open the library from Profile or the exercise picker. Search by name and
      select filter chips as needed.
    uses:
    - exercise.filter
  - id: new-exercise-inside-picker
    t: New exercise from inside the picker
    d: >-
      The picker places New exercise at the top and returns the saved exercise to
      the slot being configured.
    screen: workout-edit
    uses:
    - exercise.identity
    - template.item
  - id: write-note
    t: Write a note
    d: >-
      Open an exercise → My note → type. During a workout, a note icon opens the
      note beside the exercise name.
    screen: exercise-detail
    uses:
    - exercise.notes
- name: Behaviour & edge cases
  items:
  - id: note-box-keeps-its-width
    t: The note box keeps its width as you type
    d: >-
      The note field uses the dialog's full width from open and keeps that width
      while editing, in the library and live-session screens.
    screen: exercise-detail
    uses:
    - exercise.notes
  - id: starter-s-demo-video-not
    t: A starter demo is a specific video
    d: >-
      Starter video IDs are maintained in _starterDemos with each video's title
      and can be rechecked through YouTube oEmbed. Missing demonstrations use a
      null URL and are omitted from the detail page.
    screen: exercise-detail
    defines:
    - exercise.video-url
    uses:
    - exercise.seed
  - id: form-asks-how-movement-measured
    t: The form asks how a movement is measured before how it is loaded
    d: >-
      Measurement controls the loading form. Switching to held clears the load;
      switching back to counted seeds it from equipment. Held exercises may still
      be loaded, but the load is optional and shown in a secondary control.
    screen: exercise-form
    uses:
    - exercise.measure
    - exercise.weight-type
  - id: muscle-groups-lead-equipment-follows
    t: Filter buttons show active choices and expose Clear
    d: >-
      Buttons show their dimension name until a choice is active, then show the
      selected groups or equipment. Clear appears while either dimension is
      filtered and does not change search text; dimension labels disambiguate the
      shared Other value.
    uses:
    - exercise.filter
    - exercise.taxonomy
  - id: named-bar-weight-label-way
    t: An exercise remembers its bar's weight, not which row it was
    d: >-
      Exercises store the bar weight, not a bar-row ID. Reweighting a bar updates
      its exercises; deleting it falls back to the default; shared routines can
      carry a weight unknown to the receiving phone. Values are stored in the
      exercise's unit (for example, 45 lb rather than a converted kilogram value).
    screen: exercise-form
    uses:
    - load.bar-weight
    - load.units
    - share.routine-code
  - id: youtube-demo-link-tidied-way
    t: A YouTube demo link is tidied on the way in
    d: >-
      YouTube watch, short, embed, and youtu.be URLs are normalized to
      https://youtu.be/&lt;id&gt; with timestamps, playlists, and tracking parameters
      removed. Other URLs are preserved locally but are excluded from shared
      exercises; search URLs are not treated as video IDs.
    screen: exercise-form
    uses:
    - exercise.video-url
    - share.routine-code
  - id: seven-groups-and-no-finer
    t: There are seven muscle groups, and no finer
    d: >-
      The groups are Chest, Back, Shoulders, Legs, Arms, Core, and Other. Hip
      thrusts and glute bridges use Legs; wrist curls, carries, and traps use
      Arms or Back as appropriate. Compound exercises can name multiple groups;
      there is no finer-grained group vocabulary.
    defines:
    - exercise.taxonomy
    uses:
    - exercise.muscle-map
  - id: no-starter-files-under-other
    t: No starter movement files under Other any more
    d: >-
      Seeded kettlebell swing, clean, and Turkish get-up now use their actual
      groups (Legs/Back; Legs/Back/Shoulders; Core/Shoulders). Other remains valid
      for custom exercises and remains in the vocabulary for routine-code
      compatibility.
    uses:
    - exercise.muscle-map
    - exercise.seed
    - exercise.taxonomy
  - id: existing-exercises-keep-their-group
    t: An exercise from before the update keeps its group as its only primary
    d: >-
      Existing custom exercises retain their single primary group and no
      secondaries. Starter exercises are remapped during migration; user-set
      loading, bar, and notes are unchanged.
    screen: none
    uses:
    - exercise.muscle-map
    - exercise.seed
    - storage.migration
  - id: group-equipment-lists-wire-format
    t: The group and equipment lists are a wire format
    d: >-
      Shared routines encode group and equipment indexes rather than names. The
      lists are append-only; reordering entries would change the meaning of
      existing codes.
    screen: none
    uses:
    - exercise.taxonomy
    - share.routine-code
  - id: only-custom-exercise-editable-full
    t: Starter names and classifications are fixed; loading is editable
    d: >-
      Names and classifications are shared vocabulary, so the database writer
      rejects local changes that would invalidate routine codes. Weight type, bar,
      and note remain editable for any exercise.
    screen: exercise-detail
    uses:
    - exercise.identity
    - exercise.seed
    - share.routine-code
  - id: name-stops-80-characters-where
    t: A name stops at 80 characters where it is typed
    d: >-
      Applies to exercises, workouts, and routines. The schema rejects a longer
      value rather than truncating it.
    screen: exercise-form
    uses:
    - exercise.identity
    - storage.schema
  - id: weight-type-seeded-equipment
    t: Weight type is seeded from equipment
    d: >-
      Defaults are Barbell → bar, Dumbbell → dumbbell, Bodyweight → unweighted,
      and all other equipment → machine. Explicit exceptions cover kettlebell
      swing and Turkish get-up (dumbbell loading), ab wheel, jump rope, and battle
      rope (unweighted), and all cardio machines (unweighted). Starters whose
      names specify the implement have fixed loading; the database enforces this
      independently of the form. Other exercises retain editable loading because
      equipment classification does not determine what a gym uses. Bar weight is
      always separately editable.
    screen: exercise-form
    uses:
    - exercise.weight-type
    - exercise.taxonomy
    - exercise.seed
    - load.bar-weight
