id: "11"
title: Colour themes
tagline: Pick a preset theme, build your own, or bring in one someone shared.
screen: theme-settings
code:
- lib/theme/app_theme.dart
- lib/theme/theme_code.dart
- lib/widgets/theme_preview.dart
- lib/widgets/share_widgets.dart
- lib/screens/theme_settings_screen.dart
- lib/screens/theme_import_screen.dart
- lib/screens/scan_screen.dart
- lib/services/deep_links.dart
- lib/services/qr_decoder.dart
test:
- test/feature_11_themes_test.dart
where: >-
  <b>Palette + presets</b> lib/theme/app_theme.dart (AppColors) · <b>Code format</b>
  lib/theme/theme_code.dart · <b>Preview</b> lib/widgets/theme_preview.dart; <b>QR</b>
  share_widgets.dart · <b>Screens</b> theme_settings_screen.dart, theme_import_screen.dart,
  scan_screen.dart · <b>Links</b> lib/services/deep_links.dart; <b>frames</b>
  lib/services/qr_decoder.dart · <b>Stored in</b> Settings.themePresetId + CustomThemes
groups:
- name: What it does
  items:
  - id: eight-preset-themes-four-dark
    t: Eight preset themes as four dark/light pairs
    d: >-
      Ignition and Daylight are the everyday defaults, dark and light; Graphite and
      Paper are the second everyday pair; then Solarized dark and light, and a
      high-contrast option in each brightness.
    defines:
    - theme.palette-source
    uses:
    - theme.colour-role
  - id: many-custom-themes-you-like
    t: As many custom themes as you like
    d: >-
      each named, each edited role by role, with a live preview of the palette
      you are editing. Tap New theme, name it, and edit each colour role; the
      preview at the top follows every change.
    screen: theme-custom
    defines:
    - theme.palette-source
    - theme.colour-role
    uses:
    - theme.picker
    - theme.preview
  - id: shares-one-your-own-qr
    t: Shares one of your own as a QR code or a code you can paste
    d: >-
      the share sheet sends the bare code, because a chat app will not make a
      fosslift:// link tappable and an unclickable link is worse than a string
      nobody expected to click.
    uses:
    - share.theme-code
    - share.qr
    - share.deep-link
- name: The preview & the two markers
  screen: theme-custom
  uses:
  - theme.preview
  - theme.colour-role
  items:
  - id: preview-workout-board
    t: The preview is the workout board
    d: >-
      a miniature of the screen the palette has to survive — an exercise heading,
      three set rows (a hit, a short one, one still to do) and the stat strip —
      rather than twelve swatches. The set rows are the point: Completed and Missed
      goal are the palette's hardest job, and a chip of each says nothing about
      telling them apart at speed, while the untouched third row puts surface2,
      surface3 and faint on screen doing their real jobs.
    defines:
    - theme.preview
  - id: two-warnings-both-binary
    t: Two warnings, both binary
    d: >-
      one when text is too close to its background — comparing the preview's own
      text against its ground and cards at the same 4.5:1 the presets are held to
      — and one when the two markers are too close to each other. Guidance, never
      a running number.
    defines:
    - theme.contrast-check
    uses:
    - theme.contrast-check
  - id: done-short-must-unmistakable-each
    t: Completed and Missed goal must be unmistakable from each other
    d: >-
      every preset holds them at least kMarkerDistance apart in CIELAB, and both
      clear 4.5:1 against the ground and a card. Contrast against the background
      was never the problem — Solarized's green and yellow sit at the same luminance,
      so their ratio against each other is 1.00 and says nothing. They also differ
      by more than hue: two colours that differ only in hue are the one pair a
      colour-blind reader cannot separate at all, so a set that came up short also
      carries a downward arrow. The colour is the fast read; the arrow is the one
      that always works.
    uses:
    - theme.contrast-check
    manual: true
- name: The colour picker
  screen: theme-custom
  uses:
  - theme.picker
  - theme.colour-role
  items:
  - id: speaks-rgb-hsl-because-they
    t: It speaks RGB, and nothing else
    d: >-
      three channels and six hex digits are how every colour a palette is built
      from is written down — off a brand guide, out of the Solarized spec, from a
      screenshot. HSL was offered beside it and taken back out: a second notation
      for the same six bytes is a toggle to learn, not a colour you could not
      otherwise reach. Every colour the shipped presets use can be reached by hand,
      and that is asserted rather than assumed.
    defines:
    - theme.picker
    uses:
    - theme.palette-source
  - id: hex-field-takes-rgb-rrggbb
    t: 'A hex can be typed, pasted or copied out'
    d: >-
      the field takes #RGB, #RRGGBB or bare RRGGBB, and anything that does not read
      yet simply does not move the colour — so backspacing through a hex is not
      destructive and a typo cannot silently repaint a role. There are explicit copy
      and paste buttons, and a long press on any role row copies that role's hex,
      because building a family by hand starts from the last one's value and retyping
      six digits is what stops people doing it.
  - id: each-slider-track-painted-colours
    t: Each slider track is painted with the colours it traverses
    d: so it previews its own effect rather than asking you to imagine it.
  - id: label-filled-button-measured-not
    t: The label on a filled button is measured, not assumed
    d: >-
      whichever of a near-black tint or white reads better on the accent wins,
      so a custom or imported accent of any lightness still gets a legible label.
    uses:
    - theme.contrast-check
- name: Presets, accessibility & storage
  items:
  - id: untouched-install-follows-phone
    t: An untouched install follows the phone
    d: >-
      Ignition on a phone set to dark, Daylight on one set to light, flipping
      with the system until a theme is picked. A stored choice outranks the system
      from then on.
    uses:
    - theme.palette-source
    - storage.settings
  - id: nothing-painted-until-stored-theme
    t: Nothing is painted until the stored theme is known
    d: >-
      the root holds a bare ground-coloured frame rather than painting a frame
      of the wrong theme and correcting it — which was a flicker on every cold
      launch.
    uses:
    - theme.palette-source
    - ui.navigation
  - id: tab-shell-takes-colours-palette
    t: The tab shell takes its colours from the palette, not from AppColors
    d: >-
      go_router holds its branch navigators by GlobalKey, so re-keying MaterialApp
      moves its elements instead of rebuilding them — which is why a cold launch
      used to paint the navigation bar in the previous theme.
    uses:
    - theme.colour-role
    - ui.navigation
  - id: picker-groups-presets-brightness
    t: The picker groups presets by brightness
    d: >-
      Profile → Appearance, then tap one: dark then light, with each group's
      high-contrast option last and badged AAA. Long-pressing the badge explains
      it; so does tapping it, but only on the row already selected.
    uses:
    - theme.palette-source
  - id: both-accessible-presets-clear-wcag
    t: Both accessible presets clear WCAG AAA (7:1) for body text
    d: >-
      and AA (4.5:1) for secondary text, the accent, the completed marker and
      the record marker — over both the ground and a card — with borders above
      the 3:1 non-text floor. Every other preset clears 4.5:1 for body text.
    uses:
    - theme.contrast-check
    - theme.palette-source
    manual: true
  - id: solarized-ships-published-two-documented
    t: Solarized ships as published, with two documented departures
    d: >-
      body text takes the palette's emphasized tier rather than its body tier
      (Solarized's own body tones sit near 4.1:1), and the two intermediate surfaces
      are blends, since the palette defines two background tones and the app paints
      four.
    uses:
    - theme.palette-source
    - theme.colour-role
  - id: custom-theme-never-badged-accessible
    t: A custom theme is never badged accessible
    d: >-
      however it got there. The badge means the palette was designed and checked
      against WCAG, which is a fact about the two shipped presets. The claim is
      dropped on import and the row refuses to draw the badge whatever is stored.
    screen: theme-custom
    uses:
    - theme.contrast-check
  - id: only-your-own-themes-shareable
    t: Only your own themes are shareable
    d: >-
      the share row is hidden unless one of your own is selected: Show QR for
      someone to scan, or Send code for the system share sheet, which is also where
      "copy" lives. It sends the one that is selected, not "the custom slot".
    uses:
    - share.theme-code
    - share.qr
    - theme.palette-source
  - id: shared-theme-always-previewed-never
    t: A shared theme is always previewed, never applied on arrival
    d: >-
      Scan QR uses the camera and Paste code takes a code or a link; a scan, a tapped
      link and a pasted code all land on the same confirmation screen, and accepting
      it closes that screen rather than leaving you looking at the offer you just
      took. A code that will not decode offers nothing to apply.
    screen: theme-import
    defines:
    - share.import-review
    uses:
    - share.import-review
    - theme.preview
  - id: arriving-theme-added-your-own
    t: An arriving theme is added to your own, never substituted
    d: >-
      it never claims a preset slot and never overwrites a theme you built — importing
      four codes leaves you holding four themes.
    screen: theme-import
    uses:
    - share.import-review
    - theme.palette-source
  - id: deleting-confirmed-deleting-one-you
    t: Deleting is confirmed, and deleting the one you are looking at is safe
    d: >-
      open one of your own with the pencil: the name field renames it, and the bin
      in the app bar deletes it after a confirmation. The app falls back to the
      system default in the same write that removes the theme, so no selection is
      ever left pointing at nothing.
    screen: theme-custom
    uses:
    - theme.palette-source
  - id: choice-stored-slug-your-themes
    t: The choice is stored as a slug; your themes are rows
    d: >-
      Settings holds themePresetId — a preset slug, custom:&lt;n&gt;, or none
      — and each of your themes is a row in CustomThemes holding its palette as
      JSON. The name lives inside that JSON. A slug naming something that no longer
      exists falls back to the default, as any unknown slug does — including a
      custom:&lt;n&gt; whose row is gone.
    screen: none
    uses:
    - theme.palette-source
    - storage.settings
    - storage.schema
- name: Sharing format
  screen: none
  uses:
  - share.theme-code
  items:
  - id: theme-code-flt1-followed-base64url
    t: A theme code is FLT1. followed by base64url
    d: >-
      the whole palette in 65–84 characters. FLT1 is a format version, read first
      and dispatched on, so a future FLT2 is declined rather than misread.
    defines:
    - share.theme-code
  - id: bytes-between-name-trailing-checksum
    t: Bytes between the name and the trailing checksum are ignored
    d: so a later writer can add a field without breaking older readers.
  - id: role-order-wire-format
    t: The role order is a wire format
    d: reordering it silently changes the meaning of every code already shared.
    defines:
    - theme.colour-role
    uses:
    - theme.colour-role
  - id: crc-16-catches-damage-codes
    t: A CRC-16 catches the damage codes actually suffer
    d: a truncated paste, a mistyped character. It is not a security measure.
  - id: reading-distinguishes-two-failures
    t: Reading distinguishes two failures
    d: >-
      not a theme code at all (which includes any tag that is not FLT1), or damaged
      in transit.
    screen: theme-import
    uses:
    - share.import-review
  - id: links-fosslift-theme-code
    t: A link that arrives is fosslift://theme/&lt;code&gt;
    d: >-
      a custom scheme rather than an https App Link, so it needs no domain, no
      hosting and no network. Chat apps will not linkify it, which is why nothing
      sends one any more — but anything that hands the app one is still read.
    defines:
    - share.deep-link
    uses:
    - share.deep-link
  - id: qr-codes-hold-full-link
    t: QR codes hold the full link
    d: >-
      so one image serves both a system camera and the in-app scanner. Decoding
      is pure Dart via zxing2, not Google's ML Kit, keeping the app free of proprietary
      binaries.
    uses:
    - share.qr
    - share.deep-link
