id: "11"
title: Color themes
tagline: Choose a preset, create a custom theme, or import one.
screen: theme-settings
code:
- lib/theme/app_theme.dart
- lib/theme/theme_code.dart
- lib/widgets/common.dart
- lib/widgets/theme_preview.dart
- lib/widgets/share_widgets.dart
- lib/screens/appearance_screen.dart
- lib/screens/theme_import_screen.dart
- lib/screens/scan_screen.dart
- lib/services/deep_links.dart
- lib/services/qr_decoder.dart
test:
- test/feature_11_themes_test.dart
where: >-
  <b>Palette + presets</b> lib/theme/app_theme.dart (AppColors) · <b>Code format</b>
  lib/theme/theme_code.dart · <b>Preview</b> lib/widgets/theme_preview.dart; <b>QR</b>
  share_widgets.dart · <b>Screens</b> appearance_screen.dart, theme_import_screen.dart,
  scan_screen.dart · <b>Links</b> lib/services/deep_links.dart; <b>frames</b>
  lib/services/qr_decoder.dart · <b>Stored in</b> Settings.themePresetId + CustomThemes
groups:
- name: What it does
  items:
  - id: appearance-holds-look-app
    t: Appearance contains visual settings
    d: >-
      Profile → Appearance contains the theme, text size, and language. Profile →
      Exercise settings contains units, bars and plates, deload rules, and set
      videos.
    uses:
    - theme.palette-source
    - ui.text-scale
    - ui.language
    - ui.navigation
  - id: eight-preset-themes-four-dark
    t: Eight presets in four dark/light pairs
    d: >-
      The presets are Ignition/Daylight, Graphite/Paper, Solarized dark/light, and
      one high-contrast preset for each brightness.
    defines:
    - theme.palette-source
    uses:
    - theme.colour-role
  - id: many-custom-themes-you-like
    t: Custom themes can be created without a fixed limit
    d: >-
      Each custom theme has a name and editable color roles. New theme opens the
      editor; the preview updates as roles change.
    screen: theme-custom
    defines:
    - theme.colour-role
    uses:
    - theme.palette-source
    - theme.picker
    - theme.preview
  - id: editing-preset-saves-copy
    t: Editing a preset saves a custom copy
    d: >-
      Editing a preset opens its colors under "New from Ignition". Saving creates a
      custom theme and leaves the preset unchanged. A copied high-contrast preset
      does not retain the AAA badge.
    screen: theme-custom
    uses:
    - theme.palette-source
    - theme.picker
    - theme.preview
    - theme.contrast-check
  - id: duplicating-one-your-own
    t: Custom themes can be duplicated from the picker
    d: >-
      The copy icon creates and selects "Mine copy", adding a numeric suffix when
      needed. Duplicating an imported theme does not retain an accessibility claim.
    uses:
    - theme.picker
    - theme.palette-source
    - theme.contrast-check
  - id: shares-one-your-own-qr
    t: Custom themes can be shared as QR or text codes
    d: >-
      The share sheet sends the bare code. Chat applications do not generally
      linkify fosslift:// URLs.
    uses:
    - share.theme-code
    - share.qr
    - share.deep-link
- name: The preview & the two markers
  screen: theme-custom
  uses:
  - theme.preview
  - theme.colour-role
  items:
  - id: preview-workout-board
    t: The preview uses a workout board
    d: >-
      The preview contains an exercise heading, three set rows (completed, missed,
      and pending), and a stat strip. It exercises the Completed and Missed goal
      markers plus surface2, surface3, and faint roles in context.
    defines:
    - theme.preview
  - id: two-warnings-both-binary
    t: The preview reports two binary contrast warnings
    d: >-
      One warning compares preview text with its background and cards at 4.5:1.
      The other compares the two markers. Both are binary; no ratio is displayed.
    defines:
    - theme.contrast-check
  - id: done-short-must-unmistakable-each
    t: Completed and Missed goal markers must be distinguishable
    d: >-
      Presets keep the markers at least kMarkerDistance apart in CIELAB, and each
      marker has 4.5:1 contrast against the ground and a card. A missed set also
      displays a downward arrow so the state remains distinguishable without color.
    uses:
    - theme.contrast-check
    manual: true
- name: The colour picker
  screen: theme-custom
  uses:
  - theme.picker
  - theme.colour-role
  items:
  - id: speaks-rgb-hsl-because-they
    t: The picker uses RGB values
    d: >-
      Colors use three RGB channels represented by six hex digits. HSL is not
      exposed. Every color in the shipped presets is reachable through the picker.
    defines:
    - theme.picker
    uses:
    - theme.palette-source
  - id: hex-field-takes-rgb-rrggbb
    t: 'A hex can be typed, pasted or copied out'
    d: >-
      the field takes #RGB, #RRGGBB or bare RRGGBB, and anything that does not read
      yet simply does not move the colour — so backspacing through a hex is not
      destructive and a typo cannot silently repaint a role. There are explicit copy
      and paste buttons, and a long press on any role row copies that role's hex,
      because building a family by hand starts from the last one's value and retyping
      six digits is what stops people doing it.
  - id: each-slider-track-painted-colours
    t: Slider tracks show their traversed colors
    d: Each track shows the colors produced along its range.
  - id: label-filled-button-measured-not
    t: Filled-button labels use a measured contrast choice
    d: >-
      The button chooses between a near-black tint and white based on contrast with
      the accent.
    uses:
    - theme.contrast-check
- name: Presets, accessibility & storage
  items:
  - id: untouched-install-follows-phone
    t: An untouched install follows the system brightness
    d: >-
      Ignition is selected when the system is dark and Daylight when it is light.
      The selection follows system brightness until a theme is chosen.
    uses:
    - theme.palette-source
    - storage.settings
  - id: nothing-painted-until-stored-theme
    t: The app waits for the stored theme before painting
    d: >-
      The root shows a neutral frame until the stored theme is loaded, preventing
      a flash of the wrong theme on cold launch.
    uses:
    - theme.palette-source
    - ui.navigation
  - id: tab-shell-takes-colours-palette
    t: The tab shell uses palette roles
    d: >-
      go_router retains branch navigators by GlobalKey. The tab shell reads palette
      roles directly so changing the MaterialApp key does not preserve stale colors.
    uses:
    - theme.colour-role
    - ui.navigation
  - id: picker-groups-presets-brightness
    t: The picker groups presets by brightness
    d: >-
      Profile → Appearance lists dark presets followed by light presets. The
      high-contrast preset is last in each group and has an AAA badge; tapping or
      long-pressing the selected badge explains it.
    uses:
    - theme.palette-source
  - id: both-accessible-presets-clear-wcag
    t: Both accessible presets meet WCAG AAA (7:1) for body text
    d: >-
      They provide 7:1 for body text, 4.5:1 for secondary text, accent, completed
      marker, and record marker over ground and card, and 3:1 for borders. Other
      presets provide at least 4.5:1 for their three text tones.
    uses:
    - theme.contrast-check
    - theme.palette-source
    manual: true
  - id: solarized-ships-published-two-documented
    t: Solarized retains its published colors with adjusted text tones
    d: >-
      Solarized grounds, cards, and accent use Schoonover's colors. Text tones are
      adjusted to meet 4.5:1 on all four app surfaces: dark body text uses base2
      with quieter tones toward base1; light body text uses base02 with darker
      base01 and base00. Intermediate surfaces are blends and retain the same floor.
    uses:
    - theme.palette-source
    - theme.colour-role
    - theme.contrast-check
  - id: custom-theme-never-badged-accessible
    t: Custom themes never receive the accessible badge
    d: >-
      The badge is reserved for the two shipped palettes checked against WCAG. It
      is removed on import or preset duplication and is not drawn for custom rows.
    screen: theme-custom
    uses:
    - theme.contrast-check
  - id: only-your-own-themes-shareable
    t: Only custom themes are shareable
    d: >-
      The share row appears when a custom theme is selected. Show QR displays it;
      Send code opens the system share sheet, which also provides Copy.
    uses:
    - share.theme-code
    - share.qr
    - theme.palette-source
  - id: shared-theme-always-previewed-never
    t: Imported themes are previewed before application
    d: >-
      Scan QR, a tapped link, and Paste code all open the same confirmation screen.
      Accepting closes it; an undecodable code offers no theme to apply.
    screen: theme-import
    uses:
    - share.import-review
    - share.qr
    - share.deep-link
    - share.theme-code
    - theme.preview
  - id: arriving-theme-added-your-own
    t: Imported themes are added to custom themes
    d: >-
      Imports never occupy preset slots or overwrite existing custom themes.
    screen: theme-import
    uses:
    - share.import-review
    - theme.palette-source
  - id: deleting-confirmed-deleting-one-you
    t: Theme deletion requires confirmation and clears the active selection safely
    d: >-
      The editor's name field renames a custom theme. The app-bar bin deletes it
      after confirmation and selects the system default if it was active.
    screen: theme-custom
    uses:
    - theme.palette-source
  - id: choice-stored-slug-your-themes
    t: Preset selection is a slug; custom themes are rows
    d: >-
      Settings.themePresetId stores a preset slug, custom:&lt;n&gt;, or none. CustomThemes
      stores each custom palette as JSON, including its name. Unknown slugs and
      missing custom rows fall back to the default.
    screen: none
    uses:
    - theme.palette-source
    - storage.settings
    - storage.schema
- name: Legibility of the app's own type
  screen: today
  items:
  - id: every-text-tone-readable-every-palette
    t: Every text tone remains readable in every palette
    d: >-
      Each palette defines body, secondary, and dimmest text tones. All three meet
      4.5:1 on the ground, card, nested surface, and resume-bar surface.
    uses:
    - theme.colour-role
    - theme.type-scale
    - theme.contrast-check
  - id: headings-readable-every-palette
    t: Text tones retain their hierarchy across palettes
    d: >-
      Body text has the highest contrast, followed by secondary and dimmest. List
      headings use secondary; screen-title eyebrows use body text.
    uses:
    - theme.colour-role
    - theme.type-scale
- name: Sharing format
  screen: none
  uses:
  - share.theme-code
  items:
  - id: theme-code-flt1-followed-base64url
    t: A theme code consists of FLT1. and base64url data
    d: >-
      The payload is the whole palette in 65–84 characters. FLT1 is read first;
      unsupported versions such as FLT2 are rejected.
    defines:
    - share.theme-code
  - id: bytes-between-name-trailing-checksum
    t: Readers ignore bytes between the name and trailing checksum
    d: This permits later writers to add fields without breaking older readers.
  - id: role-order-wire-format
    t: Palette role order is part of the wire format
    d: Reordering roles changes the meaning of existing shared codes.
    uses:
    - theme.colour-role
  - id: crc-16-catches-damage-codes
    t: CRC-16 detects common code corruption
    d: It detects truncated or mistyped codes but is not a security measure.
  - id: reading-distinguishes-two-failures
    t: Decoding distinguishes invalid and corrupted codes
    d: >-
      The input is either not a theme code (including a non-FLT1 tag) or damaged in
      transit.
    screen: theme-import
    uses:
    - share.import-review
  - id: links-fosslift-theme-code
    t: Incoming links use fosslift://theme/&lt;code&gt;
    d: >-
      This custom scheme requires no domain, hosting, or network. Chat apps may not
      linkify it, but the app still accepts incoming links.
    uses:
    - share.deep-link
  - id: qr-codes-hold-full-link
    t: QR codes contain the full theme link
    d: >-
      The full link lets both a system camera and the in-app scanner decode it.
      Decoding uses the pure-Dart zxing2 package.
    uses:
    - share.qr
    - share.deep-link
