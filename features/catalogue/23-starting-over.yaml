id: "23"
title: Starting over
tagline: >-
  Reset all app data and reseed the first-launch state from one destructive
  action.
screen: backup
code:
- lib/data/database.dart
- lib/screens/backup_screen.dart
- lib/providers/providers.dart
test:
- test/feature_23_starting_over_test.dart
where: >-
  <b>The wipe</b> AppDatabase.resetEverything — every table emptied and the
  first-launch seed written again, in one transaction ·
  <b>Screen</b> lib/screens/backup_screen.dart (the last section, under save and
  restore) · <b>Clips</b> lib/services/set_video_store.dart · <b>The unit
  afterwards</b> unitSeedProvider
groups:
- name: What it does
  items:
  - id: reset-empties-the-app-back-to-a-fresh-install
    t: Reset puts the app back to a fresh install
    d: >-
      Reset empties sessions, sets, routines, workouts, slots, custom exercises,
      bars, plates, themes, and settings, then writes the first-launch seed:
      starter movements, racked bars, and an unconfigured settings row.
    defines:
    - storage.reset
    uses:
    - storage.schema
    - exercise.seed
  - id: reset-says-what-goes-before-it-goes
    t: It says what it is about to destroy, and asks
    d: >-
      The confirmation dialog lists history, routines, exercises, and settings,
      states that reset cannot be undone, and does not default to confirmation.
      Dismissal or back navigation leaves the database unchanged.
    uses:
    - storage.reset
    - ui.dialog
  - id: reset-points-at-the-backup-first
    t: It offers the backup before it takes the log
    d: >-
      The dialog recommends saving a backup before reset while the data still
      exists. It does not force a backup flow. The Backup screen presents only
      the Reset heading and action outside the confirmation dialog.
    uses:
    - storage.reset
    - share.backup-file
  - id: a-backup-holds-everything-a-reset-takes
    t: A backup taken with its clips holds everything a reset takes
    d: >-
      A backup includes the database and, when selected, all clips. Reset empties
      that database and deletes those clips, so restoring the corresponding
      backup restores the reset data, including settings. Backups made without
      clips cannot restore those clips.
    screen: none
    uses:
    - storage.reset
    - share.backup-file
    - video.storage
  - id: reset-takes-the-clips-off-the-disk-too
    t: The set videos go with it
    d: >-
      Set videos are files in app storage referenced by set rows. Reset deletes
      them with the rows so it does not leave unreachable files. Builds without
      filesystem video storage have no clips to delete.
    uses:
    - storage.reset
    - video.storage
  - id: reset-hands-back-the-first-run
    t: Afterwards the app behaves as if it had never been opened
    d: >-
      Reset restores the first-run tour, clears the routine list, and leaves Today
      without a current routine. The weight unit is inferred again from the
      phone's region whenever the stored setting is absent, so the app can render
      immediately without asking a new question.
    screen: today
    uses:
    - storage.reset
    - load.unit-defaults
    - ui.tutorial
    - template.starter-library
- name: What it refuses
  items:
  - id: reset-refuses-during-a-workout
    t: It will not run over a running workout
    d: >-
      A live session remains in memory until Finish. Reset is unavailable until
      the session is finished or abandoned, as with restore.
    uses:
    - storage.reset
    - session.live-state
- name: Behaviour &amp; edge cases
  items:
  - id: reset-is-one-transaction
    t: It happens all at once or not at all
    d: >-
      Reset empties tables and writes the seed in one transaction. An interrupted
      reset leaves the previous database intact. The table list comes from the
      schema, so later tables are included without a separate reset list.
    screen: none
    uses:
    - storage.reset
    - storage.schema
  - id: reset-is-absent-where-backup-is
    t: The browser build does not offer it
    d: >-
      Reset operates on rows, but it is located on Backup &amp; restore. That
      screen is absent on the web because the web build cannot write backup files,
      so reset is absent there as well.
    uses:
    - storage.reset
    - platform.web
    - share.backup-file
- name: Where to find it
  items:
  - id: reset-your-profile
    t: Reset your profile
    d: >-
      Profile → Backup &amp; restore → scroll to the bottom → Reset profile →
      confirm. The app returns to Today with an empty routine list and the first-
      run tour.
    uses:
    - storage.reset
