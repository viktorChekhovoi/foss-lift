id: "16"
title: Set videos
tagline: Record clips for sets and store them on-device.
screen: session
code:
- lib/services/set_video_store.dart
- lib/services/set_video_recorder.dart
- lib/services/set_video_thumbnails.dart
- lib/screens/set_video_screen.dart
- lib/screens/clip_player_screen.dart
- lib/screens/exercise_clips_screen.dart
- lib/screens/video_settings_screen.dart
- lib/util/clip_label.dart
test:
- test/feature_16_set_videos_test.dart
where: >-
  <b>Storage, naming, cleanup</b> lib/services/set_video_store.dart · <b>Camera</b>
  lib/services/set_video_recorder.dart · <b>Screens</b> set_video_screen.dart,
  clip_player_screen.dart, exercise_clips_screen.dart, video_settings_screen.dart
  · <b>Label &amp; speeds</b> lib/util/clip_label.dart · <b>Stills</b> lib/services/set_video_thumbnails.dart
  · <b>Path</b> SetEntry.videoPath live, SessionSets.videoPath saved
groups:
- name: What it does
  items:
  - id: records-one-clip-per-set
    t: Records one clip for each set
    d: >-
      From the live workout board, tap the camera on a set row and then the shutter.
    screen: set-video
    defines:
    - video.capture
  - id: marks-set-carries-clip
    t: Marks sets that have clips
    d: The marker makes the clip discoverable from the set.
    uses:
    - video.capture
    - session.set-logging
  - id: plays-one-back-full-screen
    t: Plays a clip full-screen
    d: >-
      The player uses a black background with play/pause, a draggable scrubber,
      0.5× or 0.25× speed, and optional looping.
    screen: clip-player
    defines:
    - video.playback
  - id: shows-what-clips-cost-offers
    t: Shows clip storage usage and provides cleanup
    d: Profile → Exercise settings → Storage, under Set videos.
    screen: video-settings
    defines:
    - video.storage
- name: Recording
  screen: set-video
  uses:
  - video.capture
  items:
  - id: recording-only-way-clip-gets
    t: Clips can only be recorded in the app
    d: >-
      Gallery imports are not supported, so the app does not request shared-storage
      read access.
    uses:
    - privacy.offline
  - id: no-audio-ever
    t: Recording never includes audio
    d: >-
      The recorder sets enableAudio: false. This avoids microphone access and keeps
      surrounding conversations out of clips.
    uses:
    - privacy.offline
    - platform.permissions
  - id: camera-opened-only-while-filming
    t: The camera is open only while recording
    d: >-
      It is released when the recording screen closes and is not held in background.
    uses:
    - platform.permissions
  - id: recording-stops-itself-max-clip
    t: Recording stops at the maximum clip length
    d: >-
      The default is 60 seconds; the optional maximum is 3 minutes. A five-second
      countdown precedes automatic stopping.
    uses:
    - video.storage
  - id: 720p-default-480p-request
    t: Recording uses 720p by default or 480p
    d: >-
      1080p is not offered because it substantially increases file size without
      improving the supported review workflow.
    screen: video-settings
    uses:
    - video.storage
  - id: warm-ups-cannot-filmed
    t: Warm-up sets cannot be recorded
    d: >-
      Warm-ups are suggestions, not logged sets, so they have no clip owner. Their
      reserved column keeps the warm-up and working-set rows aligned.
    screen: session
    uses:
    - session.warmup-ramp
  - id: clip-filmed-mid-session-file
    t: A mid-session clip is a file referenced by live state
    d: >-
      The live workout does not write to the database until Finish. The clip path is
      saved with the set then.
    screen: none
    uses:
    - session.live-state
    - video.storage
  - id: abandoning-workout-takes-clips
    t: Unsaved clips are deleted when their session is abandoned
    d: >-
      Abandoning a workout deletes its clips. At Finish, a clip on an unlogged set
      is also deleted because its set is not persisted.
    screen: none
    uses:
    - session.abort
    - session.finish
    - video.storage
  - id: deleting-clip-leaves-set-alone
    t: Deleting a clip does not delete its set
    d: The set remains in history.
    screen: session
    uses:
    - video.storage
  - id: re-filming-replaces
    t: Re-recording replaces the existing clip
    d: >-
      Tap the camera on a set with a clip to record a replacement or delete it. The
      replaced file is deleted immediately.
    screen: session
    uses:
    - video.capture
    - video.storage
- name: Playing one back
  screen: clip-player
  uses:
  - video.playback
  items:
  - id: loop-you-switch
    t: Playback looping is opt-in
    d: >-
      off to begin with, because a clip that plays once and stops is what opening
      one leads you to expect. Looping is what you reach for once you have found
      the rep worth watching again.
  - id: slow-motion-0-5-0
    t: Playback supports 0.5× and 0.25× speed
    d: >-
      Speed is selected with a cycling control. Speeds above 1× are not offered.
  - id: frame-frame-stepping-out-scope
    t: Frame-by-frame stepping is not supported
    d: >-
      Exact-frame seeking would require decoding forward from a keyframe, which the
      current player does not guarantee. Revisit if the player adds exact seeking.
    screen: none
  - id: clip-whose-file-has-gone
    t: Missing clip files are reported
    d: >-
      The player reports the missing file instead of showing a zero-duration clip.
      A row can outlive a file removed outside the app.
    uses:
    - video.storage
- name: Finding one again
  screen: exercise-clips
  uses:
  - video.playback
  items:
  - id: exercise-s-own-reel
    t: An exercise reel lists all clips for that movement
    d: >-
      It is a flat, newest-first list. Each row includes the localized date, set
      number, and recorded load and reps (for example, Mar 12 · set 3 · 100 kg × 5).
      Open it from Library → exercise → N clips or History → session → the exercise
      marked with a play symbol.
    uses:
    - load.units
    - history.session-record
    - ui.language
  - id: row-shows-frame-from-its-clip
    t: Each reel row shows a frame from its clip
    d: >-
      The first frame identifies each clip and distinguishes sessions with similar
      sets.
    defines:
    - video.still
    uses:
    - video.storage
  - id: frame-decoded-once-kept-beside-clip
    t: Clip frames are decoded once and cached beside the clip
    d: >-
      The still is stored as &lt;id&gt;.jpg when the clip is first listed. Clips made
      before still generation receive one on their next listing; later listings
      reuse it.
    screen: none
    uses:
    - video.still
  - id: frame-will-not-decode-falls-back
    t: Undecodable frames fall back to the play icon
    d: >-
      The row still shows the set details and can play the clip.
    uses:
    - video.still
  - id: button-appears-only-once-there
    t: The reel button appears only when clips exist
    d: >-
      An empty reel has no button.
    uses:
    - ui.empty-state
  - id: session-recap-marks-filmed-exercise
    t: The session recap marks exercises with clips
    d: >-
      It shows a play symbol and an "N filmed" count. When multiple sets are filmed,
      the user chooses the clip instead of the app guessing.
    screen: summary
    uses:
    - session.recap
  - id: label-reads-identically-both-places
    t: Clip labels are consistent across both screens
    d: >-
      Both callers use clipLabelOf.
    screen: none
- name: Storage — the policy, stated
  screen: none
  uses:
  - video.storage
  items:
  - id: nothing-ever-deleted-automatically
    t: Clips are never deleted by retention rules
    d: >-
      Clips remain until the user deletes them or cleanup removes an orphan.
  - id: caps-do-work-instead
    t: Storage caps limit library growth
    d: Per-clip and total caps limit storage growth.
    screen: video-settings
  - id: clips-live-app-private-storage
    t: Clips live in app-private storage
    d: >-
      Files use getApplicationSupportDirectory()/set_videos/. They are not in the
      shared gallery, uploaded, or exposed through a share sheet.
    uses:
    - privacy.offline
  - id: only-relative-paths-stored
    t: Only relative clip paths are stored
    d: >-
      The database stores set_videos/&lt;id&gt;.mp4 and resolves it against the current
      app directory. This avoids depending on the iOS container UUID, which can
      change after reinstall or restore.
    defines:
    - platform.portability
  - id: filename-generated-id
    t: Clip filenames use generated IDs
    d: >-
      Names are not timestamps, which can collide, or exercise names, which would
      expose the user's training to a directory reader.
    uses:
    - privacy.offline
- name: Never a dead reference
  screen: none
  uses:
  - video.storage
  items:
  - id: sweep-launch-removes-any-file
    t: Deletion removes the row first; launch cleanup removes orphan files
    d: >-
      Launch cleanup removes unreferenced clips from set_videos/, except files
      younger than kOrphanGrace (24 hours). A clip being recorded has no database
      row until its set is saved.
  - id: sweep-judges-clips-not-stills
    t: Cleanup evaluates clips separately from cached stills
    d: >-
      Still files have no database rows. Cleanup deletes a still with its clip and
      removes remaining stills whose clip is absent in a second pass.
    uses:
    - video.still
  - id: there-no-way-delete-session
    t: The app has no session-delete action
    d: >-
      No session-delete action is exposed in the app. If a session is removed by
      database behavior, foreign-key cascade removes its rows and launch cleanup
      removes the resulting orphan files.
    uses:
    - history.session-record
    - storage.schema
