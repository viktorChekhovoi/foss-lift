id: "12"
title: First-run tutorial
tagline: Tours of the app you can tap through for real, offered on first launch and replayable from Profile.
screen: tutorial
code:
- lib/widgets/tutorial.dart
- lib/widgets/tutorial_demo.dart
test:
- test/feature_12_first_run_tutorial_test.dart
where: >-
  <b>Overlay, tracks and anchors</b> lib/widgets/tutorial.dart · <b>Mock board,
  rest bar and shade</b> lib/widgets/tutorial_demo.dart · <b>Seen flag</b>
  Settings.tutorialSeen
groups:
- name: What it does
  items:
  - id: opens-welcome-card
    t: Opens on a choice of two tours
    d: >-
      the first time the app is opened: what the app is, and which tour to take —
      the full walk-through, the quick one, or neither. The card has no anchor at
      all, a plain dimmed screen with a card in the middle of it.
    defines:
    - ui.tutorial-track
    uses:
    - ui.tutorial
  - id: overlays-guided-coach-mark-tour
    t: Overlays a coach-mark tour anchored to real widgets
    d: >-
      each callout is attached to an on-screen anchor rather than to a hard-coded
      position, and the anchor is spotlighted by cutting a hole in the dimmed
      backdrop.
    defines:
    - ui.tutorial
    uses:
    - ui.navigation
  - id: you-tap-the-real-control
    t: You tap the real tabs, and look at everything else
    d: >-
      the four tab steps are the ones you walk: the hole in the scrim is a hole
      in its hit test too, the tap reaches the tab underneath, and the tour moves
      on with you. Every other step draws what it is describing instead, and the
      scrim absorbs the tap so a stray touch cannot poke the app mid-sentence.
      The split is not arbitrary — a tab is one button that is always mounted in
      the same place, and everything else the tour has to say lives on a screen
      the tour would first have to get you to.
    uses:
    - ui.tutorial
    - ui.navigation
  - id: starts-with-the-four-tabs
    t: Starts at the four tabs
    d: >-
      Today, Routines, History and Profile in turn, before any one screen is
      described — the shape of the app first, then what is inside it. Each step
      spotlights that tab's button and you tap it to go there.
    points:
    - today
    - routines
    - history
    - profile
    uses:
    - ui.navigation
    - template.routine
    - template.active-routine
    - history.session-record
    - ui.tutorial
  - id: explains-gym-words
    t: Explains the gym words where they first matter
    d: >-
      routine, training day, push day, set, rep and rest each get one plain
      sentence, at the step where the word first appears, so the tour is followable
      by somebody who has never trained before without reading as a glossary.
    defines:
    - ui.gym-vocabulary
  - id: shows-mock-board-rest-bar
    t: Draws the live workout it cannot show you, at full size
    d: >-
      the steps about a running session fill the screen with a stand-in for it —
      the session's own header, two exercises, their set rows with a note icon
      and a camera on each, and the rest bar docked at the bottom when the step
      is about resting. It is a whole screen rather than a card in the middle of
      one because that is what somebody is about to be looking at, and a
      thumbnail of a screen teaches the thumbnail. The callout sits over it, at
      whichever end leaves the thing being described uncovered. The board's
      column headers, its cells and the pulse on the cell that logs the set are
      the real board's own widgets rather than a second copy of them — the goal
      line's weight box included. Change how the board looks and the tour
      follows, which is the only way a picture of a screen stays a picture of
      that screen.
    points:
    - session
    uses:
    - ui.tutorial
    - session.set-logging
    - session.progress-mark
    - session.rest-timer
  - id: session-chapter-follows-the-training-day
    t: The live workout comes straight after the training day that starts one
    d: >-
      the step pointing at the next training day is followed by the one that
      says what tapping it leads to, and then by the whole live-workout chapter —
      the board, the weight, the rest timer, the note, the clip and the
      notification. The
      lifetime totals come after all of it. That is the order somebody actually
      moves in: a card you tap, a screen it opens, the thing you do there. The
      chapter opens by naming the transition, because nothing on screen has
      moved and the tour has to say why the picture changed.
    points:
    - today
    - session
    uses:
    - ui.tutorial
    - ui.tutorial-track
    - session.live-state
    - session.exercise-weight
  - id: shade-step-keeps-its-own-picture
    t: The notification step keeps a notification-sized picture
    d: >-
      it is the one step in the chapter that is not about the screen, so it does
      not borrow the screen's frame: a shade card in the middle of a dimmed
      display, with Done and Missed on it.
    points:
    - shade
    uses:
    - ui.tutorial
    - session.shade
  - id: explains-note-and-clip
    t: Explains the note and the clip on their own steps
    d: >-
      what the note icon beside an exercise opens and where that note is kept,
      and what the camera on a set records — one step each, both against the mock
      board with the icon in question ringed.
    points:
    - session
    uses:
    - exercise.notes
    - video.capture
  - id: explains-which-weight-a-tap-moves
    t: Says which weight a tap moves
    d: >-
      one step between the set rows and the rest timer: tapping the weight on an
      exercise's goal line changes every set still to be logged, and tapping a
      set's own weight changes that set only — in the words the weight dialog
      itself uses. The two differ in what they move, and that difference is the
      whole of the step.
    points:
    - session
    uses:
    - ui.tutorial
    - session.exercise-weight
    - session.set-logging
  - id: runs-once
    t: Runs once
    d: Settings.tutorialSeen records that it has run, so it never reappears on its own.
    uses:
    - ui.tutorial
    - storage.settings
- name: The tracks
  items:
  - id: full-tour-walks-the-app
    t: The full tour walks the whole app
    d: >-
      the four tabs, then the routine you are following and the training day you
      are due next, then straight into the session that day opens — the board,
      the weight, the rest timer, the note, the clip and the notification — out again to the
      lifetime totals, and finally into the builder to make a routine of your
      own. It assumes no gym vocabulary and defines each word once.
    points:
    - today
    - session
    - shade
    uses:
    - ui.tutorial-track
    - ui.gym-vocabulary
    - template.active-routine
    - history.aggregates
    - session.set-logging
    - session.exercise-weight
    - session.shade
    - session.rest-timer
    - exercise.notes
    - video.capture
  - id: quick-tour-is-the-four-tabs
    t: The quick tour is the four tabs and a routine built in four steps
    d: >-
      for somebody who has used a tracker before: where the four destinations
      are, then Routines → New routine → name it and add its days → Save. It skips what the
      full tour spends steps on — the live workout, and the per-slot settings —
      and folds naming a routine, adding a training day and filling it with
      exercises into one callout, because somebody who has used a tracker knows
      what those are and only needs to be shown where.
    points:
    - today
    - routines
    - history
    - profile
    - routine-edit
    uses:
    - ui.tutorial-track
    - ui.navigation
    - template.routine
    - template.workout
    - history.session-record
  - id: track-choice-is-not-a-judgement
    t: Neither track is presented as the lesser one
    d: >-
      the two are offered side by side with one line each saying who it is for —
      "explain everything, including gym terms" and "a brief tour for an
      experienced gym-goer". Neither ranks the reader: one names what it covers,
      the other who already knows it.
    uses:
    - ui.tutorial-track
- name: The builder tour
  items:
  - id: builder-tour-covers-making-a-routine
    t: The builder chapter is drawn, not driven
    d: >-
      Routines → New routine → name it → add a training day → add its exercises →
      configure one → save the day → save the routine, each step against a
      full-size picture of the screen it is about, with the control in question
      ringed. Four screens are drawn: the Routines tab, the routine builder, a
      training day, and one exercise's settings sheet. It is the same treatment the live workout gets, and for the same
      reason: the tour would otherwise have to march you through four screens it
      does not own, waiting on each to mount before it could point at anything,
      and every callout would be one badly-timed frame away from spotlighting a
      rectangle that has moved. The mocks are built from the builders' own field,
      list and row widgets rather than copies of them, so a change to the real
      screen shows up here.
    points:
    - routines
    - routine-edit
    - workout-edit
    uses:
    - ui.tutorial-track
    - ui.gym-vocabulary
    - template.routine
    - template.workout
    - template.item
  - id: builder-chapter-starts-from-today
    t: It starts where you are standing, and names every screen it moves to
    d: >-
      the full tour reaches the builder from the Today steps, so the chapter
      opens on the Routines tab — drawn with the navigation bar under it and that
      tab lit, so the picture is placed in the app rather than appearing from
      nowhere. Every step after it says what opened the screen it is on: New
      routine opens the builder, tapping a training day opens the day, tapping an
      exercise opens its settings, and saving the day comes back. A drawn chapter
      changes the picture with nothing on the phone having moved, so each change
      of picture is accounted for in words.
    points:
    - today
    - routines
    - routine-edit
    - workout-edit
    uses:
    - ui.tutorial
    - ui.navigation
    - template.routine
    - template.workout
    - template.item
  - id: callout-never-covers-the-screen-it-describes
    t: A callout never covers the screen it is describing
    d: >-
      on a drawn step the callout is docked to the top or the bottom and the
      picture takes the room that is left, rather than floating over it. Floating
      was fine over a board with an empty middle and wrong everywhere else: on
      the Routines step the card above New routine disappeared under the callout,
      which is the one thing a picture of a screen cannot afford. Which end it
      docks to follows the step's subject — the rest bar and the two Save buttons
      are at the foot of their screens, so those steps read from the top.
    uses:
    - ui.tutorial
  - id: builder-tour-explains-each-slot-setting
    t: It says what each per-exercise setting does, against the sheet they are on
    d: >-
      sets, the rep target, rest, step up by and back off by — one clause each,
      in the words the config sheet uses, against a drawing of that sheet with
      those fields on it. Naming five controls beside a picture of none of them
      was the previous arrangement, and it asked the reader to take the tour's
      word for a screen they had not seen. Nothing on this one is ringed: the
      whole picture is what the words are about.
    points:
    - workout-edit
    uses:
    - template.item
    - template.rep-target
    - template.rest
    - progression.rates
    - progression.axis
  - id: builder-tour-starts-on-its-own
    t: Both first-run tours end by building a routine, and it is also a tour on its own
    d: >-
      an empty app is the state every first run is in, so neither tour ends
      without showing the way out of it — the full one walks the whole builder,
      the quick one a condensed four steps. The same chapter is still offered by
      itself from Profile, for somebody coming back on day ten who wants the
      builder and not the tour around it. The steps are one list used by all
      three tracks rather than three descriptions of the same screen. Because it
      is drawn rather than driven, it runs wherever you happen to be standing and
      leaves you there — no tab is switched and no screen is pushed.
    points:
    - routines
    - routine-edit
    - workout-edit
    uses:
    - ui.tutorial-track
    - template.routine
    - template.item
- name: How to use it
  items:
  - id: replay-any-time
    t: Replay any of them any time
    d: >-
      Profile → Help &amp; tour asks which one — the full tour, the quick tour, or
      the routine builder — and starts it from its first step.
    screen: profile
    uses:
    - ui.tutorial
    - ui.tutorial-track
  - id: skipping-says-where-to-replay
    t: Skipping says where to find it again
    d: >-
      one line at the bottom of the screen naming Profile → Help &amp; tour, which
      fades on its own. No button, no second card to dismiss.
    uses:
    - ui.tutorial
    - ui.tutorial-track
- name: Behaviour & edge cases
  items:
  - id: covers-live-workout-which-cannot
    t: It covers the live workout, which it cannot point at
    d: >-
      the board, the rest timer and the shade are where the app is least like
      every other tracker — and none of them exists until a session is running.
      Rather than starting a workout nobody asked for, those steps draw a
      stand-in and talk about that. The builder chapter is drawn for a different
      reason — its screens exist, they are just four navigations away — so what
      the two have in common is the treatment, not the cause.
    points:
    - session
    - shade
    uses:
    - ui.tutorial
    - session.live-state
    - session.rest-timer
    - session.shade
  - id: mock-shows-only-what-the-step-is-about
    t: The mock highlights one thing at a time
    d: >-
      each board step rings its own subject and leaves the rest of the board in
      its default state: the note step rings the note, the clip step rings one
      camera, and neither shows a logged set or an outlined next set. The weight
      step is the one that rings two things — the exercise's weight and one set's
      own — because what it is describing is the difference between them. Only the
      step about the set rows puts the board mid-session — one set behind you,
      the next one outlined — because that is what it is describing. A camera is
      drawn in the accent only while it is the ringed thing, so it never competes
      with the step that is running.
    points:
    - session
    uses:
    - ui.tutorial
    - exercise.notes
    - video.capture
    - session.exercise-weight
  - id: mock-is-a-picture-not-the-board
    t: A mock is a picture, not the screen
    d: >-
      it takes no taps of its own: a tap anywhere, the mock included, advances
      the tour. Nothing on one is wired to anything — no session is started,
      resumed or written to, no routine is created, and the drawn name field
      never takes focus, so no keyboard rises over a tour.
    uses:
    - ui.tutorial
    - session.live-state
    - template.routine
  - id: mock-follows-the-live-display-rules
    t: The mock follows the same display rules as the real screen
    d: >-
      the current theme's colours and the chosen weight unit, so what the tour
      shows is what the app will look like — a tour in pounds does not demonstrate
      a board in kilos.
    uses:
    - theme.colour-role
    - load.units
  - id: shade-step-named-for-the-shade
    t: The shade step is named for the shade
    d: >-
      the title names the notification the step is describing, rather than saying
      where the phone was.
    uses:
    - session.shade
  - id: full-screen-mock-still-takes-no-taps
    t: A full-screen mock is still a picture
    d: >-
      filling the screen does not make it the app: nothing on it is wired to a
      session, no session is started or resumed, and a tap anywhere on it
      advances the tour exactly as a tap on the scrim does. The only controls
      that do anything are the callout's own Skip, Back and Next.
    points:
    - session
    uses:
    - ui.tutorial
    - session.live-state
  - id: every-anchored-step-today-tab
    t: An anchored step scrolls its target into view
    d: >-
      the tour scrolls until the anchor is on screen before spotlighting it, so a
      step can point at something below the fold — the lifetime card on a routine
      with more days than fit. It never navigates by itself: when the tour changes
      tab or pushes a screen it is because you tapped the thing it was pointing at.
    screen: today
    uses:
    - ui.tutorial
    - ui.navigation
  - id: anchor-off-screen-falls-back-to-the-middle
    t: A step whose anchor is not on screen still reads
    d: >-
      tapping Next instead of the control a step asked for leaves the following
      step pointing at a widget that is not mounted, or is mounted on a tab that
      is not showing. That callout is centred on a plain dimmed screen rather than
      spotlighting a rectangle nobody can see.
    uses:
    - ui.tutorial
    - ui.navigation
  - id: greeting-stacks-two-answers
    t: The opening card stacks its answers
    d: >-
      the tours one above the other and "Not now" under them, rather than side by
      side: they are long labels in a callout narrower than either the phone or
      the font can be relied on to be. Every later step is a short Skip / Back /
      Next.
    uses:
    - ui.tutorial
    - ui.tutorial-track
  - id: declining-ends-cleanly
    t: Declining ends it cleanly
    d: >-
      the same path as skipping mid-tour, including recording that the tour has
      been seen.
    uses:
    - ui.tutorial
    - storage.settings
