id: "12"
title: First-run tutorial
tagline: A one-time coach-mark tour that runs on first launch.
screen: tutorial
code:
- lib/widgets/tutorial.dart
- lib/widgets/tutorial_demo.dart
test:
- test/feature_12_first_run_tutorial_test.dart
where: >-
  <b>Overlay + anchors</b> lib/widgets/tutorial.dart · <b>Mock board and rest
  bar</b> lib/widgets/tutorial_demo.dart · <b>Seen flag</b> Settings.tutorialSeen
groups:
- name: What it does
  items:
  - id: opens-welcome-card
    t: Opens on an unanchored welcome card
    d: >-
      the first time the app is opened: what the app is, and the choice to take the
      tour or not — Take the tour to walk through it, Not now to dismiss. The step
      has no anchor at all, a plain dimmed screen with a card in the middle of it,
      and it is where a replay starts too.
    defines:
    - ui.tutorial
  - id: overlays-guided-coach-mark-tour
    t: Overlays a guided coach-mark tour
    d: >-
      pointing at the key parts of the UI to get a new user started, with each
      callout attached to an on-screen anchor rather than to a hard-coded position.
    defines:
    - ui.tutorial
    uses:
    - ui.navigation
  - id: shows-mock-board-rest-bar
    t: Draws the live workout it cannot show you
    d: >-
      the steps about a running session put a stand-in on the dimmed screen —
      the board (one exercise, its note icon, three set rows with a camera on
      each), the rest bar with its countdown and −15s / +15s / Skip, and the
      notification with Done and Missed on it. Read the step, look at the thing
      it is describing. The mock board is built from the real board's columns
      and cells rather than a second copy of them, down to the pulse on the cell
      that logs the set — change how the board looks and the tour follows, which
      is the only way a picture of a screen stays a picture of that screen.
    defines:
    - ui.tutorial
    uses:
    - session.set-logging
    - session.progress-mark
    - session.rest-timer
    - session.shade
  - id: explains-note-and-clip
    t: Explains the note and the clip on their own steps
    d: >-
      what the note icon beside an exercise opens and where that note is kept,
      and what the camera on a set records — one step each, both against the mock
      board with the icon in question ringed.
    uses:
    - exercise.notes
    - video.capture
  - id: runs-once
    t: Runs once
    d: Settings.tutorialSeen records that it has run, so it never reappears.
    uses:
    - ui.tutorial
    - storage.settings
- name: How to use it
  items:
  - id: replay-any-time
    t: Replay it any time
    d: Profile → Help &amp; tour, which also starts at the welcome.
    screen: profile
    uses:
    - ui.tutorial
- name: Behaviour & edge cases
  items:
  - id: covers-live-workout-which-cannot
    t: It covers the live workout, which it cannot point at
    d: >-
      the board, the rest timer and the shade are where the app is least like
      every other tracker — and none of them exists until a session is running.
      Rather than starting a workout nobody asked for, those steps draw a stand-in
      and talk about that.
    uses:
    - ui.tutorial
    - session.live-state
  - id: mock-shows-only-what-the-step-is-about
    t: The mock highlights one thing at a time
    d: >-
      each board step rings its own subject and leaves the rest of the board in
      its default state: the note step rings the note, the clip step rings one
      camera, and neither shows a logged set or an outlined next set. Only the
      step about the set rows puts the board mid-session — one set behind you,
      the next one outlined — because that is what it is describing. A camera is
      drawn in the accent only while it is the ringed thing, so it never competes
      with the step that is running.
    uses:
    - ui.tutorial
    - exercise.notes
    - video.capture
  - id: mock-is-a-picture-not-the-board
    t: The mock is a picture, not the board
    d: >-
      it takes no taps of its own: a tap anywhere, the mock included, advances the
      tour. Nothing on it is wired to a session, so no session is started, resumed
      or written to by the tour.
    uses:
    - ui.tutorial
    - session.live-state
  - id: mock-follows-the-live-display-rules
    t: The mock follows the same display rules as the real screen
    d: >-
      the current theme's colours and the chosen weight unit, so what the tour
      shows is what the app will look like — a tour in pounds does not demonstrate
      a board in kilos.
    uses:
    - theme.colour-role
    - load.units
  - id: shade-step-named-for-the-shade
    t: The shade step is named for the shade
    d: >-
      "Phone in your pocket" said where the phone was, not what the step was
      about; the title now names the notification the step is describing.
    uses:
    - session.shade
  - id: every-anchored-step-today-tab
    t: An anchored step scrolls its target into view
    d: >-
      the tour scrolls the Today tab until the anchor is on screen before
      spotlighting it, so a step can point at something below the fold — the
      lifetime card on a routine with more days than fit. It never navigates
      between tabs: steps about the other three highlight that tab's button and
      describe what is behind it.
    screen: today
    uses:
    - ui.tutorial
    - ui.navigation
  - id: greeting-stacks-two-answers
    t: The greeting stacks its two answers
    d: >-
      "Take the tour" over "Not now", rather than side by side: two long labels
      in a callout narrower than either the phone or the font can be relied on
      to be. Every later step is a short Skip / Back / Next.
    uses:
    - ui.tutorial
  - id: declining-ends-cleanly
    t: Declining ends it cleanly
    d: >-
      the same path as skipping mid-tour, including recording that the tour has
      been seen.
    uses:
    - ui.tutorial
