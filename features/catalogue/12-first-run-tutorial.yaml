id: "12"
title: First-run tutorial
tagline: First-launch tours with a replay option in Profile.
screen: tutorial
code:
- lib/widgets/tutorial.dart
- lib/widgets/tutorial_demo.dart
test:
- test/feature_12_first_run_tutorial_test.dart
where: >-
  <b>Overlay, tracks and anchors</b> lib/widgets/tutorial.dart · <b>Mock board,
  rest bar and shade</b> lib/widgets/tutorial_demo.dart · <b>Seen flag</b>
  Settings.tutorialSeen
groups:
- name: What it does
  items:
  - id: opens-welcome-card
    t: Opens with a choice of two tours
    d: >-
      On first launch it offers the full tour, quick tour, or no tour. The opening
      card has no anchor and appears centered over a dimmed screen.
    defines:
    - ui.tutorial-track
    uses:
    - ui.tutorial
  - id: overlays-guided-coach-mark-tour
    t: Overlays coach marks on real widgets
    d: >-
      Each callout references an on-screen anchor and spotlights it through a hole
      in the dimmed backdrop.
    defines:
    - ui.tutorial
    uses:
    - ui.navigation
  - id: you-tap-the-real-control
    t: Tab steps use real controls; other steps use mock screens
    d: >-
      Tab steps pass taps through the spotlight to the real tab, then advance. Other
      steps use a mock and the scrim absorbs taps. Tabs are always mounted; other
      targets require navigation that the tour does not perform.
    uses:
    - ui.tutorial
    - ui.navigation
  - id: starts-with-the-four-tabs
    t: The tour starts with the four tabs
    d: >-
      The first steps cover Today, Routines, History, and Profile. Each spotlights
      the tab button and requires the user to tap it.
    points:
    - today
    - routines
    - history
    - profile
    uses:
    - ui.navigation
    - template.routine
    - template.active-routine
    - history.session-record
    - ui.tutorial
  - id: explains-gym-words
    t: Defines gym terms at first use
    d: >-
      Routine, workout, push workout, set, rep, rest, and superset are each defined
      once at the step where the term first appears.
    defines:
    - ui.gym-vocabulary
    uses:
    - template.superset
  - id: today-step-points-at-getting-a-routine
    t: The Today step points to routine creation or the current routine
    d: >-
      On a fresh install, Today spotlights the card for adding a ready-made or
      custom routine. If a current routine already exists, it spotlights that
      routine's name instead.
    points:
    - today
    uses:
    - ui.tutorial
    - ui.empty-state
    - template.routine
    - template.active-routine
    - template.starter-library
  - id: shows-mock-board-rest-bar
    t: Draws the live workout at full size
    d: >-
      Session steps use a full-screen mock with the session header, two exercises,
      set rows, note and camera icons, and the rest bar when relevant. Board headers,
      cells, and the goal weight use the live board widgets; callouts dock at the
      end that leaves the subject visible.
    points:
    - session
    uses:
    - ui.tutorial
    - session.set-logging
    - session.progress-mark
    - session.rest-timer
  - id: session-chapter-follows-the-today-step
    t: The live-workout chapter follows the Today step
    d: >-
      the step about getting a routine is followed by the one that says what
      training it looks like, and then by the whole live-workout chapter — the
      board, the weight, the rest timer, the note, the clip and the notification.
      The lifetime totals come after all of it. That is the order somebody moves
      in: a routine, a workout in it, the thing you do there. The chapter opens by
      naming the transition — Today lists the routine's workouts with the next one
      due highlighted, and Start workout is what opens this screen — because a
      fresh install has no workout card to have tapped and the tour has to say why
      the picture changed.
    points:
    - today
    - session
    uses:
    - ui.tutorial
    - ui.tutorial-track
    - session.live-state
    - session.exercise-weight
  - id: shade-step-keeps-its-own-picture
    t: The notification step uses a notification-sized mock
    d: >-
      it is the one step in the chapter that is not about the screen, so it does
      not borrow the screen's frame: a shade card in the middle of a dimmed
      display, with Done and Missed on it.
    points:
    - shade
    uses:
    - ui.tutorial
    - session.shade
  - id: explains-note-and-clip
    t: Note and clip controls have separate steps
    d: >-
      what the note icon beside an exercise opens and where that note is kept,
      and what the camera on a set records — one step each, both against the mock
      board with the icon in question ringed.
    points:
    - session
    uses:
    - exercise.notes
    - video.capture
  - id: explains-which-weight-a-tap-moves
    t: Explains which weight a tap changes
    d: >-
      one step between the set rows and the rest timer: tapping the weight on an
      exercise's goal line changes every set still to be logged, and tapping a
      set's own weight changes that set only — in the words the weight dialog
      itself uses. The two differ in what they move, and that difference is the
      whole of the step.
    points:
    - session
    uses:
    - ui.tutorial
    - session.exercise-weight
    - session.set-logging
  - id: runs-once
    t: Runs automatically once
    d: Settings.tutorialSeen records that it has run, so it never reappears on its own.
    uses:
    - ui.tutorial
    - storage.settings
- name: The tracks
  items:
  - id: full-tour-walks-the-app
    t: The full tour covers the app's main workflows
    d: >-
      the four tabs, then the card on Today that gets you a routine, then what
      training one looks like — the board, the weight, the rest timer, the note,
      the clip and the notification — out again to the lifetime totals, and finally
      into the chapter that gets a routine into the list for real: the + that adds
      one, and behind it a ready-made program, one built from nothing, or one
      somebody sent. It assumes no gym vocabulary and defines
      each word once.
    points:
    - today
    - session
    - shade
    uses:
    - ui.tutorial-track
    - ui.gym-vocabulary
    - ui.routine-add-menu
    - share.routine-code
    - template.starter-library
    - template.active-routine
    - history.aggregates
    - session.set-logging
    - session.exercise-weight
    - session.shade
    - session.rest-timer
    - exercise.notes
    - video.capture
  - id: quick-tour-is-the-four-tabs
    t: The quick tour covers the tabs and routine creation in six steps
    d: >-
      for somebody who has used a tracker before: where the four destinations
      are, then Routines → the + that adds one → the ready-made programs → New routine → name it and add
      its workouts → Save. It skips what the full tour spends steps on — the live
      workout, the per-slot settings and the superset checkbox among them — and
      folds naming a routine, adding a workout and filling it with exercises into
      one callout, because somebody who has used a tracker knows what those are and
      only needs to be shown where. The + is not one of the cuts: it is the one
      piece of navigation an experienced gym-goer cannot guess from having used
      another tracker.
    points:
    - today
    - routines
    - history
    - profile
    - routine-edit
    uses:
    - ui.tutorial-track
    - ui.navigation
    - ui.routine-add-menu
    - template.routine
    - template.workout
    - template.starter-library
    - history.session-record
  - id: track-choice-is-not-a-judgement
    t: The two tour tracks are presented without ranking
    d: >-
      the two are offered side by side with one line each saying who it is for —
      "explain everything, including gym terms" and "a brief tour for an
      experienced gym-goer". Neither ranks the reader: one names what it covers,
      the other who already knows it.
    uses:
    - ui.tutorial-track
- name: The builder tour
  items:
  - id: builder-tour-covers-making-a-routine
    t: The routine chapter uses screen drawings
    d: >-
      Routines → the + that adds one → a ready-made program → New routine → an imported code →
      name it → add a workout →
      add its exercises → configure one → join two of them → save the workout →
      save the routine, each step against a
      full-size picture of the screen it is about, with the control in question
      ringed. Five screens are drawn: the Routines tab as a fresh install has it,
      that tab with the add sheet open over it, the routine builder, a
      workout, and one exercise's settings sheet. It is the same treatment the live workout gets, and for the same
      reason: the tour would otherwise have to march you through four screens it
      does not own, waiting on each to mount before it could point at anything,
      and every callout would be one badly-timed frame away from spotlighting a
      rectangle that has moved. The mocks are built from the builders' own field,
      list and row widgets rather than copies of them, so a change to the real
      screen shows up here.
    points:
    - routines
    - routine-edit
    - workout-edit
    uses:
    - ui.tutorial-track
    - ui.gym-vocabulary
    - ui.routine-add-menu
    - template.routine
    - template.workout
    - template.item
    - template.starter-library
    - template.superset
  - id: builder-tour-points-at-the-add-button
    t: The builder chapter points at + before opening the add sheet
    d: >-
      the second step of the chapter rings the + in the corner of the drawn
      Routines tab, with the list under it empty — which is what the tab is on
      the install the tour is running on. A control in a corner is the one thing
      on this screen somebody will not find by scrolling, and every step after it
      is on a sheet that + opened, so the picture would otherwise change with
      nothing having been tapped. Both first-run tours keep this step; it is the
      only piece of navigation the quick one still spells out.
    points:
    - routines
    uses:
    - ui.tutorial-track
    - ui.routine-add-menu
    - ui.empty-state
  - id: builder-tour-offers-a-ready-made-program-first
    t: The builder chapter presents the shipped program first
    d: >-
      the step after the + rings Ready-made routines on the opened sheet: a program copied into your list, which is the shortest path from
      a fresh install to training today. The two steps after it ring the other
      answers — one built from nothing, one somebody sent — so whichever of the
      three somebody wants, they have seen it by the fifth callout. All three rows are
      on the picture throughout, in the order the real sheet has them, and the
      steps take them in that order rather than ranking them.
    points:
    - routines
    uses:
    - ui.tutorial-track
    - ui.routine-add-menu
    - template.starter-library
    - template.routine
  - id: builder-tour-names-the-import-row
    t: The builder chapter names the import row without opening it
    d: >-
      the last step on the sheet rings Import a routine and says what it is for —
      a routine somebody sent you, scanned as a QR or pasted as a code. It stops
      there: the screens behind it belong to whoever sent the code, and a tour
      running on a phone with no code to import cannot show them. The full tour
      has this step; the quick one goes from New routine straight to the builder.
    points:
    - routines
    uses:
    - ui.tutorial-track
    - ui.routine-add-menu
    - share.routine-code
    - share.qr
  - id: builder-tour-defines-a-superset
    t: The builder chapter defines supersets at their checkbox
    d: >-
      one step after the per-slot settings, on the same drawn sheet — which grows
      the checkbox at the foot of its Target card for this step, ringed, the way
      the mock board grows a rest bar for the step about resting. Ticking it joins the exercise
      to the one above, and the two are trained as a set of each back to back with
      the rest at the end of the round. It is the training term the tour meets last
      because it is the one somebody can switch a slot to without knowing what they
      have asked for — the same reason the checkbox carries an icon that says it
      again for people who never took a tour. The quick chapter skips it, along with
      the rest of the sheet.
    points:
    - workout-edit
    uses:
    - ui.tutorial-track
    - ui.gym-vocabulary
    - template.superset
    - template.rest
    - session.superset-round
  - id: builder-chapter-starts-from-today
    t: The builder chapter identifies each screen transition
    d: >-
      the full tour reaches the chapter from the Today step, so it
      opens on the Routines tab — drawn with the navigation bar under it and that
      tab lit, so the picture is placed in the app rather than appearing from
      nowhere. Every step after it says what opened the screen it is on: the +
      opens the sheet of three, New
      routine opens the builder, tapping a workout opens it, tapping an
      exercise opens its settings, and saving the workout comes back. A drawn chapter
      changes the picture with nothing on the phone having moved, so each change
      of picture is accounted for in words.
    points:
    - today
    - routines
    - routine-edit
    - workout-edit
    uses:
    - ui.tutorial
    - ui.navigation
    - template.routine
    - template.workout
    - template.item
  - id: callout-never-covers-the-screen-it-describes
    t: Callouts do not cover the described screen
    d: >-
      on a drawn step the callout is docked to the top or the bottom and the
      picture takes the room that is left, rather than floating over it. Floating
      was fine over a board with an empty middle and wrong everywhere else: on
      the Routines step the rows of the add sheet disappeared under the callout,
      which is the one thing a picture of a screen cannot afford. Which end it
      docks to follows the step's subject — the rest bar and the two Save buttons
      are at the foot of their screens, so those steps read from the top.
    uses:
    - ui.tutorial
  - id: builder-tour-explains-each-slot-setting
    t: The builder chapter describes each per-exercise setting beside its sheet
    d: >-
      sets, the rep target, rest, step up by and back off by — one clause each,
      in the words the config sheet uses, against a drawing of that sheet with
      those fields on it. Naming five controls beside a picture of none of them
      was the previous arrangement, and it asked the reader to take the tour's
      word for a screen they had not seen. Nothing on this one is ringed: the
      numbers are what the words are about, and the checkbox that belongs to the
      step after it is not drawn yet — five named fields all have to be on the
      picture, and the sheet with everything on it is taller than a short phone
      with a callout docked under it.
    points:
    - workout-edit
    uses:
    - template.item
    - template.rep-target
    - template.rest
    - progression.rates
    - progression.axis
  - id: builder-tour-starts-on-its-own
    t: Both first-run tours end with routine creation; the chapter is also replayable
    d: >-
      an empty app is the state every first run is in, so neither tour ends
      without showing the way out of it — the full one walks the whole chapter,
      the quick one a condensed six steps. The same chapter is still offered by
      itself from Profile, for somebody coming back on day ten who wants the
      builder and not the tour around it. The steps are one list used by all
      three tracks rather than three descriptions of the same screen. Because it
      is drawn rather than driven, it runs wherever you happen to be standing and
      leaves you there — no tab is switched and no screen is pushed.
    points:
    - routines
    - routine-edit
    - workout-edit
    uses:
    - ui.tutorial-track
    - template.routine
    - template.item
- name: How to use it
  items:
  - id: replay-any-time
    t: Replay any tour from Profile
    d: >-
      Profile → Help &amp; tour asks which one — the full tour, the quick tour, or
      the routine builder — and starts it from its first step.
    screen: profile
    uses:
    - ui.tutorial
    - ui.tutorial-track
  - id: skipping-says-where-to-replay
    t: Skipping identifies the replay location
    d: >-
      one line at the bottom of the screen naming Profile → Help &amp; tour, which
      fades on its own. No button, no second card to dismiss.
    uses:
    - ui.tutorial
    - ui.tutorial-track
- name: Behaviour & edge cases
  items:
  - id: covers-live-workout-which-cannot
    t: The tour covers the live workout with a mock
    d: >-
      the board, the rest timer and the shade are where the app is least like
      every other tracker — and none of them exists until a session is running.
      Rather than starting a workout nobody asked for, those steps draw a
      stand-in and talk about that. The builder chapter is drawn for a different
      reason — its screens exist, they are just four navigations away — so what
      the two have in common is the treatment, not the cause.
    points:
    - session
    - shade
    uses:
    - ui.tutorial
    - session.live-state
    - session.rest-timer
    - session.shade
  - id: mock-shows-only-what-the-step-is-about
    t: Each mock highlights the current subject
    d: >-
      each board step rings its own subject and leaves the rest of the board in
      its default state: the note step rings the note, the clip step rings one
      camera, and neither shows a logged set or an outlined next set. The weight
      step is the one that rings two things — the exercise's weight and one set's
      own — because what it is describing is the difference between them. Only the
      step about the set rows puts the board mid-session — one set behind you,
      the next one outlined — because that is what it is describing. A camera is
      drawn in the accent only while it is the ringed thing, so it never competes
      with the step that is running.
    points:
    - session
    uses:
    - ui.tutorial
    - exercise.notes
    - video.capture
    - session.exercise-weight
  - id: mock-is-a-picture-not-the-board
    t: A mock is non-interactive
    d: >-
      it takes no taps of its own: a tap anywhere, the mock included, advances
      the tour. Nothing on one is wired to anything — no session is started,
      resumed or written to, no routine is created, and the drawn name field
      never takes focus, so no keyboard rises over a tour.
    uses:
    - ui.tutorial
    - session.live-state
    - template.routine
  - id: mock-follows-the-live-display-rules
    t: Mocks use the real screen's display rules
    d: >-
      the current theme's colours and the chosen weight unit, so what the tour
      shows is what the app will look like — a tour in pounds does not demonstrate
      a board in kilos. Its example weights are snapped to the step the gym counts
      by, so a pounds gym is shown a bar it could load rather than a kilogram
      figure converted to two decimals. That is the coarse step rather than the
      fine grid a real target lands on, and the one place the mock parts company
      with the real screen on purpose: a real weight keeps the arithmetic that
      made it, and an invented one has none to keep.
    uses:
    - theme.colour-role
    - load.units
    - load.unit-defaults
    - load.fine-grid
  - id: shade-step-named-for-the-shade
    t: The notification step is named for the notification shade
    d: >-
      the title names the notification the step is describing, rather than saying
      where the phone was.
    uses:
    - session.shade
  - id: full-screen-mock-still-takes-no-taps
    t: A full-screen mock remains non-interactive
    d: >-
      filling the screen does not make it the app: nothing on it is wired to a
      session, no session is started or resumed, and a tap anywhere on it
      advances the tour exactly as a tap on the scrim does. The only controls
      that do anything are the callout's own Skip, Back and Next.
    points:
    - session
    uses:
    - ui.tutorial
    - session.live-state
  - id: every-anchored-step-today-tab
    t: Anchored steps scroll their targets into view
    d: >-
      the tour scrolls until the anchor is on screen before spotlighting it, so a
      step can point at something below the fold — the lifetime card on a routine
      with more workouts than fit. It never navigates by itself: when the tour changes
      tab or pushes a screen it is because you tapped the thing it was pointing at.
    screen: today
    uses:
    - ui.tutorial
    - ui.navigation
  - id: anchor-off-screen-falls-back-to-the-middle
    t: Missing anchors use a centered callout
    d: >-
      tapping Next instead of the control a step asked for leaves the following
      step pointing at a widget that is not mounted, or is mounted on a tab that
      is not showing. That callout is centred on a plain dimmed screen rather than
      spotlighting a rectangle nobody can see.
    uses:
    - ui.tutorial
    - ui.navigation
  - id: greeting-stacks-two-answers
    t: The opening card stacks its choices
    d: >-
      the tours one above the other and "Not now" under them, rather than side by
      side: they are long labels in a callout narrower than either the phone or
      the font can be relied on to be. Every later step is a short Skip / Back /
      Next.
    uses:
    - ui.tutorial
    - ui.tutorial-track
  - id: declining-ends-cleanly
    t: Declining exits the tour cleanly
    d: >-
      the same path as skipping mid-tour, including recording that the tour has
      been seen.
    uses:
    - ui.tutorial
    - storage.settings
