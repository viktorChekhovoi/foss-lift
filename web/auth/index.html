<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · Foss Lift</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0e1117; color: #e8edf4; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 30em; padding: 32px; }
    h1 { letter-spacing: -1px; }
    p { color: #b6bfcd; }
    button, a { font: inherit; }
    button { background: #ff6a3d; color: #0e1117; padding: 12px 24px; border: 0; border-radius: 10px; cursor: pointer; }
    a { color: #ff996d; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to Foss Lift</h1>
    <p id="status" role="status">Continue only if you requested this sign-in link. Use the browser where you requested it.</p>
    <button id="continue" type="button">Continue</button>
    <p><a href="/#/profile/cloud">Back to Foss Lift</a></p>
    <noscript>Enable JavaScript to complete sign-in.</noscript>
  </main>
  <script src="sign-in.js" defer></script>
</body>
</html>
