name: Build iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CLAUDE.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Start the iPhone simulator while Flutter builds
        run: python3 tool/smoke_ios_controls.py --boot-only
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Show Apple toolchain
        run: xcodebuild -version
      # Standalone Dart runs before pub get's automatic Flutter code generation.
      - run: dart tool/l10n.dart
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build for the simulator
        run: flutter build ios --simulator --debug --no-codesign
      - name: Exercise the workout button on a real iPhone simulator runtime
        run: python3 tool/smoke_ios_controls.py
